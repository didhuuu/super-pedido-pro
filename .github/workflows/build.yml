name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BASE EXATA DA VERSÃO 49
      # ==========================================================

      - name: Baixar projeto - BASE #49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================================
      # PREPARAR PROJETO
      # ==========================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      # ==========================================================
      # RELATÓRIO:
      # EXECUTA EXATAMENTE O BLOCO DA VERSÃO 49
      # NÃO REESCREVE O RELATÓRIO
      # ==========================================================

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          echo "Obtendo o build.yml original da versão #49..."

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-v49.yml

          test -s /tmp/build-v49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path("/tmp/build-v49.yml").read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          inicio = None

          for i, line in enumerate(lines):
              if line.strip() == "- name: Alterar SOMENTE o relatório":
                  inicio = i
                  break

          if inicio is None:
              raise SystemExit(
                  "ERRO: etapa 'Alterar SOMENTE o relatório' não encontrada na #49."
              )

          run_line = None

          for i in range(inicio + 1, len(lines)):
              if re.match(r"^        run:\s*\|\s*$", lines[i]):
                  run_line = i
                  break

              if re.match(r"^      - name:", lines[i]):
                  break

          if run_line is None:
              raise SystemExit(
                  "ERRO: bloco run do relatório da #49 não encontrado."
              )

          script = []

          for i in range(run_line + 1, len(lines)):

              line = lines[i]

              if re.match(r"^      - name:", line):
                  break

              if line.startswith("          "):
                  script.append(line[10:])

              elif line.strip() == "":
                  script.append("")

              else:
                  raise SystemExit(
                      "ERRO: estrutura inesperada dentro do relatório #49."
                  )

          report_script = "\n".join(script).rstrip() + "\n"

          required = [
              "async function openPDF(sendViaWhatsApp=false)",
              "orientation:'portrait'",
              "format:'a4'",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()"
          ]

          for item in required:
              if item not in report_script:
                  raise SystemExit(
                      "ERRO: parte do relatório #49 não encontrada: "
                      + item
                  )

          Path("/tmp/relatorio-v49.sh").write_text(
              report_script,
              encoding="utf-8"
          )

          print(
              "OK: relatório da #49 localizado integralmente."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "OK: relatório #49 executado sem alteração."

      # ==========================================================
      # CORREÇÕES SOLICITADAS
      #
      # 1 - ADM
      # 2 - REPETIR ÚLTIMO PEDIDO
      # 3 - ZERAR PEDIDO APÓS ENVIO
      #
      # NÃO ALTERA openPDF
      # ==========================================================

      - name: Corrigir ADM, Repetir último e zerar após envio
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          from pathlib import Path
          import os

          html = (
              Path(os.environ["ANDROID_DIR"])
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          patch = r'''
<script>
(function(){

  /* ==========================================================
     CORREÇÃO ADM
     Mantém toda a administração original da #49.
     Apenas substitui o primeiro prompt por uma tela própria.
     ========================================================== */

  const __superPedidoOpenAdminOriginal =
    window.openAdmin;

  window.openAdmin = function(){

    if(
      typeof featureModal !== "function" ||
      typeof __superPedidoOpenAdminOriginal !== "function"
    ){

      alert("Administração indisponível.");

      return;
    }

    featureModal(`

      <h3>🔐 Administração</h3>

      <p>
        Digite o PIN de administração.
      </p>

      <input
        id="superPedidoAdminPin"
        type="password"
        inputmode="numeric"
        autocomplete="off"
        placeholder="PIN"
        style="
          width:100%;
          box-sizing:border-box;
          padding:12px;
          font-size:18px;
          margin-bottom:10px;
        "
      >

      <button
        class="primary"
        onclick="superPedidoConfirmarAdmin()"
      >
        Entrar
      </button>

      <button
        onclick="closeFeature()"
      >
        Cancelar
      </button>

    `);

    setTimeout(function(){

      const input =
        document.getElementById(
          "superPedidoAdminPin"
        );

      if(!input){
        return;
      }

      input.focus();

      input.addEventListener(
        "keydown",
        function(event){

          if(event.key === "Enter"){

            superPedidoConfirmarAdmin();

          }

        }
      );

    },100);

  };


  window.superPedidoConfirmarAdmin = function(){

    const input =
      document.getElementById(
        "superPedidoAdminPin"
      );

    const pin =
      input
      ? String(input.value || "")
      : "";

    const saved =
      localStorage.getItem(
        "sp_admin_pin"
      ) || "1234";

    if(pin !== saved){

      alert(
        "PIN incorreto."
      );

      if(input){

        input.value = "";

        input.focus();

      }

      return;

    }

    /*
     * A função original da #49 contém toda a administração.
     *
     * Para não duplicar nem modificar essa administração,
     * interceptamos temporariamente o prompt original.
     */

    const promptOriginal =
      window.prompt;

    window.prompt = function(){

      return pin;

    };

    try{

      __superPedidoOpenAdminOriginal.call(
        window
      );

    }finally{

      window.prompt =
        promptOriginal;

    }

  };


  /* ==========================================================
     CORREÇÃO REPETIR ÚLTIMO PEDIDO
     ========================================================== */

  window.repeatLastOrder = function(){

    try{

      let rows = [];

      /*
       * Primeiro tenta a memória atual.
       */

      if(
        typeof lastOrder !== "undefined" &&
        Array.isArray(lastOrder) &&
        lastOrder.length
      ){

        rows =
          JSON.parse(
            JSON.stringify(
              lastOrder
            )
          );

      }

      /*
       * Depois tenta o localStorage.
       */

      if(!rows.length){

        try{

          const saved =
            localStorage.getItem(
              "sp_last_order"
            );

          if(saved){

            const parsed =
              JSON.parse(
                saved
              );

            if(
              Array.isArray(parsed) &&
              parsed.length
            ){

              rows = parsed;

            }

          }

        }catch(e){

          rows = [];

        }

      }

      /*
       * Último recurso:
       * primeiro item do histórico.
       */

      let observation = "";

      if(
        !rows.length &&
        typeof historyOrders !== "undefined" &&
        Array.isArray(historyOrders) &&
        historyOrders.length
      ){

        const ultimo =
          historyOrders[0];

        if(
          ultimo &&
          Array.isArray(
            ultimo.rows
          )
        ){

          rows =
            JSON.parse(
              JSON.stringify(
                ultimo.rows
              )
            );

          observation =
            String(
              ultimo.generalObservation || ""
            );

        }

      }

      if(!rows.length){

        alert(
          "Ainda não existe último pedido."
        );

        return;

      }

      /*
       * Mantém o último pedido salvo.
       */

      if(
        typeof lastOrder !== "undefined"
      ){

        lastOrder =
          JSON.parse(
            JSON.stringify(
              rows
            )
          );

      }

      /*
       * Recupera a observação do histórico.
       */

      if(
        !observation &&
        typeof historyOrders !== "undefined" &&
        Array.isArray(historyOrders) &&
        historyOrders.length
      ){

        observation =
          String(
            historyOrders[0].generalObservation || ""
          );

      }

      window.applyRepeat(
        rows,
        observation
      );

    }catch(error){

      console.error(
        "repeatLastOrder:",
        error
      );

      alert(
        "Não foi possível repetir o último pedido."
      );

    }

  };


  /* ==========================================================
     APLICAÇÃO DO ÚLTIMO PEDIDO
     ========================================================== */

  window.applyRepeat = function(
    rows,
    observation
  ){

    if(
      !Array.isArray(rows) ||
      !rows.length
    ){

      alert(
        "Não foi possível recuperar o último pedido."
      );

      return;

    }

    vals = {};

    extras = [];

    if(
      typeof validadeCurta !== "undefined"
    ){

      validadeCurta = [];

    }

    rows.forEach(
      function(x){

        if(!x){
          return;
        }

        /*
         * Produto adicional.
         */

        if(
          x.cat === "Produto Adicional"
        ){

          extras.push({

            code:
              x.code === "-"
              ? ""
              : String(
                  x.code || ""
                ),

            name:
              String(
                x.name || ""
              ),

            qty:
              Number(
                x.order
              ) || 0

          });

          return;

        }

        /*
         * Produto normal.
         */

        if(
          typeof productByCode !== "function"
        ){

          return;

        }

        const produto =
          productByCode(
            x.code
          );

        if(!produto){

          return;

        }

        vals[
          key(
            produto.c,
            produto.s,
            produto.i,
            "o"
          )
        ] =
          Number(
            x.order
          ) || 0;

        vals[
          key(
            produto.c,
            produto.s,
            produto.i,
            "s"
          )
        ] =
          Number(
            x.stock
          ) || 0;

      }
    );

    /*
     * Recupera observação.
     */

    let obsFinal =
      String(
        observation || ""
      );

    if(
      !obsFinal &&
      typeof rows.generalObservation === "string"
    ){

      obsFinal =
        rows.generalObservation;

    }

    if(
      !obsFinal &&
      typeof historyOrders !== "undefined" &&
      Array.isArray(historyOrders) &&
      historyOrders.length
    ){

      obsFinal =
        String(
          historyOrders[0].generalObservation || ""
        );

    }

    generalObservation =
      obsFinal;

    const campoObs =
      document.getElementById(
        "generalObs"
      );

    if(campoObs){

      campoObs.value =
        generalObservation;

    }

    if(
      typeof save === "function"
    ){

      save();

    }

    if(
      typeof saveFeatures === "function"
    ){

      saveFeatures();

    }

    if(
      typeof render === "function"
    ){

      render();

    }

    if(
      typeof renderValidadeCurta === "function"
    ){

      renderValidadeCurta();

    }

    if(
      typeof updateBadge === "function"
    ){

      updateBadge();

    }

    if(
      typeof closeFeature === "function"
    ){

      closeFeature();

    }

    alert(
      "Último pedido recuperado. Confira antes de enviar."
    );

  };


  /* ==========================================================
     ZERAR PEDIDO
     
     IMPORTANTE:
     - preserva sp_last_order
     - preserva sp_history
     - limpa somente a digitação atual
     - funciona quando chamado pelo relatório #49
     ========================================================== */

  window.clearPedido = function(){

    try{

      let rowsToSave = [];

      if(
        typeof finalizedRows !== "undefined" &&
        Array.isArray(finalizedRows) &&
        finalizedRows.length
      ){

        rowsToSave =
          JSON.parse(
            JSON.stringify(
              finalizedRows
            )
          );

      }

      /*
       * O relatório #49 já chama saveHistory(rows)
       * antes de chamar clearPedido().
       *
       * Portanto, só salva aqui se ainda não estiver
       * no histórico, evitando duplicação.
       */

      let jaSalvo = false;

      if(
        rowsToSave.length &&
        typeof historyOrders !== "undefined" &&
        Array.isArray(historyOrders) &&
        historyOrders.length
      ){

        try{

          const ultimo =
            historyOrders[0];

          if(
            ultimo &&
            Array.isArray(
              ultimo.rows
            )
          ){

            jaSalvo =
              JSON.stringify(
                ultimo.rows
              ) ===
              JSON.stringify(
                rowsToSave
              );

          }

        }catch(e){

          jaSalvo = false;

        }

      }

      if(
        rowsToSave.length &&
        !jaSalvo &&
        typeof saveHistory === "function"
      ){

        saveHistory(
          rowsToSave
        );

      }

      /*
       * ZERA A DIGITAÇÃO.
       */

      vals = {};

      extras = [];

      if(
        typeof validadeCurta !== "undefined"
      ){

        validadeCurta = [];

      }

      finalizedRows = [];

      generalObservation = "";

      /*
       * Limpa campo de observação.
       */

      const campoObs =
        document.getElementById(
          "generalObs"
        );

      if(campoObs){

        campoObs.value = "";

      }

      /*
       * Limpa somente os dados do pedido atual.
       *
       * NÃO remove:
       * sp_last_order
       * sp_history
       */

      localStorage.removeItem(
        "pedido_compras_vals"
      );

      localStorage.removeItem(
        "pedido_compras_extras"
      );

      localStorage.removeItem(
        "pedido_compras_validade_curta"
      );

      localStorage.removeItem(
        "sp_general_obs"
      );

      /*
       * Salva o estado limpo.
       *
       * Isso mantém o último pedido e o histórico.
       */

      if(
        typeof saveFeatures === "function"
      ){

        saveFeatures();

      }

      /*
       * Atualiza a tela.
       */

      if(
        typeof render === "function"
      ){

        render();

      }

      if(
        typeof renderValidadeCurta === "function"
      ){

        renderValidadeCurta();

      }

      if(
        typeof updateBadge === "function"
      ){

        updateBadge();

      }

      /*
       * Fecha tela de conferência,
       * se existir.
       */

      if(
        typeof closeConference === "function"
      ){

        closeConference();

      }

      /*
       * Esconde opções de pedido finalizado.
       */

      const opcoes =
        document.getElementById(
          "opcoesFinalizado"
        );

      if(opcoes){

        opcoes.style.display =
          "none";

      }

      /*
       * Garante visualmente que todos
       * os campos de quantidade ficaram em zero.
       */

      document
        .querySelectorAll(
          "input.qty"
        )
        .forEach(
          function(input){

            input.value = "0";

          }
        );

      window.scrollTo({

        top: 0,

        behavior: "smooth"

      });

    }catch(error){

      console.error(
        "clearPedido:",
        error
      );

      /*
       * Mesmo se algum elemento visual
       * não existir, o pedido precisa ser zerado.
       */

      try{

        vals = {};

        extras = [];

        finalizedRows = [];

        generalObservation = "";

        localStorage.removeItem(
          "pedido_compras_vals"
        );

        localStorage.removeItem(
          "pedido_compras_extras"
        );

        localStorage.removeItem(
          "pedido_compras_validade_curta"
        );

        localStorage.removeItem(
          "sp_general_obs"
        );

        if(
          typeof saveFeatures === "function"
        ){

          saveFeatures();

        }

      }catch(e){}

    }

  };

})();
</script>
'''

          if "</body>" not in text:

              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          text = text.replace(
              "</body>",
              patch + "\n</body>",
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: ADM corrigido."
          )

          print(
              "OK: Repetir último pedido corrigido."
          )

          print(
              "OK: zeragem após envio corrigida."
          )

          print(
              "OK: openPDF da #49 não foi substituído."
          )

          PY

      # ==========================================================
      # BIBLIOTECAS EXATAMENTE COMO NA #49
      # ==========================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ==========================================================
      # VERIFICAÇÃO JAVASCRIPT
      # ==========================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html = (
              Path(os.environ["ANDROID_DIR"])
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          combined = "\n".join(
              scripts
          )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "window.openAdmin=function()",

              "window.repeatLastOrder=function()",

              "window.applyRepeat = function(",

              "window.clearPedido = function()",

              "window.AndroidFileBridge.sharePdf",

              "CÓDIGO",

              "NOME DO PRODUTO",

              "ESTOQUE",

              "PEDIDO"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "
                      + item
                  )

          if (
              "orientation:'landscape'" in text
              or
              'orientation:"landscape"' in text
          ):

              raise SystemExit(
                  "ERRO: relatório em paisagem."
              )

          print(
              "OK: verificações textuais concluídas."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK: JavaScript válido."

      # ==========================================================
      # VERIFICAÇÃO FINAL
      # ==========================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "window.openAdmin=function()" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder=function()" \
            "$HTML"

          grep -q \
            "window.applyRepeat = function(" \
            "$HTML"

          grep -q \
            "window.clearPedido = function()" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          grep -q \
            "RELATÓRIO DE PEDIDO" \
            "$HTML"

          echo "=========================================="
          echo " VERIFICAÇÃO FINAL"
          echo "=========================================="
          echo "OK - BASE DA VERSÃO 49"
          echo "OK - RELATÓRIO DA #49"
          echo "OK - ADM"
          echo "OK - REPETIR ÚLTIMO PEDIDO"
          echo "OK - ZERAR APÓS ENVIO"
          echo "OK - PDF A4 RETRATO"
          echo "OK - ANDROID FILE BRIDGE"
          echo "OK - JAVASCRIPT"
          echo "=========================================="

      # ==========================================================
      # COMPILAR APK
      # ==========================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ==========================================================
      # DISPONIBILIZAR APK
      # ==========================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
