name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo - versão 9 + PDF
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          import urllib.request

          # Usa exatamente o workflow que gerou o build que falhou.
          # Assim preservamos as correções da versão 9 + PDF.
          source_file = Path("/tmp/build-v9-source.yml")

          urllib.request.urlretrieve(
              "https://raw.githubusercontent.com/didhuuu/super-pedido-pro/44b3c889e2ac3f4da399e47df9eb992b8d28e8e4/.github/workflows/build.yml",
              source_file
          )

          source = source_file.read_text(
              encoding="utf-8"
          )

          marker = "python3 - <<'PY"

          start = source.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERRO: script da versão 9 não encontrado."
              )

          start = source.find(
              "\n",
              start
          ) + 1

          end = source.find(
              "\n          PY",
              start
          )

          if end < 0:
              raise SystemExit(
                  "ERRO: final do script da versão 9 não encontrado."
              )

          patch = textwrap.dedent(
              source[start:end]
          )

          # ==========================================================
          # CORREÇÃO DEFINITIVA
          #
          # O workflow antigo gerava:
          #
          # sanitizeFilename(filename)
          #
          # mas MainActivity.java não possui esse método.
          #
          # Substituímos diretamente pela sanitização do nome.
          # ==========================================================

          patch = patch.replace(
              "sanitizeFilename(\n"
              "                filename\n"
              "            )",
              "filename == null || filename.trim().isEmpty() "
              "? \"pedido.pdf\" "
              ": new File(filename).getName()"
              ".replaceAll("
              "\"[\\\\\\\\/:*?\\\\\\\"<>|]\", "
              "\"_\""
              ")"
          )

          # Segurança adicional: nenhuma chamada antiga pode chegar
          # ao compilador.
          if "sanitizeFilename(" in patch:

              patch = patch.replace(
                  "sanitizeFilename(\n"
                  "                filename\n"
                  "            )",
                  "filename == null || filename.trim().isEmpty() "
                  "? \"pedido.pdf\" "
                  ": new File(filename).getName()"
                  ".replaceAll("
                  "\"[\\\\\\\\/:*?\\\\\\\"<>|]\", "
                  "\"_\""
                  ")"
              )

          exec(
              compile(
                  patch,
                  str(source_file),
                  "exec"
              ),
              {}
          )

          print(
              "Correções da versão 9 aplicadas."
          )

          print(
              "Correção sanitizeFilename aplicada."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correção antes da compilação
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          test -f settings.gradle

          test -f build.gradle

          test -f app/build.gradle

          test -s \
            app/src/main/assets/app/xlsx.full.min.js

          test -s \
            app/src/main/assets/app/jspdf.umd.min.js

          echo "Projeto Android encontrado."

          echo "Bibliotecas locais encontradas."

          if grep -n \
            "sanitizeFilename(" \
            app/src/main/java/com/pedido/v2/MainActivity.java
          then
            echo ""
            echo "ERRO: ainda existe chamada a sanitizeFilename."
            exit 1
          fi

          echo ""
          echo "VERIFICAÇÃO OK."
          echo "Nenhuma chamada a sanitizeFilename encontrada."

      - name: Preparar compilação
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Projeto Android:"
          pwd

          echo ""
          echo "Arquivos principais:"

          test -f settings.gradle

          test -f build.gradle

          test -f app/build.gradle

          echo ""
          echo "Projeto pronto para compilação."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "======================================"

          echo "INICIANDO COMPILAÇÃO DO APK"

          echo "======================================"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

          echo "======================================"

          echo "COMPILAÇÃO CONCLUÍDA"

          echo "======================================"

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
