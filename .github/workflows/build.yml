name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          main = next(
              (root / "app/src/main/java").rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          if main is None:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # OPEN PDF
          #
          # NÃO usa regex.
          # Localiza diretamente:
          #
          # async function openPDF()
          #
          # até:
          #
          # function clearPedido()
          #
          # Isso evita o erro que ocorreu na tentativa anterior.
          # ==========================================================

          open_marker = "async function openPDF()"
          clear_marker = "function clearPedido("

          open_start = text.find(open_marker)

          if open_start == -1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada"
              )

          clear_start = text.find(
              clear_marker,
              open_start
          )

          if clear_start == -1:
              raise SystemExit(
                  "ERRO: função clearPedido não encontrada"
              )

          new_open_pdf = r"""async function openPDF(){

            const rows=
              finalizedRows.length
              ? finalizedRows
              : getRows();

            if(!rows.length){
              alert(
                'Nenhum item foi selecionado.'
              );
              return;
            }

            try{

              const {jsPDF}=
                window.jspdf||{};

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              /*
               * A4 RETRATO
               *
               * 210 x 297 mm
               */
              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;
              const margem=10;

              const colCodigo=30;
              const colEstoque=25;
              const colPedido=25;

              const colProduto=
                pageWidth-
                (margem*2)-
                colCodigo-
                colEstoque-
                colPedido;

              let y=15;

              function titulo(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(16);

                doc.text(
                  'PEDIDO DE COMPRAS',
                  margem,
                  y
                );

                y+=7;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                doc.text(
                  new Date().toLocaleString(
                    'pt-BR'
                  ),
                  margem,
                  y
                );

                y+=8;
              }

              function cabecalho(){

                if(
                  y+8 >
                  pageHeight-10
                ){

                  doc.addPage();

                  y=15;

                  titulo();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  7
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  7
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  7
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  7
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo+
                  colCodigo/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque+
                  colEstoque/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  'PEDIDO',
                  xPedido+
                  colPedido/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                y+=7;
              }

              function produtoNome(nome){

                let s=
                  String(nome||'');

                /*
                 * Evita texto enorme
                 * estourando a tabela.
                 */
                if(s.length>58){
                  s=
                    s.substring(
                      0,
                      55
                    )+
                    '...';
                }

                return s;
              }

              function linha(item){

                if(
                  y+7 >
                  pageHeight-10
                ){

                  doc.addPage();

                  y=15;

                  titulo();

                  cabecalho();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  7
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  7
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  7
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  7
                );

                doc.text(
                  String(
                    item.code||'-'
                  ),
                  xCodigo+3,
                  y+4.8
                );

                doc.text(
                  produtoNome(
                    item.name
                  ),
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  String(
                    item.stock??0
                  ),
                  xEstoque+
                  colEstoque/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  String(
                    item.order??0
                  ),
                  xPedido+
                  colPedido/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                y+=7;
              }

              titulo();

              const grupos=
                groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y+20 >
                  pageHeight-10
                ){

                  doc.addPage();

                  y=15;

                  titulo();
                }

                y+=3;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(11);

                doc.text(
                  String(
                    categoria||''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y+=5;

                cabecalho();

                for(
                  const item of items
                ){
                  linha(item);
                }
              }

              /*
               * Observação geral.
               */
              if(generalObservation){

                if(
                  y+20 >
                  pageHeight-10
                ){

                  doc.addPage();

                  y=15;

                  titulo();
                }

                y+=5;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const obs=
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    pageWidth-
                    margem*2
                  );

                doc.text(
                  obs,
                  margem,
                  y
                );
              }

              /*
               * Rodapé.
               */
              const paginas=
                doc.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=paginas;
                pagina++
              ){

                doc.setPage(
                  pagina
                );

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+
                  pagina+
                  ' de '+
                  paginas,
                  pageWidth-margem,
                  pageHeight-5,
                  {
                    align:'right'
                  }
                );
              }

              /*
               * Gera o arquivo enquanto
               * os dados ainda existem.
               */
              const base64=
                doc.output(
                  'datauristring'
                ).split(',')[1];

              const nomeArquivo=
                'relatorio-pedido-' +
                new Date()
                  .toISOString()
                  .slice(0,10) +
                '.pdf';

              /*
               * IMPORTANTE:
               *
               * Limpa o pedido antes de abrir
               * o compartilhamento.
               *
               * clearPedido(rows) também salva
               * o histórico uma única vez.
               */
              clearPedido(rows);

              if(
                window.AndroidFileBridge &&
                typeof
                window.AndroidFileBridge.sharePdf===
                'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                return;
              }

              /*
               * Fallback para navegador.
               */
              doc.save(
                nomeArquivo
              );

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                e.message
              );
            }
          }

          """

          text=(
              text[:open_start] +
              new_open_pdf +
              text[clear_start:]
          )

          # ==========================================================
          # CLEAR PEDIDO
          #
          # Localiza por nome, sem regex.
          # ==========================================================

          clear_start=text.find(
              "function clearPedido("
          )

          if clear_start==-1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrada após correção PDF"
              )

          send_start=text.find(
              "function sendWhatsApp(",
              clear_start
          )

          if send_start==-1:
              raise SystemExit(
                  "ERRO: sendWhatsApp não encontrada"
              )

          new_clear = r"""function clearPedido(historyRows=null){

            /*
             * Se o chamador passou as linhas,
             * usa essas linhas para o histórico.
             *
             * Caso contrário, usa finalizedRows.
             */
            const historico=
              Array.isArray(historyRows) &&
              historyRows.length
              ? historyRows
              : finalizedRows;

            /*
             * Salva no histórico uma única vez.
             */
            if(
              Array.isArray(historico) &&
              historico.length
            ){
              saveHistory(
                historico
              );
            }

            /*
             * ZERA AS QUANTIDADES.
             */
            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            generalObservation='';

            /*
             * Remove os dados salvos das
             * quantidades.
             */
            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            /*
             * Limpa observação.
             */
            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            /*
             * Salva o estado vazio.
             */
            save();

            /*
             * Atualiza a tela.
             */
            render();

            renderValidadeCurta();

            updateBadge();

            closeConference();

            const opcoes=
              document.getElementById(
                'opcoesFinalizado'
              );

            if(opcoes){
              opcoes.style.display='none';
            }

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }

          """

          text=(
              text[:clear_start] +
              new_clear +
              text[send_start:]
          )

          # ==========================================================
          # INICIALIZAÇÃO DO CATÁLOGO
          # ==========================================================

          old_start=(
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length&&!importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          new_start=(
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length&&!importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "if(!current||!APP_DATA[current])"
              "current=cats[0]||'';"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          if old_start in text:

              text=text.replace(
                  old_start,
                  new_start,
                  1
              )

          elif (
              "if(!current||!APP_DATA[current])"
              "current=cats[0]||'';"
              not in text
          ):

              raise SystemExit(
                  "ERRO: inicialização do catálogo não encontrada"
              )

          # ==========================================================
          # BIBLIOTECAS LOCAIS
          # ==========================================================

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ==========================================================
          # GARANTIR CORREÇÃO DE IMPORTAÇÃO
          # ==========================================================

          required=[
              "importedCatalogActive=true",
              "customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))",
              "localStorage.setItem('sp_imported_catalog_active'"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: correção de importação ausente: "+
                      item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          # ==========================================================
          # MAIN ACTIVITY
          # ==========================================================

          java=main.read_text(
              encoding="utf-8"
          )

          # Imports necessários.

          if (
              "import android.content.ClipData;"
              not in java
          ):

              java=java.replace(
                  "import android.content.Intent;\n",
                  "import android.content.ClipData;\n"
                  "import android.content.Intent;\n",
                  1
              )

          if (
              "import android.webkit.ValueCallback;"
              not in java
          ):

              java=java.replace(
                  "import android.webkit.WebSettings;\n",
                  "import android.webkit.ValueCallback;\n"
                  "import android.webkit.WebSettings;\n",
                  1
              )

          if (
              "import android.webkit.WebChromeClient;"
              not in java
          ):

              java=java.replace(
                  "import android.webkit.WebSettings;\n",
                  "import android.webkit.WebChromeClient;\n"
                  "import android.webkit.WebSettings;\n",
                  1
              )

          if (
              "private ValueCallback<Uri[]> filePathCallback;"
              not in java
          ):

              java=java.replace(
                  "public class MainActivity extends Activity {\n",
                  "public class MainActivity extends Activity {\n"
                  "    private ValueCallback<Uri[]> filePathCallback;\n"
                  "    private static final int FILE_CHOOSER_REQUEST = 1001;\n",
                  1
              )

          # ==========================================================
          # SELETOR DE ARQUIVOS
          # ==========================================================

          if "onShowFileChooser" not in java:

              marker=(
                  "        webView.setWebViewClient("
                  "new WebViewClient());\n"
              )

              block="""        webView.setWebChromeClient(new WebChromeClient() {
              @Override
              public boolean onShowFileChooser(
                      WebView view,
                      ValueCallback<Uri[]> callback,
                      FileChooserParams params) {

                  if (
                      MainActivity.this.filePathCallback != null
                  ) {
                      MainActivity.this.filePathCallback
                          .onReceiveValue(null);
                  }

                  MainActivity.this.filePathCallback =
                      callback;

                  try {

                      Intent intent =
                          params.createIntent();

                      startActivityForResult(
                          intent,
                          FILE_CHOOSER_REQUEST
                      );

                      return true;

                  } catch (Exception e) {

                      MainActivity.this.filePathCallback =
                          null;

                      Toast.makeText(
                          MainActivity.this,
                          "Não foi possível abrir o seletor de arquivos.",
                          Toast.LENGTH_LONG
                      ).show();

                      return false;
                  }
              }
          });
          """

              if marker in java:

                  java=java.replace(
                      marker,
                      marker+block,
                      1
                  )

          # ==========================================================
          # RESULTADO DO SELETOR
          # ==========================================================

          if (
              "protected void onActivityResult("
              not in java
          ):

              marker=(
                  "    public class AndroidFileBridge {\n"
              )

              result="""    @Override
          protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

              super.onActivityResult(
                  requestCode,
                  resultCode,
                  data
              );

              if(
                  requestCode != FILE_CHOOSER_REQUEST ||
                  filePathCallback == null
              ){
                  return;
              }

              Uri[] results=null;

              if(
                  resultCode == RESULT_OK &&
                  data != null
              ){

                  if(
                      data.getClipData()!=null
                  ){

                      int count=
                          data.getClipData()
                              .getItemCount();

                      results=
                          new Uri[count];

                      for(
                          int i=0;
                          i<count;
                          i++
                      ){

                          results[i]=
                              data.getClipData()
                                  .getItemAt(i)
                                  .getUri();
                      }

                  }else if(
                      data.getData()!=null
                  ){

                      results=
                          new Uri[]{
                              data.getData()
                          };
                  }
              }

              filePathCallback
                  .onReceiveValue(
                      results
                  );

              filePathCallback=null;
          }

          """

              if marker in java:

                  java=java.replace(
                      marker,
                      result+marker,
                      1
                  )

          # ==========================================================
          # SHARE PDF
          # ==========================================================

          pdf_start=java.find(
              "public void sharePdf("
          )

          if pdf_start==-1:

              raise SystemExit(
                  "ERRO: sharePdf não encontrada"
              )

          # Localiza o próximo @JavascriptInterface depois
          # do método para determinar o final.
          next_interface=java.find(
              "@JavascriptInterface",
              pdf_start+20
          )

          if next_interface==-1:

              raise SystemExit(
                  "ERRO: final de sharePdf não encontrado"
              )

          # Volta até o início da anotação.
          method_start=java.rfind(
              "@JavascriptInterface",
              0,
              pdf_start
          )

          if method_start==-1:

              raise SystemExit(
                  "ERRO: início de sharePdf não encontrado"
              )

          # Encontra fechamento do método por contagem de chaves.
          brace_start=java.find(
              "{",
              pdf_start
          )

          depth=0
          method_end=-1

          for i in range(
              brace_start,
              len(java)
          ):

              if java[i]=="{":
                  depth+=1

              elif java[i]=="}":

                  depth-=1

                  if depth==0:

                      method_end=i+1

                      break

          if method_end==-1:

              raise SystemExit(
                  "ERRO: não foi possível localizar final de sharePdf"
              )

          new_share_pdf="""@JavascriptInterface
          public void sharePdf(
                  String filename,
                  String base64) {

              try {

                  if(
                      base64 == null ||
                      base64.trim().isEmpty()
                  ){
                      throw new Exception(
                          "PDF vazio"
                      );
                  }

                  String clean=base64;

                  int comma=
                      clean.indexOf(',');

                  if(comma>=0){
                      clean=
                          clean.substring(
                              comma+1
                          );
                  }

                  byte[] bytes=
                      Base64.decode(
                          clean,
                          Base64.DEFAULT
                      );

                  File dir=
                      new File(
                          getCacheDir(),
                          "shared"
                      );

                  if(
                      !dir.exists() &&
                      !dir.mkdirs()
                  ){
                      throw new Exception(
                          "Não foi possível criar a pasta temporária"
                      );
                  }

                  String safeName=
                      sanitizeFilename(
                          filename
                      );

                  if(
                      safeName.isEmpty()
                  ){
                      safeName="pedido.pdf";
                  }

                  if(
                      !safeName
                          .toLowerCase()
                          .endsWith(".pdf")
                  ){
                      safeName+=".pdf";
                  }

                  File file=
                      new File(
                          dir,
                          safeName
                      );

                  try(
                      FileOutputStream out=
                          new FileOutputStream(
                              file
                          )
                  ){

                      out.write(bytes);

                      out.flush();
                  }

                  Uri uri=
                      FileProvider.getUriForFile(
                          MainActivity.this,
                          getPackageName()+
                          ".fileprovider",
                          file
                      );

                  Intent intent=
                      new Intent(
                          Intent.ACTION_SEND
                      );

                  intent.setType(
                      "application/pdf"
                  );

                  intent.putExtra(
                      Intent.EXTRA_STREAM,
                      uri
                  );

                  intent.setClipData(
                      ClipData.newRawUri(
                          "PDF",
                          uri
                      )
                  );

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                  );

                  startActivity(
                      Intent.createChooser(
                          intent,
                          "Enviar PDF"
                      )
                  );

              } catch(Exception e) {

                  Toast.makeText(
                      MainActivity.this,
                      "Erro ao compartilhar PDF: "+
                      e.getMessage(),
                      Toast.LENGTH_LONG
                  ).show();
              }
          }"""

          java=(
              java[:method_start] +
              "@JavascriptInterface\n        " +
              new_share_pdf.strip() +
              java[method_end:]
          )

          # ==========================================================
          # SAVEB64
          # ==========================================================

          if (
              "public void saveBase64("
              "String filename, String mimeType, String base64)"
              not in java
          ):

              marker=(
                  "        @JavascriptInterface\n"
                  "        public void shareText(String text) {"
              )

              overload="""        @JavascriptInterface
          public void saveBase64(
                  String filename,
                  String mimeType,
                  String base64) {

              saveBase64(
                  filename,
                  base64
              );
          }

          """

              if marker not in java:

