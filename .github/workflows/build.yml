name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BASE EXATA DA VERSÃO #49
      # ==========================================================

      - name: "Baixar projeto - BASE EXATA #49"
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================================
      # PREPARAR PROJETO
      # ==========================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      # ==========================================================
      # ANDROIDX
      # ==========================================================

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      # ==========================================================
      # RELATÓRIO EXATO DA #49
      #
      # NÃO RECRIA O RELATÓRIO.
      # EXTRAI E EXECUTA O BLOCO ORIGINAL DA #49.
      # ==========================================================

      - name: "Aplicar EXATAMENTE o relatório aprovado da #49"
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-v49.yml

          test -s /tmp/build-v49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build-v49.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          inicio = None

          for i, line in enumerate(lines):

              if line.strip() == \
                  "- name: Alterar SOMENTE o relatório":

                  inicio = i
                  break

          if inicio is None:

              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(
              inicio + 1,
              len(lines)
          ):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  lines[i]
              ):

                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  lines[i]
              ):

                  break

          if run_line is None:

              raise SystemExit(
                  "ERRO: bloco run do relatório #49 não encontrado."
              )

          script = []

          for line in lines[run_line + 1:]:

              if re.match(
                  r"^      - name:",
                  line
              ):

                  break

              if line.startswith(
                  "          "
              ):

                  script.append(
                      line[10:]
                  )

              elif line.strip() == "":

                  script.append("")

              else:

                  raise SystemExit(
                      "ERRO: estrutura inesperada no relatório #49."
                  )

          report_script = (
              "\n".join(script).rstrip()
              + "\n"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "orientation:'portrait'",

              "format:'a4'",

              "window.AndroidFileBridge.sharePdf",

              "saveHistory(rows)",

              "clearPedido()"

          ]

          for item in required:

              if item not in report_script:

                  raise SystemExit(
                      "ERRO: relatório #49 incompleto: "
                      + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report_script,
              encoding="utf-8"
          )

          print(
              "OK: relatório exato da #49 localizado."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "OK: relatório #49 aplicado."

      # ==========================================================
      # CRIAR PATCH JAVASCRIPT
      #
      # IMPORTANTE:
      # NÃO USA BASE64.
      # NÃO USA VARIÁVEL COM JAVASCRIPT.
      # O CÓDIGO É GRAVADO DIRETAMENTE EM UM ARQUIVO TEMPORÁRIO.
      # ==========================================================

      - name: Criar arquivo de correções JavaScript
        shell: bash
        run: |
          set -e

          cat > /tmp/super-pedido-fix.js <<'PATCHJS'
          <script>
          (function(){

            /* ==================================================
               ADM
               Mantém a administração original da #49.
               Substitui somente o prompt inicial.
               ================================================== */

            const __originalOpenAdmin =
              window.openAdmin;

            window.openAdmin = function(){

              if(
                typeof featureModal !== "function" ||
                typeof __originalOpenAdmin !== "function"
              ){

                alert(
                  "Administração indisponível."
                );

                return;
              }

              featureModal(`

                <h3>🔐 Administração</h3>

                <p>
                  Digite o PIN de administração.
                </p>

                <input
                  id="superPedidoAdminPin"
                  type="password"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="PIN"
                  style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    font-size:18px;
                  "
                >

                <button
                  onclick="superPedidoConfirmarAdmin()"
                >
                  Entrar
                </button>

                <button
                  onclick="closeFeature()"
                >
                  Cancelar
                </button>

              `);

              setTimeout(
                function(){

                  const input =
                    document.getElementById(
                      "superPedidoAdminPin"
                    );

                  if(!input){
                    return;
                  }

                  input.focus();

                  input.addEventListener(
                    "keydown",
                    function(event){

                      if(
                        event.key === "Enter"
                      ){

                        superPedidoConfirmarAdmin();

                      }

                    }
                  );

                },
                100
              );

            };


            window.superPedidoConfirmarAdmin =
              function(){

                const input =
                  document.getElementById(
                    "superPedidoAdminPin"
                  );

                const pin =
                  input
                  ? String(
                      input.value || ""
                    )
                  : "";

                const saved =
                  localStorage.getItem(
                    "sp_admin_pin"
                  ) || "1234";

                if(pin !== saved){

                  alert(
                    "PIN incorreto."
                  );

                  if(input){

                    input.value = "";

                    input.focus();

                  }

                  return;
                }

                const oldPrompt =
                  window.prompt;

                window.prompt =
                  function(){

                    return pin;

                  };

                try{

                  __originalOpenAdmin.call(
                    window
                  );

                }finally{

                  window.prompt =
                    oldPrompt;

                }

              };


            /* ==================================================
               REPETIR ÚLTIMO PEDIDO
               ================================================== */

            window.repeatLastOrder =
              function(){

                let rows = [];

                let observation = "";


                /*
                 * Primeiro tenta lastOrder em memória.
                 */

                try{

                  if(
                    typeof lastOrder !== "undefined" &&
                    Array.isArray(lastOrder) &&
                    lastOrder.length
                  ){

                    rows =
                      JSON.parse(
                        JSON.stringify(
                          lastOrder
                        )
                      );

                  }

                }catch(error){}


                /*
                 * Depois tenta localStorage.
                 */

                if(!rows.length){

                  try{

                    const saved =
                      localStorage.getItem(
                        "sp_last_order"
                      );

                    if(saved){

                      const parsed =
                        JSON.parse(
                          saved
                        );

                      if(
                        Array.isArray(parsed) &&
                        parsed.length
                      ){

                        rows = parsed;

                        if(
                          typeof lastOrder !==
                          "undefined"
                        ){

                          lastOrder =
                            JSON.parse(
                              JSON.stringify(
                                parsed
                              )
                            );

                        }

                      }

                    }

                  }catch(error){}

                }


                /*
                 * Último recurso:
                 * histórico.
                 */

                if(!rows.length){

                  try{

                    if(
                      typeof historyOrders !==
                      "undefined" &&
                      Array.isArray(
                        historyOrders
                      ) &&
                      historyOrders.length
                    ){

                      const ultimo =
                        historyOrders[0];

                      if(
                        ultimo &&
                        Array.isArray(
                          ultimo.rows
                        )
                      ){

                        rows =
                          JSON.parse(
                            JSON.stringify(
                              ultimo.rows
                            )
                          );

                        observation =
                          String(
                            ultimo.generalObservation ||
                            ""
                          );

                      }

                    }

                  }catch(error){}

                }


                if(!rows.length){

                  alert(
                    "Ainda não existe último pedido."
                  );

                  return;

                }


                window.applyRepeat(
                  rows,
                  observation
                );

              };


            /* ==================================================
               APLICAR REPETIÇÃO
               ================================================== */

            window.applyRepeat =
              function(
                rows,
                observation
              ){

                if(
                  !Array.isArray(rows) ||
                  !rows.length
                ){

                  alert(
                    "Não foi possível recuperar o último pedido."
                  );

                  return;

                }


                vals = {};

                extras = [];


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                rows.forEach(
                  function(x){

                    if(!x){
                      return;
                    }


                    /*
                     * Produto adicional.
                     */

                    if(
                      x.cat ===
                      "Produto Adicional"
                    ){

                      extras.push({

                        code:
                          x.code === "-"
                          ? ""
                          : String(
                              x.code || ""
                            ),

                        name:
                          String(
                            x.name || ""
                          ),

                        qty:
                          Number(
                            x.order
                          ) || 0

                      });

                      return;

                    }


                    /*
                     * Produto normal.
                     */

                    if(
                      typeof productByCode !==
                      "function"
                    ){

                      return;

                    }


                    const f =
                      productByCode(
                        x.code
                      );


                    if(!f){

                      return;

                    }


                    vals[
                      key(
                        f.c,
                        f.s,
                        f.i,
                        "o"
                      )
                    ] =
                      Number(
                        x.order
                      ) || 0;


                    vals[
                      key(
                        f.c,
                        f.s,
                        f.i,
                        "s"
                      )
                    ] =
                      Number(
                        x.stock
                      ) || 0;

                  }
                );


                /*
                 * Recuperar observação.
                 */

                let obsFinal =
                  String(
                    observation || ""
                  );


                if(
                  !obsFinal &&
                  rows.generalObservation
                ){

                  obsFinal =
                    String(
                      rows.generalObservation
                    );

                }


                if(
                  !obsFinal &&
                  typeof historyOrders !==
                  "undefined" &&
                  Array.isArray(
                    historyOrders
                  ) &&
                  historyOrders.length
                ){

                  obsFinal =
                    String(
                      historyOrders[0]
                        .generalObservation || ""
                    );

                }


                generalObservation =
                  obsFinal;


                const campoObs =
                  document.getElementById(
                    "generalObs"
                  );


                if(campoObs){

                  campoObs.value =
                    generalObservation;

                }


                if(
                  typeof save ===
                  "function"
                ){

                  save();

                }


                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                if(
                  typeof closeFeature ===
                  "function"
                ){

                  closeFeature();

                }


                alert(
                  "Último pedido recuperado. Confira antes de enviar."
                );

              };


            /* ==================================================
               ZERAR PEDIDO
               
               IMPORTANTE:
               - NÃO apaga sp_last_order
               - NÃO apaga sp_history
               - limpa somente o pedido atual
               - evita duplicar o histórico
               ================================================== */

            window.clearPedido =
              function(){

                let rowsToSave = [];


                try{

                  if(
                    typeof finalizedRows !==
                    "undefined" &&
                    Array.isArray(
                      finalizedRows
                    ) &&
                    finalizedRows.length
                  ){

                    rowsToSave =
                      JSON.parse(
                        JSON.stringify(
                          finalizedRows
                        )
                      );

                  }

                }catch(error){}


                /*
                 * A função openPDF da #49 já chama:
                 *
                 * saveHistory(rows);
                 * clearPedido();
                 *
                 * Portanto verificamos se o histórico
                 * já recebeu exatamente essas linhas.
                 */

                let alreadySaved =
                  false;


                try{

                  if(
                    rowsToSave.length &&
                    typeof historyOrders !==
                    "undefined" &&
                    Array.isArray(
                      historyOrders
                    ) &&
                    historyOrders.length
                  ){

                    const ultimo =
                      historyOrders[0];


                    if(
                      ultimo &&
                      Array.isArray(
                        ultimo.rows
                      )
                    ){

                      alreadySaved =
                        JSON.stringify(
                          ultimo.rows
                        ) ===
                        JSON.stringify(
                          rowsToSave
                        );

                    }

                  }

                }catch(error){}


                /*
                 * Só salva se ainda não estiver salvo.
                 */

                if(
                  rowsToSave.length &&
                  !alreadySaved &&
                  typeof saveHistory ===
                  "function"
                ){

                  saveHistory(
                    rowsToSave
                  );

                }


                /*
                 * Limpa pedido atual.
                 */

                vals = {};

                extras = [];

                finalizedRows = [];

                generalObservation = "";


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                /*
                 * Apaga somente dados do pedido atual.
                 */

                localStorage.removeItem(
                  "pedido_compras_vals"
                );

                localStorage.removeItem(
                  "pedido_compras_extras"
                );

                localStorage.removeItem(
                  "pedido_compras_validade_curta"
                );

                localStorage.removeItem(
                  "sp_general_obs"
                );


                /*
                 * Limpa observação visual.
                 */

                const obs =
                  document.getElementById(
                    "generalObs"
                  );


                if(obs){

                  obs.value = "";

                }


                /*
                 * Atualiza armazenamento.
                 */

                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                /*
                 * Atualiza tela.
                 */

                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                /*
                 * Esconde opções do pedido finalizado.
                 */

                const op =
                  document.getElementById(
                    "opcoesFinalizado"
                  );


                if(op){

                  op.style.display =
                    "none";

                }


                /*
                 * Zera campos de quantidade.
                 */

                document
                  .querySelectorAll(
                    "input.qty"
                  )
                  .forEach(
                    function(el){

                      el.value = "0";

                    }
                  );


                /*
                 * Volta para o topo.
                 */

                window.scrollTo({

                  top: 0,

                  behavior: "smooth"

                });

              };

          })();
          </script>
          PATCHJS

          test -s /tmp/super-pedido-fix.js

          node --check /tmp/super-pedido-fix.js

          echo "OK: patch JavaScript criado."
          echo "OK: patch JavaScript validado."

      # ==========================================================
      # APLICAR PATCH NA BUILD
      # ==========================================================

      - name: Aplicar correções na build
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          test -s /tmp/super-pedido-fix.js

          python3 - <<'PY'
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          patch = Path(
              "/tmp/super-pedido-fix.js"
          ).read_text(
              encoding="utf-8"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          if (
              "async function openPDF(sendViaWhatsApp=false)"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório #49 não encontrado."
              )

          if (
              "window.AndroidFileBridge.sharePdf"
              not in text
          ):

              raise SystemExit(
                  "ERRO: AndroidFileBridge não encontrado."
              )

          if (
              "orientation:'portrait'"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório não está em retrato."
              )

          if "</body>" not in text:

              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          text = text.replace(
              "</body>",
              patch + "\n</body>",
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: correções aplicadas na build."
          )

          print(
              "OK: relatório #49 preservado."
          )

          print(
              "OK: openPDF não foi sobrescrito."
          )

          PY

      # ==========================================================
      # BIBLIOTECAS PDF E EXCEL
      # ==========================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ==========================================================
      # VERIFICAR JAVASCRIPT
      # ==========================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "window.openAdmin=function(){",

              "window.repeatLastOrder=function(){",

              "window.applyRepeat=function(",

              "window.clearPedido=function(){",

              "window.AndroidFileBridge.sharePdf",

              "CÓDIGO",

              "NOME DO PRODUTO",

              "ESTOQUE",

              "PEDIDO"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "
                      + item
                  )

          if (
              "orientation:'landscape'"
              in text
              or
              'orientation:"landscape"'
              in text
          ):

              raise SystemExit(
                  "ERRO: relatório em paisagem."
              )

          print(
              "OK: verificações textuais concluídas."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK: JavaScript válido."

      # ==========================================================
      # VERIFICAÇÃO FINAL
      # ==========================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "window.openAdmin=function(){" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder=function(){" \
            "$HTML"

          grep -q \
            "window.applyRepeat=function(" \
            "$HTML"

          grep -q \
            "window.clearPedido=function(){" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          grep -q \
            "RELATÓRIO DE PEDIDO" \
            "$HTML"

          echo "=========================================="
          echo " VERIFICAÇÃO FINAL: OK"
          echo "=========================================="
          echo "BASE #49 ............... OK"
          echo "RELATÓRIO #49 .......... OK"
          echo "ADM .................... OK"
          echo "REPETIR ................ OK"
          echo "ZERAR .................. OK"
          echo "PDF A4 RETRATO ......... OK"
          echo "JAVASCRIPT ............. OK"
          echo "=========================================="

      # ==========================================================
      # COMPILAR APK
      # ==========================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ==========================================================
      # PUBLICAR APK
      # ==========================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
