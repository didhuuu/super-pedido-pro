name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - BAIXAR REPOSITÓRIO
      # ============================================================

      - name: Baixar projeto
        uses: actions/checkout@v4


      # ============================================================
      # 2 - JAVA 17
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ============================================================
      # 3 - GRADLE
      # ============================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'


      # ============================================================
      # 4 - PREPARAR ZIP DA V9
      # ============================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          mkdir -p projeto

          if [ ! -f "Super-Pedido-Pro.zip" ]; then
            echo "ERRO: Super-Pedido-Pro.zip não encontrado."
            exit 1
          fi

          unzip -o "Super-Pedido-Pro.zip" -d projeto

          echo "ZIP extraído com sucesso."


      # ============================================================
      # 5 - LOCALIZAR PROJETO ANDROID
      # ============================================================

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            -name "settings.gradle" \
            -print \
            -quit)

          if [ -z "$ANDROID_DIR" ]; then

            ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
              -type f \
              -name "settings.gradle.kts" \
              -print \
              -quit)

          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não localizado."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$ANDROID_DIR")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_DIR"


      # ============================================================
      # 6 - ANDROIDX
      # ============================================================

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

          echo "AndroidX configurado."


      # ============================================================
      # 7 - CORRIGIR HTML
      # ============================================================

      - name: Corrigir aplicativo - PDF retrato e limpeza
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app" / "src" / "main" / "assets" / "app" / "index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado em " + str(html)
              )

          text = html.read_text(encoding="utf-8")

          # ========================================================
          # BIBLIOTECAS LOCAIS
          # ========================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ========================================================
          # NOVA FUNÇÃO clearPedido
          # ========================================================

          clear_start = text.find("function clearPedido")

          if clear_start == -1:
              raise SystemExit(
                  "ERRO: função clearPedido não encontrada."
              )

          clear_end = text.find(
              "function sendWhatsApp",
              clear_start
          )

          if clear_end == -1:
              raise SystemExit(
                  "ERRO: função sendWhatsApp não encontrada."
              )

          new_clear = """
function clearPedido(historyRows=null){

  try{

    const historico =
      Array.isArray(historyRows) && historyRows.length
        ? historyRows
        : finalizedRows;

    if(
      historico &&
      historico.length &&
      typeof saveHistory === 'function'
    ){
      saveHistory(historico);
    }

  }catch(e){
    console.error('Erro ao salvar histórico:',e);
  }

  // ZERA ESTOQUE E PEDIDO
  vals={};

  // LIMPA ITENS ADICIONAIS
  extras=[];

  // LIMPA VALIDADES
  validadeCurta=[];

  // LIMPA PEDIDO FINALIZADO
  finalizedRows=[];

  // LIMPA OBSERVAÇÃO
  generalObservation='';

  const obs =
    document.getElementById('generalObs');

  if(obs){
    obs.value='';
  }

  // REMOVE OS DADOS DO PEDIDO SALVADOS
  localStorage.removeItem(
    'pedido_compras_vals'
  );

  localStorage.removeItem(
    'pedido_compras_extras'
  );

  localStorage.removeItem(
    'pedido_compras_validade_curta'
  );

  localStorage.removeItem(
    'sp_general_obs'
  );

  // REDESENHA A TELA
  render();

  if(
    typeof renderValidadeCurta === 'function'
  ){
    renderValidadeCurta();
  }

  updateBadge();

  if(
    typeof closeConference === 'function'
  ){
    closeConference();
  }

  const campos =
    document.querySelectorAll(
      'input.qty'
    );

  campos.forEach(function(campo){
    campo.value='0';
  });
}

"""

          text = (
              text[:clear_start]
              + new_clear
              + text[clear_end:]
          )

          # ========================================================
          # NOVA FUNÇÃO openPDF
          # A4 RETRATO
          # ========================================================

          pdf_start = text.find("async function openPDF")

          if pdf_start == -1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada."
              )

          clear_start = text.find(
              "function clearPedido",
              pdf_start
          )

          if clear_start == -1:
              raise SystemExit(
                  "ERRO: não foi possível localizar clearPedido após openPDF."
              )

          new_pdf = """
async function openPDF(sendViaWhatsApp=false){

  const rows =
    finalizedRows.length
      ? finalizedRows
      : getRows();

  if(!rows.length){

    alert(
      'Nenhum item foi selecionado.'
    );

    return;
  }

  try{

    const jsPDF =
      window.jspdf &&
      window.jspdf.jsPDF;

    if(!jsPDF){

      throw new Error(
        'Biblioteca PDF não carregada.'
      );

    }

    // ==========================================================
    // A4 RETRATO
    // ==========================================================

    const doc =
      new jsPDF({
        orientation:'portrait',
        unit:'mm',
        format:'a4'
      });

    const pageWidth=210;
    const pageHeight=297;
    const margem=10;

    const larguraTabela=190;

    const colCodigo=27;
    const colProduto=108;
    const colEstoque=27;
    const colPedido=28;

    let y=15;

    const data =
      new Date().toLocaleDateString(
        'pt-BR'
      );

    // ==========================================================
    // TÍTULO
    // ==========================================================

    function desenharTitulo(){

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(16);

      doc.text(
        'RELATÓRIO DE PEDIDO',
        pageWidth/2,
        y,
        {
          align:'center'
        }
      );

      y+=7;

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(9);

      doc.text(
        'Data: '+data,
        margem,
        y
      );

      y+=8;
    }

    // ==========================================================
    // CABEÇALHO
    // ==========================================================

    function desenharCabecalho(){

      const altura=7;

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(7.5);

      doc.rect(
        margem,
        y,
        larguraTabela,
        altura
      );

      doc.line(
        margem+colCodigo,
        y,
        margem+colCodigo,
        y+altura
      );

      doc.line(
        margem+colCodigo+colProduto,
        y,
        margem+colCodigo+colProduto,
        y+altura
      );

      doc.line(
        margem+colCodigo+colProduto+colEstoque,
        y,
        margem+colCodigo+colProduto+colEstoque,
        y+altura
      );

      doc.text(
        'CÓDIGO',
        margem+2,
        y+4.7
      );

      doc.text(
        'NOME DO PRODUTO',
        margem+colCodigo+2,
        y+4.7
      );

      doc.text(
        'ESTOQUE',
        margem+colCodigo+colProduto+2,
        y+4.7
      );

      doc.text(
        'PEDIDO',
        margem+colCodigo+colProduto+colEstoque+2,
        y+4.7
      );

      y+=altura;
    }

    // ==========================================================
    // NOVA PÁGINA
    // ==========================================================

    function novaPagina(){

      doc.addPage(
        'a4',
        'portrait'
      );

      y=15;

      desenharTitulo();
    }

    // ==========================================================
    // NOME DO PRODUTO
    // ==========================================================

    function nomeProduto(nome){

      let valor =
        String(nome || '');

      const limite =
        colProduto-5;

      doc.setFontSize(7.2);

      if(
        doc.getTextWidth(valor) <= limite
      ){
        return valor;
      }

      while(
        valor.length > 4 &&
        doc.getTextWidth(
          valor+'...'
        ) > limite
      ){

        valor =
          valor.substring(
            0,
            valor.length-1
          );

      }

      return valor+'...';
    }

    // ==========================================================
    // TÍTULO INICIAL
    // ==========================================================

    desenharTitulo();

    // ==========================================================
    // AGRUPAR PRODUTOS
    // ==========================================================

    const grupos =
      groupRows(rows);

    for(
      const [categoria,items]
      of Object.entries(grupos)
    ){

      if(
        y+22 >
        pageHeight-10
      ){

        novaPagina();

      }

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(10);

      doc.text(
        String(
          categoria || ''
        ).toUpperCase(),
        margem,
        y
      );

      y+=5;

      desenharCabecalho();

      for(
        const item
        of items
      ){

        if(
          y+6 >
          pageHeight-10
        ){

          novaPagina();

          doc.setFont(
            'helvetica',
            'bold'
          );

          doc.setFontSize(10);

          doc.text(
            String(
              categoria || ''
            ).toUpperCase(),
            margem,
            y
          );

          y+=5;

          desenharCabecalho();

        }

        const alturaLinha=6;

        doc.setFont(
          'helvetica',
          'normal'
        );

        doc.setFontSize(7.2);

        // ------------------------------------------------------
        // BORDA DA LINHA
        // ------------------------------------------------------

        doc.rect(
          margem,
          y,
          larguraTabela,
          alturaLinha
        );

        doc.line(
          margem+colCodigo,
          y,
          margem+colCodigo,
          y+alturaLinha
        );

        doc.line(
          margem+colCodigo+colProduto,
          y,
          margem+colCodigo+colProduto,
          y+alturaLinha
        );

        doc.line(
          margem+colCodigo+colProduto+colEstoque,
          y,
          margem+colCodigo+colProduto+colEstoque,
          y+alturaLinha
        );

        // ------------------------------------------------------
        // CÓDIGO
        // ------------------------------------------------------

        doc.text(
          String(
            item.code || '-'
          ),
          margem+2,
          y+4
        );

        // ------------------------------------------------------
        // NOME
        // ------------------------------------------------------

        doc.text(
          nomeProduto(item.name),
          margem+colCodigo+2,
          y+4
        );

        // ------------------------------------------------------
        // ESTOQUE
        // ------------------------------------------------------

        doc.text(
          String(
            item.stock ?? 0
          ),
          margem+colCodigo+colProduto+2,
          y+4
        );

        // ------------------------------------------------------
        // PEDIDO
        // ------------------------------------------------------

        doc.text(
          String(
            item.order ?? 0
          ),
          margem+colCodigo+colProduto+colEstoque+2,
          y+4
        );

        y+=alturaLinha;

      }

      y+=5;

    }

    // ==========================================================
    // OBSERVAÇÃO
    // ==========================================================

    if(generalObservation){

      if(
        y+20 >
        pageHeight-10
      ){

        novaPagina();

      }

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(8);

      doc.text(
        'OBSERVAÇÃO GERAL:',
        margem,
        y
      );

      y+=5;

      doc.setFont(
        'helvetica',
        'normal'
      );

      const observacao =
        doc.splitTextToSize(
          String(
            generalObservation
          ),
          larguraTabela
        );

      doc.text(
        observacao,
        margem,
        y
      );

    }

    // ==========================================================
    // RODAPÉ
    // ==========================================================

    const totalPaginas =
      doc.internal.getNumberOfPages();

    for(
      let pagina=1;
      pagina<=totalPaginas;
      pagina++
    ){

      doc.setPage(
        pagina
      );

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(7);

      doc.text(
        'Super Pedido Pro',
        margem,
        pageHeight-5
      );

      doc.text(
        'Página '+pagina+' de '+totalPaginas,
        pageWidth-margem,
        pageHeight-5,
        {
          align:'right'
        }
      );

    }

    // ==========================================================
    // GERAR BASE64
    // ==========================================================

    const base64 =
      doc.output(
        'datauristring'
      ).split(',')[1];

    const nomeArquivo =
      'relatorio-pedido-' +
      data.replace(
        /\//g,
        '-'
      ) +
      '.pdf';

    // ==========================================================
    // IMPORTANTE:
    // LIMPA O PEDIDO ANTES DO COMPARTILHAMENTO.
    //
    // clearPedido(rows) salva o histórico uma única vez.
    // ==========================================================

    clearPedido(rows);

    // ==========================================================
    // ANDROID
    // ==========================================================

    if(
      window.AndroidFileBridge &&
      typeof
        window.AndroidFileBridge.sharePdf ===
        'function'
    ){

      window.AndroidFileBridge.sharePdf(
        nomeArquivo,
        base64
      );

      return;

    }

    // ==========================================================
    // NAVEGADOR
    // ==========================================================

    const binario =
      atob(base64);

    const bytes =
      new Uint8Array(
        binario.length
      );

    for(
      let i=0;
      i<binario.length;
      i++
    ){

      bytes[i] =
        binario.charCodeAt(i);

    }

    const blob =
      new Blob(
        [bytes],
        {
          type:'application/pdf'
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const link =
      document.createElement(
        'a'
      );

    link.href=url;

    link.download =
      nomeArquivo;

    document.body.appendChild(
      link
    );

    link.click();

    link.remove();

    setTimeout(
      function(){

        URL.revokeObjectURL(
          url
        );

      },
      1000
    );

  }catch(e){

    console.error(e);

    alert(
      'Não foi possível gerar o PDF: '+
      (e.message || e)
    );

  }

}

"""

          text = (
              text[:pdf_start]
              + new_pdf
              + text[clear_start:]
          )

          # ========================================================
          # GRAVAR HTML
          # ========================================================

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("========================================")
          print("HTML CORRIGIDO")
          print("PDF: A4 RETRATO")
          print("Largura: 210 mm")
          print("Altura: 297 mm")
          print("Limpeza do pedido: ATIVA")
          print("Histórico: PRESERVADO")
          print("Cadastro de produtos: PRESERVADO")
          print("MainActivity: PRESERVADA")
          print("========================================")

          PY


      # ============================================================
      # 8 - BAIXAR BIBLIOTECAS
      # ============================================================

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas locais OK."


      # ============================================================
      # 9 - VERIFICAR CORREÇÕES
      # ============================================================

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          echo "Verificando HTML..."

          test -f "$HTML"

          grep -q "async function openPDF" "$HTML"

          grep -q "function clearPedido" "$HTML"

          grep -q "orientation:'portrait'" "$HTML"

          grep -q "format:'a4'" "$HTML"

          grep -q "pageWidth=210" "$HTML"

          grep -q "pageHeight=297" "$HTML"

          grep -q \
            "localStorage.removeItem" \
            "$HTML"

          grep -q \
            "pedido_compras_vals" \
            "$HTML"

          grep -q \
            "pedido_compras_extras" \
            "$HTML"

          grep -q \
            "pedido_compras_validade_curta" \
            "$HTML"

          grep -q \
            "AndroidFileBridge.sharePdf" \
            "$HTML"

          if grep -q "orientation:'landscape'" "$HTML"; then
            echo "ERRO: PDF landscape encontrado."
            exit 1
          fi

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: PDF landscape encontrado."
            exit 1
          fi

          echo "========================================"
          echo "TODAS AS CORREÇÕES FORAM VERIFICADAS"
          echo "========================================"


      # ============================================================
      # 10 - COMPILAR APK
      # ============================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug


      # ============================================================
      # 11 - VERIFICAR APK
      # ============================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"


      # ============================================================
      # 12 - DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
