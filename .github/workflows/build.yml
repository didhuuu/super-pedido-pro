name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo - versão 9 + PDF
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          main = next(
              (root / "app/src/main/java").rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          if main is None:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # 1. LIMPAR PEDIDO APÓS ENVIO
          # ============================================================

          new_clear = '''function clearPedido(){
            Object.keys(vals).forEach(k=>delete vals[k]);
            extras=[];
            validadeCurta=[];
            finalizedRows=[];
            generalObservation='';
            const obs=document.getElementById('generalObs');
            if(obs) obs.value='';
            save();
            render();
            updateBadge();
            closeConference();
          }'''

          text, n = re.subn(
              r"function clearPedido\(\)\{.*?\n\}",
              new_clear,
              text,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrado"
              )

          # ============================================================
          # 2. SELECIONAR PRIMEIRA CATEGORIA AUTOMATICAMENTE
          # ============================================================

          old_start = (
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          new_start = (
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "if(!current || !APP_DATA[current])"
              "current=cats[0]||'';"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          if old_start in text:
              text = text.replace(
                  old_start,
                  new_start,
                  1
              )

          # ============================================================
          # 3. BIBLIOTECAS LOCAIS
          # ============================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/"
              "xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/"
              "jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ============================================================
          # 4. CONFIRMAR IMPORTAÇÃO
          # ============================================================

          required = [
              "importedCatalogActive=true",
              "customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))",
              "localStorage.setItem('sp_imported_catalog_active'"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      f"ERRO: correção de importação ausente: {item}"
                  )

          # ============================================================
          # 5. PDF
          # ============================================================

          pdf_code = r'''<script>
          (function(){

            window.openPDF=function(){

              const rows =
                finalizedRows.length
                  ? finalizedRows
                  : getRows();

              if(!rows.length){
                alert('Nenhum item foi selecionado.');
                return;
              }

              try{

                if(
                  !window.jspdf ||
                  !window.jspdf.jsPDF
                ){
                  throw new Error(
                    'Biblioteca PDF não carregada.'
                  );
                }

                const doc =
                  new window.jspdf.jsPDF({
                    orientation:'landscape',
                    unit:'mm',
                    format:'a4'
                  });

                const W=297;
                const H=210;
                const M=10;

                const C1=30;
                const C2=167;
                const C3=35;
                const C4=35;

                const x1=M;
                const x2=x1+C1;
                const x3=x2+C2;
                const x4=x3+C3;

                const rowH=7;
                const headH=8;

                let y=12;

                const data =
                  new Date().toLocaleDateString(
                    'pt-BR'
                  );

                function title(){

                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(16);

                  doc.text(
                    'RELATÓRIO DE PEDIDO',
                    W/2,
                    y,
                    {
                      align:'center'
                    }
                  );

                  y+=8;

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(9);

                  doc.text(
                    'Data: '+data,
                    M,
                    y
                  );

                  y+=7;
                }

                function header(){

                  if(
                    y+headH >
                    H-10
                  ){

                    doc.addPage();

                    y=12;

                    title();
                  }

                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(8);

                  const cols=[
                    [x1,C1,'CÓDIGO'],
                    [x2,C2,'NOME DO PRODUTO'],
                    [x3,C3,'ESTOQUE'],
                    [x4,C4,'PEDIDO']
                  ];

                  cols.forEach(function(c){

                    doc.rect(
                      c[0],
                      y,
                      c[1],
                      headH
                    );

                    if(
                      c[2] ===
                      'NOME DO PRODUTO'
                    ){

                      doc.text(
                        c[2],
                        c[0]+3,
                        y+5.2
                      );

                    }else{

                      doc.text(
                        c[2],
                        c[0]+c[1]/2,
                        y+5.2,
                        {
                          align:'center'
                        }
                      );
                    }
                  });

                  y+=headH;
                }

                function fitName(name){

                  const original =
                    String(name || '');

                  let value =
                    original;

                  while(
                    value.length>3 &&
                    doc.getTextWidth(value) >
                      C2-6
                  ){

                    value =
                      value.slice(
                        0,
                        -1
                      );
                  }

                  if(
                    value !== original
                  ){

                    value =
                      value.slice(
                        0,
                        Math.max(
                          1,
                          value.length-3
                        )
                      )+'...';
                  }

                  return value;
                }

                function line(item){

                  if(
                    y+rowH >
                    H-10
                  ){

                    doc.addPage();

                    y=12;

                    title();

                    header();
                  }

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(8);

                  doc.rect(
                    x1,
                    y,
                    C1,
                    rowH
                  );

                  doc.rect(
                    x2,
                    y,
                    C2,
                    rowH
                  );

                  doc.rect(
                    x3,
                    y,
                    C3,
                    rowH
                  );

                  doc.rect(
                    x4,
                    y,
                    C4,
                    rowH
                  );

                  doc.text(
                    String(
                      item.code || '-'
                    ),
                    x1+3,
                    y+4.8
                  );

                  doc.text(
                    fitName(item.name),
                    x2+3,
                    y+4.8
                  );

                  doc.text(
                    String(
                      item.stock ?? 0
                    ),
                    x3+C3/2,
                    y+4.8,
                    {
                      align:'center'
                    }
                  );

                  doc.text(
                    String(
                      item.order ?? 0
                    ),
                    x4+C4/2,
                    y+4.8,
                    {
                      align:'center'
                    }
                  );

                  y+=rowH;
                }

                title();

                const groups =
                  groupRows(rows);

                Object.entries(
                  groups
                ).forEach(
                  function(entry){

                    const cat =
                      entry[0];

                    const items =
                      entry[1];

                    if(
                      y+25 >
                      H-10
                    ){

                      doc.addPage();

                      y=12;

                      title();
                    }

                    y+=5;

                    doc.setFont(
                      'helvetica',
                      'bold'
                    );

                    doc.setFontSize(12);

                    doc.text(
                      String(
                        cat || ''
                      ).toUpperCase(),
                      M,
                      y
                    );

                    y+=4;

                    header();

                    items.forEach(
                      line
                    );
                  }
                );

                if(
                  typeof generalObservation !==
                    'undefined' &&
                  generalObservation
                ){

                  if(
                    y+20 >
                    H-10
                  ){

                    doc.addPage();

                    y=12;

                    title();
                  }

                  y+=7;

                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(9);

                  doc.text(
                    'OBSERVAÇÃO GERAL:',
                    M,
                    y
                  );

                  y+=5;

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(8);

                  const lines =
                    doc.splitTextToSize(
                      String(
                        generalObservation
                      ),
                      267
                    );

                  doc.text(
                    lines,
                    M,
                    y
                  );
                }

                const total =
                  doc.getNumberOfPages();

                for(
                  let p=1;
                  p<=total;
                  p++
                ){

                  doc.setPage(p);

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(7);

                  doc.text(
                    'Super Pedido Pro',
                    M,
                    H-5
                  );

                  doc.text(
                    'Página '+p+
                    ' de '+total,
                    W-M,
                    H-5,
                    {
                      align:'right'
                    }
                  );
                }

                const base64 =
                  doc
                    .output(
                      'datauristring'
                    )
                    .split(',')[1];

                const filename =
                  'relatorio-pedido-' +
                  data.replace(
                    /\//g,
                    '-'
                  ) +
                  '.pdf';

                if(
                  window.AndroidFileBridge &&
                  typeof
                    window.AndroidFileBridge.sharePdf ===
                      'function'
                ){

                  window.AndroidFileBridge.sharePdf(
                    filename,
                    base64
                  );

                }else{

                  doc.save(
                    filename
                  );
                }

              }catch(e){

                console.error(
                  'Erro ao gerar PDF:',
                  e
                );

                alert(
                  'Não foi possível gerar o PDF: '+
                  e.message
                );
              }
            };

            const button =
              document.getElementById(
                'btnWhatsPdf'
              );

            if(button){

              button.onclick =
                window.openPDF;
            }

          })();
          </script>'''

          if "</body>" in text:

              text=text.replace(
                  "</body>",
                  pdf_code+
                  "\n</body>",
                  1
              )

          else:

              text += pdf_code

          html.write_text(
              text,
              encoding="utf-8"
          )

          # ============================================================
          # 6. MAIN ACTIVITY
          # ============================================================

          java=main.read_text(
              encoding="utf-8"
          )

          # ------------------------------------------------------------
          # Não usar sanitizeFilename().
          # O nome é tratado diretamente aqui.
          # ------------------------------------------------------------

          safe_share = '''@JavascriptInterface
          public void sharePdf(String filename, String base64) {
              try {

                  byte[] bytes =
                      Base64.decode(
                          base64,
                          Base64.DEFAULT
                      );

                  String safeName =
                      filename == null ||
                      filename.trim().isEmpty()
                          ? "arquivo.pdf"
                          : new File(filename)
                              .getName()
                              .replaceAll(
                                  "[\\\\/:*?\\\"<>|]",
                                  "_"
                              );

                  if(
                      !safeName
                          .toLowerCase()
                          .endsWith(".pdf")
                  ){
                      safeName += ".pdf";
                  }

                  File sharedDir =
                      new File(
                          MainActivity.this
                              .getCacheDir(),
                          "shared"
                      );

                  if(
                      !sharedDir.exists() &&
                      !sharedDir.mkdirs() &&
                      !sharedDir.exists()
                  ){
                      throw new Exception(
                          "Não foi possível criar cache/shared."
                      );
                  }

                  File file =
                      new File(
                          sharedDir,
                          safeName
                      );

                  try(
                      FileOutputStream fos =
                          new FileOutputStream(file)
                  ){
                      fos.write(bytes);
                  }

                  Uri uri =
                      FileProvider.getUriForFile(
                          MainActivity.this,
                          MainActivity.this
                              .getPackageName()
                              + ".fileprovider",
                          file
                      );

                  Intent shareIntent =
                      new Intent(
                          Intent.ACTION_SEND
                      );

                  shareIntent.setType(
                      "application/pdf"
                  );

                  shareIntent.putExtra(
                      Intent.EXTRA_STREAM,
                      uri
                  );

                  shareIntent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                  );

                  shareIntent.setClipData(
                      ClipData.newRawUri(
                          "PDF",
                          uri
                      )
                  );

                  try {

                      Intent whatsappIntent =
                          new Intent(
                              Intent.ACTION_SEND
                          );

                      whatsappIntent.setType(
                          "application/pdf"
                      );

                      whatsappIntent.putExtra(
                          Intent.EXTRA_STREAM,
                          uri
                      );

                      whatsappIntent.addFlags(
                          Intent.FLAG_GRANT_READ_URI_PERMISSION
                      );

                      whatsappIntent.setClipData(
                          ClipData.newRawUri(
                              "PDF",
                              uri
                          )
                      );

                      whatsappIntent.setPackage(
                          "com.whatsapp"
                      );

                      startActivity(
                          whatsappIntent
                      );

                  } catch(Exception e) {

                      startActivity(
                          Intent.createChooser(
                              shareIntent,
                              "Enviar pedido em PDF"
                          )
                      );
                  }

              } catch(Exception e) {

                  e.printStackTrace();

                  Toast.makeText(
                      MainActivity.this,
                      "Erro ao compartilhar o PDF.",
                      Toast.LENGTH_LONG
                  ).show();
              }
          }'''

          # Procurar o método atual sharePdf inteiro.

          pattern = (
              r'@JavascriptInterface\s+'
              r'public void sharePdf'
              r'\(String filename, String base64\)'
              r'\s*\{.*?\n\s*\}'
          )

          java2,n = re.subn(
              pattern,
              safe_share,
              java,
              count=1,
              flags=re.S
          )

          if n != 1:

              raise SystemExit(
                  "ERRO: método sharePdf não encontrado"
              )

          main.write_text(
              java2,
              encoding="utf-8"
          )

          print(
              "Correções da versão 9 aplicadas."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o xlsx.full.min.js \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

          curl -L --fail --retry 3 \
            -o jspdf.umd.min.js \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

          test -s xlsx.full.min.js

          test -s jspdf.umd.min.js

      - name: Verificar correções
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          test -f app/src/main/assets/app/index.html

          test -f app/src/main/assets/app/xlsx.full.min.js

          test -f app/src/main/assets/app/jspdf.umd.min.js

          grep -q "RELATÓRIO DE PEDIDO" \
            app/src/main/assets/app/index.html

          grep -q "AndroidFileBridge.sharePdf" \
            app/src/main/assets/app/index.html

          if grep -R \
            "sanitizeFilename(filename)" \
            app/src/main/java \
            --include="*.java"
          then
            echo "ERRO: sanitizeFilename ainda está sendo chamado."
            exit 1
          fi

          echo "Verificação concluída com sucesso."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "=========================================="
          echo "INICIANDO COMPILAÇÃO DO APK"
          echo "=========================================="

          if [ -f "./gradlew" ]; then

            echo "Gradle Wrapper encontrado."

            chmod +x ./gradlew

            ./gradlew clean assembleDebug --stacktrace

          else

            echo "Gradle Wrapper não encontrado no ZIP."
            echo "Usando Gradle 8.7 instalado pelo Actions."

            gradle --version

            gradle clean assembleDebug --stacktrace

          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(
            find \
              "$ANDROID_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print \
              -quit
          )

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Enviar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
