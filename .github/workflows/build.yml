name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar base aprovada #49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f Super-Pedido-Pro.zip

          mkdir -p projeto

          unzip -o Super-Pedido-Pro.zip -d projeto

          ANDROID_DIR=$(find \
            "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit \
            | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF \
            'android.useAndroidX=true' \
            gradle.properties \
            || echo 'android.useAndroidX=true' >> gradle.properties

          grep -qF \
            'android.enableJetifier=true' \
            gradle.properties \
            || echo 'android.enableJetifier=true' >> gradle.properties

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-base49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          src = Path(
              "/tmp/build-base49.yml"
          ).read_text(
              encoding="utf-8"
          ).splitlines()

          start = None

          for i, line in enumerate(src):

              if line.strip() == \
                  "- name: Alterar SOMENTE o relatório":

                  start = i
                  break

          if start is None:

              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(
              start + 1,
              len(src)
          ):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  src[i]
              ):

                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  src[i]
              ):

                  break

          if run_line is None:

              raise SystemExit(
                  "ERRO: bloco run do relatório #49 não encontrado."
              )

          out = []

          for line in src[run_line + 1:]:

              if re.match(
                  r"^      - name:",
                  line
              ):

                  break

              if line.startswith(
                  "          "
              ):

                  out.append(
                      line[10:]
                  )

              elif not line.strip():

                  out.append("")

              else:

                  raise SystemExit(
                      "ERRO: indentação do relatório #49 inválida."
                  )

          report = (
              "\n".join(out).rstrip()
              + "\n"
          )

          required = [
              "async function openPDF(sendViaWhatsApp=false)",
              "window.AndroidFileBridge.sharePdf",
              "orientation:'portrait'",
              "format:'a4'"
          ]

          for item in required:

              if item not in report:

                  raise SystemExit(
                      "ERRO: relatório #49 incompleto: "
                      + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report,
              encoding="utf-8"
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

      - name: Corrigir Repetir Último
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          cat > /tmp/repetir-ultimo.js <<'JS'
          (function(){

            function clone(v){
              try{
                return JSON.parse(JSON.stringify(v));
              }catch(e){
                return v;
              }
            }

            function findProduct(item){

              const code =
                String(item.code || '').trim();

              const name =
                String(item.name || '')
                .trim()
                .toLowerCase();

              if(
                code &&
                typeof productByCode === 'function'
              ){

                const p =
                  productByCode(code);

                if(p) return p;
              }

              if(
                typeof APP_DATA !== 'undefined'
              ){

                for(
                  const c of Object.keys(APP_DATA || {})
                ){

                  const sups =
                    APP_DATA[c] || {};

                  for(
                    const s of Object.keys(sups)
                  ){

                    const items =
                      Array.isArray(sups[s])
                        ? sups[s]
                        : [];

                    for(
                      let i = 0;
                      i < items.length;
                      i++
                    ){

                      const p = items[i];

                      if(
                        code &&
                        String(p[0] || '').trim() === code
                      ){

                        return {
                          c:c,
                          s:s,
                          i:i,
                          p:p
                        };
                      }

                      if(
                        name &&
                        String(p[1] || '')
                          .trim()
                          .toLowerCase() === name
                      ){

                        return {
                          c:c,
                          s:s,
                          i:i,
                          p:p
                        };
                      }
                    }
                  }
                }
              }

              return null;
            }

            function loadLast(){

              try{

                if(
                  Array.isArray(lastOrder) &&
                  lastOrder.length
                ){

                  return clone(lastOrder);
                }

              }catch(e){}

              try{

                const v =
                  JSON.parse(
                    localStorage.getItem(
                      'sp_last_order'
                    ) || 'null'
                  );

                if(
                  Array.isArray(v) &&
                  v.length
                ){

                  return v;
                }

              }catch(e){}

              try{

                const h =
                  JSON.parse(
                    localStorage.getItem(
                      'sp_history'
                    ) || '[]'
                  );

                if(
                  Array.isArray(h) &&
                  h[0] &&
                  Array.isArray(h[0].rows)
                ){

                  return clone(h[0].rows);
                }

              }catch(e){}

              try{

                if(
                  Array.isArray(historyOrders) &&
                  historyOrders[0] &&
                  Array.isArray(
                    historyOrders[0].rows
                  )
                ){

                  return clone(
                    historyOrders[0].rows
                  );
                }

              }catch(e){}

              return [];
            }

            window.repeatLastOrder =
              function(){

                const rows =
                  loadLast();

                if(!rows.length){

                  alert(
                    'Ainda não existe último pedido.'
                  );

                  return;
                }

                window.applyRepeat(rows);
              };

            window.applyRepeat =
              function(rows){

                if(
                  !Array.isArray(rows) ||
                  !rows.length
                ){

                  alert(
                    'Não foi possível recuperar o último pedido.'
                  );

                  return;
                }

                vals = {};
                extras = [];

                let first = '';
                let count = 0;

                rows.forEach(
                  function(item){

                    if(!item) return;

                    if(
                      item.cat ===
                      'Produto Adicional'
                    ){

                      extras.push({
                        code:
                          item.code === '-'
                            ? ''
                            : String(
                                item.code || ''
                              ),
                        name:
                          String(
                            item.name || ''
                          ),
                        qty:
                          Number(
                            item.order
                          ) || 0
                      });

                      count++;

                      return;
                    }

                    const p =
                      findProduct(item);

                    if(!p) return;

                    if(!first){
                      first = p.c;
                    }

                    vals[
                      key(
                        p.c,
                        p.s,
                        p.i,
                        'o'
                      )
                    ] =
                      Number(item.order) || 0;

                    vals[
                      key(
                        p.c,
                        p.s,
                        p.i,
                        's'
                      )
                    ] =
                      Number(item.stock) || 0;

                    count++;
                  }
                );

                if(
                  rows.generalObservation !==
                  undefined
                ){

                  generalObservation =
                    String(
                      rows.generalObservation || ''
                    );
                }

                const obs =
                  document.getElementById(
                    'generalObs'
                  );

                if(obs){

                  obs.value =
                    generalObservation || '';
                }

                if(
                  first &&
                  typeof APP_DATA !==
                    'undefined' &&
                  APP_DATA[first]
                ){

                  current = first;
                }

                if(
                  typeof save === 'function'
                ){

                  save();
                }

                if(
                  typeof saveFeatures ===
                  'function'
                ){

                  saveFeatures();
                }

                if(
                  typeof tabs === 'function'
                ){

                  tabs();
                }

                if(
                  typeof render === 'function'
                ){

                  render();
                }

                if(
                  typeof renderValidadeCurta ===
                  'function'
                ){

                  renderValidadeCurta();
                }

                if(
                  typeof updateBadge ===
                  'function'
                ){

                  updateBadge();
                }

                try{

                  lastOrder =
                    clone(rows);

                  localStorage.setItem(
                    'sp_last_order',
                    JSON.stringify(
                      lastOrder
                    )
                  );

                }catch(e){}

                if(
                  typeof closeFeature ===
                  'function'
                ){

                  closeFeature();
                }

                if(count){

                  alert(
                    'Último pedido recuperado. Confira antes de enviar.'
                  );

                }else{

                  alert(
                    'O último pedido foi encontrado, mas nenhum item pôde ser localizado.'
                  );
                }
              };

          })();
          JS

          node --check \
            /tmp/repetir-ultimo.js

          python3 - "$HTML" /tmp/repetir-ultimo.js <<'PY'
          from pathlib import Path
          import sys

          html_file = Path(sys.argv[1])
          js_file = Path(sys.argv[2])

          html = html_file.read_text(
              encoding="utf-8"
          )

          js = js_file.read_text(
              encoding="utf-8"
          )

          block = (
              "\n<script>\n"
              + js
              + "\n</script>\n"
          )

          if "</body>" in html:

              html = html.replace(
                  "</body>",
                  block + "</body>",
                  1
              )

          elif "</html>" in html:

              html = html.replace(
                  "</html>",
                  block + "</html>",
                  1
              )

          else:

              raise SystemExit(
                  "ERRO: não foi encontrado </body> nem </html>."
              )

          html_file.write_text(
              html,
              encoding="utf-8"
          )

          print(
              "OK - Repetir Último inserido dentro de <script>."
          )

          PY

      - name: Corrigir Importar Lista dentro do ADM
        shell: bash
        run: |
          set -e

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          cat > /tmp/patch-importador.py <<'PY'
          from pathlib import Path
          import re
          import sys

          main = Path(sys.argv[1])

          java = main.read_text(
              encoding="utf-8"
          )

          required_imports = [
              "import android.content.ClipData;",
              "import android.net.Uri;",
              "import android.webkit.ValueCallback;",
              "import android.webkit.WebChromeClient;"
          ]

          package_pos = java.find(
              "package "
          )

          if package_pos < 0:

              raise SystemExit(
                  "ERRO: package da MainActivity não encontrado."
              )

          package_end = java.find(
              chr(10),
              package_pos
          )

          if package_end < 0:

              raise SystemExit(
                  "ERRO: fim do package não encontrado."
              )

          missing_imports = []

          for imp in required_imports:

              if imp not in java:

                  missing_imports.append(
                      imp
                  )

          if missing_imports:

              block = (
                  chr(10) +
                  chr(10).join(
                      missing_imports
                  ) +
                  chr(10)
              )

              java = (
                  java[:package_end + 1] +
                  block +
                  java[package_end + 1:]
              )

          if (
              "private ValueCallback<Uri[]> filePathCallback;"
              not in java
          ):

              class_match = re.search(
                  r"public\s+class\s+MainActivity[^{]*\{",
                  java
              )

              if not class_match:

                  raise SystemExit(
                      "ERRO: classe MainActivity não encontrada."
                  )

              fields = (
                  chr(10) +
                  "    private ValueCallback<Uri[]> filePathCallback;" +
                  chr(10) +
                  "    private static final int FILE_CHOOSER_REQUEST = 1001;" +
                  chr(10)
              )

              java = (
                  java[:class_match.end()] +
                  fields +
                  java[class_match.end():]
              )

          chrome_lines = [
              "",
              "    webView.setWebChromeClient(new WebChromeClient() {",
              "        @Override",
              "        public boolean onShowFileChooser(",
              "                WebView view,",
              "                ValueCallback<Uri[]> callback,",
              "                FileChooserParams params) {",
              "",
              "            if (MainActivity.this.filePathCallback != null) {",
              "                MainActivity.this.filePathCallback.onReceiveValue(null);",
              "            }",
              "",
              "            MainActivity.this.filePathCallback = callback;",
              "",
              "            try {",
              "                Intent intent = params.createIntent();",
              "                startActivityForResult(intent, FILE_CHOOSER_REQUEST);",
              "                return true;",
              "",
              "            } catch (Exception e) {",
              "",
              "                MainActivity.this.filePathCallback = null;",
              "",
              "                Toast.makeText(",
              "                        MainActivity.this,",
              "                        \"Não foi possível abrir o seletor de arquivos.\",",
              "                        Toast.LENGTH_LONG",
              "                ).show();",
              "",
              "                return false;",
              "            }",
              "        }",
              "    });",
              ""
          ]

          chrome = chr(10).join(
              chrome_lines
          )

          if "onShowFileChooser" not in java:

              needle = "webView.setWebViewClient("

              start = java.find(
                  needle
              )

              if start < 0:

                  raise SystemExit(
                      "ERRO: setWebViewClient não encontrado."
                  )

              depth = 0
              quote = None
              escape = False
              seen_open = False
              found = False

              i = start

              while i < len(java):

                  ch = java[i]

                  if quote is not None:

                      if escape:

                          escape = False

                      elif ch == chr(92):

                          escape = True

                      elif ch == quote:

                          quote = None

                  else:

                      if (
                          ch == "'"
                          or ch == '"'
                      ):

                          quote = ch

                      elif ch == '(':

                          depth += 1
                          seen_open = True

                      elif ch == ')':

                          depth -= 1

                          if (
                              seen_open
                              and depth == 0
                          ):

                              j = i + 1

                              while (
                                  j < len(java)
                                  and java[j].isspace()
                              ):

                                  j += 1

                              if (
                                  j < len(java)
                                  and java[j] == ';'
                              ):

                                  java = (
                                      java[:j + 1] +
                                      chrome +
                                      java[j + 1:]
                                  )

                                  found = True

                                  break

                  i += 1

              if not found:

                  raise SystemExit(
                      "ERRO: final de setWebViewClient não encontrado."
                  )

          if (
              "protected void onActivityResult"
              not in java
          ):

              result_lines = [
                  "",
                  "    @Override",
                  "    protected void onActivityResult(",
                  "            int requestCode,",
                  "            int resultCode,",
                  "            Intent data) {",
                  "",
                  "        super.onActivityResult(",
                  "                requestCode,",
                  "                resultCode,",
                  "                data",
                  "        );",
                  "",
                  "        if (",
                  "                requestCode != FILE_CHOOSER_REQUEST",
                  "                || filePathCallback == null",
                  "        ) {",
                  "            return;",
                  "        }",
                  "",
                  "        Uri[] results = null;",
                  "",
                  "        if (",
                  "                resultCode == RESULT_OK",
                  "                && data != null",
                  "        ) {",
                  "",
                  "            if (data.getClipData() != null) {",
                  "",
                  "                int count =",
                  "                        data.getClipData().getItemCount();",
                  "",
                  "                results = new Uri[count];",
                  "",
                  "                for (",
                  "                        int i = 0;",
                  "                        i < count;",
                  "                        i++",
                  "                ) {",
                  "",
                  "                    results[i] =",
                  "                            data.getClipData()",
                  "                                    .getItemAt(i)",
                  "                                    .getUri();",
                  "                }",
                  "",
                  "            } else if (data.getData() != null) {",
                  "",
                  "                results = new Uri[]{",
                  "                        data.getData()",
                  "                };",
                  "            }",
                  "        }",
                  "",
                  "        filePathCallback.onReceiveValue(results);",
                  "",
                  "        filePathCallback = null;",
                  "    }",
                  ""
              ]

              result = chr(10).join(
                  result_lines
              )

              marker = (
                  "    public class AndroidFileBridge {"
              )

              if marker in java:

                  java = java.replace(
                      marker,
                      result + marker,
                      1
                  )

              else:

                  idx = java.rfind(
                      chr(10) + "}"
                  )

                  if idx < 0:

                      raise SystemExit(
                          "ERRO: final da MainActivity não encontrado."
                      )

                  java = (
                      java[:idx] +
                      result +
                      java[idx:]
                  )

          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "OK - MainActivity corrigida para importar arquivos."
          )

          PY

          python3 \
            /tmp/patch-importador.py \
            "$MAIN"

          grep -q \
            "onShowFileChooser" \
            "$MAIN"

          grep -q \
            "FILE_CHOOSER_REQUEST" \
            "$MAIN"

          grep -q \
            "onActivityResult" \
            "$MAIN"

          grep -q \
            "WebChromeClient" \
            "$MAIN"

          echo "OK - Importador do ADM corrigido."

      - name: Preparar bibliotecas Excel e PDF
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s \
            "$ASSETS/xlsx.full.min.js"

          test -s \
            "$ASSETS/jspdf.umd.min.js"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -f "$HTML"
          test -n "$MAIN"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder" \
            "$HTML"

          grep -q \
            "window.applyRepeat" \
            "$HTML"

          grep -q \
            "function importList" \
            "$HTML"

          grep -q \
            "function importSpreadsheet" \
            "$HTML"

          grep -q \
            "function applyImport" \
            "$HTML"

          grep -q \
            "onShowFileChooser" \
            "$MAIN"

          grep -q \
            "onActivityResult" \
            "$MAIN"

          if grep -q \
            "orientation:'landscape'" \
            "$HTML"; then

            echo "ERRO: relatório em paisagem."

            exit 1
          fi

          python3 - "$HTML" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(
              sys.argv[1]
          ).read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )
          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK - validações concluídas."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
