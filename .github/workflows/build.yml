name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # BASE DA VERSÃO #65
      # ============================================================

      - name: Baixar projeto - BASE 49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find \
            "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit \
            | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF \
            "android.useAndroidX=true" \
            gradle.properties \
            || echo "android.useAndroidX=true" \
            >> gradle.properties

          grep -qF \
            "android.enableJetifier=true" \
            gradle.properties \
            || echo "android.enableJetifier=true" \
            >> gradle.properties

      # ============================================================
      # RELATÓRIO DA #49
      #
      # NÃO ALTERAR.
      # ============================================================

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-base49.yml

          test -s /tmp/build-base49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build-base49.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None

          for i, line in enumerate(lines):

              if line.strip() == \
                  "- name: Alterar SOMENTE o relatório":

                  start = i
                  break

          if start is None:

              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(
              start + 1,
              len(lines)
          ):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  lines[i]
              ):

                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  lines[i]
              ):

                  break

          if run_line is None:

              raise SystemExit(
                  "ERRO: bloco run do relatório não encontrado."
              )

          script = []

          for line in lines[run_line + 1:]:

              if re.match(
                  r"^      - name:",
                  line
              ):

                  break

              if line.startswith(
                  "          "
              ):

                  script.append(
                      line[10:]
                  )

              elif line.strip() == "":

                  script.append("")

              else:

                  raise SystemExit(
                      "ERRO: estrutura do relatório #49 inválida."
                  )

          report = (
              "\n".join(script).rstrip()
              + "\n"
          )

          required = [
              "async function openPDF(sendViaWhatsApp=false)",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()",
              "orientation:'portrait'",
              "format:'a4'"
          ]

          for item in required:

              if item not in report:

                  raise SystemExit(
                      "ERRO no relatório #49: "
                      + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report,
              encoding="utf-8"
          )

          print(
              "OK - relatório #49 encontrado e validado."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "OK - relatório #49 aplicado."

      # ============================================================
      # CORREÇÃO DO REPETIR ÚLTIMO
      # ============================================================

      - name: Corrigir Repetir Último
        shell: bash
        run: |
          set -e

          cat > /tmp/repetir-ultimo.js <<'FIXJS'
          (function(){

            function copiar(valor){

              try{

                return JSON.parse(
                  JSON.stringify(valor)
                );

              }catch(e){

                return valor;

              }

            }


            function encontrarProduto(item){

              const code =
                String(
                  item.code || ""
                ).trim();


              const name =
                String(
                  item.name || ""
                ).trim()
                .toLowerCase();


              const cat =
                String(
                  item.cat || ""
                ).trim()
                .toLowerCase();


              /*
               * Primeiro: código.
               */

              if(
                code &&
                typeof productByCode ===
                "function"
              ){

                const encontrado =
                  productByCode(code);

                if(encontrado){

                  return encontrado;

                }

              }


              /*
               * Segundo: procurar pelo código
               * diretamente no APP_DATA.
               */

              if(
                typeof APP_DATA !==
                "undefined"
              ){

                for(
                  const [c,sups]
                  of Object.entries(APP_DATA)
                ){

                  for(
                    const [s,items]
                    of Object.entries(sups)
                  ){

                    for(
                      let i=0;
                      i<items.length;
                      i++
                    ){

                      const p =
                        items[i];

                      const pc =
                        String(
                          p[0] || ""
                        ).trim();

                      const pn =
                        String(
                          p[1] || ""
                        ).trim()
                        .toLowerCase();


                      if(
                        code &&
                        pc &&
                        pc === code
                      ){

                        return {
                          c:c,
                          s:s,
                          i:i,
                          p:p
                        };

                      }


                      /*
                       * Terceira tentativa:
                       * nome + categoria.
                       */

                      if(
                        name &&
                        pn === name &&
                        (
                          !cat ||
                          String(c)
                            .trim()
                            .toLowerCase()
                            === cat
                        )
                      ){

                        return {
                          c:c,
                          s:s,
                          i:i,
                          p:p
                        };

                      }

                    }

                  }

                }

              }


              return null;

            }


            window.repeatLastOrder =
              function(){

                let rows = [];

                let observation = "";


                /*
                 * 1 - lastOrder em memória.
                 */

                try{

                  if(
                    typeof lastOrder !==
                    "undefined" &&
                    Array.isArray(
                      lastOrder
                    ) &&
                    lastOrder.length
                  ){

                    rows =
                      copiar(
                        lastOrder
                      );

                  }

                }catch(e){}


                /*
                 * 2 - último pedido salvo.
                 */

                if(!rows.length){

                  try{

                    const saved =
                      localStorage.getItem(
                        "sp_last_order"
                      );

                    if(saved){

                      const parsed =
                        JSON.parse(
                          saved
                        );

                      if(
                        Array.isArray(
                          parsed
                        ) &&
                        parsed.length
                      ){

                        rows = parsed;

                      }

                    }

                  }catch(e){}

                }


                /*
                 * 3 - histórico.
                 */

                if(!rows.length){

                  try{

                    const savedHistory =
                      localStorage.getItem(
                        "sp_history"
                      );

                    if(savedHistory){

                      const hist =
                        JSON.parse(
                          savedHistory
                        );

                      if(
                        Array.isArray(hist) &&
                        hist.length &&
                        hist[0] &&
                        Array.isArray(
                          hist[0].rows
                        )
                      ){

                        rows =
                          copiar(
                            hist[0].rows
                          );

                        observation =
                          String(
                            hist[0]
                              .generalObservation
                              || ""
                          );

                      }

                    }

                  }catch(e){}

                }


                /*
                 * 4 - memória do histórico.
                 */

                if(!rows.length){

                  try{

                    if(
                      typeof historyOrders !==
                      "undefined" &&
                      Array.isArray(
                        historyOrders
                      ) &&
                      historyOrders.length
                    ){

                      const ultimo =
                        historyOrders[0];

                      if(
                        ultimo &&
                        Array.isArray(
                          ultimo.rows
                        )
                      ){

                        rows =
                          copiar(
                            ultimo.rows
                          );

                        observation =
                          String(
                            ultimo.generalObservation
                            || ""
                          );

                      }

                    }

                  }catch(e){}

                }


                if(!rows.length){

                  alert(
                    "Ainda não existe último pedido."
                  );

                  return;

                }


                window.applyRepeat(
                  rows,
                  observation
                );

              };


            window.applyRepeat =
              function(
                rows,
                observation
              ){

                if(
                  !Array.isArray(rows) ||
                  !rows.length
                ){

                  alert(
                    "Não foi possível recuperar o último pedido."
                  );

                  return;

                }


                vals = {};

                extras = [];


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                let recuperados = 0;

                let encontrados = 0;

                let primeiroCatalogo = "";


                rows.forEach(
                  function(item){

                    if(!item){
                      return;
                    }


                    /*
                     * Produto adicional.
                     */

                    if(
                      item.cat ===
                      "Produto Adicional"
                    ){

                      extras.push({

                        code:
                          item.code === "-"
                            ? ""
                            : String(
                                item.code || ""
                              ),

                        name:
                          String(
                            item.name || ""
                          ),

                        qty:
                          Number(
                            item.order
                          ) || 0

                      });

                      recuperados++;

                      return;

                    }


                    const produto =
                      encontrarProduto(
                        item
                      );


                    if(!produto){

                      return;

                    }


                    encontrados++;


                    if(
                      !primeiroCatalogo
                    ){

                      primeiroCatalogo =
                        produto.c;

                    }


                    const orderKey =
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "o"
                      );


                    const stockKey =
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "s"
                      );


                    vals[
                      orderKey
                    ] =
                      Number(
                        item.order
                      ) || 0;


                    vals[
                      stockKey
                    ] =
                      Number(
                        item.stock
                      ) || 0;


                    recuperados++;

                  }
                );


                /*
                 * Recuperar observação.
                 */

                if(
                  !observation &&
                  rows.generalObservation
                ){

                  observation =
                    String(
                      rows.generalObservation
                    );

                }


                generalObservation =
                  String(
                    observation || ""
                  );


                const obs =
                  document.getElementById(
                    "generalObs"
                  );


                if(obs){

                  obs.value =
                    generalObservation;

                }


                /*
                 * Salvar imediatamente.
                 */

                if(
                  typeof save ===
                  "function"
                ){

                  save();

                }


                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                /*
                 * Ir para a primeira categoria
                 * que contém item recuperado.
                 */

                if(
                  primeiroCatalogo &&
                  typeof APP_DATA !==
                  "undefined" &&
                  APP_DATA[
                    primeiroCatalogo
                  ]
                ){

                  current =
                    primeiroCatalogo;

                }


                if(
                  typeof tabs ===
                  "function"
                ){

                  tabs();

                }


                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                if(
                  typeof closeFeature ===
                  "function"
                ){

                  closeFeature();

                }


                /*
                 * Mantém o último pedido salvo.
                 */

                try{

                  lastOrder =
                    copiar(rows);

                  localStorage.setItem(
                    "sp_last_order",
                    JSON.stringify(
                      lastOrder
                    )
                  );

                }catch(e){}


                if(
                  recuperados === 0
                ){

                  alert(
                    "O último pedido foi encontrado, mas nenhum produto da lista atual pôde ser localizado."
                  );

                  return;

                }


                alert(
                  "Último pedido recuperado: "
                  + recuperados
                  + " item(ns). Confira antes de enviar."
                );

              };

          })();
          FIXJS

          test -s /tmp/repetir-ultimo.js

          node --check /tmp/repetir-ultimo.js

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          python3 - <<'PY'
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          patch = Path(
              "/tmp/repetir-ultimo.js"
          ).read_text(
              encoding="utf-8"
          )

          if "</body>" not in text:
              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          text = text.replace(
              "</body>",
              "\n<script>\n"
              + patch
              + "\n</script>\n</body>",
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK - Repetir Último corrigido."
          )

          PY

      # ============================================================
      # CORREÇÃO DO IMPORTADOR NO ANDROID
      # ============================================================

      - name: Corrigir Importar Lista dentro do ADM
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(
              os.environ["ANDROID_DIR"]
          )

          java_files = list(
              (
                  root /
                  "app/src/main/java"
              ).rglob(
                  "MainActivity.java"
              )
          )

          if not java_files:

              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado."
              )

          main = java_files[0]

          java = main.read_text(
              encoding="utf-8"
          )


          # ========================================================
          # IMPORTS
          # ========================================================

          if (
              "import android.content.ClipData;"
              not in java
          ):

              if (
                  "import android.content.Intent;"
                  in java
              ):

                  java = java.replace(
                      "import android.content.Intent;",
                      "import android.content.ClipData;\n"
                      "import android.content.Intent;",
                      1
                  )

              else:

                  raise SystemExit(
                      "ERRO: import android.content.Intent não encontrado."
                  )


          if (
              "import android.net.Uri;"
              not in java
          ):

              if (
                  "package "
                  in java
              ):

                  pos =
                      java.find(
                          "\n",
                          java.find(
                              "package "
                          )
                      )

                  java = (
                      java[:pos + 1]
                      +
                      "import android.net.Uri;\n"
                      +
                      java[pos + 1:]
                  )


          if (
              "import android.webkit.ValueCallback;"
              not in java
          ):

              marker = (
                  "import android.webkit.WebView;"
              )

              if marker in java:

                  java = java.replace(
                      marker,
                      "import android.webkit.ValueCallback;\n"
                      + marker,
                      1
                  )

              else:

                  marker = (
                      "import android.webkit.WebSettings;"
                  )

                  if marker in java:

                      java = java.replace(
                          marker,
                          "import android.webkit.ValueCallback;\n"
                          + marker,
                          1
                      )

                  else:

                      raise SystemExit(
                          "ERRO: import WebView/WebSettings não encontrado."
                      )


          if (
              "import android.webkit.WebChromeClient;"
              not in java
          ):

              marker = (
                  "import android.webkit.WebView;"
              )

              if marker in java:

                  java = java.replace(
                      marker,
                      "import android.webkit.WebChromeClient;\n"
                      + marker,
                      1
                  )

              else:

                  marker = (
                      "import android.webkit.WebSettings;"
                  )

                  if marker in java:

                      java = java.replace(
                          marker,
                          "import android.webkit.WebChromeClient;\n"
                          + marker,
                          1
                      )

                  else:

                      raise SystemExit(
                          "ERRO: local para WebChromeClient não encontrado."
                      )


          # ========================================================
          # CAMPOS DO FILE CHOOSER
          # ========================================================

          if (
              "filePathCallback"
              not in java
          ):

              marker = (
                  "public class MainActivity extends Activity {"
              )

              if marker not in java:

                  raise SystemExit(
                      "ERRO: classe MainActivity não encontrada."
                  )

              fields = """public class MainActivity extends Activity {
              private ValueCallback<Uri[]> filePathCallback;
              private static final int FILE_CHOOSER_REQUEST = 1001;"""

              java = java.replace(
                  marker,
                  fields,
                  1
              )


          # ========================================================
          # WEBCHROMECLIENT
          # ========================================================

          if (
              "onShowFileChooser"
              not in java
          ):

              marker = (
                  "        webView.setWebViewClient(new WebViewClient());"
              )

              if marker not in java:

                  raise SystemExit(
                      "ERRO: setWebViewClient não encontrado."
                  )

              block = r'''        webView.setWebChromeClient(new WebChromeClient() {
                  @Override
                  public boolean onShowFileChooser(
                          WebView view,
                          ValueCallback<Uri[]> callback,
                          FileChooserParams params) {

                      if (MainActivity.this.filePathCallback != null) {
                          MainActivity.this.filePathCallback.onReceiveValue(null);
                      }

                      MainActivity.this.filePathCallback = callback;

                      try {

                          Intent intent =
                                  params.createIntent();

                          startActivityForResult(
                                  intent,
                                  FILE_CHOOSER_REQUEST
                          );

                          return true;

                      } catch (Exception e) {

                          MainActivity.this.filePathCallback = null;

                          Toast.makeText(
                                  MainActivity.this,
                                  "Não foi possível abrir o seletor de arquivos.",
                                  Toast.LENGTH_LONG
                          ).show();

                          return false;
                      }
                  }
              });
'''

              java = java.replace(
                  marker,
                  marker + "\n" + block,
                  1
              )


          # ========================================================
          # RESULTADO DO SELETOR
          # ========================================================

          if (
              "FILE_CHOOSER_REQUEST"
              in java
              and
              "onActivityResult(int requestCode"
              not in java
          ):

              marker = (
                  "    public class AndroidFileBridge {"
              )

              if marker not in java:

                  raise SystemExit(
                      "ERRO: AndroidFileBridge não encontrado."
                  )

              result = r'''    @Override
              protected void onActivityResult(
                      int requestCode,
                      int resultCode,
                      Intent data) {

                  super.onActivityResult(
                          requestCode,
                          resultCode,
                          data
                  );

                  if (
                          requestCode != FILE_CHOOSER_REQUEST
                          || filePathCallback == null
                  ) {

                      return;
                  }

                  Uri[] results = null;

                  if (
                          resultCode == RESULT_OK
                          && data != null
                  ) {

                      if (
                              data.getClipData() != null
                      ) {

                          int count =
                                  data.getClipData()
                                          .getItemCount();

                          results =
                                  new Uri[count];

                          for (
                                  int i = 0;
                                  i < count;
                                  i++
                          ) {

                              results[i] =
                                      data.getClipData()
                                              .getItemAt(i)
                                              .getUri();
                          }

                      } else if (
                              data.getData() != null
                      ) {

                          results =
                                  new Uri[]{
                                          data.getData()
                                  };
                      }
                  }

                  filePathCallback.onReceiveValue(
                          results
                  );

                  filePathCallback = null;
              }

'''

              java = java.replace(
                  marker,
                  result + marker,
                  1
              )


          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "OK - seletor de arquivos Android corrigido."
          )

          print(
              "OK - MainActivity atualizado."
          )

          PY

      # ============================================================
      # BIBLIOTECAS
      # ============================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ============================================================
      # VERIFICAÇÃO DO JAVASCRIPT
      # ============================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "window.openAdmin" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder" \
            "$HTML"

          grep -q \
            "window.applyRepeat" \
            "$HTML"

          grep -q \
            "window.clearPedido" \
            "$HTML"

          grep -q \
            "importedCatalogActive" \
            "$HTML"

          grep -q \
            "function importList" \
            "$HTML"

          grep -q \
            "function importSpreadsheet" \
            "$HTML"

          grep -q \
            "function applyImport" \
            "$HTML"

          grep -q \
            "xlsx.full.min.js" \
            "$HTML"

          grep -q \
            "jspdf.umd.min.js" \
            "$HTML"

          if grep -q \
            "orientation:'landscape'" \
            "$HTML"; then

            echo "ERRO: relatório em paisagem."

            exit 1

          fi

          if grep -q \
            'orientation:"landscape"' \
            "$HTML"; then

            echo "ERRO: relatório em paisagem."

            exit 1

          fi

          python3 - "$HTML" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(
              sys.argv[1]
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK - JavaScript válido."

      # ============================================================
      # VERIFICAR IMPORTAÇÃO ANDROID
      # ============================================================

      - name: Verificar correção do importador
        shell: bash
        run: |
          set -e

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          grep -q \
            "onShowFileChooser" \
            "$MAIN"

          grep -q \
            "FILE_CHOOSER_REQUEST" \
            "$MAIN"

          grep -q \
            "filePathCallback" \
            "$MAIN"

          grep -q \
            "onActivityResult" \
            "$MAIN"

          grep -q \
            "WebChromeClient" \
            "$MAIN"

          echo "OK - importador Android preparado."

      # ============================================================
      # VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder" \
            "$HTML"

          grep -q \
            "window.applyRepeat" \
            "$HTML"

          grep -q \
            "function importList" \
            "$HTML"

          grep -q \
            "function importSpreadsheet" \
            "$HTML"

          grep -q \
            "function applyImport" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          grep -q \
            "onShowFileChooser" \
            "$MAIN"

          grep -q \
            "filePathCallback" \
            "$MAIN"

          echo ""
          echo "=========================================="
          echo " VERSÃO 66 - VERIFICAÇÃO FINAL"
          echo "=========================================="
          echo "BASE DA #65 ............ OK"
          echo "RELATÓRIO .............. PRESERVADO"
          echo "PDF A4 RETRATO ......... OK"
          echo "REPETIR ÚLTIMO ......... CORRIGIDO"
          echo "IMPORTAR LISTA ADM ..... CORRIGIDO"
          echo "SELETOR ANDROID ........ OK"
          echo "JAVASCRIPT ............. OK"
          echo "=========================================="

      # ============================================================
      # COMPILAR APK
      # ============================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ============================================================
      # VERIFICAR APK
      # ============================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
