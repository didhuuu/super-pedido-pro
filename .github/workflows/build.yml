name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR PROJETO
      # ============================================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ============================================================
      # 2. JAVA
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. GRADLE
      # ============================================================
      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 4. PREPARAR PROJETO
      # ============================================================
      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

          echo "Projeto extraído."

      # ============================================================
      # 5. LOCALIZAR PROJETO ANDROID
      # ============================================================
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_DIR"

      # ============================================================
      # 6. ANDROIDX
      # ============================================================
      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      # ============================================================
      # 7. CORRIGIR SOMENTE PDF E LIMPEZA
      #
      # IMPORTANTE:
      # - Não altera reportText()
      # - Não altera catálogo
      # - Não altera Admin
      # - Não altera importação
      # - Não altera WhatsApp texto
      # - Não altera histórico
      # - Não altera MainActivity
      #
      # Apenas substitui openPDF() e clearPedido().
      # ============================================================
      - name: Corrigir PDF e limpeza
        shell: bash
        run: |
          set -e

          python3 - "$ANDROID_DIR" <<'PY'
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = html.read_text(encoding="utf-8")

          # --------------------------------------------------------
          # Função segura para localizar uma função JavaScript
          # completa, contando chaves e ignorando strings/comentários.
          # Isso evita os erros das tentativas anteriores.
          # --------------------------------------------------------
          def find_function(text, name):
              marker = "function " + name + "("
              start = text.find(marker)

              if start < 0:
                  return None

              brace = text.find("{", start)

              if brace < 0:
                  return None

              depth = 0
              i = brace
              quote = None
              escaped = False
              line_comment = False
              block_comment = False

              while i < len(text):
                  c = text[i]
                  n = text[i + 1] if i + 1 < len(text) else ""

                  if line_comment:
                      if c == "\n":
                          line_comment = False
                      i += 1
                      continue

                  if block_comment:
                      if c == "*" and n == "/":
                          block_comment = False
                          i += 2
                          continue
                      i += 1
                      continue

                  if quote:
                      if escaped:
                          escaped = False
                      elif c == "\\":
                          escaped = True
                      elif c == quote:
                          quote = None
                      i += 1
                      continue

                  if c == "/" and n == "/":
                      line_comment = True
                      i += 2
                      continue

                  if c == "/" and n == "*":
                      block_comment = True
                      i += 2
                      continue

                  if c in ("'", '"', "`"):
                      quote = c
                      i += 1
                      continue

                  if c == "{":
                      depth += 1

                  elif c == "}":
                      depth -= 1

                      if depth == 0:
                          return start, i + 1

                  i += 1

              return None

          def replace_function(text, name, replacement):
              found = find_function(text, name)

              if found is None:
                  raise SystemExit(
                      "ERRO: função " + name + " não encontrada."
                  )

              start, end = found

              return text[:start] + replacement + text[end:]

          # --------------------------------------------------------
          # GARANTIR BIBLIOTECAS LOCAIS
          # --------------------------------------------------------
          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ========================================================
          # NOVA openPDF()
          #
          # A4 RETRATO:
          # largura 210 mm
          # altura 297 mm
          #
          # O PDF é finalizado ANTES da limpeza.
          # Depois a limpeza acontece.
          # Só então o Android recebe o PDF para compartilhar.
          # ========================================================
          new_open_pdf = r'''function openPDF(){
            const rows = finalizedRows.length ? finalizedRows : getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{
              const lib = window.jspdf || {};
              const jsPDF = lib.jsPDF;

              if(!jsPDF){
                throw new Error('Biblioteca PDF não carregada.');
              }

              /*
               * A4 RETRATO
               * 210 x 297 mm
               */
              const doc = new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth = 210;
              const pageHeight = 297;

              const margem = 10;
              const larguraUtil = pageWidth - (margem * 2);

              let y = 15;

              function cabecalho(){
                doc.setFontSize(16);
                doc.setFont(undefined,'bold');
                doc.text('PEDIDO DE COMPRAS',margem,y);

                y += 7;

                doc.setFontSize(9);
                doc.setFont(undefined,'normal');
                doc.text(
                  new Date().toLocaleString('pt-BR'),
                  margem,
                  y
                );

                y += 7;

                doc.line(
                  margem,
                  y,
                  pageWidth - margem,
                  y
                );

                y += 7;
              }

              function rodape(){
                doc.setFontSize(8);
                doc.setFont(undefined,'normal');

                const pagina =
                  'Página ' +
                  doc.getCurrentPageInfo().pageNumber;

                doc.text(
                  pagina,
                  pageWidth - margem,
                  pageHeight - 7,
                  {align:'right'}
                );
              }

              function novaPagina(){
                rodape();
                doc.addPage();
                y = 15;
                cabecalho();
              }

              cabecalho();

              const grupos = groupRows(rows);

              Object.entries(grupos).forEach(
                ([categoria,itens]) => {

                  if(y > pageHeight - 35){
                    novaPagina();
                  }

                  doc.setFontSize(11);
                  doc.setFont(undefined,'bold');

                  doc.text(
                    String(categoria).toUpperCase(),
                    margem,
                    y
                  );

                  y += 5;

                  doc.setFontSize(8);
                  doc.setFont(undefined,'bold');

                  const xCodigo = margem;
                  const xNome = margem + 25;
                  const xEstoque = pageWidth - 55;
                  const xPedido = pageWidth - 25;

                  doc.text('Código',xCodigo,y);
                  doc.text('Produto',xNome,y);
                  doc.text('Est.',xEstoque,y);
                  doc.text('Ped.',xPedido,y,{align:'right'});

                  y += 3;

                  doc.line(
                    margem,
                    y,
                    pageWidth - margem,
                    y
                  );

                  y += 5;

                  doc.setFont(undefined,'normal');

                  itens.forEach(x => {

                    const codigo = String(x.code || '-');

                    let nome = String(x.name || '');

                    /*
                     * Limita o nome para não invadir
                     * as colunas de estoque/pedido.
                     */
                    if(nome.length > 42){
                      nome = nome.substring(0,39) + '...';
                    }

                    const estoque = String(x.stock ?? 0);
                    const pedido = String(x.order ?? 0);

                    if(y > pageHeight - 20){
                      novaPagina();

                      doc.setFontSize(11);
                      doc.setFont(undefined,'bold');

                      doc.text(
                        String(categoria).toUpperCase() +
                        ' (continuação)',
                        margem,
                        y
                      );

                      y += 7;

                      doc.setFontSize(8);
                      doc.setFont(undefined,'normal');
                    }

                    doc.setFontSize(8);

                    doc.text(codigo,xCodigo,y);
                    doc.text(nome,xNome,y);
                    doc.text(estoque,xEstoque,y);
                    doc.text(
                      pedido,
                      xPedido,
                      y,
                      {align:'right'}
                    );

                    y += 5;

                    if(x.obs){
                      let obs = String(x.obs);

                      if(obs.length > 65){
                        obs = obs.substring(0,62) + '...';
                      }

                      doc.setFontSize(7);
                      doc.text(
                        'Obs: ' + obs,
                        xNome,
                        y
                      );

                      y += 4;
                      doc.setFontSize(8);
                    }

                    if(x.validade){
                      let validade = String(x.validade);

                      if(validade.length > 55){
                        validade =
                          validade.substring(0,52) + '...';
                      }

                      doc.text(
                        'Validade: ' + validade,
                        xNome,
                        y
                      );

                      y += 4;
                    }
                  });

                  y += 3;
                }
              );

              if(generalObservation){

                if(y > pageHeight - 30){
                  novaPagina();
                }

                doc.setFontSize(9);
                doc.setFont(undefined,'bold');

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y += 5;

                doc.setFont(undefined,'normal');

                const obsLines =
                  doc.splitTextToSize(
                    String(generalObservation),
                    larguraUtil
                  );

                doc.text(
                  obsLines,
                  margem,
                  y
                );
              }

              rodape();

              /*
               * Gera o PDF completo antes de limpar os dados.
               */
              const base64 =
                doc.output('datauristring').split(',')[1];

              const nomeArquivo =
                'pedido-acougue-' +
                new Date()
                  .toISOString()
                  .slice(0,10) +
                '.pdf';

              /*
               * IMPORTANTE:
               * limpa o pedido depois que o PDF já foi criado.
               *
               * clearPedido(rows) também grava o histórico.
               */
              clearPedido(rows);

              /*
               * Android:
               * somente agora envia o PDF pronto.
               */
              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf === 'function'
              ){
                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );
                return;
              }

              /*
               * Navegador normal.
               */
              doc.save(nomeArquivo);

            }catch(e){

              console.error(e);

              alert(
                'Erro ao gerar PDF: ' +
                (e && e.message ? e.message : e)
              );
            }
          }'''

          # ========================================================
          # NOVA clearPedido()
          #
          # Recebe opcionalmente as linhas do pedido para preservar
          # o histórico mesmo depois de zerar tudo.
          # ========================================================
          new_clear = r'''function clearPedido(historyRows=null){

            /*
             * Guarda o pedido no histórico ANTES de apagar
             * as quantidades.
             */
            if(
              Array.isArray(historyRows) &&
              historyRows.length
            ){
              saveHistory(historyRows);
            }else if(
              Array.isArray(finalizedRows) &&
              finalizedRows.length
            ){
              saveHistory(finalizedRows);
            }

            /*
             * Zera completamente o estado atual.
             */
            vals = {};
            extras = [];
            validadeCurta = [];
            finalizedRows = [];
            generalObservation = '';

            /*
             * Limpa o campo de observação.
             */
            const obs =
              document.getElementById('generalObs');

            if(obs){
              obs.value = '';
            }

            /*
             * Remove explicitamente os dados do pedido
             * armazenados no aparelho.
             *
             * NÃO remove:
             * - catálogo
             * - produtos cadastrados
             * - favoritos
             * - histórico
             * - último pedido
             * - configurações
             */
            localStorage.removeItem('pedido_compras_vals');
            localStorage.removeItem('pedido_compras_extras');
            localStorage.removeItem('pedido_compras_validade_curta');

            /*
             * Mantém o restante do aplicativo intacto.
             */
            render();
            renderValidadeCurta();
            updateBadge();
            closeConference();

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }'''

          # --------------------------------------------------------
          # SUBSTITUIR AS DUAS FUNÇÕES DE FORMA INDEPENDENTE.
          # --------------------------------------------------------
          text = replace_function(
              text,
              "openPDF",
              new_open_pdf
          )

          text = replace_function(
              text,
              "clearPedido",
              new_clear
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          # ========================================================
          # VERIFICAÇÕES INTERNAS
          # ========================================================

          if "function openPDF()" not in text:
              raise SystemExit(
                  "ERRO: openPDF não foi instalada."
              )

          if "function clearPedido(" not in text:
              raise SystemExit(
                  "ERRO: clearPedido não foi instalada."
              )

          if "orientation:'portrait'" not in text:
              raise SystemExit(
                  "ERRO: PDF não está configurado como retrato."
              )

          if "orientation:'landscape'" in text:
              raise SystemExit(
                  "ERRO: ainda existe PDF em landscape."
              )

          if "const pageWidth = 210" not in text:
              raise SystemExit(
                  "ERRO: largura A4 retrato não encontrada."
              )

          if "const pageHeight = 297" not in text:
              raise SystemExit(
                  "ERRO: altura A4 retrato não encontrada."
              )

          if "localStorage.removeItem('pedido_compras_vals')" not in text:
              raise SystemExit(
                  "ERRO: limpeza de quantidades não encontrada."
              )

          if "localStorage.removeItem('pedido_compras_extras')" not in text:
              raise SystemExit(
                  "ERRO: limpeza de adicionais não encontrada."
              )

          if "localStorage.removeItem('pedido_compras_validade_curta')" not in text:
              raise SystemExit(
                  "ERRO: limpeza de validade não encontrada."
              )

          if "clearPedido(rows);" not in text:
              raise SystemExit(
                  "ERRO: openPDF não chama a limpeza."
              )

          if "window.AndroidFileBridge.sharePdf" not in text:
              raise SystemExit(
                  "ERRO: compartilhamento Android do PDF não encontrado."
              )

          print("======================================")
          print("CORREÇÕES APLICADAS COM SUCESSO")
          print("======================================")
          print("PDF: A4 RETRATO")
          print("PDF: 210 x 297 mm")
          print("Limpeza: quantidades zeradas")
          print("Limpeza: localStorage removido")
          print("Histórico: preservado")
          print("Catálogo: preservado")
          print("Admin: preservado")
          print("WhatsApp: preservado")
          print("======================================")
          PY

      # ============================================================
      # 8. PREPARAR BIBLIOTECAS
      # ============================================================
      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas locais preparadas."

      # ============================================================
      # 9. VERIFICAR CORREÇÕES
      # ============================================================
      - name: Verificar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"
          MAIN="$ANDROID_DIR/app/src/main/java/com/pedido/v2/MainActivity.java"

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$HTML"
          test -f "$MAIN"

          echo "Verificando PDF..."

          grep -Fq "orientation:'portrait'" "$HTML"
          grep -Fq "const pageWidth = 210" "$HTML"
          grep -Fq "const pageHeight = 297" "$HTML"

          if grep -Fq "orientation:'landscape'" "$HTML"; then
            echo "ERRO: PDF landscape encontrado."
            exit 1
          fi

          if grep -Fq 'orientation:"landscape"' "$HTML"; then
            echo "ERRO: PDF landscape encontrado."
            exit 1
          fi

          echo "Verificando limpeza..."

          grep -Fq "localStorage.removeItem('pedido_compras_vals')" "$HTML"
          grep -Fq "localStorage.removeItem('pedido_compras_extras')" "$HTML"
          grep -Fq "localStorage.removeItem('pedido_compras_validade_curta')" "$HTML"

          echo "Verificando biblioteca PDF..."

          grep -Fq "jspdf.umd.min.js" "$HTML"

          test -s "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          echo "Verificando catálogo/importação..."

          grep -Fq "importedCatalogActive=true" "$HTML"

          echo "======================================"
          echo "TODAS AS VERIFICAÇÕES PASSARAM"
          echo "======================================"

      # ============================================================
      # 10. COMPILAR APK
      # ============================================================
      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle --no-daemon clean assembleDebug

      # ============================================================
      # 11. VERIFICAR APK
      # ============================================================
      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"

      # ============================================================
      # 12. DISPONIBILIZAR APK
      # ============================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
