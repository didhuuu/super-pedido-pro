name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir MainActivity
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          java_dir = root / "app" / "src" / "main" / "java"

          files = list(java_dir.rglob("MainActivity.java"))

          if not files:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          main = files[0]

          print("MainActivity:")
          print(main)

          text = main.read_text(
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # GARANTIR O MÉTODO sanitizeFilename
          # ---------------------------------------------------------

          method = (
              '    private String sanitizeFilename(String filename) {\\n'
              '        if (filename == null) {\\n'
              '            return "";\\n'
              '        }\\n'
              '        return new File(filename)\\n'
              '                .getName()\\n'
              '                .replaceAll("[\\\\\\\\/:*?\\\"<>|]", "_");\\n'
              '    }\\n\\n'
          )

          if "private String sanitizeFilename(" not in text:

              marker = (
                  "    @Override\n"
                  "    public void onBackPressed()"
              )

              if marker not in text:

                  raise SystemExit(
                      "ERRO: não encontrei local seguro "
                      "para inserir sanitizeFilename"
                  )

              text = text.replace(
                  marker,
                  method + marker,
                  1
              )

              print(
                  "sanitizeFilename criado."
              )

          else:

              print(
                  "sanitizeFilename já existe."
              )

          # ---------------------------------------------------------
          # CORRIGIR CHAMADA CASO TENHA SIDO ALTERADA ERRADO
          # ---------------------------------------------------------

          text = re.sub(
              r"sanitizeFilename\s*\(\s*filename\s*\)",
              "sanitizeFilename(filename)",
              text
          )

          main.write_text(
              text,
              encoding="utf-8"
          )

          # ---------------------------------------------------------
          # VERIFICAÇÃO
          # ---------------------------------------------------------

          final_text = main.read_text(
              encoding="utf-8"
          )

          if "private String sanitizeFilename(" not in final_text:

              raise SystemExit(
                  "ERRO CRÍTICO: sanitizeFilename não existe"
              )

          if "sanitizeFilename(filename)" not in final_text:

              raise SystemExit(
                  "ERRO CRÍTICO: chamada sanitizeFilename não encontrada"
              )

          print("")
          print("======================================")
          print("MAINACTIVITY CORRIGIDO")
          print("sanitizeFilename: OK")
          print("======================================")

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas preparadas."

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/settings.gradle"

          test -f "$ANDROID_DIR/build.gradle"

          test -f "$ANDROID_DIR/app/build.gradle"

          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          echo "Arquivo Java:"
          echo "$MAIN"

          grep -q \
            "private String sanitizeFilename(" \
            "$MAIN"

          grep -q \
            "sanitizeFilename(filename)" \
            "$MAIN"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/xlsx.full.min.js"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          echo ""
          echo "======================================"
          echo "VERIFICAÇÃO OK"
          echo "======================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
