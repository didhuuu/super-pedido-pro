name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Aplicar correções da versão 9 + PDF
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          import urllib.request
          import os

          # ============================================================
          # CARREGA O WORKFLOW QUE CONTÉM AS CORREÇÕES DA VERSÃO 9
          # ============================================================

          source_file = Path("/tmp/build-v9-source.yml")

          urllib.request.urlretrieve(
              "https://raw.githubusercontent.com/didhuuu/super-pedido-pro/44b3c889e2ac3f4da399e47df9eb992b8d28e8e4/.github/workflows/build.yml",
              source_file
          )

          source = source_file.read_text(
              encoding="utf-8"
          )

          marker = "python3 - <<'PY'"

          start = source.find(marker)

          if start < 0:
              raise SystemExit(
                  "ERRO: script da versão 9 não encontrado."
              )

          start = source.find(
              "\n",
              start
          ) + 1

          end = source.find(
              "\n          PY",
              start
          )

          if end < 0:
              raise SystemExit(
                  "ERRO: final do script da versão 9 não encontrado."
              )

          patch = textwrap.dedent(
              source[start:end]
          )

          # ============================================================
          # EXECUTA TODAS AS CORREÇÕES DA VERSÃO 9
          # ============================================================

          exec(
              compile(
                  patch,
                  str(source_file),
                  "exec"
              ),
              {}
          )

          # ============================================================
          # CORREÇÃO DEFINITIVA DO ERRO DO BUILD
          #
          # O erro apresentado pelo Gradle foi:
          #
          # MainActivity.java:206:
          # error: cannot find symbol
          # sanitizeFilename(String)
          #
          # Portanto corrigimos DIRETAMENTE o Java que será compilado.
          # ============================================================

          root = Path(
              os.environ["ANDROID_DIR"]
          )

          encontrou = False

          for java in root.rglob(
              "MainActivity.java"
          ):

              texto = java.read_text(
                  encoding="utf-8"
              )

              original = texto

              # Remove chamada simples:
              texto = re.sub(
                  r"sanitizeFilename\s*\s*filename\s*",
                  "filename",
                  texto
              )

              # Remove chamada em múltiplas linhas:
              texto = re.sub(
                  r"sanitizeFilename\s*\s*\n\s*filename\s*\n\s*",
                  "filename",
                  texto
              )

              if texto != original:

                  java.write_text(
                      texto,
                      encoding="utf-8"
                  )

                  encontrou = True

                  print(
                      "CORREÇÃO APLICADA EM:"
                  )

                  print(java)

          if not encontrou:
              print(
                  "Nenhuma chamada antiga encontrada."
              )

          print(
              "Correções da versão 9 aplicadas."
          )

          print(
              "Correção do MainActivity concluída."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s \
            "$ASSETS/x
