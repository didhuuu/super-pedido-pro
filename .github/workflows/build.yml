name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1 - USAR EXATAMENTE A BASE DA VERSÃO 49
      # ============================================================

      - name: Baixar projeto - BASE 49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      # ============================================================
      # 2 - JAVA
      # ============================================================

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3 - GRADLE
      # ============================================================

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 4 - PREPARAR PROJETO
      # ============================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      # ============================================================
      # 5 - LOCALIZAR PROJETO ANDROID
      # ============================================================

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find \
            "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit \
            | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_DIR"

      # ============================================================
      # 6 - ANDROIDX
      # ============================================================

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF \
            "android.useAndroidX=true" \
            gradle.properties \
            || echo \
            "android.useAndroidX=true" \
            >> gradle.properties

          grep -qF \
            "android.enableJetifier=true" \
            gradle.properties \
            || echo \
            "android.enableJetifier=true" \
            >> gradle.properties

      # ============================================================
      # 7 - APLICAR O RELATÓRIO EXATO DA VERSÃO 49
      #
      # NÃO ALTERAR openPDF.
      # ============================================================

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-base49.yml

          test -s /tmp/build-base49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build-base49.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None

          for i, line in enumerate(lines):

              if line.strip() == \
                  "- name: Alterar SOMENTE o relatório":

                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(
              start + 1,
              len(lines)
          ):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  lines[i]
              ):

                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  lines[i]
              ):

                  break

          if run_line is None:
              raise SystemExit(
                  "ERRO: bloco run do relatório #49 não encontrado."
              )

          script = []

          for line in lines[run_line + 1:]:

              if re.match(
                  r"^      - name:",
                  line
              ):

                  break

              if line.startswith(
                  "          "
              ):

                  script.append(
                      line[10:]
                  )

              elif line.strip() == "":
                  script.append("")

              else:
                  raise SystemExit(
                      "ERRO: estrutura do relatório #49 inválida."
                  )

          report = (
              "\n".join(script).rstrip()
              + "\n"
          )

          required = [
              "async function openPDF(sendViaWhatsApp=false)",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()",
              "orientation:'portrait'",
              "format:'a4'"
          ]

          for item in required:

              if item not in report:

                  raise SystemExit(
                      "ERRO: item ausente no relatório #49: "
                      + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report,
              encoding="utf-8"
          )

          print(
              "Relatório #49 localizado e validado."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "Relatório #49 aplicado."

      # ============================================================
      # 8 - CRIAR CORREÇÃO JAVASCRIPT
      #
      # IMPORTANTE:
      # AQUI É JAVASCRIPT PURO.
      # NÃO EXISTE <script>.
      # NÃO EXISTE </script>.
      #
      # Isso permite que node --check valide corretamente.
      # ============================================================

      - name: Criar arquivo de correções JavaScript
        shell: bash
        run: |
          set -e

          cat > /tmp/super-pedido-fix.js <<'FIXJS'
          (function(){

            /*
             * =====================================================
             * ADMINISTRAÇÃO
             * =====================================================
             */

            const superPedidoOriginalOpenAdmin =
              window.openAdmin;

            window.openAdmin = function(){

              if(
                typeof featureModal !== "function" ||
                typeof superPedidoOriginalOpenAdmin !== "function"
              ){

                alert(
                  "Administração indisponível."
                );

                return;
              }

              featureModal(`

                <h3>🔐 Administração</h3>

                <p>
                  Digite o PIN de administração.
                </p>

                <input
                  id="superPedidoAdminPin"
                  type="password"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="PIN"
                  style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    font-size:18px;
                    margin-bottom:10px;
                  "
                >

                <button
                  onclick="superPedidoConfirmarAdmin()"
                >
                  Entrar
                </button>

                <button
                  onclick="closeFeature()"
                >
                  Cancelar
                </button>

              `);

              setTimeout(
                function(){

                  const campo =
                    document.getElementById(
                      "superPedidoAdminPin"
                    );

                  if(!campo){
                    return;
                  }

                  campo.focus();

                  campo.addEventListener(
                    "keydown",
                    function(event){

                      if(
                        event.key === "Enter"
                      ){

                        superPedidoConfirmarAdmin();

                      }

                    }
                  );

                },
                100
              );
            };


            window.superPedidoConfirmarAdmin =
              function(){

                const campo =
                  document.getElementById(
                    "superPedidoAdminPin"
                  );

                const pin =
                  campo
                    ? String(
                        campo.value || ""
                      )
                    : "";

                const salvo =
                  localStorage.getItem(
                    "sp_admin_pin"
                  ) || "1234";

                if(pin !== salvo){

                  alert(
                    "PIN incorreto."
                  );

                  if(campo){

                    campo.value = "";

                    campo.focus();

                  }

                  return;
                }

                const promptOriginal =
                  window.prompt;

                window.prompt =
                  function(){

                    return pin;

                  };

                try{

                  superPedidoOriginalOpenAdmin.call(
                    window
                  );

                }finally{

                  window.prompt =
                    promptOriginal;

                }

              };


            /*
             * =====================================================
             * RECUPERAR ÚLTIMO PEDIDO
             * =====================================================
             */

            window.repeatLastOrder =
              function(){

                let rows = [];

                let observation = "";


                /*
                 * 1 - Memória atual
                 */

                try{

                  if(
                    typeof lastOrder !== "undefined" &&
                    Array.isArray(lastOrder) &&
                    lastOrder.length
                  ){

                    rows =
                      JSON.parse(
                        JSON.stringify(
                          lastOrder
                        )
                      );

                  }

                }catch(error){}


                /*
                 * 2 - LocalStorage
                 */

                if(!rows.length){

                  try{

                    const saved =
                      localStorage.getItem(
                        "sp_last_order"
                      );

                    if(saved){

                      const parsed =
                        JSON.parse(saved);

                      if(
                        Array.isArray(parsed) &&
                        parsed.length
                      ){

                        rows = parsed;

                        if(
                          typeof lastOrder !==
                          "undefined"
                        ){

                          lastOrder =
                            JSON.parse(
                              JSON.stringify(
                                parsed
                              )
                            );

                        }

                      }

                    }

                  }catch(error){}

                }


                /*
                 * 3 - Histórico
                 */

                if(!rows.length){

                  try{

                    if(
                      typeof historyOrders !==
                      "undefined" &&
                      Array.isArray(
                        historyOrders
                      ) &&
                      historyOrders.length
                    ){

                      const ultimo =
                        historyOrders[0];

                      if(
                        ultimo &&
                        Array.isArray(
                          ultimo.rows
                        )
                      ){

                        rows =
                          JSON.parse(
                            JSON.stringify(
                              ultimo.rows
                            )
                          );

                        observation =
                          String(
                            ultimo.generalObservation ||
                            ""
                          );

                      }

                    }

                  }catch(error){}

                }


                if(!rows.length){

                  alert(
                    "Ainda não existe último pedido."
                  );

                  return;

                }


                window.applyRepeat(
                  rows,
                  observation
                );

              };


            /*
             * =====================================================
             * APLICAR ÚLTIMO PEDIDO
             * =====================================================
             */

            window.applyRepeat =
              function(
                rows,
                observation
              ){

                if(
                  !Array.isArray(rows) ||
                  !rows.length
                ){

                  alert(
                    "Não foi possível recuperar o último pedido."
                  );

                  return;

                }


                vals = {};

                extras = [];


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                rows.forEach(
                  function(item){

                    if(!item){
                      return;
                    }


                    /*
                     * Produto adicional
                     */

                    if(
                      item.cat ===
                      "Produto Adicional"
                    ){

                      extras.push({

                        code:
                          item.code === "-"
                            ? ""
                            : String(
                                item.code || ""
                              ),

                        name:
                          String(
                            item.name || ""
                          ),

                        qty:
                          Number(
                            item.order
                          ) || 0

                      });

                      return;

                    }


                    /*
                     * Produto normal
                     */

                    if(
                      typeof productByCode !==
                      "function"
                    ){

                      return;

                    }


                    const produto =
                      productByCode(
                        item.code
                      );


                    if(!produto){

                      return;

                    }


                    vals[
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "o"
                      )
                    ] =
                      Number(
                        item.order
                      ) || 0;


                    vals[
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "s"
                      )
                    ] =
                      Number(
                        item.stock
                      ) || 0;

                  }
                );


                /*
                 * Observação geral
                 */

                let obs =
                  String(
                    observation || ""
                  );


                if(
                  !obs &&
                  rows.generalObservation
                ){

                  obs =
                    String(
                      rows.generalObservation
                    );

                }


                generalObservation =
                  obs;


                const campo =
                  document.getElementById(
                    "generalObs"
                  );


                if(campo){

                  campo.value =
                    generalObservation;

                }


                if(
                  typeof save ===
                  "function"
                ){

                  save();

                }


                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                if(
                  typeof closeFeature ===
                  "function"
                ){

                  closeFeature();

                }


                alert(
                  "Último pedido recuperado. Confira antes de enviar."
                );

              };


            /*
             * =====================================================
             * LIMPAR PEDIDO ATUAL
             *
             * NÃO APAGA:
             * - sp_last_order
             * - sp_history
             *
             * =====================================================
             */

            window.clearPedido =
              function(){

                let linhas =
                  [];


                try{

                  if(
                    typeof finalizedRows !==
                    "undefined" &&
                    Array.isArray(
                      finalizedRows
                    ) &&
                    finalizedRows.length
                  ){

                    linhas =
                      JSON.parse(
                        JSON.stringify(
                          finalizedRows
                        )
                      );

                  }

                }catch(error){}


                /*
                 * Verificar se o relatório #49
                 * já salvou o histórico.
                 */

                let jaSalvo = false;


                try{

                  if(
                    linhas.length &&
                    typeof historyOrders !==
                    "undefined" &&
                    Array.isArray(
                      historyOrders
                    ) &&
                    historyOrders.length
                  ){

                    const ultimo =
                      historyOrders[0];

                    if(
                      ultimo &&
                      Array.isArray(
                        ultimo.rows
                      )
                    ){

                      jaSalvo =
                        JSON.stringify(
                          ultimo.rows
                        ) ===
                        JSON.stringify(
                          linhas
                        );

                    }

                  }

                }catch(error){}


                /*
                 * Só salvar caso ainda não esteja salvo.
                 */

                if(
                  linhas.length &&
                  !jaSalvo &&
                  typeof saveHistory ===
                  "function"
                ){

                  saveHistory(
                    linhas
                  );

                }


                /*
                 * Limpar somente o pedido atual.
                 */

                vals = {};

                extras = [];

                finalizedRows = [];

                generalObservation = "";


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                /*
                 * Apagar somente dados do pedido atual.
                 */

                localStorage.removeItem(
                  "pedido_compras_vals"
                );

                localStorage.removeItem(
                  "pedido_compras_extras"
                );

                localStorage.removeItem(
                  "pedido_compras_validade_curta"
                );

                localStorage.removeItem(
                  "sp_general_obs"
                );


                /*
                 * Limpar observação visual.
                 */

                const campoObs =
                  document.getElementById(
                    "generalObs"
                  );


                if(campoObs){

                  campoObs.value = "";

                }


                /*
                 * Salvar estado.
                 */

                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                /*
                 * Atualizar tela.
                 */

                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                /*
                 * Ocultar opções de finalização.
                 */

                const opcoes =
                  document.getElementById(
                    "opcoesFinalizado"
                  );


                if(opcoes){

                  opcoes.style.display =
                    "none";

                }


                /*
                 * Voltar ao topo.
                 */

                window.scrollTo({

                  top: 0,

                  behavior: "smooth"

                });

              };

          })();
          FIXJS

          test -s /tmp/super-pedido-fix.js

          node --check /tmp/super-pedido-fix.js

          echo "JavaScript da correção validado com sucesso."

      # ============================================================
      # 9 - INSERIR O JAVASCRIPT NA PÁGINA
      #
      # SOMENTE AQUI AS TAGS <script> SÃO CRIADAS.
      # ============================================================

      - name: Aplicar correções na build
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          test -s /tmp/super-pedido-fix.js

          python3 - <<'PY'
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          patch = Path(
              "/tmp/super-pedido-fix.js"
          ).read_text(
              encoding="utf-8"
          )

          if "</body>" not in text:

              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          if (
              "async function openPDF(sendViaWhatsApp=false)"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório #49 não encontrado."
              )

          if (
              "window.AndroidFileBridge.sharePdf"
              not in text
          ):

              raise SystemExit(
                  "ERRO: AndroidFileBridge não encontrado."
              )

          if (
              "orientation:'portrait'"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório não está em retrato."
              )


          script_tag = (
              "\n<script>\n"
              + patch
              + "\n</script>\n"
          )


          text = text.replace(
              "</body>",
              script_tag + "</body>",
              1
          )


          html.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "Correções inseridas no index.html."
          )

          print(
              "Relatório #49 preservado."
          )

          print(
              "openPDF não foi substituído."
          )

          PY

      # ============================================================
      # 10 - BIBLIOTECAS
      # ============================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ============================================================
      # 11 - VERIFICAR JAVASCRIPT
      # ============================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          combined = "\n".join(
              scripts
          )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "window.AndroidFileBridge.sharePdf",

              "window.openAdmin=function(){",

              "window.repeatLastOrder=function(){",

              "window.applyRepeat=function(",

              "window.clearPedido=function(){",

              "function saveHistory(rows)",

              "CÓDIGO",

              "NOME DO PRODUTO",

              "ESTOQUE",

              "PEDIDO"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "
                      + item
                  )


          if (
              "orientation:'landscape'"
              in text
              or
              'orientation:"landscape"'
              in text
          ):

              raise SystemExit(
                  "ERRO: relatório em paisagem."
              )


          print(
              "Verificação textual concluída."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "JavaScript válido."

      # ============================================================
      # 12 - VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "window.openAdmin=function(){" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder=function(){" \
            "$HTML"

          grep -q \
            "window.applyRepeat=function(" \
            "$HTML"

          grep -q \
            "window.clearPedido=function(){" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          grep -q \
            "CÓDIGO" \
            "$HTML"

          grep -q \
            "NOME DO PRODUTO" \
            "$HTML"

          grep -q \
            "ESTOQUE" \
            "$HTML"

          grep -q \
            "PEDIDO" \
            "$HTML"

          echo ""
          echo "=========================================="
          echo " VERIFICAÇÃO FINAL OK"
          echo "=========================================="
          echo "BASE 49 ................ OK"
          echo "RELATÓRIO #49 .......... OK"
          echo "PDF A4 RETRATO .......... OK"
          echo "ADM ...................... OK"
          echo "REPETIR PEDIDO ........... OK"
          echo "LIMPAR PEDIDO ............ OK"
          echo "JAVASCRIPT ............... OK"
          echo "=========================================="

      # ============================================================
      # 13 - COMPILAR APK
      # ============================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ============================================================
      # 14 - VERIFICAR APK
      # ============================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # 15 - DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
