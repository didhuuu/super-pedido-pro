name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir sanitizeFilename
        shell: bash
        run: |
          set -e

          MAIN=$(find "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          echo "Corrigindo:"
          echo "$MAIN"

          cp "$MAIN" "$MAIN.backup"

          # A correção definitiva:
          # substitui a chamada problemática pelo próprio nome do arquivo.
          sed -i \
            's/sanitizeFilename(filename)/new File(filename).getName()/g' \
            "$MAIN"

          # Se por acaso existir uma declaração antiga do método,
          # ela é removida para evitar conflito.
          sed -i \
            '/^[[:space:]]*private String sanitizeFilename(String filename)[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/d' \
            "$MAIN"

          echo ""
          echo "Verificando chamada problemática..."

          if grep -n "sanitizeFilename(filename)" "$MAIN"; then
            echo "ERRO: chamada sanitizeFilename ainda existe."
            cp "$MAIN.backup" "$MAIN"
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "SANITIZEFILENAME CORRIGIDO"
          echo "======================================"

          grep -n "new File(filename).getName()" "$MAIN" || true

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas OK."

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          MAIN=$(find "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -n "$MAIN"

          echo "MainActivity:"
          echo "$MAIN"

          if grep -q "sanitizeFilename(filename)" "$MAIN"; then
            echo "ERRO: sanitizeFilename ainda está sendo chamado."
            exit 1
          fi

          grep -q \
            "new File(filename).getName()" \
            "$MAIN"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/xlsx.full.min.js"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          echo ""
          echo "======================================"
          echo "VERIFICAÇÃO PRÉ-BUILD: OK"
          echo "======================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
