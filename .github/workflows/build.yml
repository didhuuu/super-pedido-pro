name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Localizar tela HTML
        shell: bash
        run: |
          set -e

          HTML=$(find "$ANDROID_DIR" \
            -path "*/src/main/assets/*" \
            -name index.html \
            -type f \
            -print -quit)

          test -n "$HTML"

          APP_DIR=$(dirname "$HTML")

          echo "HTML=$HTML" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "HTML encontrado em: $HTML"

      - name: Corrigir ADM, Repetir e limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          html = Path(os.environ["HTML"])

          text = html.read_text(encoding="utf-8")
          original = text

          def function_block(source, name):
              pattern = (
                  r"function\s+"
                  + re.escape(name)
                  + r"\s*\("
              )

              match = re.search(pattern, source)

              if not match:
                  raise SystemExit(
                      f"ERRO: função {name} não encontrada"
                  )

              start = match.start()

              next_match = re.search(
                  r"\nfunction\s+[A-Za-z_$][\w$]*\s*\(",
                  source[match.end():]
              )

              if next_match:
                  end = (
                      match.end()
                      + next_match.start()
                      + 1
                  )
              else:
                  end = len(source)

              return start, end, source[start:end]

          def replace_function(source, name, replacement):
              start, end, _ = function_block(
                  source,
                  name
              )

              return (
                  source[:start]
                  + replacement
                  + "\n"
                  + source[end:]
              )

          # =========================================================
          # PROTEÇÃO DO RELATÓRIO DA VERSÃO #49
          # =========================================================

          report_before = function_block(
              original,
              "reportText"
          )[2]

          group_before = function_block(
              original,
              "groupRows"
          )[2]

          report_hash_before = hashlib.sha256(
              report_before.encode("utf-8")
          ).hexdigest()

          group_hash_before = hashlib.sha256(
              group_before.encode("utf-8")
          ).hexdigest()

          # =========================================================
          # 1 - ADMINISTRAÇÃO
          # =========================================================

          new_admin = r'''function openAdmin(){
            featureModal(`
              <h3>🔐 Administração</h3>

              <p>Digite o PIN de administração.</p>

              <input
                id="adminPinInput"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="PIN"
                style="width:100%;box-sizing:border-box;padding:12px;font-size:18px"
              >

              <div style="display:flex;gap:8px;margin-top:10px">
                <button onclick="confirmAdminPin()">Entrar</button>
                <button onclick="closeFeature()">Cancelar</button>
              </div>
            `);

            setTimeout(()=>{
              const input=document.getElementById('adminPinInput');
              if(input) input.focus();
            },50);
          }

          function confirmAdminPin(){
            const input=document.getElementById('adminPinInput');

            const pin=input
              ? String(input.value||'')
              : '';

            const saved=
              localStorage.getItem('sp_admin_pin')
              ||'1234';

            if(pin!==saved){
              alert('PIN incorreto.');
              return;
            }

            featureModal(`
              <h3>🔐 Administração</h3>

              <div class="stat">
                Produtos na lista:
                <b>
                  ${
                    Object.values(APP_DATA).reduce(
                      (a,s)=>
                        a+
                        Object.values(s).reduce(
                          (b,x)=>b+x.length,
                          0
                        ),
                      0
                    )
                  }
                </b>
              </div>

              <div class="adminGrid">

                <button onclick="importList()">
                  📥 Importar lista (XLSX/CSV)
                </button>

                <button onclick="generateImportTemplate()">
                  📄 Gerar lista para preencher
                </button>

                <button onclick="backupJSON()">
                  💾 Backup completo
                </button>

                <button onclick="changePin()">
                  🔑 Alterar PIN
                </button>

              </div>

              <p class="mini">
                No Android, a importação XLSX/CSV é lida pelo próprio aplicativo.
                Após uma importação, a planilha passa a ser a lista oficial;
                itens antigos que não estiverem nela deixam de aparecer.
              </p>

              <button onclick="clearLocalData()">
                ⚠️ Limpar dados locais do pedido
              </button>
            `);
          }'''

          # =========================================================
          # 2 - REPETIR ÚLTIMO PEDIDO
          # =========================================================

          new_repeat = r'''function repeatLastOrder(){

            let rows=
              Array.isArray(lastOrder)
              ? lastOrder
              : [];

            if(!rows.length){

              try{
                rows=JSON.parse(
                  localStorage.getItem('sp_last_order')
                  ||'[]'
                );
              }catch(e){
                rows=[];
              }
            }

            let observation='';

            if(
              Array.isArray(historyOrders)
              &&
              historyOrders.length
            ){
              observation=
                historyOrders[0].generalObservation
                ||'';
            }

            if(!rows.length){

              if(
                Array.isArray(historyOrders)
                &&
                historyOrders.length
              ){

                rows=
                  historyOrders[0].rows
                  ||[];

                observation=
                  historyOrders[0].generalObservation
                  ||'';
              }
            }

            if(!rows.length){

              alert(
                'Ainda não existe último pedido.'
              );

              return;
            }

            rows=JSON.parse(
              JSON.stringify(rows)
            );

            if(
              !rows.generalObservation
              &&
              observation
            ){
              rows.generalObservation=
                observation;
            }

            lastOrder=
              JSON.parse(
                JSON.stringify(rows)
              );

            saveFeatures();

            applyRepeat(lastOrder);
          }'''

          # =========================================================
          # 3 - APLICAÇÃO DO ÚLTIMO PEDIDO
          # =========================================================

          new_apply = r'''function applyRepeat(rows){

            if(
              !Array.isArray(rows)
              ||
              !rows.length
            ){

              alert(
                'Não foi possível recuperar o último pedido.'
              );

              return;
            }

            vals={};
            extras=[];

            rows.forEach(x=>{

              if(
                x.cat==='Produto Adicional'
              ){

                extras.push({
                  code:
                    x.code==='-'
                    ?''
                    :x.code,

                  name:x.name,

                  qty:
                    Number(x.order)||0
                });

                return;
              }

              const f=
                productByCode(x.code);

              if(f){

                const ko=
                  key(
                    f.c,
                    f.s,
                    f.i,
                    'o'
                  );

                vals[ko]=
                  Number(x.order)||0;

                const ks=
                  key(
                    f.c,
                    f.s,
                    f.i,
                    's'
                  );

                vals[ks]=
                  Number(x.stock)||0;
              }
            });

            generalObservation=
              rows.generalObservation
              ||generalObservation;

            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value=
                generalObservation;
            }

            save();

            saveFeatures();

            render();

            updateBadge();

            closeFeature();

            alert(
              'Último pedido recuperado. Confira antes de enviar.'
            );
          }'''

          # =========================================================
          # 4 - LIMPEZA DO PEDIDO
          # =========================================================

          new_clear = r'''function clearPedido(){

            if(
              finalizedRows.length
            ){
              saveHistory(
                finalizedRows
              );
            }

            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            save();

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            render();

            renderValidadeCurta();

            updateBadge();

            closeConference();

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }'''

          # =========================================================
          # APLICAR AS 4 CORREÇÕES
          # =========================================================

          text=replace_function(
              text,
              "openAdmin",
              new_admin
          )

          text=replace_function(
              text,
              "repeatLastOrder",
              new_repeat
          )

          text=replace_function(
              text,
              "applyRepeat",
              new_apply
          )

          text=replace_function(
              text,
              "clearPedido",
              new_clear
          )

          # =========================================================
          # CORRIGIR O ENVIO DO PDF
          #
          # Não altera o relatório.
          #
          # Apenas garante:
          # PDF enviado -> histórico salvo -> pedido limpo.
          #
          # finalizedRows é zerado antes de clearPedido()
          # para evitar salvar o histórico duas vezes.
          # =========================================================

          hook_pattern = (
              r"window\.AndroidFileBridge\s*\.\s*sharePdf"
              r"\s*\("
              r"\s*['\"]pedido-acougue\.pdf['\"]"
              r"\s*,\s*text"
              r"\s*\)"
              r"\s*;"
              r"\s*return"
          )

          matches=list(
              re.finditer(
                  hook_pattern,
                  text
              )
          )

          if len(matches)!=1:

              raise SystemExit(
                  "ERRO: chamada Android sharePdf "
                  f"encontrada {len(matches)} vez(es); "
                  "esperado exatamente 1."
              )

          match=matches[0]

          new_hook=(
              "window.AndroidFileBridge.sharePdf("
              "'pedido-acougue.pdf',text);"
              "saveHistory(rows);"
              "finalizedRows=[];"
              "clearPedido();"
              "return"
          )

          text=(
              text[:match.start()]
              +
              new_hook
              +
              text[match.end():]
          )

          # =========================================================
          # VERIFICAR QUE O RELATÓRIO NÃO FOI ALTERADO
          # =========================================================

          report_after=function_block(
              text,
              "reportText"
          )[2]

          group_after=function_block(
              text,
              "groupRows"
          )[2]

          report_hash_after=hashlib.sha256(
              report_after.encode("utf-8")
          ).hexdigest()

          group_hash_after=hashlib.sha256(
              group_after.encode("utf-8")
          ).hexdigest()

          if report_after!=report_before:

              raise SystemExit(
                  "ERRO GRAVE: reportText foi alterado."
              )

          if group_after!=group_before:

              raise SystemExit(
                  "ERRO GRAVE: groupRows foi alterado."
              )

          if report_hash_after!=report_hash_before:

              raise SystemExit(
                  "ERRO GRAVE: HASH do relatório mudou."
              )

          if group_hash_after!=group_hash_before:

              raise SystemExit(
                  "ERRO GRAVE: HASH do agrupamento mudou."
              )

          # =========================================================
          # VERIFICAR TODOS OS RECURSOS
          # =========================================================

          required=[
              "function openAdmin(){",
              "function confirmAdminPin(){",
              "function repeatLastOrder(){",
              "function applyRepeat(rows){",
              "function clearPedido(){",
              "function reportText(source=getRows()){",
              "function groupRows(rows){",
              "window.AndroidFileBridge.sharePdf('pedido-acougue.pdf',text);saveHistory(rows);finalizedRows=[];clearPedido();return"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: recurso ausente: "
                      +item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print(" VERIFICAÇÃO DAS CORREÇÕES")
          print("==========================================")
          print("OK - Administração / ADM")
          print("OK - PIN de administração")
          print("OK - Repetir último pedido")
          print("OK - Recuperação do histórico")
          print("OK - Produtos adicionais")
          print("OK - Limpeza após envio")
          print("OK - Limpeza após PDF Android")
          print("OK - Histórico preservado")
          print("OK - reportText INALTERADO")
          print("OK - groupRows INALTERADO")
          print("")
          print("HASH reportText:")
          print(report_hash_after)
          print("")
          print("HASH groupRows:")
          print(group_hash_after)
          print("")
          print("==========================================")
          print(" CORREÇÃO VALIDADA")
          print("==========================================")
          print("")

          PY

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          mkdir -p "$APP_DIR"

          curl -L --fail --retry 3 \
            -o "$APP_DIR/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$APP_DIR/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$APP_DIR/xlsx.full.min.js"

          test -s "$APP_DIR/jspdf.umd.min.js"

          echo "OK - Bibliotecas PDF e Excel"

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html=Path(
              os.environ["HTML"]
          )

          text=html.read_text(
              encoding="utf-8"
          )

          scripts=re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          combined="\n".join(
              scripts
          )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          required=[
              "function openAdmin(){",
              "function confirmAdminPin(){",
              "function repeatLastOrder(){",
              "function applyRepeat(rows){",
              "function clearPedido(){",
              "function reportText(source=getRows()){",
              "function groupRows(rows){",
              "window.AndroidFileBridge.sharePdf",
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO JavaScript: "
                      +item
                  )

          print(
              "OK - Estrutura JavaScript validada"
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK - JavaScript sem erro de sintaxe"

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          test -f "$HTML"

          test -s "$APP_DIR/xlsx.full.min.js"

          test -s "$APP_DIR/jspdf.umd.min.js"

          grep -q "function openAdmin()" "$HTML"

          grep -q "function repeatLastOrder()" "$HTML"

          grep -q "function applyRepeat(rows)" "$HTML"

          grep -q "function clearPedido()" "$HTML"

          grep -q "function reportText(source=getRows())" "$HTML"

          grep -q "function groupRows(rows)" "$HTML"

          echo "=========================================="
          echo " TODAS AS VERIFICAÇÕES PASSARAM"
          echo "=========================================="

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            assembleDebug

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK gerado está vazio."
            exit 1
          fi

          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="
          echo "Arquivo:"
          echo "$APK"
          echo ""
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
