name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Alterar SOMENTE o relatório
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado")

          text = html.read_text(encoding="utf-8")

          # ============================================================
          # RELATÓRIO NOVO
          # ============================================================

          new_open_pdf = r'''async function openPDF(sendViaWhatsApp=false){
            const rows=finalizedRows.length?finalizedRows:getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error('Biblioteca PDF não carregada.');
              }

              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;

              const margem=10;
              const largura=pageWidth-(margem*2);

              const colCodigo=24;
              const colEstoque=24;
              const colPedido=24;
              const colProduto=largura-colCodigo-colEstoque-colPedido;

              let y=15;

              function novaPagina(){
                doc.addPage();
                y=15;
              }

              function cabecalho(){

                if(y+9>pageHeight-15){
                  novaPagina();
                }

                const altura=8;

                doc.setFillColor(35,35,35);
                doc.setDrawColor(35,35,35);

                doc.rect(
                  margem,
                  y,
                  largura,
                  altura,
                  'FD'
                );

                doc.setTextColor(255,255,255);

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(7.5);

                let x=margem;

                doc.text(
                  'CÓDIGO',
                  x+2,
                  y+5.3
                );

                x+=colCodigo;

                doc.text(
                  'NOME DO PRODUTO',
                  x+2,
                  y+5.3
                );

                x+=colProduto;

                doc.text(
                  'ESTOQUE',
                  x+2,
                  y+5.3
                );

                x+=colEstoque;

                doc.text(
                  'PEDIDO',
                  x+2,
                  y+5.3
                );

                doc.setTextColor(0,0,0);

                y+=altura;
              }

              doc.setFont(
                'helvetica',
                'bold'
              );

              doc.setFontSize(16);

              doc.text(
                'RELATÓRIO DE PEDIDO',
                margem,
                y
              );

              y+=6;

              doc.setFont(
                'helvetica',
                'normal'
              );

              doc.setFontSize(8);

              const data=new Date()
                .toLocaleString('pt-BR');

              doc.text(
                data,
                margem,
                y
              );

              y+=8;

              const grupos=groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(y+20>pageHeight-15){
                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(10);

                doc.text(
                  String(categoria||'').toUpperCase(),
                  margem,
                  y
                );

                y+=5;

                cabecalho();

                for(const item of items){

                  const nome=
                    typeof nomeProduto==='function'
                    ? nomeProduto(item.name)
                    : String(item.name||'');

                  const linhasNome=
                    doc.splitTextToSize(
                      nome,
                      colProduto-4
                    );

                  const altura=Math.max(
                    6,
                    linhasNome.length*4.2+2
                  );

                  if(y+altura>pageHeight-15){

                    novaPagina();

                    doc.setFont(
                      'helvetica',
                      'bold'
                    );

                    doc.setFontSize(10);

                    doc.text(
                      String(categoria||'').toUpperCase(),
                      margem,
                      y
                    );

                    y+=5;

                    cabecalho();
                  }

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(7.2);

                  doc.setDrawColor(
                    185,
                    185,
                    185
                  );

                  let x=margem;

                  doc.rect(
                    x,
                    y,
                    largura,
                    altura
                  );

                  doc.line(
                    x+colCodigo,
                    y,
                    x+colCodigo,
                    y+altura
                  );

                  doc.line(
                    x+colCodigo+colProduto,
                    y,
                    x+colCodigo+colProduto,
                    y+altura
                  );

                  doc.line(
                    x+colCodigo+colProduto+colEstoque,
                    y,
                    x+colCodigo+colProduto+colEstoque,
                    y+altura
                  );

                  doc.text(
                    String(item.code||'-'),
                    x+2,
                    y+4
                  );

                  doc.text(
                    linhasNome,
                    x+colCodigo+2,
                    y+4
                  );

                  doc.text(
                    String(item.stock??0),
                    x+colCodigo+colProduto+2,
                    y+4
                  );

                  doc.text(
                    String(item.order??0),
                    x+colCodigo+colProduto+colEstoque+2,
                    y+4
                  );

                  y+=altura;
                }

                y+=5;
              }

              if(generalObservation){

                if(y+20>pageHeight-15){
                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                const linhas=
                  doc.splitTextToSize(
                    String(generalObservation),
                    largura
                  );

                doc.text(
                  linhas,
                  margem,
                  y
                );

                y+=linhas.length*4.2;
              }

              const total=
                doc.internal.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=total;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+pagina+' de '+total,
                  pageWidth-margem,
                  pageHeight-5,
                  {
                    align:'right'
                  }
                );
              }

              const base64=
                doc.output('datauristring')
                  .split(',')[1];

              const nomeArquivo=
                'relatorio-pedido-'+
                data.replace(/\//g,'-')+
                '.pdf';

              # Android
              if(
                window.AndroidFileBridge &&
                window.AndroidFileBridge.sharePdf
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                saveHistory(rows);

                clearPedido();

                return;
              }

              # Navegador
              const blob=doc.output('blob');

              if(
                sendViaWhatsApp &&
                navigator.share &&
                typeof File!=='undefined'
              ){

                const file=new File(
                  [blob],
                  nomeArquivo,
                  {
                    type:'application/pdf'
                  }
                );

                if(
                  !navigator.canShare ||
                  navigator.canShare({
                    files:[file]
                  })
                ){

                  try{

                    await navigator.share({
                      files:[file],
                      text:'Pedido do açougue'
                    });

                    saveHistory(rows);

                    clearPedido();

                    return;

                  }catch(e){

                    if(
                      e &&
                      e.name==='AbortError'
                    ){
                      return;
                    }
                  }
                }
              }

              const url=
                URL.createObjectURL(blob);

              const a=
                document.createElement('a');

              a.href=url;

              a.download=nomeArquivo;

              document.body.appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                ()=>{
                  URL.revokeObjectURL(url);
                },
                3000
              );

              saveHistory(rows);

              clearPedido();

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message||e)
              );
            }
          }'''

          # Corrige os comentários Python que não podem
          # permanecer dentro do JavaScript.
          new_open_pdf = new_open_pdf.replace(
              "              # Android",
              "              // Android"
          )

          new_open_pdf = new_open_pdf.replace(
              "              # Navegador",
              "              // Navegador"
          )

          # ============================================================
          # SUBSTITUI SOMENTE openPDF
          # ============================================================

          pattern = (
              r"async function openPDF"
              r"\(sendViaWhatsApp=false\)"
              r"\{.*?\n\}"
          )

          text, count = re.subn(
              pattern,
              new_open_pdf,
              text,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada."
              )

          # Mantém as bibliotecas locais.
          text=text.replace(
              'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
              'xlsx.full.min.js'
          )

          text=text.replace(
              'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
              'jspdf.umd.min.js'
          )

          # ============================================================
          # VERIFICAÇÕES
          # ============================================================

          required=[
              'function repeatLastOrder()',
              'function openAdmin()',
              'function saveHistory(rows)',
              'function applyRepeat(rows)',
              'function clearPedido()',
              'window.AndroidFileBridge.sharePdf',
              "orientation:'portrait'",
              "format:'a4'",
              "CÓDIGO",
              "NOME DO PRODUTO",
              "ESTOQUE",
              "PEDIDO"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: função/recurso ausente: "
                      +item
                  )

          # Segurança: o relatório não pode estar em paisagem.
          if "orientation:'landscape'" in text:
              raise SystemExit(
                  "ERRO: PDF em paisagem encontrado."
              )

          html.write_text(
              text,
              encoding='utf-8'
          )

          print(
              "OK: somente openPDF foi alterado."
          )

          print(
              "OK: Admin preservado."
          )

          print(
              "OK: Repetir pedido preservado."
          )

          print(
              "OK: Histórico preservado."
          )

          print(
              "OK: Importação preservada."
          )

          PY

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html=Path(
              os.environ["ANDROID_DIR"]
          )/"app/src/main/assets/app/index.html"

          text=html.read_text(
              encoding="utf-8"
          )

          scripts=re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado"
              )

          combined="\n".join(scripts)

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          required=[
              "async function openPDF(sendViaWhatsApp=false)",
              "function repeatLastOrder()",
              "function openAdmin()",
              "function saveHistory(rows)",
              "function applyRepeat(rows)",
              "function clearPedido()",
              "window.AndroidFileBridge.sharePdf",
              "CÓDIGO",
              "NOME DO PRODUTO",
              "ESTOQUE",
              "PEDIDO"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "+item
                  )

          if (
              "orientation:'landscape'" in text
              or
              'orientation:"landscape"' in text
          ):

              raise SystemExit(
                  "ERRO: relatório em paisagem."
              )

          print(
              "Verificação textual concluída."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
