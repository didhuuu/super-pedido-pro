name: Gerar APK - Super Pedido Pro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # VERSÃO 9 ORIGINAL
      # ==========================================================
      - name: Baixar versão 9
        uses: actions/checkout@v4
        with:
          ref: 69bd377f51e567832edd60769ba312e3d7f39156

      # ==========================================================
      # JAVA
      # ==========================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================================
      # GRADLE
      # ==========================================================
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================================
      # EXTRAIR A VERSÃO 9
      # ==========================================================
      - name: Extrair projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f Super-Pedido-Pro.zip

          mkdir -p projeto

          unzip -o Super-Pedido-Pro.zip -d projeto

      # ==========================================================
      # LOCALIZAR PROJETO ANDROID
      # ==========================================================
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      # ==========================================================
      # ÚNICA CORREÇÃO DE CONFIGURAÇÃO:
      # ANDROIDX
      # ==========================================================
      - name: Ativar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          if ! grep -Fq "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -Fq "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "AndroidX configurado."

      # ==========================================================
      # ALTERAR SOMENTE O RELATÓRIO PDF
      #
      # NÃO ALTERA:
      # - clearPedido
      # - ADM
      # - repetir pedido
      # - histórico
      # - favoritos
      # - importação
      # - MainActivity
      # - estoque
      # - produtos
      # ==========================================================
      - name: Corrigir somente relatório PDF
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado."
              )

          text = html.read_text(encoding="utf-8")

          inicio = text.find("async function openPDF")
          fim = text.find("function sendWhatsApp", inicio)

          if inicio == -1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada."
              )

          if fim == -1:
              raise SystemExit(
                  "ERRO: função sendWhatsApp não encontrada."
              )

          novo_open_pdf = r'''async function openPDF(sendViaWhatsApp=false){
            const rows=finalizedRows.length?finalizedRows:getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{
              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;

              const margin=10;
              const tableWidth=190;

              const colCode=27;
              const colName=108;
              const colStock=27;
              const colOrder=28;

              let y=15;

              function drawTitle(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(15);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {align:'center'}
                );

                y+=7;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                doc.text(
                  'Data: '+
                  new Date().toLocaleString('pt-BR'),
                  margin,
                  y
                );

                y+=8;
              }

              function drawHeader(){

                const h=7;

                if(y+h>pageHeight-15){
                  doc.addPage();
                  y=15;
                  drawTitle();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(7);

                doc.rect(
                  margin,
                  y,
                  tableWidth,
                  h
                );

                doc.line(
                  margin+colCode,
                  y,
                  margin+colCode,
                  y+h
                );

                doc.line(
                  margin+colCode+colName,
                  y,
                  margin+colCode+colName,
                  y+h
                );

                doc.line(
                  margin+
                  colCode+
                  colName+
                  colStock,
                  y,
                  margin+
                  colCode+
                  colName+
                  colStock,
                  y+h
                );

                doc.text(
                  'CÓDIGO',
                  margin+colCode/2,
                  y+4.6,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  margin+colCode+2,
                  y+4.6
                );

                doc.text(
                  'ESTOQUE',
                  margin+
                  colCode+
                  colName+
                  colStock/2,
                  y+4.6,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  margin+
                  colCode+
                  colName+
                  colStock+
                  colOrder/2,
                  y+4.6,
                  {align:'center'}
                );

                y+=h;
              }

              function newPage(){
                doc.addPage(
                  'a4',
                  'portrait'
                );

                y=15;

                drawTitle();
              }

              function drawProduct(item){

                const code=String(
                  item.code||'-'
                );

                const name=String(
                  item.name||''
                );

                const stock=String(
                  item.stock??0
                );

                const order=String(
                  item.order??0
                );

                const nameLines=
                  doc.splitTextToSize(
                    name,
                    colName-4
                  );

                const obsLines=[];

                if(item.obs){
                  obsLines.push(
                    ...doc.splitTextToSize(
                      'Obs: '+String(item.obs),
                      colName-4
                    )
                  );
                }

                if(item.validade){
                  obsLines.push(
                    ...doc.splitTextToSize(
                      'Validade: '+
                      String(item.validade),
                      colName-4
                    )
                  );
                }

                const lines=[
                  ...nameLines,
                  ...obsLines
                ];

                const rowHeight=Math.max(
                  7,
                  lines.length*4+3
                );

                if(
                  y+rowHeight>
                  pageHeight-15
                ){
                  newPage();
                  drawHeader();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(6.8);

                doc.rect(
                  margin,
                  y,
                  tableWidth,
                  rowHeight
                );

                doc.line(
                  margin+colCode,
                  y,
                  margin+colCode,
                  y+rowHeight
                );

                doc.line(
                  margin+colCode+colName,
                  y,
                  margin+colCode+colName,
                  y+rowHeight
                );

                doc.line(
                  margin+
                  colCode+
                  colName+
                  colStock,
                  y,
                  margin+
                  colCode+
                  colName+
                  colStock,
                  y+rowHeight
                );

                doc.text(
                  code,
                  margin+colCode/2,
                  y+4.3,
                  {align:'center'}
                );

                let ny=y+4;

                lines.forEach(
                  line=>{
                    doc.text(
                      line,
                      margin+
                      colCode+
                      2,
                      ny
                    );

                    ny+=4;
                  }
                );

                doc.text(
                  stock,
                  margin+
                  colCode+
                  colName+
                  colStock/2,
                  y+4.3,
                  {align:'center'}
                );

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.text(
                  order,
                  margin+
                  colCode+
                  colName+
                  colStock+
                  colOrder/2,
                  y+4.3,
                  {align:'center'}
                );

                y+=rowHeight;
              }

              drawTitle();

              const groups=groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(groups)
              ){

                if(y+18>pageHeight-15){
                  newPage();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  String(categoria||'').toUpperCase(),
                  margin,
                  y
                );

                y+=5;

                drawHeader();

                items.forEach(
                  item=>{
                    drawProduct(item);
                  }
                );

                y+=4;
              }

              if(generalObservation){

                if(y+20>pageHeight-15){
                  newPage();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margin,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                const obsLines=
                  doc.splitTextToSize(
                    String(generalObservation),
                    tableWidth
                  );

                doc.text(
                  obsLines,
                  margin,
                  y
                );
              }

              const totalPages=
                doc.internal.getNumberOfPages();

              for(
                let page=1;
                page<=totalPages;
                page++
              ){

                doc.setPage(page);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margin,
                  pageHeight-6
                );

                doc.text(
                  'Página '+
                  page+
                  ' de '+
                  totalPages,
                  pageWidth-margin,
                  pageHeight-6,
                  {align:'right'}
                );
              }

              const filename=
                'pedido-acougue-'+
                new Date()
                  .toISOString()
                  .slice(0,10)+
                '.pdf';

              const base64=
                doc.output(
                  'datauristring'
                ).split(',')[1];

              /*
               * ANDROID
               *
               * Mantém exatamente o fluxo
               * de compartilhamento existente.
               */

              if(
                window.AndroidFileBridge &&
                typeof
                window.AndroidFileBridge.sharePdf
                ==='function'
              ){

                window.AndroidFileBridge.sharePdf(
                  filename,
                  base64
                );

                saveHistory(rows);

                clearPedido();

                return;
              }

              /*
               * NAVEGADOR / WHATSAPP
               */

              if(
                sendViaWhatsApp &&
                navigator.share &&
                typeof File!=='undefined'
              ){

                const binary=
                  atob(base64);

                const bytes=
                  new Uint8Array(
                    binary.length
                  );

                for(
                  let i=0;
                  i<binary.length;
                  i++
                ){
                  bytes[i]=
                    binary.charCodeAt(i);
                }

                const file=new File(
                  [bytes],
                  filename,
                  {
                    type:'application/pdf'
                  }
                );

                if(
                  !navigator.canShare ||
                  navigator.canShare({
                    files:[file]
                  })
                ){

                  try{

                    await navigator.share({
                      files:[file],
                      text:'Pedido do açougue'
                    });

                    saveHistory(rows);

                    clearPedido();

                    return;

                  }catch(e){

                    if(
                      e &&
                      e.name==='AbortError'
                    ){
                      return;
                    }
                  }
                }
              }

              /*
               * DOWNLOAD NORMAL
               */

              const blob=doc.output('blob');

              const url=
                URL.createObjectURL(blob);

              const a=
                document.createElement('a');

              a.href=url;
              a.download=filename;

              document.body.appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                ()=>{
                  URL.revokeObjectURL(url);
                },
                2000
              );

              if(!sendViaWhatsApp){

                saveHistory(rows);

                clearPedido();
              }

            }catch(e){

              console.error(
                'openPDF:',
                e
              );

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message||e)
              );
            }
          }'''

          novo_texto = (
              text[:inicio]
              + novo_open_pdf
              + "\n"
              + text[fim:]
          )

          html.write_text(
              novo_texto,
              encoding="utf-8"
          )

          print(
              "OK: somente openPDF foi substituído."
          )
          PY

      # ==========================================================
      # VERIFICAR JAVASCRIPT
      # ==========================================================
      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import re
          import os
          from pathlib import Path

          html=Path(
              os.environ["ANDROID_DIR"]
          ) / "app/src/main/assets/app/index.html"

          text=html.read_text(
              encoding="utf-8"
          )

          scripts=re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERRO: JavaScript não encontrado."
              )

          combined="\n".join(scripts)

          Path(
              "/tmp/super-pedido.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          required=[
              "async function openPDF",
              "function sendWhatsApp",
              "function clearPedido",
              "function repeatLastOrder",
              "function openAdmin",
              "orientation:'portrait'",
              "format:'a4'",
              "CÓDIGO",
              "NOME DO PRODUTO",
              "ESTOQUE",
              "PEDIDO",
              "Página",
              "AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: faltando: "+
                      item
                  )

          if (
              "orientation:'landscape'"
              in text
              or
              'orientation:"landscape"'
              in text
          ):
              raise SystemExit(
                  "ERRO: PDF paisagem encontrado."
              )

          print(
              "Verificação estrutural: OK"
          )
          PY

          node --check /tmp/super-pedido.js

          echo "JavaScript: OK"

      # ==========================================================
      # COMPILAR APK
      # ==========================================================
      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              assembleDebug
          else
            gradle \
              --no-daemon \
              assembleDebug
          fi

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================
      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK vazio."
            exit 1
          fi

          echo "APK gerado com sucesso:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ==========================================================
      # DISPONIBILIZAR APK
      # ==========================================================
      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
