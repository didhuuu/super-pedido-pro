name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir SOMENTE ADM, Repetir último e limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          original = text

          def replace_function(
              source,
              marker,
              replacement
          ):
              start = source.find(marker)

              if start < 0:
                  raise SystemExit(
                      "ERRO: não encontrou " + marker
                  )

              next_function = source.find(
                  "function ",
                  start + len(marker)
              )

              if next_function < 0:
                  raise SystemExit(
                      "ERRO: não encontrou o fim de "
                      + marker
                  )

              return (
                  source[:start]
                  + replacement
                  + "\n"
                  + source[next_function:]
              )

          def get_function(
              source,
              marker
          ):
              start = source.find(marker)

              if start < 0:
                  raise SystemExit(
                      "ERRO: não encontrou " + marker
                  )

              next_function = source.find(
                  "function ",
                  start + len(marker)
              )

              if next_function < 0:
                  raise SystemExit(
                      "ERRO: não encontrou o fim de "
                      + marker
                  )

              return source[start:next_function]

          # ==================================================
          # GUARDAR O RELATÓRIO ORIGINAL DA BASE #49
          # ==================================================

          report_text_before = get_function(
              original,
              "function reportText(source=getRows()){"
          )

          group_rows_before = get_function(
              original,
              "function groupRows(rows){"
          )

          open_pdf_before = get_function(
              original,
              "function openPDF(){"
          )

          # ==================================================
          # 1. ADMINISTRAÇÃO
          #
          # Remove dependência do prompt() do WebView Android.
          # ==================================================

          new_admin = '''function openAdmin(){featureModal(`<h3>🔐 Administração</h3><p>Digite o PIN de administração.</p><input id="adminPinInput" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" style="width:100%;box-sizing:border-box;padding:12px;font-size:18px"><div style="display:flex;gap:8px;margin-top:10px"><button onclick="confirmAdminPin()">Entrar</button><button onclick="closeFeature()">Cancelar</button></div>`);setTimeout(()=>{const e=document.getElementById('adminPinInput');if(e)e.focus()},50)}
          function confirmAdminPin(){const input=document.getElementById('adminPinInput');const pin=input?String(input.value||''):'';const saved=localStorage.getItem('sp_admin_pin')||'1234';if(pin!==saved){alert('PIN incorreto.');return}featureModal(`<h3>🔐 Administração</h3><div class="stat">Produtos na lista: <b>${Object.values(APP_DATA).reduce((a,s)=>a+Object.values(s).reduce((b,x)=>b+x.length,0),0)}</b></div><div class="adminGrid"><button onclick="importList()">📥 Importar lista (XLSX/CSV)</button><button onclick="generateImportTemplate()">📄 Gerar lista para preencher</button><button onclick="backupJSON()">💾 Backup completo</button><button onclick="changePin()">🔑 Alterar PIN</button></div><p class="mini">No Android, a importação XLSX/CSV é lida pelo próprio aplicativo. Após uma importação, a planilha passa a ser a lista oficial; itens antigos que não estiverem nela deixam de aparecer.</p><button onclick="clearLocalData()">⚠️ Limpar dados locais do pedido</button>`)}'''

          # ==================================================
          # 2. REPETIR ÚLTIMO PEDIDO
          # ==================================================

          new_repeat = '''function repeatLastOrder(){let rows=Array.isArray(lastOrder)?lastOrder:[];if(!rows.length){try{rows=JSON.parse(localStorage.getItem('sp_last_order')||'[]')}catch(e){rows=[]}}if(!rows.length&&Array.isArray(historyOrders)&&historyOrders.length){rows=historyOrders[0].rows||[];if(rows.length)rows.generalObservation=historyOrders[0].generalObservation||''}if(!rows.length){alert('Ainda não existe último pedido.');return}lastOrder=JSON.parse(JSON.stringify(rows));saveFeatures();applyRepeat(lastOrder)}'''

          new_apply = '''function applyRepeat(rows){if(!Array.isArray(rows)||!rows.length){alert('Não foi possível recuperar o último pedido.');return}vals={};extras=[];rows.forEach(x=>{if(x.cat==='Produto Adicional'){extras.push({code:x.code==='-'?'':x.code,name:x.name,qty:Number(x.order)||0});return}const f=productByCode(x.code);if(f){const ko=key(f.c,f.s,f.i,'o');vals[ko]=Number(x.order)||0;const ks=key(f.c,f.s,f.i,'s');vals[ks]=Number(x.stock)||0;}});generalObservation=(rows.generalObservation||generalObservation);const obs=document.getElementById('generalObs');if(obs)obs.value=generalObservation;save();saveFeatures();render();updateBadge();closeFeature();alert('Último pedido recuperado. Confira antes de enviar.')}'''

          # ==================================================
          # 3. LIMPAR PEDIDO
          #
          # Mantém histórico e último pedido.
          # ==================================================

          new_clear = '''function clearPedido(){if(finalizedRows.length)saveHistory(finalizedRows);vals={};extras=[];validadeCurta=[];finalizedRows=[];save();localStorage.removeItem('pedido_compras_vals');localStorage.removeItem('pedido_compras_extras');localStorage.removeItem('pedido_compras_validade_curta');render();renderValidadeCurta();updateBadge();closeConference();window.scrollTo({top:0,behavior:'smooth'})}'''

          # Aplicar SOMENTE as três funções.

          text = replace_function(
              text,
              "function openAdmin(){",
              new_admin
          )

          text = replace_function(
              text,
              "function repeatLastOrder(){",
              new_repeat
          )

          text = replace_function(
              text,
              "function applyRepeat(rows){",
              new_apply
          )

          text = replace_function(
              text,
              "function clearPedido(){",
              new_clear
          )

          # ==================================================
          # PDF:
          #
          # NÃO muda geração, layout ou conteúdo.
          #
          # Apenas garante que, depois que o Android receber
          # o PDF, o pedido seja salvo no histórico e limpo.
          # ==================================================

          old_hook = (
              "window.AndroidFileBridge.sharePdf("
              "'pedido-acougue.pdf',text);return"
          )

          new_hook = (
              "window.AndroidFileBridge.sharePdf("
              "'pedido-acougue.pdf',text);"
              "saveHistory(rows);"
              "clearPedido();"
              "return"
          )

          if text.count(old_hook) != 1:
              raise SystemExit(
                  "ERRO: gancho Android do PDF "
                  "não encontrado exatamente uma vez"
              )

          text = text.replace(
              old_hook,
              new_hook,
              1
          )

          # ==================================================
          # PROTEÇÃO ABSOLUTA DO RELATÓRIO
          # ==================================================

          if get_function(
              text,
              "function reportText(source=getRows()){"
          ) != report_text_before:

              raise SystemExit(
                  "ERRO GRAVE: reportText foi alterado"
              )

          if get_function(
              text,
              "function groupRows(rows){"
          ) != group_rows_before:

              raise SystemExit(
                  "ERRO GRAVE: groupRows foi alterado"
              )

          expected_open_pdf = open_pdf_before.replace(
              old_hook,
              new_hook
          )

          if get_function(
              text,
              "function openPDF(){"
          ) != expected_open_pdf:

              raise SystemExit(
                  "ERRO GRAVE: openPDF recebeu "
                  "alteração além do pós-envio"
              )

          # ==================================================
          # VERIFICAÇÕES FINAIS
          # ==================================================

          required = [
              "function openAdmin(){",
              "function confirmAdminPin(){",
              "function repeatLastOrder(){",
              "function applyRepeat(rows){",
              "function clearPedido(){",
              "function openPDF(){",
              "function reportText(source=getRows()){",
              "function groupRows(rows){",
              "window.AndroidFileBridge.sharePdf('pedido-acougue.pdf',text);saveHistory(rows);clearPedido();return"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: recurso ausente: "
                      + item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "========================================"
          )

          print(
              "OK: ADM corrigido."
          )

          print(
              "OK: REPETIR ÚLTIMO corrigido."
          )

          print(
              "OK: LIMPEZA após envio corrigida."
          )

          print(
              "OK: reportText INALTERADO."
          )

          print(
              "OK: groupRows INALTERADO."
          )

          print(
              "OK: geração do relatório INALTERADA."
          )

          print(
              "OK: PDF Android recebeu somente "
              "o pós-envio."
          )

          print(
              "HASH reportText:",
              hashlib.sha256(
                  report_text_before.encode()
              ).hexdigest()
          )

          print(
              "HASH groupRows:",
              hashlib.sha256(
                  group_rows_before.encode()
              ).hexdigest()
          )

          print(
              "========================================"
          )

          PY

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html = (
              Path(os.environ["ANDROID_DIR"])
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado"
              )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          checks = [
              "function openAdmin(){",
              "function confirmAdminPin(){",
              "function repeatLastOrder(){",
              "function applyRepeat(rows){",
              "function clearPedido(){",
              "function openPDF(){",
              "function reportText(source=getRows()){",
              "function groupRows(rows){",
              "CÓDIGO",
              "NOME DO PRODUTO",
              "ESTOQUE",
              "PEDIDO",
          ]

          for item in checks:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "
                      + item
                  )

          print(
              "OK: verificações estruturais concluídas."
          )

          PY

          node --check /tmp/super-pedido-inline.js

          echo "OK: JavaScript sem erro de sintaxe."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle --no-daemon assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK gerado: $APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
