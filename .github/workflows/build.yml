name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # BASE EXATA DA VERSÃO #49
      # ==========================================================

      - name: Baixar projeto - BASE #49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ==========================================================
      # PREPARAR PROJETO
      # ==========================================================

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      # ==========================================================
      # RELATÓRIO EXATO DA VERSÃO #49
      # NÃO REESCREVE O RELATÓRIO
      # ==========================================================

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-v49.yml

          test -s /tmp/build-v49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build-v49.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          inicio = None

          for i, line in enumerate(lines):

              if line.strip() == \
                  "- name: Alterar SOMENTE o relatório":

                  inicio = i
                  break

          if inicio is None:

              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(
              inicio + 1,
              len(lines)
          ):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  lines[i]
              ):

                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  lines[i]
              ):

                  break

          if run_line is None:

              raise SystemExit(
                  "ERRO: bloco run do relatório #49 não encontrado."
              )

          script = []

          for i in range(
              run_line + 1,
              len(lines)
          ):

              line = lines[i]

              if re.match(
                  r"^      - name:",
                  line
              ):

                  break

              if line.startswith(
                  "          "
              ):

                  script.append(
                      line[10:]
                  )

              elif line.strip() == "":

                  script.append("")

              else:

                  raise SystemExit(
                      "ERRO: estrutura inesperada no relatório #49."
                  )

          report_script = (
              "\n".join(script).rstrip()
              + "\n"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "orientation:'portrait'",

              "format:'a4'",

              "window.AndroidFileBridge.sharePdf",

              "saveHistory(rows)",

              "clearPedido()"

          ]

          for item in required:

              if item not in report_script:

                  raise SystemExit(
                      "ERRO: parte do relatório #49 ausente: "
                      + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report_script,
              encoding="utf-8"
          )

          print(
              "OK: relatório EXATO da #49 localizado."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "OK: relatório #49 aplicado."

      # ==========================================================
      # PATCH DAS CORREÇÕES
      #
      # ADM
      # REPETIR ÚLTIMO PEDIDO
      # ZERAR PEDIDO
      #
      # O CÓDIGO JAVASCRIPT É TRANSPORTADO EM BASE64.
      # ASSIM NÃO EXISTE <script> SOLTO NO YAML.
      # ==========================================================

      - name: Preparar correções
        shell: bash
        run: |
          set -e

          echo 'PATCH_    aWRvX2NvbXByYXNfZXh0cmFzIik7CiAgICBsb2NhbFN0b3JhZ2UucmVtb3ZlSXRlbSgicGVkaWRvX2NvbXByYXNfdmFsaWRhZGVfY3VydGEiKTsKICAgIGxvY2FsU3RvcmFnZS5yZW1vdmVJdGVtKCJzcF9nZW5lcmFsX29icyIpOwogICAgY29uc3Qg  c3R5bGUuZGlzcGxheT0ibm9uZSI7CiAgICBkb2N1bWVudC5xdWVyeVNlbGVjdG9yQWxsKCJpbnB1dC5xdHkiKS5mb3JFYWNoKGVsPT5lbC52YWx1ZT0iMCIpOwogICAgd2luZG93LnNjcm9sbFRvKHt0b3A6MCxiZWhhdmlvcjoi c21vb3RoIn0pOwogIH07Cn0pOwo8L3NjcmlwdD4=' >> "$GITHUB_ENV"

      - name: Aplicar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          encoded = os.environ[
              "PATCH_B64"
          ]

          patch = base64.b64decode(
              encoded
          ).decode(
              "utf-8"
          )

          if (
              "async function openPDF(sendViaWhatsApp=false)"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório #49 não encontrado."
              )

          if (
              "window.AndroidFileBridge.sharePdf"
              not in text
          ):

              raise SystemExit(
                  "ERRO: AndroidFileBridge não encontrado."
              )

          if (
              "orientation:'portrait'"
              not in text
          ):

              raise SystemExit(
                  "ERRO: relatório não está em retrato."
              )

          if "</body>" not in text:

              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          text = text.replace(
              "</body>",
              patch + "\n</body>",
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: correções aplicadas."
          )

          print(
              "OK: relatório preservado."
          )

      # ==========================================================
      # BIBLIOTECAS
      # ==========================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ==========================================================
      # VALIDAR JAVASCRIPT
      # ==========================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          import re
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          required = [

              "async function openPDF(sendViaWhatsApp=false)",

              "window.openAdmin=function(){",

              "window.repeatLastOrder=function(){",

              "window.applyRepeat=function(",

              "window.clearPedido=function(){",

              "window.AndroidFileBridge.sharePdf",

              "CÓDIGO",

              "NOME DO PRODUTO",

              "ESTOQUE",

              "PEDIDO"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: não encontrado: "
                      + item
                  )

          if (
              "orientation:'landscape'"
              in text
              or
              'orientation:"landscape"'
              in text
          ):

              raise SystemExit(
                  "ERRO: relatório em paisagem."
              )

          print(
              "OK: JavaScript verificado."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

      # ==========================================================
      # VERIFICAÇÃO FINAL
      # ==========================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "window.openAdmin=function(){" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder=function(){" \
            "$HTML"

          grep -q \
            "window.applyRepeat=function(" \
            "$HTML"

          grep -q \
            "window.clearPedido=function(){" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          grep -q \
            "RELATÓRIO DE PEDIDO" \
            "$HTML"

          echo "=========================================="
          echo " VERIFICAÇÃO FINAL OK"
          echo "=========================================="
          echo "BASE #49 ............... OK"
          echo "RELATÓRIO #49 .......... OK"
          echo "ADM .................... OK"
          echo "REPETIR ............... OK"
          echo "ZERAR .................. OK"
          echo "PDF A4 RETRATO ......... OK"
          echo "JAVASCRIPT ............. OK"
          echo "=========================================="

      # ==========================================================
      # COMPILAR APK
      # ==========================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ==========================================================
      # VERIFICAR APK
      # ==========================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ==========================================================
      # DISPONIBILIZAR APK
      # ==========================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
