name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. BAIXAR EXATAMENTE A VERSÃO 9
      # ============================================================
      - name: Baixar exatamente a versão 9
        uses: actions/checkout@v4
        with:
          ref: 69bd377f51e567832edd60769ba312e3d7f39156

      # ============================================================
      # 2. JAVA 17
      # ============================================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. GRADLE 8.7
      # ============================================================
      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # ============================================================
      # 4. EXTRAIR O PROJETO DA VERSÃO 9
      # ============================================================
      - name: Extrair projeto da versão 9
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      # ============================================================
      # 5. LOCALIZAR O PROJETO ANDROID
      # ============================================================
      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android encontrado em:"
          echo "$ANDROID_DIR"

      # ============================================================
      # 6. CORREÇÃO DO ERRO REAL DO BUILD:
      # ANDROIDX
      # ============================================================
      - name: Corrigir configuração AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          if ! grep -Fq "android.useAndroidX=true" gradle.properties; then
            echo "android.useAndroidX=true" >> gradle.properties
          fi

          if ! grep -Fq "android.enableJetifier=true" gradle.properties; then
            echo "android.enableJetifier=true" >> gradle.properties
          fi

          echo "========================================"
          echo "gradle.properties:"
          echo "========================================"

          cat gradle.properties

      # ============================================================
      # 7. ALTERAR SOMENTE O RELATÓRIO PDF
      # ============================================================
      - name: Alterar somente o relatório PDF
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado em "
                  + str(html)
              )

          text = html.read_text(encoding="utf-8")

          inicio = text.find("async function openPDF")
          fim = text.find("function sendWhatsApp", inicio)

          if inicio < 0:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada."
              )

          if fim < 0:
              raise SystemExit(
                  "ERRO: função sendWhatsApp não encontrada."
              )

          # ========================================================
          # NOVA FUNÇÃO openPDF
          # SOMENTE ESTA FUNÇÃO SERÁ SUBSTITUÍDA.
          # ========================================================

          novo_open_pdf = r'''async function openPDF(sendViaWhatsApp=false){

            const rows = finalizedRows.length ? finalizedRows : getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              const lib = window.jspdf || {};

              const jsPDF = lib.jsPDF;

              if(!jsPDF){
                throw new Error('Biblioteca PDF não carregada.');
              }

              const doc = new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth = 210;
              const pageHeight = 297;

              const marginLeft = 10;
              const marginRight = 10;

              const tableWidth = pageWidth - marginLeft - marginRight;

              const colCode = 24;
              const colName = 100;
              const colStock = 32;
              const colOrder = 34;

              const rowHeight = 7;

              let y = 15;

              function drawFooter(){

                const total = doc.getNumberOfPages();

                for(let page=1; page<=total; page++){

                  doc.setPage(page);

                  doc.setFontSize(7);

                  doc.setFont('helvetica','normal');

                  doc.text(
                    'Super Pedido Pro',
                    marginLeft,
                    pageHeight - 7
                  );

                  doc.text(
                    'Página ' + page + ' de ' + total,
                    pageWidth - marginRight,
                    pageHeight - 7,
                    {align:'right'}
                  );

                }

              }

              function drawTableHeader(){

                if(y + 12 > pageHeight - 15){

                  doc.addPage();

                  y = 15;

                }

                doc.setFontSize(8);

                doc.setFont('helvetica','bold');

                doc.setFillColor(235,238,242);

                doc.rect(
                  marginLeft,
                  y - 5,
                  tableWidth,
                  rowHeight,
                  'F'
                );

                doc.rect(
                  marginLeft,
                  y - 5,
                  tableWidth,
                  rowHeight
                );

                doc.text(
                  'CÓDIGO',
                  marginLeft + 2,
                  y
                );

                doc.text(
                  'NOME DO PRODUTO',
                  marginLeft + colCode + 2,
                  y
                );

                doc.text(
                  'ESTOQUE',
                  marginLeft + colCode + colName + colStock / 2,
                  y,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  marginLeft +
                    colCode +
                    colName +
                    colStock +
                    colOrder / 2,
                  y,
                  {align:'center'}
                );

                y += rowHeight;

              }

              function drawCategory(title){

                if(y + 14 > pageHeight - 15){

                  doc.addPage();

                  y = 15;

                }

                doc.setFontSize(10);

                doc.setFont('helvetica','bold');

                doc.text(
                  String(title || ''),
                  marginLeft,
                  y
                );

                y += 5;

                drawTableHeader();

              }

              function drawItem(x){

                const code = String(x.code || '-');

                const name = String(x.name || '');

                const stock = String(x.stock ?? 0);

                const order = String(x.order ?? 0);

                const obs = x.obs
                  ? 'Obs: ' + String(x.obs)
                  : '';

                const validade = x.validade
                  ? 'Validade: ' + String(x.validade)
                  : '';

                const nameLines = doc.splitTextToSize(
                  name,
                  colName - 4
                );

                const extraLines = [];

                if(obs){
                  extraLines.push(
                    ...doc.splitTextToSize(
                      obs,
                      colName - 4
                    )
                  );
                }

                if(validade){
                  extraLines.push(
                    ...doc.splitTextToSize(
                      validade,
                      colName - 4
                    )
                  );
                }

                const allNameLines = [
                  ...nameLines,
                  ...extraLines
                ];

                const linesCount = Math.max(
                  1,
                  allNameLines.length
                );

                const h = Math.max(
                  rowHeight,
                  linesCount * 4.2 + 3
                );

                if(y + h > pageHeight - 15){

                  doc.addPage();

                  y = 15;

                  drawTableHeader();

                }

                doc.setFontSize(7.5);

                doc.setFont('helvetica','normal');

                doc.rect(
                  marginLeft,
                  y - 4,
                  tableWidth,
                  h
                );

                doc.line(
                  marginLeft + colCode,
                  y - 4,
                  marginLeft + colCode,
                  y - 4 + h
                );

                doc.line(
                  marginLeft + colCode + colName,
                  y - 4,
                  marginLeft + colCode + colName,
                  y - 4 + h
                );

                doc.line(
                  marginLeft +
                    colCode +
                    colName +
                    colStock,
                  y - 4,
                  marginLeft +
                    colCode +
                    colName +
                    colStock,
                  y - 4 + h
                );

                doc.text(
                  code,
                  marginLeft + 2,
                  y + 1
                );

                let ny = y + 1;

                allNameLines.forEach(line => {

                  doc.text(
                    line,
                    marginLeft + colCode + 2,
                    ny
                  );

                  ny += 4.2;

                });

                doc.text(
                  stock,
                  marginLeft +
                    colCode +
                    colName +
                    colStock / 2,
                  y + 1,
                  {align:'center'}
                );

                doc.setFont('helvetica','bold');

                doc.text(
                  order,
                  marginLeft +
                    colCode +
                    colName +
                    colStock +
                    colOrder / 2,
                  y + 1,
                  {align:'center'}
                );

                doc.setFont('helvetica','normal');

                y += h;

              }

              // ====================================================
              // TÍTULO
              // ====================================================

              doc.setFont('helvetica','bold');

              doc.setFontSize(16);

              doc.text(
                'PEDIDO DE COMPRAS',
                marginLeft,
                y
              );

              y += 6;

              doc.setFont('helvetica','normal');

              doc.setFontSize(8);

              doc.text(
                new Date().toLocaleString('pt-BR'),
                marginLeft,
                y
              );

              y += 7;

              // ====================================================
              // AGRUPAMENTO POR CATEGORIA
              // ====================================================

              const groups = groupRows(rows);

              Object.entries(groups).forEach(
                ([cat, items]) => {

                  drawCategory(cat);

                  items.forEach(x => {

                    drawItem(x);

                  });

                  y += 4;

                }
              );

              // ====================================================
              // OBSERVAÇÃO GERAL
              // ====================================================

              if(generalObservation){

                if(y + 25 > pageHeight - 15){

                  doc.addPage();

                  y = 15;

                }

                doc.setFont('helvetica','bold');

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL',
                  marginLeft,
                  y
                );

                y += 5;

                doc.setFont('helvetica','normal');

                const obsLines =
                  doc.splitTextToSize(
                    String(generalObservation),
                    tableWidth
                  );

                obsLines.forEach(line => {

                  if(y + 5 > pageHeight - 15){

                    doc.addPage();

                    y = 15;

                  }

                  doc.text(
                    line,
                    marginLeft,
                    y
                  );

                  y += 4.5;

                });

              }

              // ====================================================
              // RODAPÉ / PÁGINAÇÃO
              // ====================================================

              drawFooter();

              // ====================================================
              // ANDROID
              // ====================================================

              if(
                window.AndroidFileBridge &&
                window.AndroidFileBridge.sharePdf
              ){

                const b64 =
                  doc.output('datauristring')
                    .split(',')[1];

                window.AndroidFileBridge.sharePdf(
                  'pedido-acougue.pdf',
                  b64
                );

                saveHistory(rows);

                clearPedido();

                return;

              }

              // ====================================================
              // NAVEGADOR / WHATSAPP
              // ====================================================

              const blob = doc.output('blob');

              const filename =
                'pedido-acougue-' +
                new Date()
                  .toISOString()
                  .slice(0,10) +
                '.pdf';

              if(
                sendViaWhatsApp &&
                navigator.share &&
                typeof File !== 'undefined'
              ){

                const file = new File(
                  [blob],
                  filename,
                  {
                    type:'application/pdf'
                  }
                );

                if(
                  !navigator.canShare ||
                  navigator.canShare({
                    files:[file]
                  })
                ){

                  try{

                    await navigator.share({
                      files:[file],
                      text:'Pedido do açougue'
                    });

                    saveHistory(rows);

                    clearPedido();

                    return;

                  }catch(e){

                    if(
                      e &&
                      e.name === 'AbortError'
                    ){

                      return;

                    }

                  }

                }

              }

              // ====================================================
              // DOWNLOAD NORMAL
              // ====================================================

              const url =
                URL.createObjectURL(blob);

              const a =
                document.createElement('a');

              a.href = url;

              a.download = filename;

              document.body.appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                () => URL.revokeObjectURL(url),
                3000
              );

              alert(
                'PDF gerado. Se o compartilhamento do WhatsApp não abrir automaticamente, abra o WhatsApp e anexe o PDF baixado.'
              );

              if(!sendViaWhatsApp){

                saveHistory(rows);

                clearPedido();

              }

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: ' +
                (e.message || e)
              );

            }

          }'''

          novo_texto = (
              text[:inicio]
              + novo_open_pdf
              + "\n"
              + text[fim:]
          )

          html.write_text(
              novo_texto,
              encoding="utf-8"
          )

          print("Relatório PDF substituído.")
          print("Nenhuma outra função JavaScript foi alterada.")
          PY

      # ============================================================
      # 8. VERIFICAÇÃO ANTES DA COMPILAÇÃO
      # ============================================================
      - name: Verificar código antes do APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          test -f "gradle.properties"

          grep -Fq "android.useAndroidX=true" gradle.properties
          grep -Fq "android.enableJetifier=true" gradle.properties

          grep -Fq "orientation:'portrait'" \
            app/src/main/assets/app/index.html

          grep -Fq "format:'a4'" \
            app/src/main/assets/app/index.html

          grep -Fq "CÓDIGO" \
            app/src/main/assets/app/index.html

          grep -Fq "NOME DO PRODUTO" \
            app/src/main/assets/app/index.html

          grep -Fq "ESTOQUE" \
            app/src/main/assets/app/index.html

          grep -Fq "PEDIDO" \
            app/src/main/assets/app/index.html

          grep -Fq "Página ' + page + ' de ' + total" \
            app/src/main/assets/app/index.html

          grep -Fq "AndroidFileBridge.sharePdf" \
            app/src/main/assets/app/index.html

          grep -Fq "saveHistory(rows)" \
            app/src/main/assets/app/index.html

          grep -Fq "clearPedido()" \
            app/src/main/assets/app/index.html

          # Verificar que funções importantes da versão 9
          # continuam presentes.
          grep -Fq "function repeatLastOrder" \
            app/src/main/assets/app/index.html

          grep -Fq "function openAdmin" \
            app/src/main/assets/app/index.html

          grep -Fq "function saveFeatures" \
            app/src/main/assets/app/index.html

          grep -Fq "function loadFeatures" \
            app/src/main/assets/app/index.html

          echo "========================================"
          echo "VERIFICAÇÃO CONCLUÍDA"
          echo "========================================"
          echo "AndroidX: OK"
          echo "PDF A4 vertical: OK"
          echo "Tabela: OK"
          echo "Paginação: OK"
          echo "AndroidFileBridge: OK"
          echo "Histórico: OK"
          echo "Limpeza: OK"
          echo "Repetir pedido: OK"
          echo "ADM: OK"
          echo "Recursos da versão 9 preservados: OK"

      # ============================================================
      # 9. GERAR APK
      # ============================================================
      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      # ============================================================
      # 10. LOCALIZAR APK
      # ============================================================
      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/Super-Pedido-Pro.apk"

      # ============================================================
      # 11. PUBLICAR APK
      # ============================================================
      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: apk-final/Super-Pedido-Pro.apk
          if-no-files-found: error
          retention-days: 30
