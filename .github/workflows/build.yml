name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          rm -rf projeto
          test -f "Super-Pedido-Pro.zip"
          mkdir -p projeto
          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e
          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" -name settings.gradle -type f -print -quit | xargs -r dirname)
          test -n "$ANDROID_DIR"
          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"
          touch gradle.properties
          grep -q "android.useAndroidX=true" gradle.properties || echo "android.useAndroidX=true" >> gradle.properties
          grep -q "android.enableJetifier=true" gradle.properties || echo "android.enableJetifier=true" >> gradle.properties

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          HTML_DIR="$ANDROID_DIR/app/src/main/assets/app"
          mkdir -p "$HTML_DIR"

          curl -L --fail --silent --show-error \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" \
            -o "$HTML_DIR/xlsx.full.min.js"

          curl -L --fail --silent --show-error \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" \
            -o "$HTML_DIR/jspdf.umd.min.js"

          test -s "$HTML_DIR/xlsx.full.min.js"
          test -s "$HTML_DIR/jspdf.umd.min.js"

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado")

          text = html.read_text(encoding="utf-8")

          # =========================================================
          # BIBLIOTECAS LOCAIS
          # =========================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # =========================================================
          # LIMPAR PEDIDO APÓS ENVIO
          # =========================================================

          new_clear = '''function clearPedido(){
            Object.keys(vals).forEach(k=>delete vals[k]);
            extras=[];
            validadeCurta=[];
            finalizedRows=[];
            generalObservation='';
            const obs=document.getElementById('generalObs');
            if(obs) obs.value='';
            save();
            render();
            updateBadge();
            closeConference();
          }'''

          text, n = re.subn(
              r"function clearPedido\(\)\{.*?\n\}",
              new_clear,
              text,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  "ERRO: não foi possível corrigir clearPedido"
              )

          # =========================================================
          # SELECIONAR PRIMEIRA CATEGORIA
          # =========================================================

          old_start = (
              "load();loadFeatures();APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive){"
              "APP_DATA=DATA;cats=Object.keys(DATA)}"
              "tabs();render();updateBadge();renderValidadeCurta();"
          )

          new_start = (
              "load();loadFeatures();APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive){"
              "APP_DATA=DATA;cats=Object.keys(DATA)}"
              "if(!current || !APP_DATA[current])current=cats[0]||'';"
              "tabs();render();updateBadge();renderValidadeCurta();"
          )

          if old_start in text:
              text = text.replace(old_start,new_start,1)

          # =========================================================
          # REMOVER OPENPDF ANTIGO
          # =========================================================

          text = re.sub(
              r"async\s+function\s+openPDF\s*\([^)]*\)\s*\{.*?\n\}",
              "",
              text,
              flags=re.S
          )

          text = re.sub(
              r"function\s+openPDF\s*\([^)]*\)\s*\{.*?\n\}",
              "",
              text,
              flags=re.S
          )

          # =========================================================
          # NOVO PDF
          # =========================================================

          new_pdf = r'''
          async function openPDF(){

            const rows = finalizedRows.length
              ? finalizedRows
              : getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              if(
                typeof window.jspdf === 'undefined' ||
                !window.jspdf.jsPDF
              ){
                alert('Biblioteca PDF não carregada.');
                return;
              }

              const jsPDF = window.jspdf.jsPDF;

              const doc = new jsPDF({
                orientation:'landscape',
                unit:'mm',
                format:'a4'
              });

              const pageWidth = 297;
              const pageHeight = 210;
              const margem = 10;

              let y = 12;

              const agora = new Date();

              const data = agora.toLocaleDateString(
                'pt-BR',
                {
                  day:'2-digit',
                  month:'2-digit',
                  year:'numeric'
                }
              );

              function titulo(){

                doc.setFont('helvetica','bold');
                doc.setFontSize(18);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {align:'center'}
                );

                y += 8;

                doc.setFont('helvetica','normal');
                doc.setFontSize(10);

                doc.text(
                  'Data: '+data,
                  margem,
                  y
                );

                y += 7;
              }

              titulo();

              const grupos = groupRows(rows);

              /*
               * COLUNAS FIXAS
               *
               * CÓDIGO          30 mm
               * NOME PRODUTO   167 mm
               * ESTOQUE         35 mm
               * PEDIDO          35 mm
               */

              const colCodigo = 30;
              const colProduto = 167;
              const colEstoque = 35;
              const colPedido = 35;

              const xCodigo = margem;
              const xProduto = xCodigo + colCodigo;
              const xEstoque = xProduto + colProduto;
              const xPedido = xEstoque + colEstoque;

              const tabelaLargura =
                colCodigo +
                colProduto +
                colEstoque +
                colPedido;

              const alturaCabecalho = 8;
              const alturaLinha = 7;

              function novaPagina(){

                doc.addPage();

                y = 12;

                doc.setFont('helvetica','bold');
                doc.setFontSize(16);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {align:'center'}
                );

                y += 8;

                doc.setFont('helvetica','normal');
                doc.setFontSize(9);

                doc.text(
                  'Data: '+data,
                  margem,
                  y
                );

                y += 7;
              }

              function cabecalho(){

                if(
                  y+alturaCabecalho >
                  pageHeight-10
                ){
                  novaPagina();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaCabecalho
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaCabecalho
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaCabecalho
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaCabecalho
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo+colCodigo/2,
                  y+5.2,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto+3,
                  y+5.2
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque+colEstoque/2,
                  y+5.2,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  xPedido+colPedido/2,
                  y+5.2,
                  {align:'center'}
                );

                y += alturaCabecalho;
              }

              function nomeProduto(nome){

                const original =
                  String(nome || '');

                let valor = original;

                while(
                  doc.getTextWidth(valor) >
                  colProduto-6 &&
                  valor.length > 3
                ){
                  valor =
                    valor.substring(
                      0,
                      valor.length-1
                    );
                }

                if(valor !== original){

                  valor =
                    valor.substring(
                      0,
                      Math.max(
                        1,
                        valor.length-3
                      )
                    )+'...';
                }

                return valor;
              }

              function linha(item){

                if(
                  y+alturaLinha >
                  pageHeight-10
                ){

                  novaPagina();

                  cabecalho();
                }

                doc.setFont('helvetica','normal');
                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaLinha
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaLinha
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaLinha
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaLinha
                );

                doc.text(
                  String(item.code || '-'),
                  xCodigo+3,
                  y+4.8
                );

                doc.text(
                  nomeProduto(item.name),
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  String(item.stock ?? 0),
                  xEstoque+colEstoque/2,
                  y+4.8,
                  {align:'center'}
                );

                doc.text(
                  String(item.order ?? 0),
                  xPedido+colPedido/2,
                  y+4.8,
                  {align:'center'}
                );

                y += alturaLinha;
              }

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y+25 >
                  pageHeight-10
                ){
                  novaPagina();
                }

                y += 5;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(12);

                doc.text(
                  String(
                    categoria || ''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y += 4;

                cabecalho();

                for(
                  const item of items
                ){
                  linha(item);
                }
              }

              /*
               * OBSERVAÇÃO GERAL
               */

              if(
                typeof generalObservation !==
                'undefined' &&
                generalObservation
              ){

                if(
                  y+20 >
                  pageHeight-10
                ){
                  novaPagina();
                }

                y += 7;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y += 5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const obsLines =
                  doc.splitTextToSize(
                    String(generalObservation),
                    tabelaLargura
                  );

                doc.text(
                  obsLines,
                  margem,
                  y
                );
              }

              /*
               * RODAPÉ
               */

              const totalPaginas =
                doc.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=totalPaginas;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+
                  pagina+
                  ' de '+
                  totalPaginas,
                  pageWidth-margem,
                  pageHeight-5,
                  {align:'right'}
                );
              }

              /*
               * BASE64 DO PDF
               */

              const base64 =
                doc.output(
                  'datauristring'
                ).split(',')[1];

              const nome =
                'relatorio-pedido-' +
                data.replace(/\//g,'-') +
                '.pdf';

              /*
               * ANDROID
               */

              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf ===
                'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nome,
                  base64
                );

                return;
              }

              /*
               * NAVEGADOR
               */

              doc.save(nome);

            }catch(error){

              console.error(
                'Erro ao gerar PDF:',
                error
              );

              alert(
                'Não foi possível gerar o PDF: '+
                error.message
              );
            }
          }
          '''

          # =========================================================
          # INSERIR OPENPDF
          # =========================================================

          pos = text.find("function clearPedido()")

          if(pos == -1):
              pos = text.find("function sendWhatsApp()")

          if(pos == -1):
              raise SystemExit(
                  "ERRO: local para inserir openPDF não encontrado"
              )

          text = (
              text[:pos]
              + new_pdf
              + "\n\n"
              + text[pos:]
          )

          # =========================================================
          # GARANTIR CHAMADA CORRETA
          # =========================================================

          text = text.replace(
              "openPDF(true)",
              "openPDF()"
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("HTML corrigido com sucesso.")

          PY

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          test -f app/src/main/assets/app/index.html
          test -f app/src/main/assets/app/xlsx.full.min.js
          test -f app/src/main/assets/app/jspdf.umd.min.js

          echo "Arquivos conferidos."

      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Super-Pedido-Pro.apk"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro
          path: Super-Pedido-Pro.apk
          if-no-files-found: error
