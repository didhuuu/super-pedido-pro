name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo - PDF retrato e limpeza real
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          main = next(
              (root / "app/src/main/java").rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          if main is None:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # BIBLIOTECAS LOCAIS
          # ==========================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ==========================================================
          # LIMPEZA REAL DO PEDIDO
          #
          # Mantém:
          # - cadastro de produtos
          # - catálogo
          # - favoritos
          # - histórico
          # - último pedido
          #
          # Apaga somente:
          # - estoque
          # - quantidades do pedido
          # - adicionais
          # - validade curta
          # - observação geral
          # ==========================================================

          new_clear = r'''function clearPedido(historyRows=null){
            try{
              const historico =
                Array.isArray(historyRows) && historyRows.length
                  ? historyRows
                  : finalizedRows;

              if(historico.length){
                saveHistory(historico);
              }
            }catch(e){}

            vals={};
            extras=[];
            validadeCurta=[];
            finalizedRows=[];
            generalObservation='';

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            localStorage.removeItem(
              'sp_general_obs'
            );

            const obs =
              document.getElementById('generalObs');

            if(obs){
              obs.value='';
            }

            render();

            if(
              typeof renderValidadeCurta ===
              'function'
            ){
              renderValidadeCurta();
            }

            updateBadge();

            closeConference();

            document
              .querySelectorAll('input.qty')
              .forEach(el=>{
                el.value='0';
              });
          }'''

          text, n = re.subn(
              r"function clearPedido\(\)\{.*?\}",
              new_clear,
              text,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrado"
              )

          # ==========================================================
          # NOVO PDF
          #
          # A4 RETRATO
          # 210 x 297 mm
          #
          # NÃO usa landscape.
          # ==========================================================

          pdf_function = r'''async function openPDF(sendViaWhatsApp=false){
            const rows =
              finalizedRows.length
                ? finalizedRows
                : getRows();

            if(!rows.length){
              alert(
                'Nenhum item foi selecionado.'
              );
              return;
            }

            try{

              const {jsPDF} =
                window.jspdf || {};

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              // ====================================================
              // A4 RETRATO
              // ====================================================

              const doc = new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;

              const margem=10;

              const largura=190;

              const colCodigo=27;
              const colProduto=108;
              const colEstoque=27;
              const colPedido=28;

              let y=14;

              const data =
                new Date().toLocaleDateString(
                  'pt-BR',
                  {
                    day:'2-digit',
                    month:'2-digit',
                    year:'numeric'
                  }
                );

              // ====================================================
              // TÍTULO
              // ====================================================

              function titulo(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(16);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {
                    align:'center'
                  }
                );

                y+=8;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(9);

                doc.text(
                  'Data: '+data,
                  margem,
                  y
                );

                y+=8;
              }

              // ====================================================
              // CABEÇALHO DA TABELA
              // ====================================================

              function cabecalho(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(7.5);

                const h=7;

                doc.rect(
                  margem,
                  y,
                  largura,
                  h
                );

                doc.line(
                  margem+colCodigo,
                  y,
                  margem+colCodigo,
                  y+h
                );

                doc.line(
                  margem+
                    colCodigo+
                    colProduto,
                  y,
                  margem+
                    colCodigo+
                    colProduto,
                  y+h
                );

                doc.line(
                  margem+
                    colCodigo+
                    colProduto+
                    colEstoque,
                  y,
                  margem+
                    colCodigo+
                    colProduto+
                    colEstoque,
                  y+h
                );

                doc.text(
                  'CÓDIGO',
                  margem+2,
                  y+4.8
                );

                doc.text(
                  'NOME DO PRODUTO',
                  margem+
                    colCodigo+
                    2,
                  y+4.8
                );

                doc.text(
                  'ESTOQUE',
                  margem+
                    colCodigo+
                    colProduto+
                    2,
                  y+4.8
                );

                doc.text(
                  'PEDIDO',
                  margem+
                    colCodigo+
                    colProduto+
                    colEstoque+
                    2,
                  y+4.8
                );

                y+=h;
              }

              // ====================================================
              // NOME DO PRODUTO
              // ====================================================

              function nomeProduto(nome){

                let valor =
                  String(nome || '');

                doc.setFontSize(7.2);

                while(
                  valor.length>3 &&
                  doc.getTextWidth(
                    valor+'...'
                  ) >
                  colProduto-4
                ){
                  valor =
                    valor.slice(
                      0,
                      -1
                    );
                }

                if(
                  valor !==
                  String(nome || '')
                ){
                  return valor+'...';
                }

                return valor;
              }

              // ====================================================
              // NOVA PÁGINA
              // ====================================================

              function novaPagina(){

                doc.addPage(
                  'a4',
                  'portrait'
                );

                y=14;

                titulo();
              }

              // ====================================================
              // INÍCIO
              // ====================================================

              titulo();

              const grupos =
                groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(y+20>285){
                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(10);

                doc.text(
                  String(
                    categoria || ''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y+=5;

                cabecalho();

                for(const item of items){

                  if(y+6>285){

                    novaPagina();

                    doc.setFont(
                      'helvetica',
                      'bold'
                    );

                    doc.setFontSize(10);

                    doc.text(
                      String(
                        categoria || ''
                      ).toUpperCase(),
                      margem,
                      y
                    );

                    y+=5;

                    cabecalho();
                  }

                  const h=6;

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(7.2);

                  // ----------------------------------------------
                  // LINHA
                  // ----------------------------------------------

                  doc.rect(
                    margem,
                    y,
                    largura,
                    h
                  );

                  doc.line(
                    margem+colCodigo,
                    y,
                    margem+colCodigo,
                    y+h
                  );

                  doc.line(
                    margem+
                      colCodigo+
                      colProduto,
                    y,
                    margem+
                      colCodigo+
                      colProduto,
                    y+h
                  );

                  doc.line(
                    margem+
                      colCodigo+
                      colProduto+
                      colEstoque,
                    y,
                    margem+
                      colCodigo+
                      colProduto+
                      colEstoque,
                    y+h
                  );

                  // ----------------------------------------------
                  // CÓDIGO
                  // ----------------------------------------------

                  doc.text(
                    String(
                      item.code || '-'
                    ),
                    margem+2,
                    y+4
                  );

                  // ----------------------------------------------
                  // PRODUTO
                  // ----------------------------------------------

                  doc.text(
                    nomeProduto(
                      item.name
                    ),
                    margem+
                      colCodigo+
                      2,
                    y+4
                  );

                  // ----------------------------------------------
                  // ESTOQUE
                  // ----------------------------------------------

                  doc.text(
                    String(
                      item.stock ?? 0
                    ),
                    margem+
                      colCodigo+
                      colProduto+
                      2,
                    y+4
                  );

                  // ----------------------------------------------
                  // PEDIDO
                  // ----------------------------------------------

                  doc.text(
                    String(
                      item.order ?? 0
                    ),
                    margem+
                      colCodigo+
                      colProduto+
                      colEstoque+
                      2,
                    y+4
                  );

                  y+=h;
                }

                y+=5;
              }

              // ====================================================
              // OBSERVAÇÃO GERAL
              // ====================================================

              if(generalObservation){

                if(y+20>285){
                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                const linhas =
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    largura
                  );

                doc.text(
                  linhas,
                  margem,
                  y
                );
              }

              // ====================================================
              // RODAPÉ
              // ====================================================

              const total =
                doc.internal
                  .getNumberOfPages();

              for(
                let pagina=1;
                pagina<=total;
                pagina++
              ){

                doc.setPage(
                  pagina
                );

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+
                    pagina+
                    ' de '+
                    total,
                  pageWidth-margem,
                  pageHeight-5,
                  {
                    align:'right'
                  }
                );
              }

              // ====================================================
              // CONVERTER PDF PARA BASE64
              // ====================================================

              const base64 =
                doc
                  .output(
                    'datauristring'
                  )
                  .split(',')[1];

              const nomeArquivo =
                'relatorio-pedido-' +
                data.replace(
                  /\//g,
                  '-'
                ) +
                '.pdf';

              // ====================================================
              // PRIMEIRO LIMPA O PEDIDO
              // DEPOIS ENVIA O PDF
              //
              // clearPedido(rows) também salva
              // o histórico somente uma vez.
              // ====================================================

              clearPedido(rows);

              // ====================================================
              // ANDROID
              // ====================================================

              if(
                window.AndroidFileBridge &&
                typeof
                  window.AndroidFileBridge
                    .sharePdf ===
                    'function'
              ){

                window.AndroidFileBridge
                  .sharePdf(
                    nomeArquivo,
                    base64
                  );

                return;
              }

              // ====================================================
              // FALLBACK NAVEGADOR
              // ====================================================

              const byteChars =
                atob(base64);

              const bytes =
                new Uint8Array(
                  byteChars.length
                );

              for(
                let i=0;
                i<byteChars.length;
                i++
              ){
                bytes[i] =
                  byteChars.charCodeAt(i);
              }

              const blob =
                new Blob(
                  [bytes],
                  {
                    type:
                      'application/pdf'
                  }
                );

              const url =
                URL.createObjectURL(
                  blob
                );

              const a =
                document.createElement(
                  'a'
                );

              a.href=url;

              a.download =
                nomeArquivo;

              document.body.appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                ()=>{
                  URL.revokeObjectURL(
                    url
                  );
                },
                1000
              );

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message || e)
              );
            }
          }'''

          # ==========================================================
          # SUBSTITUIR openPDF
          # ==========================================================

          start =
            text.find(
              "async function openPDF"
            )

          if start < 0:
              raise SystemExit(
                  "ERRO: openPDF não encontrado"
              )

          end =
            text.find(
              "function clearPedido",
              start
            )

          if end < 0:
              raise SystemExit(
                  "ERRO: início de clearPedido não encontrado"
              )

          text = (
              text[:start]
              + pdf_function
              + "\n"
              + text[end:]
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "HTML corrigido com sucesso."
          )

          print(
              "PDF: A4 retrato."
          )

          print(
              "Limpeza: estoque e pedido zerados."
          )

          print(
              "Histórico: preservado."
          )

          # ==========================================================
          # MAIN ACTIVITY
          #
          # NÃO ALTERAR.
          #
          # A versão 9 já possui a estrutura Android necessária.
          # ==========================================================

          java = main.read_text(
              encoding="utf-8"
          )

          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "MainActivity preservada."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas locais OK."

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          # PDF retrato
          grep -q "orientation:'portrait'" "$HTML"

          grep -q "format:'a4'" "$HTML"

          grep -q "pageWidth=210" "$HTML"

          grep -q "pageHeight=297" "$HTML"

          # Limpeza
          grep -q "clearPedido" "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_vals')" \
            "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_extras')" \
            "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_validade_curta')" \
            "$HTML"

          # Android PDF
          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          # Título
          grep -q \
            "RELATÓRIO DE PEDIDO" \
            "$HTML"

          # Garantir que não existe PDF paisagem
          if grep -q \
            "orientation:'landscape'" \
            "$HTML"; then

            echo "ERRO: PDF ainda contém landscape."

            exit 1
          fi

          if grep -q \
            "orientation: 'landscape'" \
            "$HTML"; then

            echo "ERRO: PDF ainda contém landscape."

            exit 1
          fi

          echo "======================================"

          echo "VERIFICAÇÃO OK"

          echo "PDF: A4 RETRATO"

          echo "Tamanho: 210 x 297 mm"

          echo "Limpeza do pedido: OK"

          echo "Histórico: OK"

          echo "WhatsApp/PDF Android: OK"

          echo "======================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "======================================"

          echo "APK GERADO COM SUCESSO"

          ls -lh "$APK"

          echo "======================================"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
