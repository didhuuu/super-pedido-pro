name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair versão #9
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto da versão #9 encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Alterar SOMENTE o relatório PDF
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 <<'PY'
          import base64
          import os
          from pathlib import Path

          html = Path(
              os.environ["ANDROID_DIR"]
          ) / "app/src/main/assets/app/index.html"

          text = html.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # ESTA É A ÚNICA ALTERAÇÃO FEITA NA VERSÃO #9:
          # SUBSTITUIR SOMENTE openPDF()
          # ============================================================

          pdf_b64 = """
           bENvZGlnbyx5LG1hcmdlbStjb2xDb2RpZ28seSsoaCkpOwogICAgfQoKICAgIH0K
          """

          # O conteúdo acima é apenas um marcador seguro.
          # A substituição real é feita abaixo diretamente.
          # ============================================================

          start = text.find(
              "async function openPDF"
          )

          if start == -1:
              raise SystemExit(
                  "ERRO: openPDF da versão #9 não foi encontrada."
              )

          # Procura a próxima função depois de openPDF.
          pos = start

          depth = 0
          started = False
          end = -1

          while pos < len(text):

              if text.startswith("function ", pos):
                  if started and depth == 0:
                      end = pos
                      break

              if text.startswith("{", pos):
                  depth += 1
                  started = True

              elif text.startswith("}", pos):
                  if started:
                      depth -= 1

                      if depth == 0:
                          end = pos + 1
                          break

              pos += 1

          if end == -1:
              raise SystemExit(
                  "ERRO: não foi possível localizar o final de openPDF."
              )

          new_pdf = r"""
async function openPDF(sendViaWhatsApp=false){

  const rows =
    finalizedRows.length
      ? finalizedRows
      : getRows();

  if(!rows.length){
    alert('Nenhum item foi selecionado.');
    return;
  }

  try{

    const {jsPDF} = window.jspdf || {};

    if(!jsPDF){
      throw new Error(
        'Biblioteca PDF não carregada.'
      );
    }

    /*
     * ================================================================
     * PDF A4 RETRATO
     * ================================================================
     */

    const doc = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: 'a4'
    });

    const pageWidth = 210;
    const pageHeight = 297;
    const margem = 10;

    const largura = 190;

    /*
     * COLUNAS
     *
     * CÓDIGO       27 mm
     * PRODUTO     108 mm
     * ESTOQUE      27 mm
     * PEDIDO       28 mm
     *
     * Total       190 mm
     */

    const colCodigo = 27;
    const colProduto = 108;
    const colEstoque = 27;
    const colPedido = 28;

    let y = 14;

    const data =
      new Date().toLocaleDateString(
        'pt-BR',
        {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric'
        }
      );

    function titulo(){

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(16);

      doc.text(
        'RELATÓRIO DE PEDIDO',
        pageWidth / 2,
        y,
        {
          align: 'center'
        }
      );

      y += 8;

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(9);

      doc.text(
        'Data: ' + data,
        margem,
        y
      );

      y += 8;
    }

    function cabecalho(){

      const h = 7;

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(7.5);

      doc.rect(
        margem,
        y,
        largura,
        h
      );

      doc.line(
        margem + colCodigo,
        y,
        margem + colCodigo,
        y + h
      );

      doc.line(
        margem + colCodigo + colProduto,
        y,
        margem + colCodigo + colProduto,
        y + h
      );

      doc.line(
        margem + colCodigo + colProduto + colEstoque,
        y,
        margem + colCodigo + colProduto + colEstoque,
        y + h
      );

      doc.text(
        'CÓDIGO',
        margem + 2,
        y + 4.8
      );

      doc.text(
        'NOME DO PRODUTO',
        margem + colCodigo + 2,
        y + 4.8
      );

      doc.text(
        'ESTOQUE',
        margem + colCodigo + colProduto + 2,
        y + 4.8
      );

      doc.text(
        'PEDIDO',
        margem + colCodigo + colProduto + colEstoque + 2,
        y + 4.8
      );

      y += h;
    }

    function nomeProduto(nome){

      let valor =
        String(nome || '');

      doc.setFontSize(7.2);

      while(
        valor.length > 3 &&
        doc.getTextWidth(
          valor + '...'
        ) >
        colProduto - 4
      ){

        valor =
          valor.slice(
            0,
            -1
          );
      }

      if(
        valor !==
        String(nome || '')
      ){

        return valor + '...';
      }

      return valor;
    }

    function novaPagina(){

      doc.addPage(
        'a4',
        'portrait'
      );

      y = 14;

      titulo();
    }

    titulo();

    const grupos =
      groupRows(rows);

    for(
      const [categoria, items]
      of Object.entries(grupos)
    ){

      if(y + 20 > 285){
        novaPagina();
      }

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(10);

      doc.text(
        String(
          categoria || ''
        ).toUpperCase(),
        margem,
        y
      );

      y += 5;

      cabecalho();

      for(
        const item of items
      ){

        if(y + 6 > 285){

          novaPagina();

          doc.setFont(
            'helvetica',
            'bold'
          );

          doc.setFontSize(10);

          doc.text(
            String(
              categoria || ''
            ).toUpperCase(),
            margem,
            y
          );

          y += 5;

          cabecalho();
        }

        const h = 6;

        doc.setFont(
          'helvetica',
          'normal'
        );

        doc.setFontSize(7.2);

        doc.rect(
          margem,
          y,
          largura,
          h
        );

        doc.line(
          margem + colCodigo,
          y,
          margem + colCodigo,
          y + h
        );

        doc.line(
          margem + colCodigo + colProduto,
          y,
          margem + colCodigo + colProduto,
          y + h
        );

        doc.line(
          margem + colCodigo + colProduto + colEstoque,
          y,
          margem + colCodigo + colProduto + colEstoque,
          y + h
        );

        doc.text(
          String(
            item.code || '-'
          ),
          margem + 2,
          y + 4
        );

        doc.text(
          nomeProduto(item.name),
          margem + colCodigo + 2,
          y + 4
        );

        doc.text(
          String(
            item.stock == null
              ? 0
              : item.stock
          ),
          margem + colCodigo + colProduto + 2,
          y + 4
        );

        doc.text(
          String(
            item.order == null
              ? 0
              : item.order
          ),
          margem + colCodigo + colProduto + colEstoque + 2,
          y + 4
        );

        y += h;
      }

      y += 5;
    }

    /*
     * OBSERVAÇÃO
     */

    if(generalObservation){

      if(y + 20 > 285){
        novaPagina();
      }

      doc.setFont(
        'helvetica',
        'bold'
      );

      doc.setFontSize(8);

      doc.text(
        'OBSERVAÇÃO GERAL:',
        margem,
        y
      );

      y += 5;

      doc.setFont(
        'helvetica',
        'normal'
      );

      const linhas =
        doc.splitTextToSize(
          String(
            generalObservation
          ),
          largura
        );

      doc.text(
        linhas,
        margem,
        y
      );
    }

    /*
     * RODAPÉ
     */

    const total =
      doc.internal.getNumberOfPages();

    for(
      let pagina = 1;
      pagina <= total;
      pagina++
    ){

      doc.setPage(
        pagina
      );

      doc.setFont(
        'helvetica',
        'normal'
      );

      doc.setFontSize(7);

      doc.text(
        'Super Pedido Pro',
        margem,
        pageHeight - 5
      );

      doc.text(
        'Página ' +
        pagina +
        ' de ' +
        total,
        pageWidth - margem,
        pageHeight - 5,
        {
          align: 'right'
        }
      );
    }

    /*
     * GERA O PDF
     */

    const base64 =
      doc
        .output(
          'datauristring'
        )
        .split(',')[1];

    const nomeArquivo =
      'relatorio-pedido-' +
      data.replace(/\//g, '-') +
      '.pdf';

    /*
     * NÃO altera nenhuma outra função do aplicativo.
     */

    if(
      window.AndroidFileBridge &&
      typeof window.AndroidFileBridge.sharePdf ===
        'function'
    ){

      window.AndroidFileBridge.sharePdf(
        nomeArquivo,
        base64
      );

      return;
    }

    /*
     * Navegador
     */

    const byteChars =
      atob(base64);

    const bytes =
      new Uint8Array(
        byteChars.length
      );

    for(
      let i = 0;
      i < byteChars.length;
      i++
    ){

      bytes[i] =
        byteChars.charCodeAt(i);
    }

    const blob =
      new Blob(
        [bytes],
        {
          type: 'application/pdf'
        }
      );

    const url =
      URL.createObjectURL(
        blob
      );

    const a =
      document.createElement(
        'a'
      );

    a.href = url;

    a.download =
      nomeArquivo;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(
      () => URL.revokeObjectURL(url),
      1000
    );

  }catch(e){

    console.error(
      'openPDF:',
      e
    );

    alert(
      'Não foi possível gerar o PDF: ' +
      (e.message || e)
    );
  }
}
"""

    text = (
        text[:start]
        + new_pdf
        + "\n"
        + text[end:]
    )

    html.write_text(
        text,
        encoding="utf-8"
    )

    print(
        "OK: somente openPDF foi alterado."
    )

          PY

      - name: Preparar biblioteca PDF
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar que somente o relatório foi alterado
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q "orientation:'portrait'" "$HTML"
          grep -q "format:'a4'" "$HTML"
          grep -q "pageWidth = 210" "$HTML"
          grep -q "pageHeight = 297" "$HTML"
          grep -q "RELATÓRIO DE PEDIDO" "$HTML"
          grep -q "CÓDIGO" "$HTML"
          grep -q "NOME DO PRODUTO" "$HTML"
          grep -q "ESTOQUE" "$HTML"
          grep -q "PEDIDO" "$HTML"

          echo "RELATÓRIO PDF A4 RETRATO OK."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK encontrado:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
