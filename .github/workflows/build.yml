name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar exatamente a versão 9
        uses: actions/checkout@v4
        with:
          ref: 69bd377f51e567832edd60769ba312e3d7f39156

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto da versão 9
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Alterar SOMENTE o relatório PDF
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])
          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: app/src/main/assets/app/index.html não encontrado."
              )

          text = html.read_text(encoding="utf-8")

          inicio = text.find("async function openPDF")
          fim = text.find("function sendWhatsApp", inicio)

          if inicio < 0:
              raise SystemExit(
                  "ERRO: função openPDF da versão 9 não encontrada."
              )

          if fim < 0:
              raise SystemExit(
                  "ERRO: função sendWhatsApp não encontrada depois de openPDF."
              )

          novo_open_pdf = r'''async function openPDF(sendViaWhatsApp=false){
            const rows=finalizedRows.length?finalizedRows:getRows();
            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{
              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error('Biblioteca PDF não carregada.');
              }

              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const W=210;
              const H=297;
              const L=10;
              const R=10;
              const usable=W-L-R;
              const footerY=290;

              /*
               * CÓDIGO | NOME DO PRODUTO | ESTOQUE | PEDIDO
               */
              const colCodigo=24;
              const colNome=100;
              const colEstoque=32;
              const colPedido=34;

              const lineH=4.5;
              let y=15;

              const dataAtual=new Date().toLocaleString('pt-BR');

              function cabecalhoPagina(){
                doc.setFont('helvetica','bold');
                doc.setFontSize(15);
                doc.text('PEDIDO DE COMPRAS',L,y);

                y+=6;

                doc.setFont('helvetica','normal');
                doc.setFontSize(8.5);
                doc.text(dataAtual,L,y);

                y+=6;
              }

              function novaPagina(){
                doc.addPage('a4','portrait');
                y=15;
                cabecalhoPagina();
              }

              function verificarEspaco(altura){
                if(y+altura>footerY-2){
                  novaPagina();
                  return true;
                }
                return false;
              }

              function cabecalhoTabela(){
                const altura=8;

                verificarEspaco(altura);

                doc.setFont('helvetica','bold');
                doc.setFontSize(8);

                let x=L;

                doc.rect(x,y,colCodigo,altura);
                doc.text('CÓDIGO',x+2,y+5.2);

                x+=colCodigo;

                doc.rect(x,y,colNome,altura);
                doc.text('NOME DO PRODUTO',x+2,y+5.2);

                x+=colNome;

                doc.rect(x,y,colEstoque,altura);
                doc.text('ESTOQUE',x+2,y+5.2);

                x+=colEstoque;

                doc.rect(x,y,colPedido,altura);
                doc.text('PEDIDO',x+2,y+5.2);

                y+=altura;
              }

              function categoria(nome){
                const altura=7;

                verificarEspaco(altura);

                doc.setFont('helvetica','bold');
                doc.setFontSize(9);

                doc.rect(L,y,usable,altura);

                doc.text(
                  String(nome||'SEM CATEGORIA'),
                  L+2,
                  y+4.8
                );

                y+=altura;

                cabecalhoTabela();
              }

              function produto(item){

                const codigo=String(item.code??'-');
                const nome=String(item.name??'');
                const estoque=String(item.stock??0);
                const pedido=String(item.order??0);

                const nomeLinhas=doc.splitTextToSize(
                  nome,
                  colNome-4
                );

                const altura=Math.max(
                  7,
                  nomeLinhas.length*lineH+5
                );

                if(y+altura>footerY-2){
                  novaPagina();
                  cabecalhoTabela();
                }

                const topo=y;

                let x=L;

                doc.setFont('helvetica','normal');
                doc.setFontSize(8);

                doc.rect(
                  x,
                  topo,
                  colCodigo,
                  altura
                );

                doc.text(
                  codigo,
                  x+2,
                  topo+4.5
                );

                x+=colCodigo;

                doc.rect(
                  x,
                  topo,
                  colNome,
                  altura
                );

                doc.text(
                  nomeLinhas,
                  x+2,
                  topo+4.5,
                  {
                    maxWidth:colNome-4
                  }
                );

                x+=colNome;

                doc.rect(
                  x,
                  topo,
                  colEstoque,
                  altura
                );

                doc.text(
                  estoque,
                  x+colEstoque/2,
                  topo+4.5,
                  {
                    align:'center'
                  }
                );

                x+=colEstoque;

                doc.rect(
                  x,
                  topo,
                  colPedido,
                  altura
                );

                doc.text(
                  pedido,
                  x+colPedido/2,
                  topo+4.5,
                  {
                    align:'center'
                  }
                );

                y+=altura;

                /*
                 * Observação específica do produto.
                 * Continua dentro do relatório sem alterar
                 * os dados do pedido.
                 */
                if(item.obs){

                  const linhasObs=doc.splitTextToSize(
                    'Obs.: '+String(item.obs),
                    colNome-4
                  );

                  const alturaObs=
                    linhasObs.length*3.5+3;

                  if(y+alturaObs>footerY-2){
                    novaPagina();
                    cabecalhoTabela();
                  }

                  doc.setFont('helvetica','italic');
                  doc.setFontSize(7);

                  doc.text(
                    linhasObs,
                    L+colCodigo+2,
                    y+3
                  );

                  y+=alturaObs;
                }

                if(item.validade){

                  const linhasValidade=doc.splitTextToSize(
                    'Validade: '+String(item.validade),
                    colNome-4
                  );

                  const alturaValidade=
                    linhasValidade.length*3.5+3;

                  if(y+alturaValidade>footerY-2){
                    novaPagina();
                    cabecalhoTabela();
                  }

                  doc.setFont('helvetica','italic');
                  doc.setFontSize(7);

                  doc.text(
                    linhasValidade,
                    L+colCodigo+2,
                    y+3
                  );

                  y+=alturaValidade;
                }
              }

              /*
               * INÍCIO DO RELATÓRIO
               */
              cabecalhoPagina();

              const grupos=groupRows(rows);

              for(const [categoriaNome,itens] of Object.entries(grupos)){

                categoria(categoriaNome);

                for(const item of itens){
                  produto(item);
                }

                y+=3;
              }

              /*
               * OBSERVAÇÃO GERAL
               */
              if(generalObservation){

                const linhas=doc.splitTextToSize(
                  'OBSERVAÇÃO GERAL: '+String(generalObservation),
                  usable-4
                );

                const altura=Math.max(
                  10,
                  linhas.length*4+5
                );

                if(y+altura>footerY-2){
                  novaPagina();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(8);

                doc.rect(
                  L,
                  y,
                  usable,
                  altura
                );

                doc.text(
                  linhas,
                  L+2,
                  y+5
                );

                y+=altura;
              }

              /*
               * RODAPÉ E NUMERAÇÃO
               */
              const totalPaginas=doc.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=totalPaginas;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont('helvetica','normal');
                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  L,
                  footerY
                );

                doc.text(
                  'Página '+pagina+' de '+totalPaginas,
                  W-R,
                  footerY,
                  {
                    align:'right'
                  }
                );
              }

              /*
               * Geração do arquivo
               */
              const blob=doc.output('blob');

              const filename=
                'pedido-acougue-'+
                new Date().toISOString().slice(0,10)+
                '.pdf';

              const b64=
                doc.output('datauristring')
                  .split(',')[1];

              /*
               * ANDROID
               *
               * Mantém exatamente o comportamento
               * de salvar histórico e limpar o pedido.
               */
              if(
                window.AndroidFileBridge &&
                window.AndroidFileBridge.sharePdf
              ){

                window.AndroidFileBridge.sharePdf(
                  filename,
                  b64
                );

                saveHistory(rows);
                clearPedido();

                return;
              }

              /*
               * COMPARTILHAMENTO PELO NAVEGADOR
               */
              if(
                sendViaWhatsApp &&
                navigator.share &&
                typeof File!=='undefined'
              ){

                const file=new File(
                  [blob],
                  filename,
                  {
                    type:'application/pdf'
                  }
                );

                if(
                  !navigator.canShare ||
                  navigator.canShare({
                    files:[file]
                  })
                ){

                  try{

                    await navigator.share({
                      files:[file],
                      text:'Pedido do açougue'
                    });

                    saveHistory(rows);
                    clearPedido();

                    return;

                  }catch(e){

                    if(
                      e &&
                      e.name==='AbortError'
                    ){
                      return;
                    }
                  }
                }
              }

              /*
               * DOWNLOAD NORMAL
               */
              const url=
                URL.createObjectURL(blob);

              const a=
                document.createElement('a');

              a.href=url;
              a.download=filename;

              document.body.appendChild(a);
              a.click();
              a.remove();

              setTimeout(
                ()=>URL.revokeObjectURL(url),
                3000
              );

              alert(
                'PDF gerado. Se o compartilhamento do WhatsApp não abrir automaticamente, abra o WhatsApp e anexe o PDF baixado.'
              );

              if(!sendViaWhatsApp){
                saveHistory(rows);
                clearPedido();
              }

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message||e)
              );
            }
          }'''

          novo_texto = (
              text[:inicio]
              + novo_open_pdf
              + "\n"
              + text[fim:]
          )

          html.write_text(
              novo_texto,
              encoding="utf-8"
          )

          print("OK: somente openPDF() foi substituída.")
          print("Bytes antes:", len(text.encode("utf-8")))
          print("Bytes depois:", len(novo_texto.encode("utf-8")))
          PY

      - name: Verificar JavaScript antes do build
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root=Path(os.environ["ANDROID_DIR"])
          html=root/"app/src/main/assets/app/index.html"

          text=html.read_text(encoding="utf-8")

          inicio=text.find("async function openPDF")
          fim=text.find("function sendWhatsApp",inicio)

          if inicio < 0 or fim < 0:
              raise SystemExit(
                  "ERRO: estrutura do relatório inválida."
              )

          trecho=text[inicio:fim]

          obrigatorios=[
              "orientation:'portrait'",
              "format:'a4'",
              "'CÓDIGO'",
              "'NOME DO PRODUTO'",
              "'ESTOQUE'",
              "'PEDIDO'",
              "Página '+pagina+' de '+totalPaginas",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()"
          ]

          for item in obrigatorios:
              if item not in trecho:
                  raise SystemExit(
                      "ERRO: relatório incompleto: "+item
                  )

          print("OK: relatório PDF validado.")
          print("OK: A4 retrato.")
          print("OK: 4 colunas.")
          print("OK: categorias.")
          print("OK: observação.")
          print("OK: rodapé/paginação.")
          print("OK: compartilhamento Android.")
          print("OK: histórico preservado.")
          print("OK: limpeza preservada.")
          PY

      - name: Verificar projeto Android
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --version
          else
            gradle --version
          fi

      - name: Gerar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Localizar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print -quit)

          test -n "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/Super-Pedido-Pro-v9-relatorio-corrigido.apk"

          echo "APK encontrado:"
          echo "$APK"

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK-v9-Relatorio-Corrigido
          path: apk-final/Super-Pedido-Pro-v9-relatorio-corrigido.apk
          if-no-files-found: error
