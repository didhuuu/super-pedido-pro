name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          rm -rf projeto
          test -f "Super-Pedido-Pro.zip"
          mkdir -p projeto
          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo - Admin, importação, PDF e limpeza
        shell: bash
        run: |
          set -e

          cat > /tmp/super_pedido_pdf.js <<'JSCODE'
          async function openPDF(){

            const rows =
              finalizedRows.length
                ? finalizedRows
                : getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              const jsPDF =
                window.jspdf &&
                window.jspdf.jsPDF;

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              const doc =
                new jsPDF({
                  orientation:'landscape',
                  unit:'mm',
                  format:'a4'
                });

              const pageWidth = 297;
              const pageHeight = 210;
              const margem = 10;

              const colCodigo = 30;
              const colProduto = 167;
              const colEstoque = 35;
              const colPedido = 35;

              const xCodigo = margem;
              const xProduto =
                xCodigo + colCodigo;

              const xEstoque =
                xProduto + colProduto;

              const xPedido =
                xEstoque + colEstoque;

              const tabelaLargura =
                colCodigo +
                colProduto +
                colEstoque +
                colPedido;

              const alturaCabecalho = 8;
              const alturaLinha = 7;

              let y = 12;

              const data =
                new Date().toLocaleDateString(
                  'pt-BR',
                  {
                    day:'2-digit',
                    month:'2-digit',
                    year:'numeric'
                  }
                );

              function cabecalhoPagina(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(16);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth / 2,
                  y,
                  {align:'center'}
                );

                y += 8;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(9);

                doc.text(
                  'Data: ' + data,
                  margem,
                  y
                );

                y += 7;
              }

              function novaPagina(){

                doc.addPage();

                y = 12;

                cabecalhoPagina();
              }

              function desenharCabecalho(){

                if(
                  y + alturaCabecalho >
                  pageHeight - 10
                ){
                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaCabecalho
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaCabecalho
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaCabecalho
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaCabecalho
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo + colCodigo / 2,
                  y + 5.2,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto + 3,
                  y + 5.2
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque + colEstoque / 2,
                  y + 5.2,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  xPedido + colPedido / 2,
                  y + 5.2,
                  {align:'center'}
                );

                y += alturaCabecalho;
              }

              function nomeProduto(nome){

                const original =
                  String(nome || '');

                let valor = original;

                while(
                  doc.getTextWidth(valor) >
                    colProduto - 6 &&
                  valor.length > 3
                ){
                  valor =
                    valor.substring(
                      0,
                      valor.length - 1
                    );
                }

                if(valor !== original){

                  valor =
                    valor.substring(
                      0,
                      Math.max(
                        1,
                        valor.length - 3
                      )
                    ) + '...';
                }

                return valor;
              }

              function desenharLinha(item){

                if(
                  y + alturaLinha >
                  pageHeight - 10
                ){

                  novaPagina();

                  desenharCabecalho();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaLinha
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaLinha
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaLinha
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaLinha
                );

                doc.text(
                  String(item.code || '-'),
                  xCodigo + 3,
                  y + 4.8
                );

                doc.text(
                  nomeProduto(item.name),
                  xProduto + 3,
                  y + 4.8
                );

                doc.text(
                  String(item.stock ?? 0),
                  xEstoque + colEstoque / 2,
                  y + 4.8,
                  {align:'center'}
                );

                doc.text(
                  String(item.order ?? 0),
                  xPedido + colPedido / 2,
                  y + 4.8,
                  {align:'center'}
                );

                y += alturaLinha;
              }

              cabecalhoPagina();

              const grupos =
                groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y + 25 >
                  pageHeight - 10
                ){
                  novaPagina();
                }

                y += 5;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(12);

                doc.text(
                  String(
                    categoria || ''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y += 4;

                desenharCabecalho();

                for(
                  const item of items
                ){
                  desenharLinha(item);
                }
              }

              if(
                typeof generalObservation !==
                  'undefined' &&
                generalObservation
              ){

                if(
                  y + 20 >
                  pageHeight - 10
                ){
                  novaPagina();
                }

                y += 7;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y += 5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const linhas =
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    tabelaLargura
                  );

                doc.text(
                  linhas,
                  margem,
                  y
                );
              }

              const totalPaginas =
                doc.getNumberOfPages();

              for(
                let pagina = 1;
                pagina <= totalPaginas;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight - 5
                );

                doc.text(
                  'Página ' +
                    pagina +
                    ' de ' +
                    totalPaginas,
                  pageWidth - margem,
                  pageHeight - 5,
                  {align:'right'}
                );
              }

              const base64 =
                doc
                  .output('datauristring')
                  .split(',')[1];

              const nomeArquivo =
                'relatorio-pedido-' +
                data.replace(/\//g,'-') +
                '.pdf';

              if(
                window.AndroidFileBridge &&
                typeof
                  window.AndroidFileBridge.sharePdf ===
                    'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                return;
              }

              doc.save(nomeArquivo);

            }catch(error){

              console.error(
                'Erro ao gerar PDF:',
                error
              );

              alert(
                'Não foi possível gerar o PDF: ' +
                error.message
              );
            }
          }
          JSCODE

          python3 - <<'PY'
          from pathlib import Path
          import re
          import os

          root = Path(
              os.environ["ANDROID_DIR"]
          )

          html = (
              root /
              "app/src/main/assets/app/index.html"
          )

          main = next(
              (
                  root /
                  "app/src/main/java"
              ).rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          if main is None:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # Limpeza do pedido.

          new_clear = '''function clearPedido(){
            Object.keys(vals).forEach(k=>delete vals[k]);
            extras=[];
            validadeCurta=[];
            finalizedRows=[];
            generalObservation='';
            const obs=document.getElementById('generalObs');
            if(obs) obs.value='';
            save();
            render();
            updateBadge();
            closeConference();
          }'''

          text,n = re.subn(
              r"function clearPedido\(\)\{.*?\n\}",
              new_clear,
              text,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrado"
              )

          # Categoria inicial.

          old_start = (
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive){"
              "APP_DATA=DATA;"
              "cats=Object.keys(DATA)}"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          new_start = (
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length && !importedCatalogActive){"
              "APP_DATA=DATA;"
              "cats=Object.keys(DATA)}"
              "if(!current || !APP_DATA[current])"
              "current=cats[0]||'';"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          if old_start in text:

              text = text.replace(
                  old_start,
                  new_start,
                  1
              )

          # Bibliotecas locais.

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/"
              "xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/"
              "jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # PDF.

          pdf_code = Path(
              "/tmp/super_pedido_pdf.js"
          ).read_text(
              encoding="utf-8"
          ).strip()

          pdf_pattern = (
              r"(?:async\s+)?function\s+openPDF"
              r"\s*\([^)]*\)\s*\{.*?\}\s*"
              r"(?=function\s+sendWhatsApp\()"
          )

          text,pdf_n = re.subn(
              pdf_pattern,
              pdf_code + "\n",
              text,
              count=1,
              flags=re.S
          )

          if pdf_n != 1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada"
              )

          text = text.replace(
              "document.getElementById('btnWhatsPdf').onclick=()=>openPDF(true);",
              "document.getElementById('btnWhatsPdf').onclick=openPDF;"
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          # MainActivity.

          java = main.read_text(
              encoding="utf-8"
          )

          if (
              "import android.content.ClipData;"
              not in java
          ):

              java = java.replace(
                  "import android.content.Intent;\n",
                  "import android.content.ClipData;\n"
                  "import android.content.Intent;\n",
                  1
              )

          if (
              "import android.webkit.ValueCallback;"
              not in java
          ):

              java = java.replace(
                  "import android.webkit.WebView;\n",
                  "import android.webkit.ValueCallback;\n"
                  "import android.webkit.WebView;\n",
                  1
              )

          if (
              "import android.webkit.WebChromeClient;"
              not in java
          ):

              java = java.replace(
                  "import android.webkit.WebView;\n",
                  "import android.webkit.WebChromeClient;\n"
                  "import android.webkit.WebView;\n",
                  1
              )

          if (
              "private ValueCallback<Uri[]> filePathCallback;"
              not in java
          ):

              java = java.replace(
                  "public class MainActivity extends Activity {\n",
                  "public class MainActivity extends Activity {\n"
                  "    private ValueCallback<Uri[]> filePathCallback;\n"
                  "    private static final int FILE_CHOOSER_REQUEST = 1001;\n",
                  1
              )

          # Seletor de arquivos.

          if "onShowFileChooser" not in java:

              marker = (
                  "        webView.setWebViewClient("
                  "new WebViewClient());\n"
              )

              block = '''        webView.setWebChromeClient(new WebChromeClient() {
              @Override
              public boolean onShowFileChooser(
                      WebView view,
                      ValueCallback<Uri[]> callback,
                      FileChooserParams params) {

                  if(
                      MainActivity.this.filePathCallback
                      != null
                  ){
                      MainActivity.this.filePathCallback
                          .onReceiveValue(null);
                  }

                  MainActivity.this.filePathCallback =
                      callback;

                  try{

                      Intent intent =
                          params.createIntent();

                      startActivityForResult(
                          intent,
                          FILE_CHOOSER_REQUEST
                      );

                      return true;

                  }catch(Exception e){

                      MainActivity.this.filePathCallback =
                          null;

                      Toast.makeText(
                          MainActivity.this,
                          "Não foi possível abrir o seletor de arquivos.",
                          Toast.LENGTH_LONG
                      ).show();

                      return false;
                  }
              }
          });
          '''

              if marker in java:
                  java = java.replace(
                      marker,
                      marker + block,
                      1
                  )

          # Resultado do seletor.

          if "protected void onActivityResult(" not in java:

              marker = (
                  "    public class AndroidFileBridge {\n"
              )

              result = '''    @Override
          protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

              super.onActivityResult(
                  requestCode,
                  resultCode,
                  data
              );

              if(
                  requestCode != FILE_CHOOSER_REQUEST ||
                  filePathCallback == null
              ){
                  return;
              }

              Uri[] results = null;

              if(
                  resultCode == RESULT_OK &&
                  data != null
              ){

                  if(data.getClipData() != null){

                      int count =
                          data.getClipData()
                              .getItemCount();

                      results =
                          new Uri[count];

                      for(
                          int i=0;
                          i<count;
                          i++
                      ){

                          results[i] =
                              data.getClipData()
                                  .getItemAt(i)
                                  .getUri();
                      }

                  }else if(
                      data.getData() != null
                  ){

                      results =
                          new Uri[]{
                              data.getData()
                          };
                  }
              }

              filePathCallback.onReceiveValue(
                  results
              );

              filePathCallback = null;
          }

          '''

              java = java.replace(
                  marker,
                  result + marker,
                  1
              )

          # PDF Android.

          pdf_pattern_java = (
              r"        @JavascriptInterface\n"
              r"        public void sharePdf"
              r"\(String filename, String base64\)"
              r"\s*\{.*?\n"
              r"        \}\n\n"
              r"        @JavascriptInterface"
          )

          pdf_method = '''        @JavascriptInterface
          public void sharePdf(
                  String filename,
                  String base64) {

              try{

                  if(
                      base64 == null ||
                      base64.trim().isEmpty()
                  ){
                      throw new Exception(
                          "PDF vazio"
                      );
                  }

                  String clean = base64;

                  int comma =
                      clean.indexOf(',');

                  if(comma >= 0){
                      clean =
                          clean.substring(
                              comma + 1
                          );
                  }

                  byte[] bytes =
                      Base64.decode(
                          clean,
                          Base64.DEFAULT
                      );

                  File dir =
                      new File(
                          getCacheDir(),
                          "shared"
                      );

                  if(
                      !dir.exists() &&
                      !dir.mkdirs()
                  ){
                      throw new Exception(
                          "Não foi possível criar a pasta temporária"
                      );
                  }

                  String safeName =
                      sanitizeFilename(
                          filename
                      );

                  if(
                      safeName == null ||
                      safeName.isEmpty()
                  ){
                      safeName =
                          "pedido.pdf";
                  }

                  if(
                      !safeName
                          .toLowerCase()
                          .endsWith(".pdf")
                  ){
                      safeName += ".pdf";
                  }

                  File file =
                      new File(
                          dir,
                          safeName
                      );

                  try(
                      FileOutputStream out =
                          new FileOutputStream(file)
                  ){

                      out.write(bytes);
                      out.flush();
                  }

                  Uri uri =
                      FileProvider.getUriForFile(
                          MainActivity.this,
                          getPackageName() +
                              ".fileprovider",
                          file
                      );

                  Intent intent =
                      new Intent(
                          Intent.ACTION_SEND
                      );

                  intent.setType(
                      "application/pdf"
                  );

                  intent.putExtra(
                      Intent.EXTRA_STREAM,
                      uri
                  );

                  intent.setClipData(
                      ClipData.newRawUri(
                          "PDF",
                          uri
                      )
                  );

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                  );

                  startActivity(
                      Intent.createChooser(
                          intent,
                          "Enviar PDF"
                      )
                  );

              }catch(Exception e){

                  Toast.makeText(
                      MainActivity.this,
                      "Erro ao compartilhar PDF: " +
                          e.getMessage(),
                      Toast.LENGTH_LONG
                  ).show();
              }
          }

          @JavascriptInterface'''

          java,n = re.subn(
              pdf_pattern_java,
              pdf_method,
              java,
              count=1,
              flags=re.S
          )

          if n != 1:
              raise SystemExit(
                  "ERRO: sharePdf não encontrado"
              )

          # Compatibilidade saveBase64.

          if (
              "public void saveBase64("
              "String filename, "
              "String mimeType, "
              "String base64)"
              not in java
          ):

              marker = (
                  "        @JavascriptInterface\n"
                  "        public void shareText(String text) {"
              )

              overload = '''        @JavascriptInterface
          public void saveBase64(
                  String filename,
                  String mimeType,
                  String base64) {

              saveBase64(
                  filename,
                  base64
              );
          }

          '''

              if marker in java:

                  java = java.replace(
                      marker,
                      overload + marker,
                      1
                  )

          # Sanitização.

          if "private String sanitizeFilename(" not in java:

              marker = (
                  "    @Override\n"
                  "    public void onBackPressed() {"
              )

              helper = '''    private String sanitizeFilename(
              String filename
          ){

              if(filename == null){
                  return "";
              }

              return new File(filename)
                  .getName()
                  .replaceAll(
                      "[\\\\/:*?\\\"<>|]",
                      "_"
                  );
          }

          '''

              if marker in java:

                  java = java.replace(
                      marker,
                      helper + marker,
                      1
                  )

          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "Correções aplicadas com sucesso."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "Verificando arquivos..."

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -s "$ANDROID_DIR/app/src/main/assets/app/xlsx.full.min.js"
          test -s "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          MAIN=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name "MainActivity.java" \
            -type f \
            -print \
            -quit)

          test -n "$MAIN"
          test -f "$MAIN"

          echo "Verificando PDF..."

          grep -Fq "async function openPDF()" "$HTML"
          grep -Fq "jspdf.umd.min.js" "$HTML"
          grep -Fq "sharePdf(nomeArquivo,base64)" "$HTML"

          echo "Verificando Android..."

          grep -Fq "sharePdf" "$MAIN"
          grep -Fq "FileProvider" "$MAIN"
          grep -Fq "application/pdf" "$MAIN"

          echo "Projeto verificado com sucesso."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Iniciando compilação..."

          gradle \
            --no-daemon \
            clean \
            assembleDebug

          echo "Compilação concluída."

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK encontrado:"
          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
