name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          mkdir -p projeto

          test -f "Super-Pedido-Pro.zip"

          unzip -o "Super-Pedido-Pro.zip" -d projeto

          echo "ZIP da V9 extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app" / "src" / "main" / "assets" / "app" / "index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = html.read_text(encoding="utf-8")

          print("HTML encontrado.")
          print("Aplicando correções da V9...")

          # =====================================================
          # 1. PDF: LANDSCAPE -> PORTRAIT
          # =====================================================

          old = "orientation:'landscape'"
          new = "orientation:'portrait'"

          if old in text:
              text = text.replace(old, new)
              print("PDF landscape corrigido.")

          old = "orientation: 'landscape'"
          new = "orientation: 'portrait'"

          if old in text:
              text = text.replace(old, new)
              print("PDF landscape corrigido.")

          # =====================================================
          # 2. TAMANHO A4 RETRATO
          # =====================================================

          text = text.replace(
              "const pageWidth=297,pageHeight=210",
              "const pageWidth=210,pageHeight=297"
          )

          text = text.replace(
              "const pageWidth = 297,pageHeight = 210",
              "const pageWidth = 210,pageHeight = 297"
          )

          text = text.replace(
              "pageWidth=297,pageHeight=210",
              "pageWidth=210,pageHeight=297"
          )

          # =====================================================
          # 3. GARANTIR QUE O PDF NÃO USE LANDSCAPE
          # =====================================================

          text = text.replace(
              "doc.addPage('a4','landscape')",
              "doc.addPage('a4','portrait')"
          )

          text = text.replace(
              "doc.addPage(\"a4\",\"landscape\")",
              "doc.addPage(\"a4\",\"portrait\")"
          )

          # =====================================================
          # 4. CORRIGIR ENVIO DO PDF
          #
          # O problema da V9 era:
          #
          # sharePdf(...)
          # return
          #
          # sem executar clearPedido().
          #
          # Agora:
          #
          # clearPedido(...)
          # sharePdf(...)
          # return
          # =====================================================

          alvo = """window.AndroidFileBridge.sharePdf(nomeArquivo,base64);
      return;"""

          substituto = """clearPedido(rows);
      window.AndroidFileBridge.sharePdf(nomeArquivo,base64);
      return;"""

          if alvo in text:

              text = text.replace(
                  alvo,
                  substituto,
                  1
              )

              print("Limpeza após PDF corrigida.")

          else:

              alvo2 = """window.AndroidFileBridge.sharePdf(nomeArquivo,base64);
        return;"""

              substituto2 = """clearPedido(rows);
        window.AndroidFileBridge.sharePdf(nomeArquivo,base64);
        return;"""

              if alvo2 in text:

                  text = text.replace(
                      alvo2,
                      substituto2,
                      1
                  )

                  print("Limpeza após PDF corrigida.")

              else:

                  print(
                      "AVISO: chamada sharePdf específica não encontrada."
                  )

          # =====================================================
          # 5. GARANTIR QUE A FUNÇÃO clearPedido LIMPE O STORAGE
          # =====================================================

          # Não substituímos a função inteira.
          # Apenas garantimos que as três chaves do pedido
          # sejam removidas quando clearPedido for executado.

          marcador = "function clearPedido"

          pos = text.find(marcador)

          if pos == -1:

              print(
                  "AVISO: clearPedido não encontrado."
              )

          else:

              print(
                  "clearPedido encontrado."
              )

              # =================================================
              # Se a versão já possui removeItem, preservamos.
              # Caso não possua, inserimos antes de render().
              # =================================================

              chaves = [
                  "pedido_compras_vals",
                  "pedido_compras_extras",
                  "pedido_compras_validade_curta"
              ]

              falta = [
                  chave
                  for chave in chaves
                  if chave not in text[pos:]
              ]

              if falta:

                  fim_funcao = text.find(
                      "function sendWhatsApp",
                      pos
                  )

                  if fim_funcao == -1:
                      fim_funcao = len(text)

                  trecho = text[pos:fim_funcao]

                  insercao = ""

                  for chave in falta:

                      insercao += (
                          "\n  localStorage.removeItem("
                          + repr(chave)
                          + ");"
                      )

                  ponto = trecho.find("render();")

                  if ponto != -1:

                      trecho = (
                          trecho[:ponto]
                          + insercao
                          + "\n  "
                          + trecho[ponto:]
                      )

                      text = (
                          text[:pos]
                          + trecho
                          + text[fim_funcao:]
                      )

                      print(
                          "Limpeza localStorage reforçada."
                      )

          # =====================================================
          # 6. BIBLIOTECAS LOCAIS
          # =====================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # =====================================================
          # 7. GRAVAR
          # =====================================================

          html.write_text(
              text,
              encoding="utf-8"
          )

          # =====================================================
          # 8. VERIFICAÇÃO
          # =====================================================

          if "orientation:'landscape'" in text:
              raise SystemExit(
                  "ERRO: landscape ainda existe no HTML."
              )

          if "orientation: 'landscape'" in text:
              raise SystemExit(
                  "ERRO: landscape ainda existe no HTML."
              )

          if "orientation:'portrait'" not in text:
              raise SystemExit(
                  "ERRO: configuração portrait não encontrada."
              )

          if "pageWidth=210" not in text:
              print(
                  "AVISO: pageWidth=210 não localizado."
              )

          if "pageHeight=297" not in text:
              print(
                  "AVISO: pageHeight=297 não localizado."
              )

          print("========================================")
          print("CORREÇÃO CONCLUÍDA")
          print("PDF: A4 RETRATO")
          print("210 x 297 mm")
          print("Quantidade: limpeza ativada")
          print("Estoque: limpeza ativada")
          print("Cadastro: preservado")
          print("Histórico: preservado")
          print("MainActivity: não alterada")
          print("========================================")

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas OK."

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          echo "Verificando correções..."

          test -f "$HTML"

          grep -q "async function openPDF" "$HTML"

          grep -q "function clearPedido" "$HTML"

          grep -q "orientation:'portrait'" "$HTML"

          grep -q "pageWidth=210" "$HTML"

          grep -q "pageHeight=297" "$HTML"

          grep -q "pedido_compras_vals" "$HTML"

          grep -q "pedido_compras_extras" "$HTML"

          grep -q "pedido_compras_validade_curta" "$HTML"

          if grep -q "orientation:'landscape'" "$HTML"; then
            echo "ERRO: landscape encontrado."
            exit 1
          fi

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: landscape encontrado."
            exit 1
          fi

          echo "========================================"
          echo "VERIFICAÇÃO APROVADA"
          echo "========================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
