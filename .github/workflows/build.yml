name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          if [ -f "Super-Pedido-Pro.zip" ]; then
            mkdir -p projeto
            unzip -o "Super-Pedido-Pro.zip" -d projeto
          else
            echo "ERRO: Super-Pedido-Pro.zip não encontrado."
            exit 1
          fi

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" -name settings.gradle -type f -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          cd "$ANDROID_DIR"

          if [ ! -f gradle.properties ]; then
            touch gradle.properties
          fi

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          test -f "$ANDROID_DIR/settings.gradle"
          test -f "$ANDROID_DIR/build.gradle"
          test -f "$ANDROID_DIR/app/build.gradle"
          test -f "$ANDROID_DIR/app/src/main/AndroidManifest.xml"
          test -f "$ANDROID_DIR/app/src/main/assets/app/index.html"

          echo "Projeto Android encontrado corretamente."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          ls -lh "$APK"
          echo "APK gerado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
