name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
              -name settings.gradle.kts \
              -type f \
              -print -quit | xargs -r dirname)
          fi

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Localizar tela HTML
        shell: bash
        run: |
          set -e

          HTML=$(find "$ANDROID_DIR" \
            -path "*/src/main/assets/*" \
            -name index.html \
            -type f \
            -print -quit)

          test -n "$HTML"

          APP_DIR=$(dirname "$HTML")

          echo "HTML=$HTML" >> "$GITHUB_ENV"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"

          echo "HTML encontrado:"
          echo "$HTML"

      - name: Corrigir ADM, Repetir e Limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          html = Path(os.environ["HTML"])

          text = html.read_text(encoding="utf-8")
          original = text

          # ---------------------------------------------------------
          # Localiza uma função JavaScript inteira
          # ---------------------------------------------------------

          def function_block(source, name):

              pattern = (
                  r"function\s+"
                  + re.escape(name)
                  + r"\s*\("
              )

              match = re.search(pattern, source)

              if not match:
                  raise SystemExit(
                      f"ERRO: função {name} não encontrada."
                  )

              start = match.start()

              next_match = re.search(
                  r"\nfunction\s+[A-Za-z_$][\w$]*\s*\(",
                  source[match.end():]
              )

              if next_match:
                  end = (
                      match.end()
                      + next_match.start()
                      + 1
                  )
              else:
                  end = len(source)

              return start, end, source[start:end]

          def replace_function(source, name, replacement):

              start, end, old = function_block(
                  source,
                  name
              )

              return (
                  source[:start]
                  + replacement
                  + "\n"
                  + source[end:]
              )

          # ---------------------------------------------------------
          # PROTEGER O RELATÓRIO DA VERSÃO #49
          #
          # O openPDF NÃO SERÁ MODIFICADO.
          # ---------------------------------------------------------

          openpdf_before = function_block(
              original,
              "openPDF"
          )[2]

          openpdf_hash_before = hashlib.sha256(
              openpdf_before.encode("utf-8")
          ).hexdigest()

          # ---------------------------------------------------------
          # 1. ADM
          # ---------------------------------------------------------

          new_admin = r'''function openAdmin(){

            featureModal(`
              <h3>🔐 Administração</h3>

              <p>Digite o PIN de administração.</p>

              <input
                id="adminPinInput"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="PIN"
                style="
                  width:100%;
                  box-sizing:border-box;
                  padding:12px;
                  font-size:18px;
                  margin-top:8px
                "
              >

              <div
                style="
                  display:flex;
                  gap:8px;
                  margin-top:12px
                "
              >

                <button onclick="confirmAdminPin()">
                  Entrar
                </button>

                <button onclick="closeFeature()">
                  Cancelar
                </button>

              </div>
            `);

            setTimeout(function(){

              const input =
                document.getElementById(
                  'adminPinInput'
                );

              if(input){
                input.focus();

                input.addEventListener(
                  'keydown',
                  function(e){

                    if(e.key==='Enter'){
                      confirmAdminPin();
                    }

                  }
                );
              }

            },100);

          }

          function confirmAdminPin(){

            const input =
              document.getElementById(
                'adminPinInput'
              );

            const pin =
              input
              ? String(input.value || '')
              : '';

            const saved =
              localStorage.getItem(
                'sp_admin_pin'
              ) || '1234';

            if(pin !== saved){

              alert('PIN incorreto.');

              if(input){
                input.focus();
                input.value='';
              }

              return;
            }

            featureModal(`

              <h3>🔐 Administração</h3>

              <div class="stat">

                Produtos na lista:

                <b>
                  ${
                    Object.values(APP_DATA).reduce(
                      (a,s)=>
                        a +
                        Object.values(s).reduce(
                          (b,x)=>b+x.length,
                          0
                        ),
                      0
                    )
                  }
                </b>

              </div>

              <div class="adminGrid">

                <button onclick="importList()">
                  📥 Importar lista (XLSX/CSV)
                </button>

                <button onclick="generateImportTemplate()">
                  📄 Gerar lista para preencher
                </button>

                <button onclick="backupJSON()">
                  💾 Backup completo
                </button>

                <button onclick="changePin()">
                  🔑 Alterar PIN
                </button>

              </div>

              <p class="mini">
                No Android, a importação XLSX/CSV é lida
                pelo próprio aplicativo.
                Após uma importação, a planilha passa a ser
                a lista oficial.
              </p>

              <button onclick="clearLocalData()">
                ⚠️ Limpar dados locais do pedido
              </button>

            `);
          }'''

          text = replace_function(
              text,
              "openAdmin",
              new_admin
          )

          # ---------------------------------------------------------
          # 2. REPETIR ÚLTIMO PEDIDO
          # ---------------------------------------------------------

          new_repeat = r'''function repeatLastOrder(){

            let rows=[];

            if(
              Array.isArray(lastOrder) &&
              lastOrder.length
            ){

              rows = JSON.parse(
                JSON.stringify(lastOrder)
              );

            }

            if(!rows.length){

              try{

                const stored =
                  localStorage.getItem(
                    'sp_last_order'
                  );

                if(stored){

                  const parsed =
                    JSON.parse(stored);

                  if(
                    Array.isArray(parsed) &&
                    parsed.length
                  ){
                    rows = parsed;
                  }

                }

              }catch(e){

                rows=[];

              }

            }

            if(!rows.length){

              if(
                Array.isArray(historyOrders) &&
                historyOrders.length
              ){

                const latest =
                  historyOrders[0];

                if(
                  latest &&
                  Array.isArray(latest.rows)
                ){

                  rows =
                    JSON.parse(
                      JSON.stringify(
                        latest.rows
                      )
                    );

                  rows.generalObservation =
                    latest.generalObservation || '';

                }

              }

            }

            if(!rows.length){

              alert(
                'Ainda não existe último pedido.'
              );

              return;
            }

            lastOrder =
              JSON.parse(
                JSON.stringify(rows)
              );

            saveFeatures();

            applyRepeat(
              JSON.parse(
                JSON.stringify(rows)
              )
            );

          }'''

          text = replace_function(
              text,
              "repeatLastOrder",
              new_repeat
          )

          # ---------------------------------------------------------
          # 3. APLICAR PEDIDO REPETIDO
          # ---------------------------------------------------------

          new_apply = r'''function applyRepeat(rows){

            if(
              !Array.isArray(rows) ||
              !rows.length
            ){

              alert(
                'Não foi possível recuperar o último pedido.'
              );

              return;
            }

            vals={};

            extras=[];

            rows.forEach(function(x){

              if(
                x &&
                x.cat === 'Produto Adicional'
              ){

                extras.push({

                  code:
                    x.code === '-'
                    ? ''
                    : String(x.code || ''),

                  name:
                    String(x.name || ''),

                  qty:
                    Number(x.order) || 0

                });

                return;
              }

              if(!x){
                return;
              }

              const f =
                productByCode(x.code);

              if(!f){
                return;
              }

              const ko =
                key(
                  f.c,
                  f.s,
                  f.i,
                  'o'
                );

              const ks =
                key(
                  f.c,
                  f.s,
                  f.i,
                  's'
                );

              vals[ko] =
                Number(x.order) || 0;

              vals[ks] =
                Number(x.stock) || 0;

            });

            if(
              typeof rows.generalObservation ===
              'string'
            ){

              generalObservation =
                rows.generalObservation;

            }

            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){

              obs.value =
                generalObservation;

            }

            save();

            saveFeatures();

            render();

            updateBadge();

            closeFeature();

            alert(
              'Último pedido recuperado. Confira antes de enviar.'
            );

          }'''

          text = replace_function(
              text,
              "applyRepeat",
              new_apply
          )

          # ---------------------------------------------------------
          # 4. LIMPEZA DO PEDIDO
          #
          # Mantém histórico e último pedido.
          # Remove somente o pedido atual.
          # ---------------------------------------------------------

          new_clear = r'''function clearPedido(){

            const rowsToSave =
              Array.isArray(finalizedRows)
              ? JSON.parse(
                  JSON.stringify(
                    finalizedRows
                  )
                )
              : [];

            // Evita gravar duas vezes no histórico
            // quando o openPDF da versão #49 já
            // salvou o pedido antes de chamar clearPedido().

            let alreadySaved=false;

            if(
              rowsToSave.length &&
              Array.isArray(historyOrders) &&
              historyOrders.length
            ){

              try{

                alreadySaved =
                  JSON.stringify(
                    historyOrders[0].rows || []
                  ) ===
                  JSON.stringify(
                    rowsToSave
                  );

              }catch(e){

                alreadySaved=false;

              }

            }

            if(
              rowsToSave.length &&
              !alreadySaved
            ){

              saveHistory(
                rowsToSave
              );

            }

            // Limpa o pedido atual

            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            generalObservation='';

            // Limpa observação visual

            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            // Remove somente os dados do pedido atual

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            localStorage.removeItem(
              'sp_general_obs'
            );

            // Atualiza a tela

            render();

            if(
              typeof renderValidadeCurta ===
              'function'
            ){

              renderValidadeCurta();

            }

            updateBadge();

            if(
              typeof closeConference ===
              'function'
            ){

              closeConference();

            }

            const opcoes =
              document.getElementById(
                'opcoesFinalizado'
              );

            if(opcoes){

              opcoes.style.display='none';

            }

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });

          }'''

          text = replace_function(
              text,
              "clearPedido",
              new_clear
          )

          # ---------------------------------------------------------
          # NÃO ALTERAR openPDF
          # ---------------------------------------------------------

          openpdf_after = function_block(
              text,
              "openPDF"
          )[2]

          openpdf_hash_after = hashlib.sha256(
              openpdf_after.encode("utf-8")
          ).hexdigest()

          if openpdf_before != openpdf_after:

              raise SystemExit(
                  "ERRO GRAVE: openPDF foi alterado."
              )

          if openpdf_hash_before != openpdf_hash_after:

              raise SystemExit(
                  "ERRO GRAVE: HASH do openPDF mudou."
              )

          # ---------------------------------------------------------
          # VERIFICAÇÕES
          # ---------------------------------------------------------

          required = [

              "function openAdmin(){",

              "function confirmAdminPin(){",

              "function repeatLastOrder(){",

              "function applyRepeat(rows){",

              "function clearPedido(){",

              "localStorage.removeItem(",

              "sp_last_order",

              "saveHistory(",

              "updateBadge()"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: recurso ausente: "
                      + item
                  )

          # ---------------------------------------------------------
          # CONFIRMA QUE A CHAMADA sharePdf EXISTENTE
          # NÃO FOI MODIFICADA
          # ---------------------------------------------------------

          before_pdf_calls = re.findall(
              r"AndroidFileBridge\s*\.\s*sharePdf\s*\(",
              original
          )

          after_pdf_calls = re.findall(
              r"AndroidFileBridge\s*\.\s*sharePdf\s*\(",
              text
          )

          if before_pdf_calls != after_pdf_calls:

              raise SystemExit(
                  "ERRO GRAVE: chamadas Android sharePdf foram alteradas."
              )

          # ---------------------------------------------------------
          # GRAVAR
          # ---------------------------------------------------------

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("")
          print("==========================================")
          print(" VERIFICAÇÃO DAS CORREÇÕES")
          print("==========================================")
          print("OK - ADM")
          print("OK - PIN de administração")
          print("OK - Repetir último pedido")
          print("OK - Recuperação pelo histórico")
          print("OK - Produtos adicionais")
          print("OK - Limpeza do pedido")
          print("OK - Estoque limpo")
          print("OK - Quantidades limpas")
          print("OK - Validade curta limpa")
          print("OK - Observação limpa")
          print("OK - Histórico preservado")
          print("OK - Último pedido preservado")
          print("OK - openPDF INALTERADO")
          print("OK - sharePdf INALTERADO")
          print("==========================================")
          print(" CORREÇÕES APLICADAS COM SUCESSO")
          print("==========================================")
          PY

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          node --check "$HTML"

          echo "JavaScript válido."

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          test -f "$HTML"

          grep -q "function openAdmin" "$HTML"
          grep -q "function confirmAdminPin" "$HTML"
          grep -q "function repeatLastOrder" "$HTML"
          grep -q "function applyRepeat" "$HTML"
          grep -q "function clearPedido" "$HTML"

          echo "Todas as correções foram encontradas."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi

      - name: Verificar APK gerado
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk/Super-Pedido-Pro.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/apk/Super-Pedido-Pro.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: apk/Super-Pedido-Pro.apk
          if-no-files-found: error
