name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip" || {
            echo "ERRO: Super-Pedido-Pro.zip não encontrado."
            exit 1
          }

          mkdir -p projeto
          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: settings.gradle não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto Android:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          HTML_DIR="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$HTML_DIR"

          curl -L --fail --silent --show-error \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" \
            -o "$HTML_DIR/xlsx.full.min.js"

          curl -L --fail --silent --show-error \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" \
            -o "$HTML_DIR/jspdf.umd.min.js"

          test -s "$HTML_DIR/xlsx.full.min.js"
          test -s "$HTML_DIR/jspdf.umd.min.js"

          echo "Bibliotecas locais prontas."

      - name: Corrigir HTML do aplicativo
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML" || {
            echo "ERRO: index.html não encontrado."
            exit 1
          }

          echo "Corrigindo bibliotecas externas..."

          perl -0pi -e \
            's#https://cdnjs\.cloudflare\.com/ajax/libs/xlsx/0\.18\.5/xlsx\.full\.min\.js#xlsx.full.min.js#g' \
            "$HTML"

          perl -0pi -e \
            's#https://cdnjs\.cloudflare\.com/ajax/libs/jspdf/2\.5\.1/jspdf\.umd\.min\.js#jspdf.umd.min.js#g' \
            "$HTML"

          python3 - "$HTML" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          # ==========================================================
          # NOVO RELATÓRIO PDF
          # ==========================================================

          new_pdf = r'''
          async function openPDF(){

            const rows = finalizedRows.length
              ? finalizedRows
              : getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              if(typeof window.jspdf === 'undefined' ||
                 !window.jspdf.jsPDF){

                alert('Biblioteca PDF não carregada.');
                return;
              }

              const jsPDF = window.jspdf.jsPDF;

              /*
               * A4 horizontal.
               * Isso deixa espaço suficiente para as quatro colunas.
               */
              const doc = new jsPDF({
                orientation: 'landscape',
                unit: 'mm',
                format: 'a4'
              });

              const pageWidth = 297;
              const pageHeight = 210;

              const margem = 10;

              let y = 12;

              /*
               * Título
               */
              doc.setFont('helvetica','bold');
              doc.setFontSize(18);
              doc.text(
                'RELATÓRIO DE PEDIDO',
                pageWidth / 2,
                y,
                {align:'center'}
              );

              y += 8;

              /*
               * Data
               */
              const agora = new Date();

              const data = agora.toLocaleDateString(
                'pt-BR',
                {
                  day:'2-digit',
                  month:'2-digit',
                  year:'numeric'
                }
              );

              doc.setFont('helvetica','normal');
              doc.setFontSize(10);

              doc.text(
                'Data: ' + data,
                margem,
                y
              );

              y += 7;

              /*
               * Agrupa os produtos por categoria.
               */
              const grupos = groupRows(rows);

              /*
               * Larguras fixas das colunas.
               *
               * Código      = 30 mm
               * Produto     = 167 mm
               * Estoque     = 35 mm
               * Pedido      = 35 mm
               *
               * Total = 267 mm
               * Área útil = 277 mm
               */
              const colCodigo = 30;
              const colProduto = 167;
              const colEstoque = 35;
              const colPedido = 35;

              const xCodigo = margem;
              const xProduto = xCodigo + colCodigo;
              const xEstoque = xProduto + colProduto;
              const xPedido = xEstoque + colEstoque;

              const tabelaLargura =
                colCodigo +
                colProduto +
                colEstoque +
                colPedido;

              const alturaCabecalho = 8;
              const alturaLinha = 7;

              function novaPagina(){

                doc.addPage();

                y = 12;

                doc.setFont('helvetica','bold');
                doc.setFontSize(16);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth / 2,
                  y,
                  {align:'center'}
                );

                y += 8;

                doc.setFont('helvetica','normal');
                doc.setFontSize(9);

                doc.text(
                  'Data: ' + data,
                  margem,
                  y
                );

                y += 7;
              }

              function desenharCabecalho(){

                if(y + alturaCabecalho > pageHeight - 10){
                  novaPagina();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaCabecalho
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaCabecalho
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaCabecalho
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaCabecalho
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo + colCodigo / 2,
                  y + 5.2,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto + 3,
                  y + 5.2
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque + colEstoque / 2,
                  y + 5.2,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  xPedido + colPedido / 2,
                  y + 5.2,
                  {align:'center'}
                );

                y += alturaCabecalho;
              }

              function textoProduto(nome){

                let valor = String(nome || '');

                /*
                 * Limite aproximado para impedir
                 * que o nome entre nas outras colunas.
                 */
                while(
                  doc.getTextWidth(valor) >
                  colProduto - 6 &&
                  valor.length > 3
                ){
                  valor = valor.substring(
                    0,
                    valor.length - 1
                  );
                }

                if(valor !== String(nome || '')){
                  valor = valor.substring(
                    0,
                    Math.max(1,valor.length - 3)
                  ) + '...';
                }

                return valor;
              }

              function desenharLinha(item){

                if(y + alturaLinha > pageHeight - 10){

                  novaPagina();

                  desenharCabecalho();
                }

                doc.setFont('helvetica','normal');
                doc.setFontSize(8);

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaLinha
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaLinha
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaLinha
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaLinha
                );

                doc.text(
                  String(item.code || '-'),
                  xCodigo + 3,
                  y + 4.8
                );

                doc.text(
                  textoProduto(item.name),
                  xProduto + 3,
                  y + 4.8
                );

                doc.text(
                  String(item.stock ?? 0),
                  xEstoque + colEstoque / 2,
                  y + 4.8,
                  {align:'center'}
                );

                doc.text(
                  String(item.order ?? 0),
                  xPedido + colPedido / 2,
                  y + 4.8,
                  {align:'center'}
                );

                y += alturaLinha;
              }

              /*
               * Cada categoria recebe seu próprio bloco.
               */
              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y + 25 >
                  pageHeight - 10
                ){

                  novaPagina();
                }

                /*
                 * Espaço entre categorias.
                 */
                y += 5;

                /*
                 * Nome da categoria.
                 */
                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(12);

                doc.text(
                  String(categoria || '').toUpperCase(),
                  margem,
                  y
                );

                y += 4;

                desenharCabecalho();

                /*
                 * Produtos.
                 */
                for(const item of items){

                  desenharLinha(item);
                }
              }

              /*
               * Observação geral.
               */
              if(
                typeof generalObservation !== 'undefined' &&
                generalObservation
              ){

                if(y + 20 > pageHeight - 10){
                  novaPagina();
                }

                y += 7;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y += 5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const obsLines =
                  doc.splitTextToSize(
                    String(generalObservation),
                    tabelaLargura
                  );

                doc.text(
                  obsLines,
                  margem,
                  y
                );
              }

              /*
               * Rodapé com número da página.
               */
              const totalPaginas =
                doc.getNumberOfPages();

              for(
                let pagina = 1;
                pagina <= totalPaginas;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight - 5
                );

                doc.text(
                  'Página ' +
                  pagina +
                  ' de ' +
                  totalPaginas,
                  pageWidth - margem,
                  pageHeight - 5,
                  {align:'right'}
                );
              }

              /*
               * Gera o PDF como Base64.
               */
              const base64 =
                doc.output('datauristring')
                   .split(',')[1];

              const nome =
                'relatorio-pedido-' +
                data.replace(/\//g,'-') +
                '.pdf';

              /*
               * Envia para o Android.
               */
              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf === 'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nome,
                  base64
                );

                return;
              }

              /*
               * Fallback para navegador.
               */
              doc.save(nome);

            }catch(error){

              console.error(
                'Erro ao gerar PDF:',
                error
              );

              alert(
                'Não foi possível gerar o PDF: ' +
                error.message
              );
            }
          }
          '''

          # ----------------------------------------------------------
          # Remove versões antigas de openPDF
          # ----------------------------------------------------------

          import re

          text = re.sub(
              r'async\s+function\s+openPDF\s*\([^)]*\)\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          text = re.sub(
              r'function\s+openPDF\s*\([^)]*\)\s*\{.*?\n\s*\}',
              '',
              text,
              flags=re.S
          )

          # ----------------------------------------------------------
          # Insere a nova função antes de clearPedido
          # ----------------------------------------------------------

          pos = text.find('function clearPedido()')

          if pos == -1:
              pos = text.find('function sendWhatsApp()')

          if pos == -1:
              raise SystemExit(
                  'ERRO: não foi possível localizar ponto para inserir openPDF.'
              )

          text = (
              text[:pos]
              + new_pdf
              + '\n\n'
              + text[pos:]
          )

          # ----------------------------------------------------------
          # Corrige o botão para chamar a função nova
          # ----------------------------------------------------------

          text = text.replace(
              'onclick="openPDF(true)"',
              'onclick="openPDF()"'
          )

          text = text.replace(
              "btnWhatsPdf').onclick=()=>openPDF(true)",
              "btnWhatsPdf').onclick=()=>openPDF()"
          )

          text = text.replace(
              'btnWhatsPdf").onclick=()=>openPDF(true)',
              'btnWhatsPdf").onclick=()=>openPDF()'
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Novo PDF inserido com sucesso.")
          PY

          echo "Verificando HTML..."

          grep -q "function openPDF" "$HTML"
          grep -q "RELATÓRIO DE PEDIDO" "$HTML"
          grep -q "CÓDIGO" "$HTML"
          grep -q "NOME DO PRODUTO" "$HTML"
          grep -q "ESTOQUE" "$HTML"
          grep -q "PEDIDO" "$HTML"
          grep -q "jspdf.umd.min.js" "$HTML"
          grep -q "AndroidFileBridge.sharePdf" "$HTML"

          echo "HTML validado."

      - name: Corrigir categoria inicial
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          python3 - "$HTML" <<'PY'
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          old = "tabs();render();updateBadge();renderValidadeCurta();"

          new = (
              'if(!current || !APP_DATA[current])'
              'current=cats[0]||"";'
              'tabs();render();updateBadge();renderValidadeCurta();'
          )

          text = text.replace(old,new)

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

      - name: Corrigir limpeza do pedido
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          python3 - "$HTML" <<'PY'
          import sys
          from pathlib import Path
          import re

          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")

          replacement = r'''
          function clearPedido(){

            if(
              typeof finalizedRows !== 'undefined' &&
              finalizedRows.length &&
              typeof saveHistory === 'function'
            ){
              saveHistory(finalizedRows);
            }

            vals={};
            extras=[];
            validadeCurta=[];
            finalizedRows=[];
            generalObservation='';

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            save();

            render();

            updateBadge();

            renderValidadeCurta();

            if(
              typeof closeConference === 'function'
            ){
              closeConference();
            }

            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }
          '''

          text = re.sub(
              r'function\s+clearPedido\s*\([^)]*\)\s*\{.*?\n\s*\}',
              replacement,
              text,
              count=1,
              flags=re.S
          )

          path.write_text(
              text,
              encoding="utf-8"
          )

          print("Limpeza do pedido validada.")
          PY

      - name: Verificar projeto
        shell: bash
        run: |
          set -e

          echo "======================================"
          echo " VERIFICAÇÃO FINAL DO SUPER PEDIDO PRO"
          echo "======================================"

          test -f "$ANDROID_DIR/settings.gradle"

          test -f \
            "$ANDROID_DIR/app/src/main/AndroidManifest.xml"

          test -f \
            "$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/xlsx.full.min.js"

          test -s \
            "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          MAIN_ACTIVITY=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo "ERRO: MainActivity.java não encontrado."
            exit 1
          fi

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          grep -q "function openPDF" "$HTML"
          grep -q "RELATÓRIO DE PEDIDO" "$HTML"
          grep -q "CÓDIGO" "$HTML"
          grep -q "NOME DO PRODUTO" "$HTML"
          grep -q "ESTOQUE" "$HTML"
          grep -q "PEDIDO" "$HTML"
          grep -q "AndroidFileBridge.sharePdf" "$HTML"

          grep -q "importedCatalogActive" "$HTML"

          echo ""
          echo "HTML: OK"
          echo "PDF: OK"
          echo "Biblioteca XLSX: OK"
          echo "Biblioteca jsPDF: OK"
          echo "MainActivity: OK"
          echo ""
          echo "Projeto pronto para compilação."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            ./gradlew \
              --no-daemon \
              clean \
              assembleDebug

          else

            gradle \
              --no-daemon \
              clean \
              assembleDebug

          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo " APK GERADO COM SUCESSO"
          echo "======================================"
          echo ""

          ls -lh "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-final"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-final/Super-Pedido-Pro.apk"

          echo ""
          echo "APK preparado para download."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: apk-final/Super-Pedido-Pro.apk
          retention-days: 7
