name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          rm -rf projeto
          mkdir -p projeto
          test -f Super-Pedido-Pro.zip
          unzip -o Super-Pedido-Pro.zip -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "Corrigindo PDF para A4 retrato..."

          sed -i "s/orientation:'landscape'/orientation:'portrait'/g" "$HTML"
          sed -i "s/orientation: 'landscape'/orientation: 'portrait'/g" "$HTML"
          sed -i 's/orientation:"landscape"/orientation:"portrait"/g' "$HTML"
          sed -i 's/orientation: "landscape"/orientation: "portrait"/g' "$HTML"

          sed -i "s/const pageWidth=297,pageHeight=210,margem=10;/const pageWidth=210,pageHeight=297,margem=10;/g" "$HTML"

          sed -i "s/const pageWidth = 297,pageHeight = 210,margem = 10;/const pageWidth = 210,pageHeight = 297,margem = 10;/g" "$HTML"

          sed -i "s/const colCodigo=30,colProduto=167,colEstoque=35,colPedido=35;/const colCodigo=27,colProduto=108,colEstoque=27,colPedido=28;/g" "$HTML"

          echo "Corrigindo limpeza depois do envio..."

          python3 - "$HTML" <<'PY'
import sys
from pathlib import Path

arquivo = Path(sys.argv[1])
texto = arquivo.read_text(encoding="utf-8")

antigo = "window.AndroidFileBridge.sharePdf(nomeArquivo,base64);"

novo = "finalizedRows=rows; clearPedido(); window.AndroidFileBridge.sharePdf(nomeArquivo,base64);"

if antigo in texto and "finalizedRows=rows; clearPedido(); window.AndroidFileBridge.sharePdf(nomeArquivo,base64);" not in texto:
    texto = texto.replace(antigo, novo, 1)
    print("Envio + limpeza corrigidos.")
else:
    print("Fluxo de envio já estava corrigido ou não foi encontrado.")

arquivo.write_text(texto, encoding="utf-8")
PY

          echo "Corrigindo bibliotecas locais..."

          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js#xlsx.full.min.js#g" "$HTML"

          sed -i "s#https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js#jspdf.umd.min.js#g" "$HTML"

          echo "Correções concluídas."

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas OK."

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          echo "Verificando PDF..."

          if grep -q "orientation:'landscape'" "$HTML"; then
            echo "ERRO: PDF landscape ainda encontrado."
            exit 1
          fi

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: PDF landscape ainda encontrado."
            exit 1
          fi

          if ! grep -q "orientation:'portrait'" "$HTML"; then
            echo "ERRO: PDF portrait não encontrado."
            exit 1
          fi

          if ! grep -q "pageWidth=210,pageHeight=297" "$HTML"; then
            echo "ERRO: A4 retrato não encontrado."
            exit 1
          fi

          echo "Verificando limpeza..."

          if ! grep -q "function clearPedido" "$HTML"; then
            echo "ERRO: clearPedido não encontrada."
            exit 1
          fi

          if ! grep -q "pedido_compras_vals" "$HTML"; then
            echo "ERRO: armazenamento do pedido não encontrado."
            exit 1
          fi

          if ! grep -q "pedido_compras_extras" "$HTML"; then
            echo "ERRO: armazenamento dos adicionais não encontrado."
            exit 1
          fi

          if ! grep -q "pedido_compras_validade_curta" "$HTML"; then
            echo "ERRO: armazenamento da validade não encontrado."
            exit 1
          fi

          if ! grep -q "finalizedRows=rows; clearPedido();" "$HTML"; then
            echo "ERRO: limpeza após geração do PDF não encontrada."
            exit 1
          fi

          echo "===================================="
          echo "VERIFICAÇÃO APROVADA"
          echo "===================================="
          echo "PDF: A4 RETRATO"
          echo "210 x 297 mm"
          echo "Pedido: será zerado"
          echo "Estoque: será zerado"
          echo "Cadastro: preservado"
          echo "Histórico: preservado"
          echo "===================================="

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não encontrado."
            exit 1
          fi

          echo "===================================="
          echo "APK GERADO COM SUCESSO"
          echo "===================================="

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
