name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto - BASE 49
        uses: actions/checkout@v4
        with:
          ref: 4e67e53aa453548944592d7b7f417fb77ca9fe7c
          fetch-depth: 1

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find \
            "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit \
            | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF \
            "android.useAndroidX=true" \
            gradle.properties \
            || echo "android.useAndroidX=true" \
            >> gradle.properties

          grep -qF \
            "android.enableJetifier=true" \
            gradle.properties \
            || echo "android.enableJetifier=true" \
            >> gradle.properties

      # ============================================================
      # RELATÓRIO ORIGINAL DA #49
      # NÃO ALTERAR O openPDF
      # ============================================================

      - name: Aplicar EXATAMENTE o relatório aprovado da #49
        shell: bash
        run: |
          set -e

          git show HEAD:.github/workflows/build.yml \
            > /tmp/build-base49.yml

          test -s /tmp/build-base49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build-base49.yml"
          ).read_text(
              encoding="utf-8"
          )

          lines = source.splitlines()

          start = None

          for i, line in enumerate(lines):
              if line.strip() == "- name: Alterar SOMENTE o relatório":
                  start = i
                  break

          if start is None:
              raise SystemExit(
                  "ERRO: etapa do relatório #49 não encontrada."
              )

          run_line = None

          for i in range(start + 1, len(lines)):

              if re.match(
                  r"^        run:\s*\|\s*$",
                  lines[i]
              ):
                  run_line = i
                  break

              if re.match(
                  r"^      - name:",
                  lines[i]
              ):
                  break

          if run_line is None:
              raise SystemExit(
                  "ERRO: bloco run do relatório não encontrado."
              )

          script = []

          for line in lines[run_line + 1:]:

              if re.match(
                  r"^      - name:",
                  line
              ):
                  break

              if line.startswith("          "):
                  script.append(line[10:])
              elif line.strip() == "":
                  script.append("")
              else:
                  raise SystemExit(
                      "ERRO: estrutura do relatório #49 inválida."
                  )

          report = "\n".join(script).rstrip() + "\n"

          required = [
              "async function openPDF(sendViaWhatsApp=false)",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "clearPedido()",
              "orientation:'portrait'",
              "format:'a4'"
          ]

          for item in required:
              if item not in report:
                  raise SystemExit(
                      "ERRO no relatório #49: " + item
                  )

          Path(
              "/tmp/relatorio-v49.sh"
          ).write_text(
              report,
              encoding="utf-8"
          )

          print(
              "OK - relatório #49 encontrado e validado."
          )

          PY

          chmod +x /tmp/relatorio-v49.sh

          bash /tmp/relatorio-v49.sh

          echo "OK - relatório #49 aplicado."

      # ============================================================
      # CORREÇÕES JAVASCRIPT
      # JAVASCRIPT PURO - SEM TAG <script>
      # ============================================================

      - name: Criar arquivo de correções JavaScript
        shell: bash
        run: |
          set -e

          cat > /tmp/super-pedido-fix.js <<'FIXJS'
          (function(){

            const superPedidoOriginalOpenAdmin =
              window.openAdmin;

            window.openAdmin = function(){

              if(
                typeof featureModal !== "function" ||
                typeof superPedidoOriginalOpenAdmin !== "function"
              ){

                alert(
                  "Administração indisponível."
                );

                return;
              }

              featureModal(`

                <h3>🔐 Administração</h3>

                <p>
                  Digite o PIN de administração.
                </p>

                <input
                  id="superPedidoAdminPin"
                  type="password"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="PIN"
                  style="
                    width:100%;
                    box-sizing:border-box;
                    padding:12px;
                    font-size:18px;
                    margin-bottom:10px;
                  "
                >

                <button
                  onclick="superPedidoConfirmarAdmin()"
                >
                  Entrar
                </button>

                <button
                  onclick="closeFeature()"
                >
                  Cancelar
                </button>

              `);

              setTimeout(
                function(){

                  const campo =
                    document.getElementById(
                      "superPedidoAdminPin"
                    );

                  if(!campo){
                    return;
                  }

                  campo.focus();

                  campo.addEventListener(
                    "keydown",
                    function(event){

                      if(
                        event.key === "Enter"
                      ){

                        superPedidoConfirmarAdmin();

                      }

                    }
                  );

                },
                100
              );
            };


            window.superPedidoConfirmarAdmin =
              function(){

                const campo =
                  document.getElementById(
                    "superPedidoAdminPin"
                  );

                const pin =
                  campo
                    ? String(
                        campo.value || ""
                      )
                    : "";

                const salvo =
                  localStorage.getItem(
                    "sp_admin_pin"
                  ) || "1234";

                if(pin !== salvo){

                  alert(
                    "PIN incorreto."
                  );

                  if(campo){

                    campo.value = "";

                    campo.focus();

                  }

                  return;
                }

                const promptOriginal =
                  window.prompt;

                window.prompt =
                  function(){

                    return pin;

                  };

                try{

                  superPedidoOriginalOpenAdmin.call(
                    window
                  );

                }finally{

                  window.prompt =
                    promptOriginal;

                }

              };


            window.repeatLastOrder =
              function(){

                let rows = [];

                let observation = "";


                try{

                  if(
                    typeof lastOrder !== "undefined" &&
                    Array.isArray(lastOrder) &&
                    lastOrder.length
                  ){

                    rows =
                      JSON.parse(
                        JSON.stringify(
                          lastOrder
                        )
                      );

                  }

                }catch(error){}


                if(!rows.length){

                  try{

                    const saved =
                      localStorage.getItem(
                        "sp_last_order"
                      );

                    if(saved){

                      const parsed =
                        JSON.parse(saved);

                      if(
                        Array.isArray(parsed) &&
                        parsed.length
                      ){

                        rows = parsed;

                        if(
                          typeof lastOrder !==
                          "undefined"
                        ){

                          lastOrder =
                            JSON.parse(
                              JSON.stringify(
                                parsed
                              )
                            );

                        }

                      }

                    }

                  }catch(error){}

                }


                if(!rows.length){

                  try{

                    if(
                      typeof historyOrders !==
                      "undefined" &&
                      Array.isArray(
                        historyOrders
                      ) &&
                      historyOrders.length
                    ){

                      const ultimo =
                        historyOrders[0];

                      if(
                        ultimo &&
                        Array.isArray(
                          ultimo.rows
                        )
                      ){

                        rows =
                          JSON.parse(
                            JSON.stringify(
                              ultimo.rows
                            )
                          );

                        observation =
                          String(
                            ultimo.generalObservation ||
                            ""
                          );

                      }

                    }

                  }catch(error){}

                }


                if(!rows.length){

                  alert(
                    "Ainda não existe último pedido."
                  );

                  return;

                }


                window.applyRepeat(
                  rows,
                  observation
                );

              };


            window.applyRepeat =
              function(
                rows,
                observation
              ){

                if(
                  !Array.isArray(rows) ||
                  !rows.length
                ){

                  alert(
                    "Não foi possível recuperar o último pedido."
                  );

                  return;

                }


                vals = {};

                extras = [];


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                rows.forEach(
                  function(item){

                    if(!item){
                      return;
                    }


                    if(
                      item.cat ===
                      "Produto Adicional"
                    ){

                      extras.push({

                        code:
                          item.code === "-"
                            ? ""
                            : String(
                                item.code || ""
                              ),

                        name:
                          String(
                            item.name || ""
                          ),

                        qty:
                          Number(
                            item.order
                          ) || 0

                      });

                      return;

                    }


                    if(
                      typeof productByCode !==
                      "function"
                    ){

                      return;

                    }


                    const produto =
                      productByCode(
                        item.code
                      );


                    if(!produto){
                      return;
                    }


                    vals[
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "o"
                      )
                    ] =
                      Number(
                        item.order
                      ) || 0;


                    vals[
                      key(
                        produto.c,
                        produto.s,
                        produto.i,
                        "s"
                      )
                    ] =
                      Number(
                        item.stock
                      ) || 0;

                  }
                );


                let obs =
                  String(
                    observation || ""
                  );


                if(
                  !obs &&
                  rows.generalObservation
                ){

                  obs =
                    String(
                      rows.generalObservation
                    );

                }


                generalObservation =
                  obs;


                const campo =
                  document.getElementById(
                    "generalObs"
                  );


                if(campo){

                  campo.value =
                    generalObservation;

                }


                if(
                  typeof save ===
                  "function"
                ){

                  save();

                }


                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                if(
                  typeof closeFeature ===
                  "function"
                ){

                  closeFeature();

                }


                alert(
                  "Último pedido recuperado. Confira antes de enviar."
                );

              };


            window.clearPedido =
              function(){

                let linhas = [];


                try{

                  if(
                    typeof finalizedRows !==
                    "undefined" &&
                    Array.isArray(
                      finalizedRows
                    ) &&
                    finalizedRows.length
                  ){

                    linhas =
                      JSON.parse(
                        JSON.stringify(
                          finalizedRows
                        )
                      );

                  }

                }catch(error){}


                let jaSalvo = false;


                try{

                  if(
                    linhas.length &&
                    typeof historyOrders !==
                    "undefined" &&
                    Array.isArray(
                      historyOrders
                    ) &&
                    historyOrders.length
                  ){

                    const ultimo =
                      historyOrders[0];

                    if(
                      ultimo &&
                      Array.isArray(
                        ultimo.rows
                      )
                    ){

                      jaSalvo =
                        JSON.stringify(
                          ultimo.rows
                        ) ===
                        JSON.stringify(
                          linhas
                        );

                    }

                  }

                }catch(error){}


                if(
                  linhas.length &&
                  !jaSalvo &&
                  typeof saveHistory ===
                  "function"
                ){

                  saveHistory(
                    linhas
                  );

                }


                vals = {};

                extras = [];

                finalizedRows = [];

                generalObservation = "";


                if(
                  typeof validadeCurta !==
                  "undefined"
                ){

                  validadeCurta = [];

                }


                localStorage.removeItem(
                  "pedido_compras_vals"
                );

                localStorage.removeItem(
                  "pedido_compras_extras"
                );

                localStorage.removeItem(
                  "pedido_compras_validade_curta"
                );

                localStorage.removeItem(
                  "sp_general_obs"
                );


                const campoObs =
                  document.getElementById(
                    "generalObs"
                  );


                if(campoObs){

                  campoObs.value = "";

                }


                if(
                  typeof saveFeatures ===
                  "function"
                ){

                  saveFeatures();

                }


                if(
                  typeof render ===
                  "function"
                ){

                  render();

                }


                if(
                  typeof renderValidadeCurta ===
                  "function"
                ){

                  renderValidadeCurta();

                }


                if(
                  typeof updateBadge ===
                  "function"
                ){

                  updateBadge();

                }


                const opcoes =
                  document.getElementById(
                    "opcoesFinalizado"
                  );


                if(opcoes){

                  opcoes.style.display =
                    "none";

                }


                window.scrollTo({

                  top: 0,

                  behavior: "smooth"

                });

              };

          })();
          FIXJS

          test -s /tmp/super-pedido-fix.js

          node --check /tmp/super-pedido-fix.js

          echo "OK - JavaScript da correção validado."

      # ============================================================
      # INSERIR CORREÇÃO NO INDEX
      # ============================================================

      - name: Aplicar correções na build
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          test -s /tmp/super-pedido-fix.js

          python3 - <<'PY'
          import os
          from pathlib import Path

          html = (
              Path(
                  os.environ["ANDROID_DIR"]
              )
              / "app/src/main/assets/app/index.html"
          )

          text = html.read_text(
              encoding="utf-8"
          )

          patch = Path(
              "/tmp/super-pedido-fix.js"
          ).read_text(
              encoding="utf-8"
          )

          if "</body>" not in text:
              raise SystemExit(
                  "ERRO: </body> não encontrado."
              )

          if (
              "async function openPDF(sendViaWhatsApp=false)"
              not in text
          ):
              raise SystemExit(
                  "ERRO: relatório #49 não encontrado."
              )

          if (
              "window.AndroidFileBridge.sharePdf"
              not in text
          ):
              raise SystemExit(
                  "ERRO: AndroidFileBridge não encontrado."
              )

          if (
              "orientation:'portrait'"
              not in text
          ):
              raise SystemExit(
                  "ERRO: relatório não está em retrato."
              )

          script = (
              "\n<script>\n"
              + patch
              + "\n</script>\n"
          )

          text = text.replace(
              "</body>",
              script + "</body>",
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK - correções inseridas."
          )

          print(
              "OK - relatório #49 preservado."
          )

          print(
              "OK - openPDF preservado."
          )

          PY

      # ============================================================
      # BIBLIOTECAS
      # ============================================================

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      # ============================================================
      # VERIFICAÇÃO JAVASCRIPT
      #
      # SEM PYTHON DESNECESSÁRIO.
      # ============================================================

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "window.openAdmin" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder" \
            "$HTML"

          grep -q \
            "window.applyRepeat" \
            "$HTML"

          grep -q \
            "window.clearPedido" \
            "$HTML"

          grep -q \
            "function saveHistory(rows)" \
            "$HTML"

          grep -q \
            "CÓDIGO" \
            "$HTML"

          grep -q \
            "NOME DO PRODUTO" \
            "$HTML"

          grep -q \
            "ESTOQUE" \
            "$HTML"

          grep -q \
            "PEDIDO" \
            "$HTML"

          if grep -q \
            "orientation:'landscape'" \
            "$HTML"; then

            echo "ERRO: relatório em paisagem."

            exit 1

          fi

          if grep -q \
            'orientation:"landscape"' \
            "$HTML"; then

            echo "ERRO: relatório em paisagem."

            exit 1

          fi

          python3 - "$HTML" <<'PY'
          import re
          import sys
          from pathlib import Path

          html = Path(
              sys.argv[1]
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
          )

          if not scripts:
              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              "\n".join(scripts),
              encoding="utf-8"
          )

          print(
              "JavaScript extraído para validação."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo ""
          echo "=========================================="
          echo " VERIFICAÇÃO JAVASCRIPT: OK"
          echo "=========================================="

      # ============================================================
      # VERIFICAÇÃO FINAL
      # ============================================================

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          grep -q \
            "async function openPDF(sendViaWhatsApp=false)" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          grep -q \
            "window.openAdmin" \
            "$HTML"

          grep -q \
            "window.repeatLastOrder" \
            "$HTML"

          grep -q \
            "window.applyRepeat" \
            "$HTML"

          grep -q \
            "window.clearPedido" \
            "$HTML"

          grep -q \
            "orientation:'portrait'" \
            "$HTML"

          grep -q \
            "format:'a4'" \
            "$HTML"

          echo ""
          echo "=========================================="
          echo " VERIFICAÇÃO FINAL - OK"
          echo "=========================================="
          echo "BASE 49 ................ OK"
          echo "RELATÓRIO .............. OK"
          echo "PDF A4 RETRATO ......... OK"
          echo "ADM .................... OK"
          echo "REPETIR ................ OK"
          echo "LIMPAR ................. OK"
          echo "JAVASCRIPT ............. OK"
          echo "=========================================="

      # ============================================================
      # COMPILAR APK
      # ============================================================

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      # ============================================================
      # VERIFICAR APK
      # ============================================================

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo " APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      # ============================================================
      # DISPONIBILIZAR APK
      # ============================================================

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
