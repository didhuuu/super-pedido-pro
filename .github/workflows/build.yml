name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir somente PDF e limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # LOCALIZAR OPENPDF
          #
          # Aceita tanto:
          #
          # async function openPDF()
          #
          # quanto:
          #
          # function openPDF()
          #
          # sem usar regex.
          # ==========================================================

          marker = "function openPDF"

          pos = text.find(marker)

          if pos == -1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada"
              )

          # Se existir "async " imediatamente antes,
          # inclui o async na substituição.
          if pos >= 6 and text[pos-6:pos] == "async ":
              open_start = pos - 6
          else:
              open_start = pos

          # ==========================================================
          # LOCALIZAR CLEARPEDIDO
          # ==========================================================

          clear_start = text.find(
              "function clearPedido",
              pos
          )

          if clear_start == -1:
              raise SystemExit(
                  "ERRO: função clearPedido não encontrada"
              )

          # ==========================================================
          # LOCALIZAR SENDWHATSAPP
          # ==========================================================

          send_start = text.find(
              "function sendWhatsApp",
              clear_start
          )

          if send_start == -1:
              raise SystemExit(
                  "ERRO: função sendWhatsApp não encontrada"
              )

          # ==========================================================
          # NOVA FUNÇÃO OPENPDF
          #
          # SOMENTE PDF.
          #
          # A4 RETRATO:
          # 210 x 297 mm
          # ==========================================================

          new_open_pdf = r"""async function openPDF(){

            const rows=
              finalizedRows.length
              ? finalizedRows
              : getRows();

            if(!rows.length){

              alert(
                'Nenhum item foi selecionado.'
              );

              return;
            }

            try{

              const {jsPDF}=
                window.jspdf||{};

              if(!jsPDF){

                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              /*
               * A4 RETRATO.
               *
               * NÃO usar landscape.
               */
              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;
              const margem=10;

              const colCodigo=30;
              const colEstoque=25;
              const colPedido=25;

              const colProduto=
                pageWidth-
                (margem*2)-
                colCodigo-
                colEstoque-
                colPedido;

              const alturaCabecalho=8;
              const alturaLinha=7;

              let y=12;

              const data=
                new Date().toLocaleDateString(
                  'pt-BR',
                  {
                    day:'2-digit',
                    month:'2-digit',
                    year:'numeric'
                  }
                );

              function titulo(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(18);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {
                    align:'center'
                  }
                );

                y+=8;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(10);

                doc.text(
                  'Data: '+data,
                  margem,
                  y
                );

                y+=7;
              }

              function novaPagina(){

                doc.addPage();

                y=12;

                titulo();
              }

              function nomeProduto(nome){

                const original=
                  String(nome||'');

                let valor=original;

                doc.setFontSize(8);

                while(
                  doc.getTextWidth(valor)>
                  colProduto-6 &&
                  valor.length>3
                ){

                  valor=
                    valor.slice(
                      0,
                      -1
                    );
                }

                if(
                  valor!==original
                ){

                  valor=
                    valor.slice(
                      0,
                      Math.max(
                        1,
                        valor.length-3
                      )
                    )+
                    '...';
                }

                return valor;
              }

              function cabecalhoTabela(){

                if(
                  y+alturaCabecalho>
                  pageHeight-10
                ){

                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaCabecalho
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaCabecalho
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaCabecalho
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaCabecalho
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo+
                  colCodigo/2,
                  y+5.2,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto+3,
                  y+5.2
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque+
                  colEstoque/2,
                  y+5.2,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  'PEDIDO',
                  xPedido+
                  colPedido/2,
                  y+5.2,
                  {
                    align:'center'
                  }
                );

                y+=alturaCabecalho;
              }

              function linhaProduto(item){

                if(
                  y+alturaLinha>
                  pageHeight-10
                ){

                  novaPagina();

                  cabecalhoTabela();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  alturaLinha
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  alturaLinha
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  alturaLinha
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  alturaLinha
                );

                doc.text(
                  String(
                    item.code||'-'
                  ),
                  xCodigo+3,
                  y+4.8
                );

                doc.text(
                  nomeProduto(
                    item.name
                  ),
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  String(
                    item.stock??0
                  ),
                  xEstoque+
                  colEstoque/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                doc.text(
                  String(
                    item.order??0
                  ),
                  xPedido+
                  colPedido/2,
                  y+4.8,
                  {
                    align:'center'
                  }
                );

                y+=alturaLinha;
              }

              titulo();

              const grupos=
                groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y+25>
                  pageHeight-10
                ){

                  novaPagina();
                }

                y+=5;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(12);

                doc.text(
                  String(
                    categoria||''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y+=4;

                cabecalhoTabela();

                for(
                  const item of items
                ){

                  linhaProduto(
                    item
                  );
                }
              }

              if(
                typeof generalObservation!==
                'undefined' &&
                generalObservation
              ){

                if(
                  y+20>
                  pageHeight-10
                ){

                  novaPagina();
                }

                y+=7;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const observacao=
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    pageWidth-
                    margem*2
                  );

                doc.text(
                  observacao,
                  margem,
                  y
                );
              }

              const totalPaginas=
                doc.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=totalPaginas;
                pagina++
              ){

                doc.setPage(
                  pagina
                );

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+
                  pagina+
                  ' de '+
                  totalPaginas,
                  pageWidth-margem,
                  pageHeight-5,
                  {
                    align:'right'
                  }
                );
              }

              /*
               * O PDF fica pronto na memória
               * antes de limpar as quantidades.
               */
              const base64=
                doc.output(
                  'datauristring'
                ).split(',')[1];

              const nomeArquivo=
                'relatorio-pedido-' +
                data.replace(
                  /\//g,
                  '-'
                )+
                '.pdf';

              /*
               * IMPORTANTE:
               *
               * clearPedido(rows):
               *
               * 1. salva o histórico;
               * 2. zera as quantidades;
               * 3. remove os dados salvos;
               * 4. atualiza a tela.
               *
               * Depois disso o PDF é enviado.
               */
              clearPedido(
                rows
              );

              if(
                window.AndroidFileBridge &&
                typeof
                window.AndroidFileBridge.sharePdf===
                'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                return;
              }

              /*
               * Fallback para navegador.
               */
              const byteChars=
                atob(base64);

              const bytes=
                new Uint8Array(
                  byteChars.length
                );

              for(
                let i=0;
                i<byteChars.length;
                i++
              ){

                bytes[i]=
                  byteChars.charCodeAt(i);
              }

              const blob=
                new Blob(
                  [bytes],
                  {
                    type:
                      'application/pdf'
                  }
                );

              const url=
                URL.createObjectURL(
                  blob
                );

              const a=
                document.createElement(
                  'a'
                );

              a.href=url;

              a.download=
                nomeArquivo;

              document.body.appendChild(
                a
              );

              a.click();

              a.remove();

              setTimeout(
                ()=>{
                  URL.revokeObjectURL(
                    url
                  );
                },
                1000
              );

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message||e)
              );
            }
          }

          """

          # ==========================================================
          # SUBSTITUIR OPENPDF
          # ==========================================================

          text=(
              text[:open_start] +
              new_open_pdf +
              text[clear_start:]
          )

          # ==========================================================
          # NOVO CLEARPEDIDO
          #
          # Recebe as linhas do PDF quando necessário.
          #
          # Para WhatsApp continua funcionando com:
          #
          # clearPedido()
          # ==========================================================

          clear_start=text.find(
              "function clearPedido"
          )

          if clear_start==-1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrada após PDF"
              )

          send_start=text.find(
              "function sendWhatsApp",
              clear_start
          )

          if send_start==-1:
              raise SystemExit(
                  "ERRO: sendWhatsApp não encontrada após PDF"
              )

          new_clear = r"""function clearPedido(historyRows=null){

            /*
             * Usa as linhas recebidas pelo PDF.
             * No WhatsApp usa finalizedRows.
             */
            const historico=
              Array.isArray(historyRows) &&
              historyRows.length
              ? historyRows
              : finalizedRows;

            /*
             * Salva o histórico uma única vez.
             */
            if(
              Array.isArray(historico) &&
              historico.length
            ){

              saveHistory(
                historico
              );
            }

            /*
             * ZERA TODAS AS QUANTIDADES.
             */
            vals={};

            /*
             * ZERA EXTRAS.
             */
            extras=[];

            /*
             * ZERA VALIDADES.
             */
            validadeCurta=[];

            /*
             * ZERA CONFERÊNCIA.
             */
            finalizedRows=[];

            /*
             * LIMPA OBSERVAÇÃO.
             */
            generalObservation='';

            /*
             * REMOVE AS QUANTIDADES
             * SALVAS NO CELULAR.
             */
            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            /*
             * Limpa campo de observação.
             */
            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){

              obs.value='';
            }

            /*
             * Salva novamente o estado vazio.
             */
            save();

            /*
             * Atualiza a tela.
             */
            render();

            renderValidadeCurta();

            updateBadge();

            closeConference();

            /*
             * Esconde opções de finalização.
             */
            const opcoes=
              document.getElementById(
                'opcoesFinalizado'
              );

            if(opcoes){

              opcoes.style.display=
                'none';
            }

            /*
             * Volta a tela para o topo.
             */
            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }

          """

          text=(
              text[:clear_start] +
              new_clear +
              text[send_start:]
          )

          # ==========================================================
          # GARANTIR QUE O BOTÃO PDF CONTINUE CHAMANDO openPDF
          # ==========================================================

          text=text.replace(
              "document.getElementById('btnWhatsPdf').onclick=()=>openPDF(true);",
              "document.getElementById('btnWhatsPdf').onclick=openPDF;"
          )

          # ==========================================================
          # BIBLIOTECAS LOCAIS
          # ==========================================================

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ==========================================================
          # VERIFICAÇÕES INTERNAS DO HTML
          # ==========================================================

          if "async function openPDF()" not in text:
              raise SystemExit(
                  "ERRO: nova openPDF não foi inserida"
              )

          if "orientation:'portrait'" not in text:
              raise SystemExit(
                  "ERRO: PDF não está configurado como retrato"
              )

          if "pageWidth=210" not in text:
              raise SystemExit(
                  "ERRO: largura A4 não encontrada"
              )

          if "pageHeight=297" not in text:
              raise SystemExit(
                  "ERRO: altura A4 não encontrada"
              )

          if "clearPedido(rows)" not in text:
              raise SystemExit(
                  "ERRO: limpeza após PDF não encontrada"
              )

          if "vals={};" not in text:
              raise SystemExit(
                  "ERRO: zeragem de vals não encontrada"
              )

          if "localStorage.removeItem('pedido_compras_vals')" not in text:
              raise SystemExit(
                  "ERRO: remoção das quantidades salvas não encontrada"
              )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK: PDF A4 retrato e limpeza corrigidos."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          echo "Verificando PDF..."

          grep -Fq \
            "orientation:'portrait'" \
            "$HTML"

          grep -Fq \
            "pageWidth=210" \
            "$HTML"

          grep -Fq \
            "pageHeight=297" \
            "$HTML"

          if grep -Fq \
            "orientation:'landscape'" \
            "$HTML"
          then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          if grep -Fq \
            'orientation:"landscape"' \
            "$HTML"
          then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          echo "PDF RETRATO: OK"

          echo "Verificando limpeza..."

          grep -Fq \
            "vals={};" \
            "$HTML"

          grep -Fq \
            "extras=[];" \
            "$HTML"

          grep -Fq \
            "validadeCurta=[];" \
            "$HTML"

          grep -Fq \
            "finalizedRows=[];" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_vals')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_extras')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_validade_curta')" \
            "$HTML"

          grep -Fq \
            "clearPedido(rows)" \
            "$HTML"

          echo "LIMPEZA: OK"

          echo "Verificando aplicativo..."

          grep -Fq \
            "function reportText" \
            "$HTML"

          grep -Fq \
            "function sendWhatsApp" \
            "$HTML"

          grep -Fq \
            "function finish" \
            "$HTML"

          echo "FUNÇÕES EXISTENTES: OK"

          echo "Todas as verificações passaram."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "APK gerado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
