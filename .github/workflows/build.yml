name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto
          mkdir -p projeto

          test -f "Super-Pedido-Pro.zip"

          unzip -o "Super-Pedido-Pro.zip" -d projeto

          echo "Projeto extraído."

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          SETTINGS=$(find "$GITHUB_WORKSPACE/projeto" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print \
            -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          ANDROID_DIR=$(dirname "$SETTINGS")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "^android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "^android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          if [ ! -f "$HTML" ]; then
            echo "ERRO: index.html não encontrado."
            exit 1
          fi

          echo "Corrigindo PDF..."

          python3 -c 'from pathlib import Path; p=Path("'"$HTML"'"); s=p.read_text(encoding="utf-8"); s=s.replace("orientation:'"'"'landscape'"'"'","orientation:'"'"'portrait'"'"'"); s=s.replace("orientation: '"'"'landscape'"'"'","orientation: '"'"'portrait'"'"'"); s=s.replace("orientation:\"landscape\"","orientation:\"portrait\""); s=s.replace("orientation: \"landscape\"","orientation: \"portrait\""); s=s.replace("const pageWidth=297,pageHeight=210","const pageWidth=210,pageHeight=297"); s=s.replace("const pageWidth = 297,pageHeight = 210","const pageWidth = 210,pageHeight = 297"); s=s.replace("pageWidth=297,pageHeight=210","pageWidth=210,pageHeight=297"); s=s.replace("pageWidth = 297,pageHeight = 210","pageWidth = 210,pageHeight = 297"); s=s.replace("doc.addPage('"'"'a4'"'"','"'"'landscape'"'"')","doc.addPage('"'"'a4'"'"','"'"'portrait'"'"')"); s=s.replace("doc.addPage(\"a4\",\"landscape\")","doc.addPage(\"a4\",\"portrait\")"); p.write_text(s,encoding="utf-8")'

          echo "Corrigindo limpeza após envio do PDF..."

          python3 -c 'from pathlib import Path; p=Path("'"$HTML"'"); s=p.read_text(encoding="utf-8"); a="window.AndroidFileBridge.sharePdf(nomeArquivo,base64);"; b="clearPedido(rows);"+chr(10)+"      "+a; i=s.find(a); c=s.find("clearPedido(rows);"); already=(c!=-1 and c<i and i-c<100); s=s if already else (s[:i]+b+s[i+len(a):] if i!=-1 else s); p.write_text(s,encoding="utf-8")'

          echo "Garantindo limpeza do localStorage..."

          python3 -c 'from pathlib import Path; p=Path("'"$HTML"'"); s=p.read_text(encoding="utf-8"); pos=s.find("function clearPedido"); end=s.find("function sendWhatsApp",pos) if pos>=0 else -1; trecho=s[pos:end] if pos>=0 and end>=0 else ""; faltas=["pedido_compras_vals","pedido_compras_extras","pedido_compras_validade_curta"]; ins=""; [ins:=ins+chr(10)+"  localStorage.removeItem("+repr(k)+");" for k in faltas if k not in trecho]; ponto=trecho.find("render();"); s=s[:pos]+(trecho[:ponto]+ins+chr(10)+"  "+trecho[ponto:] if ins and ponto>=0 else trecho)+s[end:] if ins and pos>=0 and end>=0 and ponto>=0 else s; p.write_text(s,encoding="utf-8")'

          echo "Corrigindo bibliotecas..."

          python3 -c 'from pathlib import Path; p=Path("'"$HTML"'"); s=p.read_text(encoding="utf-8"); s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js","xlsx.full.min.js"); s=s.replace("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js","jspdf.umd.min.js"); p.write_text(s,encoding="utf-8")'

          echo "Correções concluídas."

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

          echo "Bibliotecas OK."

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          echo "Verificando PDF..."

          grep -q "orientation:'portrait'" "$HTML"

          grep -q "pageWidth=210" "$HTML"

          grep -q "pageHeight=297" "$HTML"

          echo "Verificando limpeza..."

          grep -q "function clearPedido" "$HTML"

          grep -q "pedido_compras_vals" "$HTML"

          grep -q "pedido_compras_extras" "$HTML"

          grep -q "pedido_compras_validade_curta" "$HTML"

          echo "Verificando ausência de landscape..."

          if grep -q "orientation:'landscape'" "$HTML"; then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          echo "Verificação concluída."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
