name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo - PDF retrato e limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # BIBLIOTECAS LOCAIS
          # ============================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ============================================================
          # LIMPEZA REAL DO PEDIDO
          # ============================================================

          new_clear = r'''function clearPedido(){

            try{
              if(
                typeof finalizedRows!=='undefined' &&
                finalizedRows.length &&
                typeof saveHistory==='function'
              ){
                saveHistory(finalizedRows);
              }
            }catch(e){
              console.warn(
                'Erro ao salvar histórico:',
                e
              );
            }

            /*
             * ZERA COMPLETAMENTE O ESTADO
             */
            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            generalObservation='';

            /*
             * REMOVE OS DADOS SALVOS
             */
            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            localStorage.removeItem(
              'sp_general_obs'
            );

            /*
             * LIMPA OBSERVAÇÃO
             */
            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            /*
             * REDESENHA A TELA
             */
            render();

            if(
              typeof renderValidadeCurta==='function'
            ){
              renderValidadeCurta();
            }

            updateBadge();

            closeConference();

            /*
             * GARANTIA EXTRA:
             * qualquer campo de quantidade
             * visível fica em zero.
             */
            document
              .querySelectorAll('input.qty')
              .forEach(el=>{
                el.value='0';
              });
          }'''

          text, count = re.subn(
              r"function clearPedido\(\)\{.*?\n\}",
              new_clear,
              text,
              count=1,
              flags=re.S
          )

          if count != 1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrado"
              )

          # ============================================================
          # NOVA FUNÇÃO OPENPDF
          #
          # A4 RETRATO
          # 210 x 297 mm
          #
          # O PDF é criado primeiro.
          # Depois o pedido é salvo no histórico e LIMPO.
          # Somente depois o Android recebe o PDF.
          # ============================================================

          pdf_function = r'''async function openPDF(
            sendViaWhatsApp=false
          ){

            const rows =
              finalizedRows.length
                ? finalizedRows
                : getRows();

            if(!rows.length){

              alert(
                'Nenhum item foi selecionado.'
              );

              return;
            }

            try{

              const {jsPDF} =
                window.jspdf || {};

              if(!jsPDF){

                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              /*
               * ======================================================
               * A4 RETRATO
               * ======================================================
               */
              const doc =
                new jsPDF({
                  orientation:'portrait',
                  unit:'mm',
                  format:'a4'
                });

              const pageWidth=210;

              const pageHeight=297;

              const margem=10;

              const larguraTabela=190;

              /*
               * COLUNAS
               */
              const colCodigo=27;

              const colProduto=108;

              const colEstoque=27;

              const colPedido=28;

              const xCodigo=margem;

              const xProduto=
                xCodigo+colCodigo;

              const xEstoque=
                xProduto+colProduto;

              const xPedido=
                xEstoque+colEstoque;

              const alturaCabecalho=7;

              const alturaLinha=6;

              let y=14;

              const data=
                new Date().toLocaleDateString(
                  'pt-BR',
                  {
                    day:'2-digit',
                    month:'2-digit',
                    year:'numeric'
                  }
                );

              /*
               * ======================================================
               * TÍTULO
               * ======================================================
               */
              function titulo(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(16);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth/2,
                  y,
                  {
                    align:'center'
                  }
                );

                y+=8;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(9);

                doc.text(
                  'Data: '+data,
                  margem,
                  y
                );

                y+=8;
              }

              /*
               * ======================================================
               * CABEÇALHO DA TABELA
               * ======================================================
               */
              function cabecalhoTabela(){

                if(
                  y+
                  alturaCabecalho>
                  pageHeight-10
                ){

                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(7.5);

                doc.rect(
                  margem,
                  y,
                  larguraTabela,
                  alturaCabecalho
                );

                doc.line(
                  xProduto,
                  y,
                  xProduto,
                  y+alturaCabecalho
                );

                doc.line(
                  xEstoque,
                  y,
                  xEstoque,
                  y+alturaCabecalho
                );

                doc.line(
                  xPedido,
                  y,
                  xPedido,
                  y+alturaCabecalho
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo+2,
                  y+4.7
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto+2,
                  y+4.7
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque+2,
                  y+4.7
                );

                doc.text(
                  'PEDIDO',
                  xPedido+2,
                  y+4.7
                );

                y+=alturaCabecalho;
              }

              /*
               * ======================================================
               * NOME DO PRODUTO
               * ======================================================
               */
              function nomeProduto(nome){

                const original=
                  String(nome||'');

                let valor=original;

                doc.setFontSize(7.2);

                while(
                  valor.length>3 &&
                  doc.getTextWidth(
                    valor+'...'
                  )>
                  colProduto-4
                ){

                  valor=
                    valor.slice(0,-1);
                }

                if(
                  valor!==original
                ){

                  return valor+'...';
                }

                return valor;
              }

              /*
               * ======================================================
               * NOVA PÁGINA
               * ======================================================
               */
              function novaPagina(){

                doc.addPage(
                  'a4',
                  'portrait'
                );

                y=14;

                titulo();
              }

              /*
               * ======================================================
               * INÍCIO
               * ======================================================
               */
              titulo();

              const grupos=
                groupRows(rows);

              /*
               * ======================================================
               * CATEGORIAS
               * ======================================================
               */
              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(
                  y+20>
                  pageHeight-10
                ){

                  novaPagina();
                }

                /*
                 * NOME DA CATEGORIA
                 */
                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(10);

                doc.text(
                  String(
                    categoria||''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y+=5;

                /*
                 * CABEÇALHO
                 */
                cabecalhoTabela();

                /*
                 * PRODUTOS
                 */
                for(
                  const item of items
                ){

                  if(
                    y+alturaLinha>
                    pageHeight-10
                  ){

                    novaPagina();

                    doc.setFont(
                      'helvetica',
                      'bold'
                    );

                    doc.setFontSize(10);

                    doc.text(
                      String(
                        categoria||''
                      ).toUpperCase(),
                      margem,
                      y
                    );

                    y+=5;

                    cabecalhoTabela();
                  }

                  doc.setFont(
                    'helvetica',
                    'normal'
                  );

                  doc.setFontSize(7.2);

                  /*
                   * LINHA
                   */
                  doc.rect(
                    margem,
                    y,
                    larguraTabela,
                    alturaLinha
                  );

                  doc.line(
                    xProduto,
                    y,
                    xProduto,
                    y+alturaLinha
                  );

                  doc.line(
                    xEstoque,
                    y,
                    xEstoque,
                    y+alturaLinha
                  );

                  doc.line(
                    xPedido,
                    y,
                    xPedido,
                    y+alturaLinha
                  );

                  /*
                   * CÓDIGO
                   */
                  doc.text(
                    String(
                      item.code||'-'
                    ),
                    xCodigo+2,
                    y+4
                  );

                  /*
                   * PRODUTO
                   */
                  doc.text(
                    nomeProduto(
                      item.name
                    ),
                    xProduto+2,
                    y+4
                  );

                  /*
                   * ESTOQUE
                   */
                  doc.text(
                    String(
                      item.stock??0
                    ),
                    xEstoque+2,
                    y+4
                  );

                  /*
                   * PEDIDO
                   */
                  doc.text(
                    String(
                      item.order??0
                    ),
                    xPedido+2,
                    y+4
                  );

                  y+=alturaLinha;
                }

                y+=5;
              }

              /*
               * ======================================================
               * OBSERVAÇÃO
               * ======================================================
               */
              if(generalObservation){

                if(
                  y+20>
                  pageHeight-10
                ){

                  novaPagina();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                const linhas=
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    larguraTabela
                  );

                doc.text(
                  linhas,
                  margem,
                  y
                );
              }

              /*
               * ======================================================
               * RODAPÉ
               * ======================================================
               */
              const totalPaginas=
                doc.internal.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=totalPaginas;
                pagina++
              ){

                doc.setPage(
                  pagina
                );

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+
                  pagina+
                  ' de '+
                  totalPaginas,
                  pageWidth-margem,
                  pageHeight-5,
                  {
                    align:'right'
                  }
                );
              }

              /*
               * ======================================================
               * CONVERTE O PDF PARA BASE64
               * ======================================================
               */
              const base64=
                doc
                  .output(
                    'datauristring'
                  )
                  .split(',')[1];

              const nomeArquivo=
                'relatorio-pedido-'+
                data.replace(
                  /\//g,
                  '-'
                )+
                '.pdf';

              /*
               * ======================================================
               * IMPORTANTE
               *
               * 1. O PDF já está pronto.
               * 2. Salva histórico.
               * 3. LIMPA pedido.
               * 4. Só então abre o compartilhamento.
               * ======================================================
               */

              if(
                typeof saveHistory===
                'function'
              ){

                saveHistory(rows);
              }

              /*
               * LIMPA ANTES DO SHARE
               */
              clearPedido();

              /*
               * ======================================================
               * ANDROID
               * ======================================================
               */
              if(
                window.AndroidFileBridge &&
                typeof
                window.AndroidFileBridge.sharePdf===
                'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                return;
              }

              /*
               * ======================================================
               * NAVEGADOR
               * ======================================================
               */
              const byteChars=
                atob(base64);

              const bytes=
                new Uint8Array(
                  byteChars.length
                );

              for(
                let i=0;
                i<byteChars.length;
                i++
              ){

                bytes[i]=
                  byteChars.charCodeAt(i);
              }

              const blob=
                new Blob(
                  [bytes],
                  {
                    type:
                      'application/pdf'
                  }
                );

              const url=
                URL.createObjectURL(
                  blob
                );

              const a=
                document.createElement(
                  'a'
                );

              a.href=url;

              a.download=
                nomeArquivo;

              document
                .body
                .appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                ()=>{
                  URL.revokeObjectURL(
                    url
                  );
                },
                1000
              );

            }catch(e){

              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (
                  e.message||e
                )
              );
            }
          }'''

          # ============================================================
          # SUBSTITUIR OPENPDF INTEIRA
          # ============================================================

          inicio=
              text.find(
                  "async function openPDF"
              )

          if inicio < 0:
              raise SystemExit(
                  "ERRO: openPDF não encontrado"
              )

          fim=
              text.find(
                  "function clearPedido",
                  inicio
              )

          if fim < 0:
              raise SystemExit(
                  "ERRO: clearPedido não encontrado"
              )

          text=(
              text[:inicio]
              +
              pdf_function
              +
              "\n"
              +
              text[fim:]
          )

          # ============================================================
          # GARANTIR QUE A ORIENTAÇÃO ANTIGA NÃO SOBROU
          # ============================================================

          if "orientation:'landscape'" in text:
              raise SystemExit(
                  "ERRO: ainda existe orientation landscape no HTML"
              )

          if "orientation: 'landscape'" in text:
              raise SystemExit(
                  "ERRO: ainda existe orientation landscape no HTML"
              )

          # ============================================================
          # GARANTIR RETRATO
          # ============================================================

          if "orientation:'portrait'" not in text:
              raise SystemExit(
                  "ERRO: orientação retrato não encontrada"
              )

          if "pageWidth=210" not in text:
              raise SystemExit(
                  "ERRO: largura A4 retrato não encontrada"
              )

          if "pageHeight=297" not in text:
              raise SystemExit(
                  "ERRO: altura A4 retrato não encontrada"
              )

          # ============================================================
          # SALVAR HTML
          # ============================================================

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "HTML corrigido com sucesso."
          )

          print(
              "PDF: A4 RETRATO"
          )

          print(
              "Limpeza: ATIVA"
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correcoes
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          echo "Verificando PDF..."

          grep -q "orientation:'portrait'" "$HTML"

          grep -q "format:'a4'" "$HTML"

          grep -q "pageWidth=210" "$HTML"

          grep -q "pageHeight=297" "$HTML"

          grep -q "RELATÓRIO DE PEDIDO" "$HTML"

          grep -q "window.AndroidFileBridge.sharePdf" "$HTML"

          echo "Verificando limpeza..."

          grep -q "vals={};" "$HTML"

          grep -q "extras=[];" "$HTML"

          grep -q "validadeCurta=[];" "$HTML"

          grep -q "finalizedRows=[];" "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_vals')" \
            "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_extras')" \
            "$HTML"

          grep -q \
            "localStorage.removeItem('pedido_compras_validade_curta')" \
            "$HTML"

          if grep -q "orientation:'landscape'" "$HTML"; then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "VERIFICACAO CONCLUIDA"
          echo "PDF: A4 RETRATO"
          echo "LIMPEZA: COMPLETA"
          echo "======================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            --stacktrace \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "======================================"
          echo "APK GERADO COM SUCESSO"
          echo "======================================"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
