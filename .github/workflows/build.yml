name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # BIBLIOTECAS LOCAIS
          # ============================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ============================================================
          # CORREÇÃO DO clearPedido
          #
          # Apaga somente o pedido atual.
          #
          # NÃO apaga:
          # catálogo
          # favoritos
          # histórico
          # último pedido
          # produtos cadastrados
          # configurações
          # ============================================================

          clear_code = r"""
          window.clearPedidoFinal = function(historyRows){

            try{

              if(
                Array.isArray(historyRows) &&
                historyRows.length
              ){

                lastOrder =
                  JSON.parse(
                    JSON.stringify(historyRows)
                  );

                historyOrders.unshift({
                  date:
                    new Date().toLocaleString('pt-BR'),

                  generalObservation:
                    generalObservation || '',

                  rows:
                    JSON.parse(
                      JSON.stringify(historyRows)
                    )
                });

                historyOrders =
                  historyOrders.slice(0,20);

                if(
                  typeof saveFeatures === 'function'
                ){
                  saveFeatures();
                }
              }


              /*
               * ZERA O PEDIDO
               */
              vals = {};
              extras = [];
              validadeCurta = [];
              finalizedRows = [];
              generalObservation = '';


              /*
               * REMOVE SOMENTE OS DADOS DO PEDIDO
               */
              localStorage.removeItem(
                'pedido_compras_vals'
              );

              localStorage.removeItem(
                'pedido_compras_extras'
              );

              localStorage.removeItem(
                'pedido_compras_validade_curta'
              );

              localStorage.removeItem(
                'sp_general_obs'
              );


              /*
               * Salva o estado vazio.
               */
              if(
                typeof save === 'function'
              ){
                save();
              }


              /*
               * Mantém histórico e último pedido.
               */
              if(
                typeof saveFeatures === 'function'
              ){
                saveFeatures();
              }


              const obs =
                document.getElementById(
                  'generalObs'
                );

              if(obs){
                obs.value = '';
              }


              if(
                typeof render === 'function'
              ){
                render();
              }


              if(
                typeof renderValidadeCurta === 'function'
              ){
                renderValidadeCurta();
              }


              if(
                typeof updateBadge === 'function'
              ){
                updateBadge();
              }


              if(
                typeof closeConference === 'function'
              ){
                closeConference();
              }


            }catch(e){

              console.error(
                'clearPedidoFinal:',
                e
              );

              alert(
                'Erro ao limpar pedido: ' +
                e.message
              );
            }
          };
          """

          # ============================================================
          # CORREÇÃO DO REPETIR ÚLTIMO PEDIDO
          # ============================================================

          repeat_code = r"""
          window.repeatLastOrderFinal = function(){

            let rows =
              Array.isArray(lastOrder)
                ? lastOrder
                : [];

            let observation =
              '';


            if(
              !rows.length &&
              Array.isArray(historyOrders) &&
              historyOrders.length
            ){

              rows =
                historyOrders[0].rows || [];

              observation =
                historyOrders[0]
                  .generalObservation || '';
            }


            if(!rows.length){

              alert(
                'Ainda não existe último pedido.'
              );

              return;
            }


            vals = {};
            extras = [];
            validadeCurta = [];


            rows.forEach(function(x){

              if(
                x.cat === 'Produto Adicional'
              ){

                extras.push({
                  code:
                    x.code === '-'
                      ? ''
                      : x.code,

                  name:
                    x.name,

                  qty:
                    Number(x.order) || 0
                });

                return;
              }


              if(
                x.cat === '⚠️ Validade Curta'
              ){

                validadeCurta.push({

                  code:
                    x.code === '-'
                      ? ''
                      : x.code,

                  name:
                    x.name,

                  qty:
                    Number(x.order) || 0,

                  date:
                    x.validade || ''
                });

                return;
              }


              if(
                typeof productByCode !== 'function'
              ){
                return;
              }


              const f =
                productByCode(
                  x.code
                );


              if(!f){
                return;
              }


              vals[
                key(
                  f.c,
                  f.s,
                  f.i,
                  'o'
                )
              ] =
                Number(x.order) || 0;


              vals[
                key(
                  f.c,
                  f.s,
                  f.i,
                  's'
                )
              ] =
                Number(x.stock) || 0;

            });


            generalObservation =
              observation ||
              generalObservation ||
              '';


            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value =
                generalObservation;
            }


            if(
              typeof save === 'function'
            ){
              save();
            }


            if(
              typeof saveFeatures === 'function'
            ){
              saveFeatures();
            }


            if(
              typeof render === 'function'
            ){
              render();
            }


            if(
              typeof renderValidadeCurta === 'function'
            ){
              renderValidadeCurta();
            }


            if(
              typeof updateBadge === 'function'
            ){
              updateBadge();
            }


            if(
              typeof closeFeature === 'function'
            ){
              closeFeature();
            }


            alert(
              'Último pedido recuperado. Confira antes de enviar.'
            );
          };
          """

          # ============================================================
          # CORREÇÃO DO PDF
          #
          # A4 RETRATO:
          # largura 210 mm
          # altura 297 mm
          # ============================================================

          pdf_code = r"""
          window.openPDFFinal = function(){

            const rows =
              Array.isArray(finalizedRows) &&
              finalizedRows.length
                ? finalizedRows
                : getRows();


            if(!rows.length){

              alert(
                'Nenhum item foi selecionado.'
              );

              return;
            }


            try{

              const jspdf =
                window.jspdf || {};

              const jsPDF =
                jspdf.jsPDF;


              if(!jsPDF){

                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }


              /*
               * A4 RETRATO
               */
              const doc =
                new jsPDF({
                  orientation: 'portrait',
                  unit: 'mm',
                  format: 'a4'
                });


              const pageWidth = 210;
              const pageHeight = 297;

              const margin = 10;

              const usableWidth =
                pageWidth -
                margin * 2;


              let y = 15;

              let page = 1;


              function footer(){

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margin,
                  pageHeight - 7
                );

                doc.text(
                  'Página ' + page,
                  pageWidth - margin,
                  pageHeight - 7,
                  {
                    align: 'right'
                  }
                );
              }


              function newPage(){

                footer();

                doc.addPage();

                page++;

                y = 15;
              }


              function title(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(14);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  pageWidth / 2,
                  y,
                  {
                    align: 'center'
                  }
                );

                y += 7;


                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Data: ' +
                  new Date()
                    .toLocaleString('pt-BR'),
                  margin,
                  y
                );

                y += 8;
              }


              /*
               * COLUNAS
               *
               * Código = 28
               * Produto = 112
               * Estoque = 25
               * Pedido = 25
               */
              const xCode =
                margin;

              const xName =
                margin + 28;

              const xStock =
                margin + 140;

              const xOrder =
                margin + 165;

              const xEnd =
                pageWidth - margin;


              function tableHeader(){

                if(
                  y + 8 >
                  pageHeight - 14
                ){

                  newPage();

                  title();
                }


                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(6.5);


                doc.rect(
                  margin,
                  y,
                  usableWidth,
                  8
                );


                doc.line(
                  xName,
                  y,
                  xName,
                  y + 8
                );

                doc.line(
                  xStock,
                  y,
                  xStock,
                  y + 8
                );

                doc.line(
                  xOrder,
                  y,
                  xOrder,
                  y + 8
                );


                doc.text(
                  'CÓDIGO',
                  xCode + 14,
                  y + 5,
                  {
                    align: 'center'
                  }
                );


                doc.text(
                  'PRODUTO',
                  xName + 2,
                  y + 5
                );


                doc.text(
                  'ESTOQUE',
                  xStock + 12.5,
                  y + 5,
                  {
                    align: 'center'
                  }
                );


                doc.text(
                  'PEDIDO',
                  xOrder + 12.5,
                  y + 5,
                  {
                    align: 'center'
                  }
                );


                y += 8;
              }


              function drawRow(item){

                const name =
                  String(
                    item.name || ''
                  );


                const nameLines =
                  doc.splitTextToSize(
                    name,
                    108
                  );


                const rowHeight =
                  Math.max(
                    7,
                    nameLines.length * 3.5 + 2
                  );


                if(
                  y + rowHeight >
                  pageHeight - 14
                ){

                  newPage();

                  title();

                  tableHeader();
                }


                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(6.2);


                /*
                 * Caixa.
                 */
                doc.rect(
                  margin,
                  y,
                  usableWidth,
                  rowHeight
                );


                /*
                 * Divisórias.
                 */
                doc.line(
                  xName,
                  y,
                  xName,
                  y + rowHeight
                );

                doc.line(
                  xStock,
                  y,
                  xStock,
                  y + rowHeight
                );

                doc.line(
                  xOrder,
                  y,
                  xOrder,
                  y + rowHeight
                );


                /*
                 * Código.
                 */
                doc.text(
                  String(
                    item.code || '-'
                  ),
                  xCode + 14,
                  y + rowHeight / 2 + 2,
                  {
                    align: 'center'
                  }
                );


                /*
                 * Nome.
                 */
                doc.text(
                  nameLines,
                  xName + 2,
                  y + 3.8
                );


                /*
                 * Estoque.
                 */
                doc.text(
                  String(
                    item.stock ?? 0
                  ),
                  xStock + 12.5,
                  y + rowHeight / 2 + 2,
                  {
                    align: 'center'
                  }
                );


                /*
                 * Pedido.
                 */
                doc.text(
                  String(
                    item.order ?? 0
                  ),
                  xOrder + 12.5,
                  y + rowHeight / 2 + 2,
                  {
                    align: 'center'
                  }
                );


                y += rowHeight;
              }


              title();


              const groups = {};


              rows.forEach(function(item){

                const category =
                  item.cat ||
                  'Outros';


                if(
                  !groups[category]
                ){
                  groups[category] = [];
                }


                groups[category].push(
                  item
                );
              });


              Object.entries(
                groups
              ).forEach(
                function(entry){

                  const category =
                    entry[0];

                  const items =
                    entry[1];


                  if(
                    y + 16 >
                    pageHeight - 14
                  ){

                    newPage();

                    title();
                  }


                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(8.5);


                  doc.text(
                    String(
                      category
                    ).toUpperCase(),
                    margin,
                    y
                  );


                  y += 4;


                  tableHeader();


                  items.forEach(
                    drawRow
                  );


                  y += 2;
                }
              );


              /*
               * Observação geral.
               */
              if(
                generalObservation
              ){

                if(
                  y + 15 >
                  pageHeight - 14
                ){

                  newPage();

                  title();
                }


                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(7);


                doc.text(
                  'OBSERVAÇÃO:',
                  margin,
                  y
                );


                y += 4;


                doc.setFont(
                  'helvetica',
                  'normal'
                );


                const obsLines =
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    usableWidth
                  );


                doc.text(
                  obsLines,
                  margin,
                  y
                );
              }


              footer();


              const base64 =
                doc
                  .output(
                    'datauristring'
                  )
                  .split(',')[1];


              const filename =
                'relatorio-pedido-' +
                new Date()
                  .toLocaleDateString(
                    'pt-BR'
                  )
                  .replace(
                    /\//g,
                    '-'
                  ) +
                '.pdf';


              /*
               * PRIMEIRO SALVA O HISTÓRICO
               * E ZERA O PEDIDO.
               */
              clearPedidoFinal(rows);


              /*
               * DEPOIS COMPARTILHA.
               */
              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf === 'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  filename,
                  base64
                );

              }else{

                doc.save(
                  filename
                );
              }


            }catch(e){

              console.error(
                'openPDFFinal:',
                e
              );

              alert(
                'Erro ao gerar PDF: ' +
                e.message
              );
            }
          };
          """

          # ============================================================
          # INSTALA AS CORREÇÕES ANTES DO </script>
          # ============================================================

          if "</script>" not in text:

              raise SystemExit(
                  "ERRO: </script> não encontrado"
              )


          injection = (
              "\n"
              + clear_code
              + "\n"
              + repeat_code
              + "\n"
              + pdf_code
              + "\n"
          )


          text =
              text.replace(
                  "</script>",
                  injection + "</script>",
                  1
              )


          # ============================================================
          # REDIRECIONA OS BOTÕES PARA AS VERSÕES CORRIGIDAS
          # ============================================================

          text = re.sub(
              r"document\.getElementById\('btnWhatsPdf'\)\.onclick\s*=\s*[^;]+;",
              "document.getElementById('btnWhatsPdf').onclick=function(){openPDFFinal();};",
              text,
              count=1
          )


          # Mantém o botão de repetir último funcionando.
          text = text.replace(
              "onclick=\"repeatLastOrder()\"",
              "onclick=\"repeatLastOrderFinal()\""
          )


          html.write_text(
              text,
              encoding="utf-8"
          )


          print(
              "HTML corrigido com sucesso."
          )

          PY

      - name: Preparar bibliotecas PDF e XLSX
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          echo "Verificando PDF retrato..."

          grep -q "orientation: 'portrait'" "$HTML"

          grep -q "openPDFFinal" "$HTML"

          echo "Verificando limpeza..."

          grep -q "clearPedidoFinal" "$HTML"

          grep -q "pedido_compras_vals" "$HTML"

          grep -q "pedido_compras_extras" "$HTML"

          grep -q "pedido_compras_validade_curta" "$HTML"

          echo "Verificando repetir último..."

          grep -q "repeatLastOrderFinal" "$HTML"

          echo "Verificando biblioteca PDF..."

          test -s "$ANDROID_DIR/app/src/main/assets/app/jspdf.umd.min.js"

          echo "Verificando biblioteca XLSX..."

          test -s "$ANDROID_DIR/app/src/main/assets/app/xlsx.full.min.js"

          if grep -q "orientation: 'landscape'" "$HTML"; then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          if grep -q 'orientation: "landscape"' "$HTML"; then
            echo "ERRO: ainda existe PDF landscape."
            exit 1
          fi

          echo ""
          echo "=========================================="
          echo "VERIFICAÇÃO OK"
          echo "PDF: A4 RETRATO"
          echo "LIMPEZA: OK"
          echo "REPETIR ÚLTIMO: OK"
          echo "XLSX: OK"
          echo "=========================================="

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle --no-daemon clean assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo ""
          echo "=========================================="
          echo "APK GERADO COM SUCESSO"
          echo "=========================================="

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
