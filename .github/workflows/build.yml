name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ============================================================
          # BIBLIOTECAS LOCAIS
          # ============================================================

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text = text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ============================================================
          # LIMPAR PEDIDO
          # ============================================================

          clear_code = r"""
          window.clearPedido = function(){

            try{

              /*
               * O histórico e o último pedido já devem ter
               * sido salvos antes desta função.
               *
               * Aqui apagamos SOMENTE o pedido atual.
               */

              vals = {};
              extras = [];
              validadeCurta = [];
              finalizedRows = [];
              generalObservation = '';

              /*
               * Remove os dados atuais do pedido.
               */

              localStorage.removeItem(
                'pedido_compras_vals'
              );

              localStorage.removeItem(
                'pedido_compras_extras'
              );

              localStorage.removeItem(
                'pedido_compras_validade_curta'
              );

              localStorage.removeItem(
                'sp_general_obs'
              );

              /*
               * Salva o estado vazio.
               */

              if(
                typeof save === 'function'
              ){
                save();
              }

              /*
               * Limpa o campo de observação.
               */

              const obs =
                document.getElementById(
                  'generalObs'
                );

              if(obs){
                obs.value = '';
              }

              /*
               * Atualiza a tela.
               */

              if(
                typeof render === 'function'
              ){
                render();
              }

              if(
                typeof renderValidadeCurta === 'function'
              ){
                renderValidadeCurta();
              }

              if(
                typeof updateBadge === 'function'
              ){
                updateBadge();
              }

              if(
                typeof closeConference === 'function'
              ){
                closeConference();
              }

            }catch(e){

              console.error(
                'clearPedido:',
                e
              );

              alert(
                'Erro ao limpar pedido: ' +
                e.message
              );
            }
          };
          """

          # ============================================================
          # REPETIR ÚLTIMO PEDIDO
          # ============================================================

          repeat_code = r"""
          window.repeatLastOrder = function(){

            try{

              let rows =
                Array.isArray(lastOrder)
                  ? JSON.parse(
                      JSON.stringify(lastOrder)
                    )
                  : [];

              /*
               * Recuperação de segurança pelo localStorage.
               */

              if(!rows.length){

                try{

                  rows =
                    JSON.parse(
                      localStorage.getItem(
                        'sp_last_order'
                      ) || '[]'
                    );

                }catch(e){

                  rows = [];
                }
              }

              /*
               * Se ainda não encontrou, usa o primeiro
               * pedido do histórico.
               */

              if(!rows.length){

                try{

                  const history =
                    JSON.parse(
                      localStorage.getItem(
                        'sp_history'
                      ) || '[]'
                    );

                  if(
                    Array.isArray(history) &&
                    history.length
                  ){

                    rows =
                      JSON.parse(
                        JSON.stringify(
                          history[0].rows || []
                        )
                      );

                    if(
                      history[0].generalObservation
                    ){
                      generalObservation =
                        history[0].generalObservation;
                    }
                  }

                }catch(e){}
              }

              if(
                !Array.isArray(rows) ||
                !rows.length
              ){

                alert(
                  'Ainda não existe último pedido.'
                );

                return;
              }

              /*
               * Começa um novo pedido.
               */

              vals = {};
              extras = [];
              validadeCurta = [];

              rows.forEach(function(x){

                /*
                 * Produto adicional.
                 */

                if(
                  x.cat === 'Produto Adicional'
                ){

                  extras.push({
                    code:
                      x.code === '-'
                        ? ''
                        : (x.code || ''),

                    name:
                      x.name || '',

                    qty:
                      Number(x.order) || 0
                  });

                  return;
                }

                /*
                 * Validade curta.
                 */

                if(
                  x.cat === '⚠️ Validade Curta'
                ){

                  validadeCurta.push({

                    code:
                      x.code === '-'
                        ? ''
                        : (x.code || ''),

                    name:
                      x.name || '',

                    qty:
                      Number(x.order) || 0,

                    date:
                      x.validade || ''
                  });

                  return;
                }

                /*
                 * Produto normal.
                 */

                if(
                  typeof productByCode !== 'function'
                ){
                  return;
                }

                const f =
                  productByCode(
                    x.code
                  );

                if(!f){
                  return;
                }

                vals[
                  key(
                    f.c,
                    f.s,
                    f.i,
                    'o'
                  )
                ] =
                  Number(x.order) || 0;

                vals[
                  key(
                    f.c,
                    f.s,
                    f.i,
                    's'
                  )
                ] =
                  Number(x.stock) || 0;

              });

              /*
               * Observação.
               */

              if(
                rows.generalObservation
              ){

                generalObservation =
                  rows.generalObservation;

              }

              const obs =
                document.getElementById(
                  'generalObs'
                );

              if(obs){
                obs.value =
                  generalObservation || '';
              }

              /*
               * Salva e redesenha.
               */

              if(
                typeof save === 'function'
              ){
                save();
              }

              if(
                typeof saveFeatures === 'function'
              ){
                saveFeatures();
              }

              if(
                typeof render === 'function'
              ){
                render();
              }

              if(
                typeof renderValidadeCurta === 'function'
              ){
                renderValidadeCurta();
              }

              if(
                typeof updateBadge === 'function'
              ){
                updateBadge();
              }

              if(
                typeof closeFeature === 'function'
              ){
                closeFeature();
              }

              alert(
                'Último pedido recuperado. Confira antes de enviar.'
              );

            }catch(e){

              console.error(
                'repeatLastOrder:',
                e
              );

              alert(
                'Não foi possível repetir o último pedido.'
              );
            }
          };
          """

          # ============================================================
          # BOTÃO ADM
          # ============================================================

          admin_code = r"""
          window.openAdmin = function(){

            try{

              const savedPin =
                localStorage.getItem(
                  'sp_admin_pin'
                ) || '1234';

              /*
               * Se existir o modal original,
               * usamos o sistema original do aplicativo.
               */

              if(
                typeof featureModal === 'function'
              ){

                featureModal(

                  '<h3>🔐 Administração</h3>' +

                  '<p>Digite o PIN de administrador:</p>' +

                  '<input ' +
                  'id="superPedidoAdminPin" ' +
                  'type="password" ' +
                  'inputmode="numeric" ' +
                  'maxlength="20" ' +
                  'style="width:100%;box-sizing:border-box;padding:12px;font-size:18px" ' +
                  'placeholder="PIN">' +

                  '<br><br>' +

                  '<button onclick="window.checkSuperPedidoAdmin()">Entrar</button> ' +

                  '<button onclick="closeFeature()">Cancelar</button>'
                );

                window.checkSuperPedidoAdmin =
                  function(){

                    const input =
                      document.getElementById(
                        'superPedidoAdminPin'
                      );

                    const pin =
                      input
                        ? String(
                            input.value || ''
                          )
                        : '';

                    if(
                      pin !== savedPin
                    ){

                      alert(
                        'PIN incorreto.'
                      );

                      return;
                    }

                    /*
                     * Abre a área administrativa original.
                     */

                    if(
                      typeof featureModal === 'function'
                    ){

                      featureModal(

                        '<h3>⚙️ Administração</h3>' +

                        '<p>Produtos cadastrados: <b>' +

                        Object.values(
                          APP_DATA || {}
                        ).reduce(
                          function(total, subs){

                            return total +
                              Object.values(subs)
                                .reduce(
                                  function(t, arr){
                                    return t +
                                      (
                                        Array.isArray(arr)
                                          ? arr.length
                                          : 0
                                      );
                                  },
                                  0
                                );

                          },
                          0
                        ) +

                        '</b></p>' +

                        '<div class="adminGrid">' +

                        '<button onclick="importList()">📥 Importar lista (XLSX/CSV)</button>' +

                        '<button onclick="backupJSON()">💾 Backup completo</button>' +

                        '<button onclick="changePin()">🔑 Alterar PIN</button>' +

                        '</div>' +

                        '<p class="mini">' +
                        'A importação XLSX/CSV continua usando as funções originais do aplicativo.' +
                        '</p>' +

                        '<button onclick="closeFeature()">Fechar</button>'

                      );

                    }

                  };

                return;
              }

              /*
               * Fallback para Android caso o modal não exista.
               */

              const pin =
                prompt(
                  'Digite o PIN de administração.'
                );

              if(
                pin === null
              ){
                return;
              }

              if(
                String(pin) === String(savedPin)
              ){

                alert(
                  'Administração disponível.'
                );

              }else{

                alert(
                  'PIN incorreto.'
                );
              }

            }catch(e){

              console.error(
                'openAdmin:',
                e
              );

              alert(
                'Não foi possível abrir a administração.'
              );
            }
          };
          """

          # ============================================================
          # PDF A4 RETRATO
          # ============================================================

          pdf_code = r"""
          window.openPDF = async function(sendViaWhatsApp){

            const rows =
              Array.isArray(finalizedRows) &&
              finalizedRows.length
                ? finalizedRows
                : getRows();

            if(
              !Array.isArray(rows) ||
              !rows.length
            ){

              alert(
                'Nenhum item foi selecionado.'
              );

              return;
            }

            try{

              const lib =
                window.jspdf || {};

              const jsPDF =
                lib.jsPDF;

              if(!jsPDF){

                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              /*
               * ========================================================
               * A4 RETRATO
               * ========================================================
               */

              const doc =
                new jsPDF({
                  orientation: 'portrait',
                  unit: 'mm',
                  format: 'a4'
                });

              const W = 210;
              const H = 297;
              const M = 10;

              const tableW =
                W - (M * 2);

              let y = 15;
              let page = 1;

              const xCode =
                M;

              const xName =
                M + 28;

              const xStock =
                M + 140;

              const xOrder =
                M + 165;

              const xEnd =
                W - M;

              /*
               * Rodapé.
               */

              function footer(){

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  M,
                  H - 7
                );

                doc.text(
                  'Página ' + page,
                  xEnd,
                  H - 7,
                  {
                    align: 'right'
                  }
                );
              }

              /*
               * Cabeçalho.
               */

              function title(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(14);

                doc.text(
                  'RELATÓRIO DE PEDIDO',
                  W / 2,
                  y,
                  {
                    align: 'center'
                  }
                );

                y += 7;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Data: ' +
                  new Date()
                    .toLocaleDateString(
                      'pt-BR'
                    ),
                  M,
                  y
                );

                y += 8;
              }

              /*
               * Nova página.
               */

              function newPage(){

                footer();

                doc.addPage();

                page++;

                y = 15;

                title();
              }

              /*
               * Cabeçalho da tabela.
               */

              function tableHeader(){

                if(
                  y + 8 >
                  H - 14
                ){

                  newPage();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(6.5);

                doc.rect(
                  M,
                  y,
                  tableW,
                  8
                );

                doc.line(
                  xName,
                  y,
                  xName,
                  y + 8
                );

                doc.line(
                  xStock,
                  y,
                  xStock,
                  y + 8
                );

                doc.line(
                  xOrder,
                  y,
                  xOrder,
                  y + 8
                );

                doc.text(
                  'CÓDIGO',
                  xCode + 14,
                  y + 5,
                  {
                    align: 'center'
                  }
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xName + 2,
                  y + 5
                );

                doc.text(
                  'ESTOQUE',
                  xStock + 12.5,
                  y + 5,
                  {
                    align: 'center'
                  }
                );

                doc.text(
                  'PEDIDO',
                  xOrder + 12.5,
                  y + 5,
                  {
                    align: 'center'
                  }
                );

                y += 8;
              }

              /*
               * Linha do produto.
               */

              function productRow(item){

                const name =
                  String(
                    item.name || ''
                  );

                const lines =
                  doc.splitTextToSize(
                    name,
                    108
                  );

                const rowH =
                  Math.max(
                    7,
                    lines.length * 3.5 + 2
                  );

                if(
                  y + rowH >
                  H - 14
                ){

                  newPage();

                  tableHeader();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(6.2);

                /*
                 * Caixa.
                 */

                doc.rect(
                  M,
                  y,
                  tableW,
                  rowH
                );

                /*
                 * Divisórias.
                 */

                doc.line(
                  xName,
                  y,
                  xName,
                  y + rowH
                );

                doc.line(
                  xStock,
                  y,
                  xStock,
                  y + rowH
                );

                doc.line(
                  xOrder,
                  y,
                  xOrder,
                  y + rowH
                );

                /*
                 * Código.
                 */

                doc.text(
                  String(
                    item.code || '-'
                  ),
                  xCode + 14,
                  y + rowH / 2 + 2,
                  {
                    align: 'center'
                  }
                );

                /*
                 * Produto.
                 */

                doc.text(
                  lines,
                  xName + 2,
                  y + 3.8
                );

                /*
                 * Estoque.
                 */

                doc.text(
                  String(
                    item.stock == null
                      ? 0
                      : item.stock
                  ),
                  xStock + 12.5,
                  y + rowH / 2 + 2,
                  {
                    align: 'center'
                  }
                );

                /*
                 * Pedido.
                 */

                doc.text(
                  String(
                    item.order == null
                      ? 0
                      : item.order
                  ),
                  xOrder + 12.5,
                  y + rowH / 2 + 2,
                  {
                    align: 'center'
                  }
                );

                y += rowH;
              }

              /*
               * Início.
               */

              title();

              const groups =
                groupRows(rows);

              Object.keys(groups)
                .forEach(
                  function(category){

                    if(
                      y + 18 >
                      H - 14
                    ){

                      newPage();
                    }

                    doc.setFont(
                      'helvetica',
                      'bold'
                    );

                    doc.setFontSize(8.5);

                    doc.text(
                      String(category),
                      M,
                      y
                    );

                    y += 4;

                    tableHeader();

                    groups[category]
                      .forEach(
                        function(item){
                          productRow(item);
                        }
                      );

                    y += 4;
                  }
                );

              /*
               * Observação.
               */

              if(
                generalObservation
              ){

                const obsLines =
                  doc.splitTextToSize(
                    'OBSERVAÇÃO: ' +
                    generalObservation,
                    tableW
                  );

                if(
                  y +
                  obsLines.length * 4 +
                  5 >
                  H - 14
                ){

                  newPage();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  obsLines,
                  M,
                  y
                );

                y +=
                  obsLines.length * 4 +
                  5;
              }

              footer();

              /*
               * Gera o PDF.
               */

              const base64 =
                doc
                  .output(
                    'datauristring'
                  )
                  .split(',')[1];

              const filename =
                'relatorio-pedido-' +
                new Date()
                  .toISOString()
                  .slice(0,10) +
                '.pdf';

              /*
               * ========================================================
               * ANDROID
               *
               * Primeiro salva histórico e limpa o pedido.
               * Só depois abre o compartilhamento.
               * ========================================================
               */

              if(
                window.AndroidFileBridge &&
                typeof
                  window.AndroidFileBridge.sharePdf ===
                    'function'
              ){

                if(
                  typeof saveHistory ===
                    'function'
                ){

                  saveHistory(rows);
                }

                window.clearPedido();

                window.AndroidFileBridge.sharePdf(
                  filename,
                  base64
                );

                return;
              }

              /*
               * ========================================================
               * NAVEGADOR
               * ========================================================
               */

              const blob =
                doc.output(
                  'blob'
                );

              const url =
                URL.createObjectURL(
                  blob
                );

              const a =
                document.createElement(
                  'a'
                );

              a.href = url;

              a.download =
                filename;

              document.body
                .appendChild(a);

              a.click();

              a.remove();

              setTimeout(
                function(){

                  URL.revokeObjectURL(
                    url
                  );

                },
                1200
              );

              if(
                typeof saveHistory ===
                  'function'
              ){

                saveHistory(rows);
              }

              window.clearPedido();

            }catch(e){

              console.error(
                'openPDF:',
                e
              );

              alert(
                'Não foi possível gerar o relatório: ' +
                e.message
              );
            }
          };
          """

          # ============================================================
          # INSERIR AS CORREÇÕES ANTES DO </body>
          # ============================================================

          patch = (
              '<script>\n' +
              clear_code +
              '\n' +
              repeat_code +
              '\n' +
              admin_code +
              '\n' +
              pdf_code +
              '\n' +
              '</script>\n'
          )

          marker = "</body>"

          if marker not in text:
              raise SystemExit(
                  "ERRO: fechamento </body> não encontrado"
              )

          text = text.replace(
              marker,
              patch + marker,
              1
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "Correções inseridas com sucesso."
          )

          PY

      - name: Preparar bibliotecas PDF e XLSX
        shell: bash
        run: |
          set -e

          ASSET_DIR="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSET_DIR"

          curl -fL --retry 3 \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" \
            -o "$ASSET_DIR/xlsx.full.min.js"

          curl -fL --retry 3 \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" \
            -o "$ASSET_DIR/jspdf.umd.min.js"

          test -s "$ASSET_DIR/xlsx.full.min.js"

          test -s "$ASSET_DIR/jspdf.umd.min.js"

      - name: Verificar JavaScript corrigido
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import re
          from pathlib import Path
          import os

          html =
            Path(
              os.environ["ANDROID_DIR"]
            ) / "app/src/main/assets/app/index.html"

          text =
            html.read_text(
              encoding="utf-8"
            )

          scripts =
            re.findall(
              r"<script(?:[^>]*)>(.*?)</script>",
              text,
              re.S
            )

          if not scripts:
              raise SystemExit(
                "ERRO: nenhum JavaScript inline encontrado"
              )

          combined =
            "\n".join(scripts)

          Path(
            "/tmp/super-pedido-inline.js"
          ).write_text(
            combined,
            encoding="utf-8"
          )

          required = [

            "window.openPDF = async function",

            "window.clearPedido = function",

            "window.repeatLastOrder = function",

            "window.openAdmin = function",

            "orientation: 'portrait'",

            "RELATÓRIO DE PEDIDO",

            "CÓDIGO",

            "NOME DO PRODUTO",

            "ESTOQUE",

            "PEDIDO"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                    "ERRO: não encontrado: " +
                    item
                  )

          if (
              "orientation: 'landscape'"
              in text
              or
              'orientation: "landscape"'
              in text
          ):

              raise SystemExit(
                "ERRO: ainda existe PDF em paisagem"
              )

          print(
            "Verificação textual concluída."
          )

          PY

          node --check \
            /tmp/super-pedido-inline.js

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(
            find \
              "$ANDROID_DIR/app/build/outputs/apk" \
              -type f \
              -name "*.apk" \
              -print -quit
          )

          test -n "$APK"

          test -s "$APK"

          echo "APK=$APK" \
            >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
