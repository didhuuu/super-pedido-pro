name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e
          rm -rf projeto
          test -f "Super-Pedido-Pro.zip"
          mkdir -p projeto
          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          main = next(
              (root / "app/src/main/java").rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit(
                  "ERRO: index.html não encontrado"
              )

          if main is None:
              raise SystemExit(
                  "ERRO: MainActivity.java não encontrado"
              )

          text = html.read_text(
              encoding="utf-8"
          )

          # ==========================================================
          # 1. CORRIGIR OPENPDF
          #
          # A versão 9 original usa:
          #
          # async function openPDF(){
          #
          # A substituição abaixo procura exatamente essa estrutura,
          # sem depender de openPDF estar antes/depois de clearPedido.
          #
          # O relatório passa a ser A4 RETRATO.
          # ==========================================================

          pdf_pattern = (
              r"(?:async\s+)?function\s+openPDF\s*\(\s*\)\s*\{"
              r".*?"
              r"\n\}\s*"
              r"function\s+clearPedido\s*\("
          )

          new_pdf_and_marker = r"""function openPDF(){
            const rows=finalizedRows.length?finalizedRows:getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{

              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              /*
               * A4 RETRATO
               *
               * 210 x 297 mm
               */
              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;
              const margem=10;

              const colCodigo=30;
              const colEstoque=25;
              const colPedido=25;
              const colProduto=
                pageWidth-
                (margem*2)-
                colCodigo-
                colEstoque-
                colPedido;

              let y=15;

              function titulo(){

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(16);

                doc.text(
                  'PEDIDO DE COMPRAS',
                  margem,
                  y
                );

                y+=7;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                doc.text(
                  new Date().toLocaleString(
                    'pt-BR'
                  ),
                  margem,
                  y
                );

                y+=8;
              }

              function cabecalhoTabela(){

                if(y+12>pageHeight-10){
                  doc.addPage();
                  y=15;
                  titulo();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  7
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  7
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  7
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  7
                );

                doc.text(
                  'CÓDIGO',
                  xCodigo+colCodigo/2,
                  y+4.8,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  'ESTOQUE',
                  xEstoque+colEstoque/2,
                  y+4.8,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  xPedido+colPedido/2,
                  y+4.8,
                  {align:'center'}
                );

                y+=7;
              }

              function nomeProduto(nome){

                const valor=
                  String(nome||'');

                const limite=58;

                if(
                  valor.length<=limite
                ){
                  return valor;
                }

                return valor.substring(
                  0,
                  limite-3
                )+'...';
              }

              function linhaProduto(item){

                if(y+7>pageHeight-10){

                  doc.addPage();

                  y=15;

                  titulo();

                  cabecalhoTabela();
                }

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const xCodigo=margem;

                const xProduto=
                  xCodigo+colCodigo;

                const xEstoque=
                  xProduto+colProduto;

                const xPedido=
                  xEstoque+colEstoque;

                doc.rect(
                  xCodigo,
                  y,
                  colCodigo,
                  7
                );

                doc.rect(
                  xProduto,
                  y,
                  colProduto,
                  7
                );

                doc.rect(
                  xEstoque,
                  y,
                  colEstoque,
                  7
                );

                doc.rect(
                  xPedido,
                  y,
                  colPedido,
                  7
                );

                doc.text(
                  String(item.code||'-'),
                  xCodigo+3,
                  y+4.8
                );

                doc.text(
                  nomeProduto(item.name),
                  xProduto+3,
                  y+4.8
                );

                doc.text(
                  String(item.stock??0),
                  xEstoque+colEstoque/2,
                  y+4.8,
                  {align:'center'}
                );

                doc.text(
                  String(item.order??0),
                  xPedido+colPedido/2,
                  y+4.8,
                  {align:'center'}
                );

                y+=7;
              }

              titulo();

              const grupos=groupRows(rows);

              for(
                const [categoria,items]
                of Object.entries(grupos)
              ){

                if(y+22>pageHeight-10){

                  doc.addPage();

                  y=15;

                  titulo();
                }

                y+=4;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(11);

                doc.text(
                  String(
                    categoria||''
                  ).toUpperCase(),
                  margem,
                  y
                );

                y+=5;

                cabecalhoTabela();

                for(
                  const item of items
                ){
                  linhaProduto(item);
                }
              }

              /*
               * Observação geral
               */
              if(generalObservation){

                if(y+20>pageHeight-10){

                  doc.addPage();

                  y=15;

                  titulo();
                }

                y+=5;

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(9);

                doc.text(
                  'OBSERVAÇÃO GERAL',
                  margem,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const observacao=
                  doc.splitTextToSize(
                    String(
                      generalObservation
                    ),
                    pageWidth-(margem*2)
                  );

                doc.text(
                  observacao,
                  margem,
                  y
                );
              }

              /*
               * Rodapé em todas as páginas.
               */
              const totalPaginas=
                doc.getNumberOfPages();

              for(
                let pagina=1;
                pagina<=totalPaginas;
                pagina++
              ){

                doc.setPage(pagina);

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  margem,
                  pageHeight-5
                );

                doc.text(
                  'Página '+pagina+
                  ' de '+
                  totalPaginas,
                  pageWidth-margem,
                  pageHeight-5,
                  {align:'right'}
                );
              }

              /*
               * Gera o PDF ANTES de limpar o pedido.
               */
              const base64=
                doc.output(
                  'datauristring'
                ).split(',')[1];

              const nomeArquivo=
                'relatorio-pedido-'+
                new Date()
                  .toISOString()
                  .slice(0,10)+
                '.pdf';

              /*
               * Salva no histórico e zera
               * o pedido ANTES de abrir o
               * compartilhamento.
               */
              clearPedido(rows);

              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf===
                'function'
              ){

                window.AndroidFileBridge.sharePdf(
                  nomeArquivo,
                  base64
                );

                return;
              }

              doc.save(
                nomeArquivo
              );

            }catch(e){

              console.error(
                e
              );

              alert(
                'Não foi possível gerar o PDF: '+
                e.message
              );
            }
          }

          function clearPedido"""

          text,n=re.subn(
              pdf_pattern,
              new_pdf_and_marker,
              text,
              count=1,
              flags=re.S
          )

          if n!=1:
              raise SystemExit(
                  "ERRO: não foi possível substituir o bloco PDF."
              )

          # ==========================================================
          # 2. CORRIGIR CLEARPEDIDO
          #
          # Recebe opcionalmente as linhas do pedido.
          #
          # Isso permite:
          #
          # PDF -> clearPedido(rows)
          # WhatsApp -> clearPedido()
          #
          # E evita duplicação no histórico.
          # ==========================================================

          clear_pattern = (
              r"function\s+clearPedido\s*\(\s*"
              r"historyRows\s*=\s*null\s*\)\s*\{"
              r".*?"
              r"\n\}\s*"
              r"function\s+sendWhatsApp\s*\("
          )

          new_clear_and_marker = r"""function clearPedido(historyRows=null){

            const historico=
              Array.isArray(historyRows) &&
              historyRows.length
              ? historyRows
              : finalizedRows;

            /*
             * Salva o pedido no histórico somente
             * uma vez.
             */
            if(
              Array.isArray(historico) &&
              historico.length
            ){
              saveHistory(
                historico
              );
            }

            /*
             * ZERA O PEDIDO ATUAL.
             *
             * O cadastro dos produtos NÃO é apagado.
             */
            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            generalObservation='';

            /*
             * Remove os dados persistidos
             * das quantidades.
             */
            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            /*
             * Limpa a observação da tela.
             */
            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            /*
             * Persiste o estado vazio.
             */
            save();

            /*
             * Atualiza completamente a tela.
             */
            render();

            renderValidadeCurta();

            updateBadge();

            closeConference();

            const opcoes=
              document.getElementById(
                'opcoesFinalizado'
              );

            if(opcoes){
              opcoes.style.display='none';
            }

          }

          function sendWhatsApp"""

          text,n=re.subn(
              clear_pattern,
              new_clear_and_marker,
              text,
              count=1,
              flags=re.S
          )

          if n!=1:
              raise SystemExit(
                  "ERRO: não foi possível substituir clearPedido."
              )

          # ==========================================================
          # 3. MANTER A CORREÇÃO DO CATÁLOGO
          # ==========================================================

          old_start=(
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length&&!importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          new_start=(
              "load();loadFeatures();"
              "APP_DATA=buildAppData();"
              "cats=Object.keys(APP_DATA);"
              "if(!cats.length&&!importedCatalogActive)"
              "{APP_DATA=DATA;cats=Object.keys(DATA)}"
              "if(!current||!APP_DATA[current])"
              "current=cats[0]||'';"
              "tabs();render();updateBadge();"
              "renderValidadeCurta();"
          )

          if old_start in text:

              text=text.replace(
                  old_start,
                  new_start,
                  1
              )

          elif (
              "if(!current||!APP_DATA[current])"
              "current=cats[0]||'';"
              not in text
          ):

              raise SystemExit(
                  "ERRO: inicialização do catálogo não encontrada."
              )

          # ==========================================================
          # 4. BIBLIOTECAS LOCAIS
          # ==========================================================

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          # ==========================================================
          # 5. PRESERVAR IMPORTAÇÃO
          # ==========================================================

          required=[
              "importedCatalogActive=true",
              "customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))",
              "localStorage.setItem('sp_imported_catalog_active'"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: correção de importação ausente: "+
                      item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          # ==========================================================
          # MAINACTIVITY
          # ==========================================================

          java=main.read_text(
              encoding="utf-8"
          )

          # Imports
          if (
              "import android.content.ClipData;"
              not in java
          ):

              java=java.replace(
                  "import android.content.Intent;\n",
                  "import android.content.ClipData;\n"
                  "import android.content.Intent;\n",
                  1
              )

          if (
              "import android.webkit.ValueCallback;"
              not in java
          ):

              java=java.replace(
                  "import android.webkit.WebSettings;\n",
                  "import android.webkit.ValueCallback;\n"
                  "import android.webkit.WebSettings;\n",
                  1
              )

          if (
              "import android.webkit.WebChromeClient;"
              not in java
          ):

              java=java.replace(
                  "import android.webkit.WebSettings;\n",
                  "import android.webkit.WebChromeClient;\n"
                  "import android.webkit.WebSettings;\n",
                  1
              )

          if (
              "private ValueCallback<Uri[]> filePathCallback;"
              not in java
          ):

              java=java.replace(
                  "public class MainActivity extends Activity {\n",
                  "public class MainActivity extends Activity {\n"
                  "    private ValueCallback<Uri[]> filePathCallback;\n"
                  "    private static final int FILE_CHOOSER_REQUEST = 1001;\n",
                  1
              )

          # ==========================================================
          # FILE CHOOSER
          # ==========================================================

          if "onShowFileChooser" not in java:

              marker=(
                  "        webView.setWebViewClient("
                  "new WebViewClient());\n"
              )

              block="""        webView.setWebChromeClient(new WebChromeClient() {
              @Override
              public boolean onShowFileChooser(
                      WebView view,
                      ValueCallback<Uri[]> callback,
                      FileChooserParams params) {

                  if (MainActivity.this.filePathCallback != null) {
                      MainActivity.this.filePathCallback.onReceiveValue(null);
                  }

                  MainActivity.this.filePathCallback = callback;

                  try {
                      Intent intent = params.createIntent();

                      startActivityForResult(
                              intent,
                              FILE_CHOOSER_REQUEST
                      );

                      return true;

                  } catch (Exception e) {

                      MainActivity.this.filePathCallback = null;

                      Toast.makeText(
                              MainActivity.this,
                              "Não foi possível abrir o seletor de arquivos.",
                              Toast.LENGTH_LONG
                      ).show();

                      return false;
                  }
              }
          });
          """

              if marker in java:

                  java=java.replace(
                      marker,
                      marker+block,
                      1
                  )

          # ==========================================================
          # RESULTADO DO FILE CHOOSER
          # ==========================================================

          if (
              "protected void onActivityResult("
              not in java
          ):

              marker=(
                  "    public class AndroidFileBridge {\n"
              )

              result="""    @Override
          protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

              super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
              );

              if(
                  requestCode != FILE_CHOOSER_REQUEST ||
                  filePathCallback == null
              ){
                  return;
              }

              Uri[] results=null;

              if(
                  resultCode == RESULT_OK &&
                  data != null
              ){

                  if(data.getClipData()!=null){

                      int count=
                          data.getClipData()
                              .getItemCount();

                      results=new Uri[count];

                      for(
                          int i=0;
                          i<count;
                          i++
                      ){

                          results[i]=
                              data.getClipData()
                                  .getItemAt(i)
                                  .getUri();
                      }

                  }else if(
                      data.getData()!=null
                  ){

                      results=new Uri[]{
                          data.getData()
                      };
                  }
              }

              filePathCallback.onReceiveValue(
                  results
              );

              filePathCallback=null;
          }

          """

              if marker in java:

                  java=java.replace(
                      marker,
                      result+marker,
                      1
                  )

          # ==========================================================
          # SHARE PDF
          # ==========================================================

          pdf_pattern_java=(
              r"        @JavascriptInterface\s+"
              r"public void sharePdf\s*\("
              r"String filename,\s*String base64\)\s*\{"
              r".*?"
              r"\n        \}\s+"
              r"@JavascriptInterface"
          )

          pdf_method_java="""        @JavascriptInterface
          public void sharePdf(
                  String filename,
                  String base64) {

              try {

                  if(
                      base64 == null ||
                      base64.trim().isEmpty()
                  ){
                      throw new Exception(
                          "PDF vazio"
                      );
                  }

                  String clean=base64;

                  int comma=
                      clean.indexOf(',');

                  if(comma>=0){
                      clean=
                          clean.substring(
                              comma+1
                          );
                  }

                  byte[] bytes=
                      Base64.decode(
                          clean,
                          Base64.DEFAULT
                      );

                  File dir=
                      new File(
                          getCacheDir(),
                          "shared"
                      );

                  if(
                      !dir.exists() &&
                      !dir.mkdirs()
                  ){
                      throw new Exception(
                          "Não foi possível criar a pasta temporária"
                      );
                  }

                  String safeName=
                      sanitizeFilename(
                          filename
                      );

                  if(safeName.isEmpty()){
                      safeName="pedido.pdf";
                  }

                  if(
                      !safeName
                          .toLowerCase()
                          .endsWith(".pdf")
                  ){
                      safeName+=".pdf";
                  }

                  File file=
                      new File(
                          dir,
                          safeName
                      );

                  try(
                      FileOutputStream out=
                          new FileOutputStream(file)
                  ){

                      out.write(bytes);
                      out.flush();
                  }

                  Uri uri=
                      FileProvider.getUriForFile(
                          MainActivity.this,
                          getPackageName()+
                          ".fileprovider",
                          file
                      );

                  Intent intent=
                      new Intent(
                          Intent.ACTION_SEND
                      );

                  intent.setType(
                      "application/pdf"
                  );

                  intent.putExtra(
                      Intent.EXTRA_STREAM,
                      uri
                  );

                  intent.setClipData(
                      ClipData.newRawUri(
                          "PDF",
                          uri
                      )
                  );

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                  );

                  startActivity(
                      Intent.createChooser(
                          intent,
                          "Enviar PDF"
                      )
                  );

              }catch(Exception e){

                  Toast.makeText(
                      MainActivity.this,
                      "Erro ao compartilhar PDF: "+
                      e.getMessage(),
                      Toast.LENGTH_LONG
                  ).show();
              }
          }

          @JavascriptInterface"""

          java,n=re.subn(
              pdf_pattern_java,
              pdf_method_java,
              java,
              count=1,
              flags=re.S
          )

          if n!=1:

              raise SystemExit(
                  "ERRO: sharePdf não encontrado."
              )

          # ==========================================================
          # SAVEB64 COM 3 ARGUMENTOS
          # ==========================================================

          if (
              "public void saveBase64("
              "String filename, String mimeType, String base64)"
              not in java
          ):

              marker=(
                  "        @JavascriptInterface\n"
                  "        public void shareText(String text) {"
              )

              overload="""        @JavascriptInterface
          public void saveBase64(
                  String filename,
                  String mimeType,
                  String base64) {

              saveBase64(
                  filename,
                  base64
              );
          }

          """

              if marker not in java:

                  raise SystemExit(
                      "ERRO: saveBase64 não encontrado."
                  )

              java=java.replace(
                  marker,
                  overload+marker,
                  1
              )

          # ==========================================================
          # SANITIZE FILENAME
          # ==========================================================

          if (
              "private String sanitizeFilename("
              not in java
          ):

              marker=(
                  "    @Override\n"
                  "    public void onBackPressed() {"
              )

              helper="""    private String sanitizeFilename(String filename) {

              if (filename == null) {
                  return "";
              }

              return new File(filename)
                  .getName()
                  .replaceAll(
                      "[\\\\/:*?\\\"<>|]",
                      "_"
                  );
          }

          """

              if marker in java:

                  java=java.replace(
                      marker,
                      helper+marker,
                      1
                  )

          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "Aplicativo corrigido com sucesso."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          JAVA=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -f "$HTML"

          test -f "$JAVA"

          echo "Verificando PDF..."

          grep -Fq \
            "orientation:'portrait'" \
            "$HTML"

          grep -Fq \
            "pageWidth=210" \
            "$HTML"

          grep -Fq \
            "pageHeight=297" \
            "$HTML"

          if grep -Fq \
            "orientation:'landscape'" \
            "$HTML"
          then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          if grep -Fq \
            'orientation:"landscape"' \
            "$HTML"
          then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          echo "PDF A4 RETRATO: OK"

          echo "Verificando limpeza..."

          grep -Fq \
            "vals={};" \
            "$HTML"

          grep -Fq \
            "extras=[];" \
            "$HTML"

          grep -Fq \
            "validadeCurta=[];" \
            "$HTML"

          grep -Fq \
            "finalizedRows=[];" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_vals')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_extras')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_validade_curta')" \
            "$HTML"

          grep -Fq \
            "clearPedido(rows);" \
            "$HTML"

          echo "LIMPEZA: OK"

          echo "Verificando importação..."

          grep -Fq \
            "importedCatalogActive=true" \
            "$HTML"

          grep -Fq \
            "customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))" \
            "$HTML"

          echo "IMPORTAÇÃO: OK"

          echo "Verificando Android..."

          grep -Fq \
            "onShowFileChooser" \
            "$JAVA"

          grep -Fq \
            "ClipData.newRawUri" \
            "$JAVA"

          grep -Fq \
            "saveBase64(String filename, String mimeType, String base64)" \
            "$JAVA"

          grep -Fq \
            "sanitizeFilename" \
            "$JAVA"

          echo "ANDROID: OK"

          echo "Todas as verificações passaram."

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "APK gerado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
