name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar exatamente a V9
        uses: actions/checkout@v4
        with:
          ref: 69bd377f51e567832edd60769ba312e3d7f39156

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extrair V9
        shell: bash
        run: |
          set -e
          rm -rf projeto
          test -f Super-Pedido-Pro.zip
          mkdir -p projeto
          unzip -o Super-Pedido-Pro.zip -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print \
            -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERRO: projeto Android não encontrado."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Projeto: $ANDROID_DIR"

      - name: Ativar AndroidX
        shell: bash
        run: |
          set -e
          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -Fq "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -Fq "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"
          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Corrigir somente o relatório
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["ANDROID_DIR"])
          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado.")

          text = html.read_text(encoding="utf-8")

          inicio = text.find("async function openPDF")
          fim = text.find("function sendWhatsApp", inicio)

          if inicio == -1:
              raise SystemExit("ERRO: openPDF não encontrada.")

          if fim == -1:
              raise SystemExit("ERRO: sendWhatsApp não encontrada.")

          novo_open_pdf = r'''async function openPDF(sendViaWhatsApp=false){
            const rows=finalizedRows.length?finalizedRows:getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{
              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error('Biblioteca PDF não carregada.');
              }

              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const W=210;
              const H=297;
              const M=10;
              const TW=190;

              const CODE=28;
              const NAME=100;
              const STOCK=30;
              const ORDER=32;

              let y=15;

              function title(){
                doc.setFont('helvetica','bold');
                doc.setFontSize(15);
                doc.text(
                  'PEDIDO DE COMPRAS',
                  W/2,
                  y,
                  {align:'center'}
                );

                y+=7;

                doc.setFont('helvetica','normal');
                doc.setFontSize(8);

                doc.text(
                  new Date().toLocaleString('pt-BR'),
                  M,
                  y
                );

                y+=7;
              }

              function header(){
                const h=7;

                if(y+h>H-15){
                  doc.addPage();
                  y=15;
                  title();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(7);

                doc.rect(M,y,TW,h);

                doc.line(
                  M+CODE,
                  y,
                  M+CODE,
                  y+h
                );

                doc.line(
                  M+CODE+NAME,
                  y,
                  M+CODE+NAME,
                  y+h
                );

                doc.line(
                  M+CODE+NAME+STOCK,
                  y,
                  M+CODE+NAME+STOCK,
                  y+h
                );

                doc.text(
                  'CÓDIGO',
                  M+CODE/2,
                  y+4.7,
                  {align:'center'}
                );

                doc.text(
                  'NOME DO PRODUTO',
                  M+CODE+2,
                  y+4.7
                );

                doc.text(
                  'ESTOQUE',
                  M+CODE+NAME+STOCK/2,
                  y+4.7,
                  {align:'center'}
                );

                doc.text(
                  'PEDIDO',
                  M+CODE+NAME+STOCK+ORDER/2,
                  y+4.7,
                  {align:'center'}
                );

                y+=h;
              }

              function categoria(nome){
                if(y+18>H-15){
                  doc.addPage();
                  y=15;
                  title();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(9);

                doc.text(
                  String(nome||'').toUpperCase(),
                  M,
                  y
                );

                y+=5;

                header();
              }

              function produto(x){
                const code=String(x.code||'-');
                const name=String(x.name||'');
                const stock=String(x.stock??0);
                const order=String(x.order??0);

                const linhasNome=
                  doc.splitTextToSize(
                    name,
                    NAME-4
                  );

                const linhasExtras=[];

                if(x.obs){
                  linhasExtras.push(
                    ...doc.splitTextToSize(
                      'Obs: '+String(x.obs),
                      NAME-4
                    )
                  );
                }

                if(x.validade){
                  linhasExtras.push(
                    ...doc.splitTextToSize(
                      'Validade: '+String(x.validade),
                      NAME-4
                    )
                  );
                }

                const linhas=[
                  ...linhasNome,
                  ...linhasExtras
                ];

                const qtd=Math.max(
                  1,
                  linhas.length
                );

                const h=Math.max(
                  7,
                  qtd*4.2+3
                );

                if(y+h>H-15){
                  doc.addPage();
                  y=15;
                  title();
                  header();
                }

                doc.setFont('helvetica','normal');
                doc.setFontSize(6.8);

                doc.rect(
                  M,
                  y,
                  TW,
                  h
                );

                doc.line(
                  M+CODE,
                  y,
                  M+CODE,
                  y+h
                );

                doc.line(
                  M+CODE+NAME,
                  y,
                  M+CODE+NAME,
                  y+h
                );

                doc.line(
                  M+CODE+NAME+STOCK,
                  y,
                  M+CODE+NAME+STOCK,
                  y+h
                );

                doc.text(
                  code,
                  M+CODE/2,
                  y+4.3,
                  {align:'center'}
                );

                let ny=y+4.3;

                linhas.forEach(linha=>{
                  doc.text(
                    linha,
                    M+CODE+2,
                    ny
                  );

                  ny+=4.2;
                });

                doc.text(
                  stock,
                  M+CODE+NAME+STOCK/2,
                  y+4.3,
                  {align:'center'}
                );

                doc.setFont('helvetica','bold');

                doc.text(
                  order,
                  M+CODE+NAME+STOCK+ORDER/2,
                  y+4.3,
                  {align:'center'}
                );

                doc.setFont('helvetica','normal');

                y+=h;
              }

              title();

              const groups=groupRows(rows);

              for(const [cat,items] of Object.entries(groups)){
                categoria(cat);

                items.forEach(item=>{
                  produto(item);
                });

                y+=4;
              }

              if(generalObservation){
                if(y+20>H-15){
                  doc.addPage();
                  y=15;
                  title();
                }

                doc.setFont('helvetica','bold');
                doc.setFontSize(8);

                doc.text(
                  'OBSERVAÇÃO GERAL:',
                  M,
                  y
                );

                y+=5;

                doc.setFont('helvetica','normal');

                const obs=doc.splitTextToSize(
                  String(generalObservation),
                  TW
                );

                obs.forEach(linha=>{
                  if(y+5>H-15){
                    doc.addPage();
                    y=15;
                  }

                  doc.text(
                    linha,
                    M,
                    y
                  );

                  y+=4.5;
                });
              }

              const total=doc.internal.getNumberOfPages();

              for(let p=1;p<=total;p++){
                doc.setPage(p);

                doc.setFont('helvetica','normal');
                doc.setFontSize(7);

                doc.text(
                  'Super Pedido Pro',
                  M,
                  H-6
                );

                doc.text(
                  'Página '+p+' de '+total,
                  W-M,
                  H-6,
                  {align:'right'}
                );
              }

              const filename=
                'pedido-acougue-'+
                new Date().toISOString().slice(0,10)+
                '.pdf';

              const b64=
                doc.output('datauristring')
                  .split(',')[1];

              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf==='function'
              ){
                window.AndroidFileBridge.sharePdf(
                  'pedido-acougue.pdf',
                  b64
                );

                saveHistory(rows);
                clearPedido();

                return;
              }

              const blob=doc.output('blob');

              if(
                sendViaWhatsApp &&
                navigator.share &&
                typeof File!=='undefined'
              ){
                const file=new File(
                  [blob],
                  filename,
                  {type:'application/pdf'}
                );

                if(
                  !navigator.canShare ||
                  navigator.canShare({files:[file]})
                ){
                  try{
                    await navigator.share({
                      files:[file],
                      text:'Pedido do açougue'
                    });

                    saveHistory(rows);
                    clearPedido();

                    return;
                  }catch(e){
                    if(
                      e &&
                      e.name==='AbortError'
                    ){
                      return;
                    }
                  }
                }
              }

              const url=
                URL.createObjectURL(blob);

              const a=
                document.createElement('a');

              a.href=url;
              a.download=filename;

              document.body.appendChild(a);
              a.click();
              a.remove();

              setTimeout(
                ()=>URL.revokeObjectURL(url),
                3000
              );

              if(!sendViaWhatsApp){
                saveHistory(rows);
                clearPedido();
              }

            }catch(e){
              console.error(e);

              alert(
                'Não foi possível gerar o PDF: '+
                (e.message||e)
              );
            }
          }'''

          novo_texto=(
            text[:inicio]
            +novo_open_pdf
            +"\n"
            +text[fim:]
          )

          html.write_text(
            novo_texto,
            encoding="utf-8"
          )

          print("OK - somente openPDF alterado.")
          PY

      - name: Corrigir caminhos das bibliotecas
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import os

          html=Path(os.environ["ANDROID_DIR"]) / \
            "app/src/main/assets/app/index.html"

          text=html.read_text(encoding="utf-8")

          text=text.replace(
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
            "xlsx.full.min.js"
          )

          text=text.replace(
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
            "jspdf.umd.min.js"
          )

          html.write_text(
            text,
            encoding="utf-8"
          )
          PY

      - name: Verificar JavaScript e funções originais
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          from pathlib import Path
          import re
          import os

          html=Path(os.environ["ANDROID_DIR"]) / \
            "app/src/main/assets/app/index.html"

          text=html.read_text(encoding="utf-8")

          required=[
            "async function openPDF",
            "function sendWhatsApp",
            "function clearPedido",
            "function repeatLastOrder",
            "function applyRepeat",
            "function openAdmin",
            "function saveHistory",
            "function saveFeatures",
            "function loadFeatures",
            "function productByCode",
            "groupRows",
            "AndroidFileBridge.sharePdf",
            "CÓDIGO",
            "NOME DO PRODUTO",
            "ESTOQUE",
            "PEDIDO",
            "orientation:'portrait'",
            "format:'a4'
          ]

          for item in required:
            if item not in text:
              raise SystemExit(
                "ERRO: função/estrutura ausente: "+item
              )

          if "orientation:'landscape'" in text:
            raise SystemExit(
              "ERRO: relatório paisagem encontrado."
            )

          scripts=re.findall(
            r"<script(?:[^>]*)>(.*?)</script>",
            text,
            re.S
          )

          if not scripts:
            raise SystemExit(
              "ERRO: JavaScript não encontrado."
            )

          Path("/tmp/super-pedido.js").write_text(
            "\n".join(scripts),
            encoding="utf-8"
          )

          print("Verificação estrutural OK.")
          PY

          node --check /tmp/super-pedido.js

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean \
              assembleDebug
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print \
            -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não foi gerado."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "ERRO: APK vazio."
            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 30
