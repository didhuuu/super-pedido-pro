name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
              -name settings.gradle.kts \
              -type f \
              -print -quit | xargs -r dirname)
          fi

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -qF "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -qF "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Aplicar exatamente o relatório aprovado da versão #49
        shell: bash
        run: |
          set -e

          git show 4e67e53aa453548944592d7b7f417fb77ca9fe7c:.github/workflows/build.yml \
            > /tmp/build49.yml

          python3 - <<'PY'
          from pathlib import Path
          import re

          source = Path(
              "/tmp/build49.yml"
          ).read_text(
              encoding="utf-8"
          )

          match = re.search(
              r"- name: Alterar SOMENTE o relatório.*?"
              r"\n          python3 - <<'PY'\n"
              r"(.*?)"
              r"\n          PY\n",
              source,
              re.S
          )

          if not match:
              raise SystemExit(
                  "ERRO: não foi possível recuperar "
                  "o script exato do relatório #49."
              )

          script = match.group(1)

          linhas = []

          for line in script.splitlines():

              if line.startswith("          "):
                  linhas.append(
                      line[10:]
                  )
              else:
                  linhas.append(line)

          script = "\n".join(linhas)

          Path(
              "/tmp/report49.py"
          ).write_text(
              script,
              encoding="utf-8"
          )

          print(
              "OK: script do relatório #49 "
              "recuperado do commit aprovado."
          )
          PY

          python3 /tmp/report49.py

      - name: Localizar tela HTML
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          echo "HTML=$HTML" >> "$GITHUB_ENV"

          echo "HTML encontrado:"
          echo "$HTML"

      - name: Corrigir somente ADM, Repetir e Limpeza
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import os
          import re

          html = Path(
              os.environ["HTML"]
          )

          text = html.read_text(
              encoding="utf-8"
          )

          # =========================================================
          # LOCALIZAR UMA FUNÇÃO JAVASCRIPT COMPLETA
          # =========================================================

          def find_function(source, name):

              pattern = (
                  r"(?m)^(\s*)"
                  r"(?:async\s+)?function\s+"
                  + re.escape(name)
                  + r"\s*\("
              )

              match = re.search(
                  pattern,
                  source
              )

              if not match:

                  raise SystemExit(
                      f"ERRO: função {name} não encontrada."
                  )

              start = match.start()

              brace = source.find(
                  "{",
                  match.end()
              )

              if brace < 0:

                  raise SystemExit(
                      f"ERRO: abertura da função "
                      f"{name} não encontrada."
                  )

              depth = 0

              quote = None

              escape = False

              line_comment = False

              block_comment = False

              i = brace

              while i < len(source):

                  c = source[i]

                  n = (
                      source[i + 1]
                      if i + 1 < len(source)
                      else ""
                  )

                  if line_comment:

                      if c == "\n":
                          line_comment = False

                  elif block_comment:

                      if c == "*" and n == "/":

                          block_comment = False

                          i += 1

                  elif quote:

                      if escape:

                          escape = False

                      elif c == "\\":

                          escape = True

                      elif c == quote:

                          quote = None

                  else:

                      if c == "/" and n == "/":

                          line_comment = True

                          i += 1

                      elif c == "/" and n == "*":

                          block_comment = True

                          i += 1

                      elif c in "'\"`":

                          quote = c

                      elif c == "{":

                          depth += 1

                      elif c == "}":

                          depth -= 1

                          if depth == 0:

                              return (
                                  start,
                                  i + 1,
                                  source[start:i + 1]
                              )

                  i += 1

              raise SystemExit(
                  f"ERRO: função {name} sem fechamento."
              )

          def replace_function(
              source,
              name,
              replacement
          ):

              start, end, old = find_function(
                  source,
                  name
              )

              return (
                  source[:start]
                  + replacement
                  + source[end:]
              )

          # =========================================================
          # PROTEGER O RELATÓRIO #49
          # =========================================================

          _, _, openpdf_before = find_function(
              text,
              "openPDF"
          )

          openpdf_hash = hashlib.sha256(
              openpdf_before.encode("utf-8")
          ).hexdigest()

          # =========================================================
          # ADM
          # =========================================================

          new_admin = r'''function openAdmin(){

            featureModal(`
              <h3>🔐 Administração</h3>

              <p>Digite o PIN de administração.</p>

              <input
                id="adminPinInput"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="PIN"
                style="
                  width:100%;
                  box-sizing:border-box;
                  padding:12px;
                  font-size:18px
                "
              >

              <div
                style="
                  display:flex;
                  gap:8px;
                  margin-top:10px
                "
              >

                <button
                  onclick="confirmAdminPin()"
                >
                  Entrar
                </button>

                <button
                  onclick="closeFeature()"
                >
                  Cancelar
                </button>

              </div>
            `);

            setTimeout(function(){

              const input =
                document.getElementById(
                  'adminPinInput'
                );

              if(input){

                input.focus();

                input.addEventListener(
                  'keydown',
                  function(e){

                    if(e.key === 'Enter'){

                      confirmAdminPin();

                    }

                  }
                );

              }

            },100);

          }

          function confirmAdminPin(){

            const input =
              document.getElementById(
                'adminPinInput'
              );

            const pin =
              input
              ? String(input.value || '')
              : '';

            const saved =
              localStorage.getItem(
                'sp_admin_pin'
              ) || '1234';

            if(pin !== saved){

              alert(
                'PIN incorreto.'
              );

              if(input){

                input.value = '';

                input.focus();

              }

              return;
            }

            featureModal(`

              <h3>🔐 Administração</h3>

              <div class="stat">

                Produtos na lista:

                <b>
                  ${
                    Object.values(APP_DATA).reduce(
                      (a,s)=>
                        a +
                        Object.values(s).reduce(
                          (b,x)=>b+x.length,
                          0
                        ),
                      0
                    )
                  }
                </b>

              </div>

              <div class="adminGrid">

                <button
                  onclick="importList()"
                >
                  📥 Importar lista (XLSX/CSV)
                </button>

                <button
                  onclick="generateImportTemplate()"
                >
                  📄 Gerar lista para preencher
                </button>

                <button
                  onclick="backupJSON()"
                >
                  💾 Backup completo
                </button>

                <button
                  onclick="changePin()"
                >
                  🔑 Alterar PIN
                </button>

              </div>

              <p class="mini">

                No Android, a importação XLSX/CSV
                é lida pelo próprio aplicativo.

                Após uma importação, a planilha
                passa a ser a lista oficial.

              </p>

              <button
                onclick="clearLocalData()"
              >
                ⚠️ Limpar dados locais do pedido
              </button>

            `);

          }'''

          text = replace_function(
              text,
              "openAdmin",
              new_admin
          )

          # =========================================================
          # REPETIR ÚLTIMO PEDIDO
          # =========================================================

          new_repeat = r'''function repeatLastOrder(){

            let rows = [];

            if(
              Array.isArray(lastOrder) &&
              lastOrder.length
            ){

              rows =
                JSON.parse(
                  JSON.stringify(
                    lastOrder
                  )
                );

            }

            if(!rows.length){

              try{

                const stored =
                  localStorage.getItem(
                    'sp_last_order'
                  );

                if(stored){

                  const parsed =
                    JSON.parse(
                      stored
                    );

                  if(
                    Array.isArray(parsed) &&
                    parsed.length
                  ){

                    rows = parsed;

                  }

                }

              }catch(e){

                rows = [];

              }

            }

            if(
              !rows.length &&
              Array.isArray(historyOrders) &&
              historyOrders.length
            ){

              const latest =
                historyOrders[0];

              if(
                latest &&
                Array.isArray(
                  latest.rows
                )
              ){

                rows =
                  JSON.parse(
                    JSON.stringify(
                      latest.rows
                    )
                  );

                rows.generalObservation =
                  latest.generalObservation || '';

              }

            }

            if(!rows.length){

              alert(
                'Ainda não existe último pedido.'
              );

              return;

            }

            lastOrder =
              JSON.parse(
                JSON.stringify(
                  rows
                )
              );

            saveFeatures();

            applyRepeat(
              JSON.parse(
                JSON.stringify(
                  rows
                )
              )
            );

          }'''

          text = replace_function(
              text,
              "repeatLastOrder",
              new_repeat
          )

          # =========================================================
          # APLICAR REPETIÇÃO
          # =========================================================

          new_apply = r'''function applyRepeat(rows){

            if(
              !Array.isArray(rows) ||
              !rows.length
            ){

              alert(
                'Não foi possível recuperar o último pedido.'
              );

              return;

            }

            vals = {};

            extras = [];

            rows.forEach(function(x){

              if(!x){

                return;

              }

              if(
                x.cat === 'Produto Adicional'
              ){

                extras.push({

                  code:
                    x.code === '-'
                    ? ''
                    : String(
                        x.code || ''
                      ),

                  name:
                    String(
                      x.name || ''
                    ),

                  qty:
                    Number(
                      x.order
                    ) || 0

                });

                return;

              }

              const f =
                productByCode(
                  x.code
                );

              if(!f){

                return;

              }

              vals[
                key(
                  f.c,
                  f.s,
                  f.i,
                  'o'
                )
              ] =
                Number(
                  x.order
                ) || 0;

              vals[
                key(
                  f.c,
                  f.s,
                  f.i,
                  's'
                )
              ] =
                Number(
                  x.stock
                ) || 0;

            });

            if(
              typeof rows.generalObservation ===
              'string'
            ){

              generalObservation =
                rows.generalObservation;

            }

            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){

              obs.value =
                generalObservation;

            }

            save();

            saveFeatures();

            render();

            updateBadge();

            closeFeature();

            alert(
              'Último pedido recuperado. Confira antes de enviar.'
            );

          }'''

          text = replace_function(
              text,
              "applyRepeat",
              new_apply
          )

          # =========================================================
          # LIMPAR PEDIDO
          # =========================================================

          new_clear = r'''function clearPedido(){

            const rowsToSave =
              Array.isArray(
                finalizedRows
              )
              ? JSON.parse(
                  JSON.stringify(
                    finalizedRows
                  )
                )
              : [];

            let alreadySaved = false;

            if(
              rowsToSave.length &&
              Array.isArray(
                historyOrders
              ) &&
              historyOrders.length
            ){

              try{

                const latest =
                  historyOrders[0];

                if(
                  latest &&
                  Array.isArray(
                    latest.rows
                  )
                ){

                  alreadySaved =
                    JSON.stringify(
                      latest.rows
                    ) ===
                    JSON.stringify(
                      rowsToSave
                    );

                }

              }catch(e){

                alreadySaved = false;

              }

            }

            if(
              rowsToSave.length &&
              !alreadySaved
            ){

              saveHistory(
                rowsToSave
              );

            }

            vals = {};

            extras = [];

            validadeCurta = [];

            finalizedRows = [];

            generalObservation = '';

            const obs =
              document.getElementById(
                'generalObs'
              );

            if(obs){

              obs.value = '';

            }

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            localStorage.removeItem(
              'sp_general_obs'
            );

            render();

            if(
              typeof renderValidadeCurta ===
              'function'
            ){

              renderValidadeCurta();

            }

            updateBadge();

            if(
              typeof closeConference ===
              'function'
            ){

              closeConference();

            }

            const opcoes =
              document.getElementById(
                'opcoesFinalizado'
              );

            if(opcoes){

              opcoes.style.display =
                'none';

            }

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });

          }'''

          text = replace_function(
              text,
              "clearPedido",
              new_clear
          )

          # =========================================================
          # PROTEÇÃO FINAL DO RELATÓRIO
          # =========================================================

          _, _, openpdf_after = find_function(
              text,
              "openPDF"
          )

          openpdf_hash_after =
              hashlib.sha256(
                  openpdf_after.encode(
                      "utf-8"
                  )
              ).hexdigest()

          if (
              openpdf_hash_after
              !=
              openpdf_hash
          ):

              raise SystemExit(
                  "ERRO GRAVE: "
                  "openPDF/relatório foi alterado."
              )

          if (
              openpdf_before
              !=
              openpdf_after
          ):

              raise SystemExit(
                  "ERRO GRAVE: conteúdo do "
                  "openPDF foi alterado."
              )

          # =========================================================
          # VERIFICAÇÕES
          # =========================================================

          required = [

              "function openAdmin(){",

              "function confirmAdminPin(){",

              "function repeatLastOrder(){",

              "function applyRepeat(rows){",

              "function clearPedido(){",

              "sp_admin_pin",

              "sp_last_order",

              "pedido_compras_vals",

              "pedido_compras_extras",

              "pedido_compras_validade_curta",

              "sp_general_obs"

          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: correção ausente: "
                      + item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print(
              "OK - ADM corrigido"
          )

          print(
              "OK - Repetir último pedido corrigido"
          )

          print(
              "OK - Limpeza corrigida"
          )

          print(
              "OK - openPDF preservado"
          )

          print(
              "OK - relatório protegido"
          )

          PY

      - name: Preparar bibliotecas PDF e Excel
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          mkdir -p "$ASSETS"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L \
            --fail \
            --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar JavaScript
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          html = Path(
              os.environ["HTML"]
          )

          text = html.read_text(
              encoding="utf-8"
          )

          scripts = re.findall(
              r"<script(?:[^>]*)>(.*?)</script\s*>",
              text,
              re.S | re.I
          )

          if not scripts:

              raise SystemExit(
                  "ERRO: nenhum JavaScript encontrado."
              )

          combined = "\n\n".join(
              scripts
          )

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              combined,
              encoding="utf-8"
          )

          print(
              "OK: "
              + str(len(scripts))
              + " bloco(s) JavaScript extraído(s)."
          )
          PY

          node --check \
            /tmp/super-pedido-inline.js

          echo "OK: JavaScript válido."

      - name: Verificação final antes da compilação
        shell: bash
        run: |
          set -e

          test -f "$HTML"

          grep -q \
            "function openAdmin" \
            "$HTML"

          grep -q \
            "function confirmAdminPin" \
            "$HTML"

          grep -q \
            "function repeatLastOrder" \
            "$HTML"

          grep -q \
            "function applyRepeat(rows)" \
            "$HTML"

          grep -q \
            "function clearPedido" \
            "$HTML"

          grep -q \
            "window.AndroidFileBridge.sharePdf" \
            "$HTML"

          echo "=========================================="
          echo " VERIFICAÇÃO FINAL"
          echo "=========================================="
          echo "OK - ADM"
          echo "OK - Repetir último pedido"
          echo "OK - Limpeza"
          echo "OK - sharePdf"
          echo "OK - Relatório #49 preservado"
          echo "OK - JavaScript válido"
          echo "=========================================="

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              assembleDebug

          else

            gradle \
              --no-daemon \
              assembleDebug

          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find \
            "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then

            echo "ERRO: APK não foi gerado."

            exit 1

          fi

          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
