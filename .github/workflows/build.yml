name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em:"
          echo "$ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -Fq "android.useAndroidX=true" gradle.properties || \
            echo "android.useAndroidX=true" >> gradle.properties

          grep -Fq "android.enableJetifier=true" gradle.properties || \
            echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir somente Administração, Repetir e Zeramento
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])
          html = root / "app/src/main/assets/app/index.html"

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado")

          text = html.read_text(encoding="utf-8")

          # ============================================================
          # LOCALIZA UMA FUNÇÃO JAVASCRIPT DE FORMA SEGURA
          # Funciona tanto se a função estiver em uma linha quanto
          # em várias linhas.
          # ============================================================

          def find_function(text, name):
              pattern = re.compile(
                  r'function\s+' + re.escape(name) +
                  r'\s*\([^)]*\)\s*\{',
                  re.S
              )

              m = pattern.search(text)

              if not m:
                  return None

              start = m.start()
              brace_start = text.find("{", m.start(), m.end())

              depth = 0
              quote = None
              escape = False
              i = brace_start

              while i < len(text):
                  ch = text[i]

                  if quote:
                      if escape:
                          escape = False
                      elif ch == "\\":
                          escape = True
                      elif ch == quote:
                          quote = None
                  else:
                      if ch in ("'", '"', "`"):
                          quote = ch
                      elif ch == "{":
                          depth += 1
                      elif ch == "}":
                          depth -= 1

                          if depth == 0:
                              return start, i + 1

                  i += 1

              raise SystemExit(
                  "ERRO: função " + name +
                  " foi encontrada, mas suas chaves não fecharam."
              )

          def replace_function(text, name, new_function):
              found = find_function(text, name)

              if not found:
                  raise SystemExit(
                      "ERRO: não foi possível localizar " + name
                  )

              start, end = found

              return text[:start] + new_function + text[end:]

          # ============================================================
          # 1. ADMINISTRAÇÃO
          #
          # Não usa prompt(), porque prompt() pode não funcionar
          # corretamente dentro do WebView Android.
          # ============================================================

          new_open_admin = r'''function openAdmin(){
            const saved=localStorage.getItem('sp_admin_pin')||'1234';

            featureModal(`
              <h3>🔐 Administração</h3>

              <div class="stat">
                Digite o PIN de administração:
              </div>

              <input
                id="adminPinInput"
                type="password"
                inputmode="numeric"
                maxlength="12"
                placeholder="PIN"
                style="
                  width:100%;
                  padding:13px;
                  border:1px solid #cbd5e1;
                  border-radius:9px;
                  font-size:18px;
                  text-align:center;
                  margin:8px 0;
                "
              >

              <button
                onclick="confirmAdminPin()"
                style="
                  width:100%;
                  background:#176b3a;
                  color:white;
                  border:0;
                  padding:13px;
                  border-radius:9px;
                  font-weight:800;
                "
              >
                🔓 Entrar
              </button>

              <button
                onclick="closeFeature()"
                style="
                  width:100%;
                  margin-top:7px;
                  padding:11px;
                  border-radius:9px;
                "
              >
                Cancelar
              </button>
            `);

            setTimeout(()=>{
              const el=document.getElementById('adminPinInput');
              if(el)el.focus();
            },100);
          }'''

          text = replace_function(
              text,
              "openAdmin",
              new_open_admin
          )

          # ============================================================
          # 2. CONFIRMAÇÃO DO PIN
          # ============================================================

          admin_helpers = r'''
          function confirmAdminPin(){
            const el=document.getElementById('adminPinInput');

            if(!el){
              alert('Tela de administração não encontrada.');
              return;
            }

            const pin=String(el.value||'').trim();

            if(!pin){
              alert('Digite o PIN.');
              return;
            }

            const saved=localStorage.getItem('sp_admin_pin')||'1234';

            if(pin!==saved){
              el.value='';
              el.focus();
              alert('PIN incorreto.');
              return;
            }

            const totalProdutos=Object.values(APP_DATA)
              .reduce(
                (a,s)=>
                  a+
                  Object.values(s)
                    .reduce((b,x)=>b+x.length,0),
                0
              );

            featureModal(`
              <h3>🔐 Administração</h3>

              <div class="stat">
                Produtos na lista:
                <b>${totalProdutos}</b>
              </div>

              <div class="adminGrid">

                <button onclick="importList()">
                  📥 Importar lista (XLSX/CSV)
                </button>

                <button onclick="backupJSON()">
                  💾 Backup completo
                </button>

                <button onclick="changePin()">
                  🔑 Alterar PIN
                </button>

              </div>

              <p class="mini">
                A importação XLSX/CSV é feita pelo próprio aplicativo.
              </p>

              <button
                onclick="clearLocalData()"
                style="
                  width:100%;
                  background:#fff1f2;
                  color:#b42318;
                  border:1px solid #fecdd3;
                  font-weight:800;
                "
              >
                ⚠️ Limpar dados locais do pedido
              </button>

              <button
                onclick="closeFeature()"
                style="width:100%;margin-top:8px"
              >
                Fechar
              </button>
            `);
          }
          '''

          # Só adiciona os auxiliares se ainda não existirem.
          if "function confirmAdminPin()" not in text:
              marker = "function importList()"
              pos = text.find(marker)

              if pos < 0:
                  raise SystemExit(
                      "ERRO: não foi possível localizar importList"
                  )

              text = text[:pos] + admin_helpers + "\n" + text[pos:]

          # ============================================================
          # 3. REPETIR ÚLTIMO PEDIDO
          #
          # Não depende de prompt.
          # Recupera diretamente o pedido salvo.
          # ============================================================

          new_repeat = r'''function repeatLastOrder(){
            try{
              let rows=Array.isArray(lastOrder)?lastOrder:[];

              if(!rows.length){
                const raw=localStorage.getItem('sp_last_order')||'[]';

                try{
                  rows=JSON.parse(raw);
                }catch(e){
                  rows=[];
                }
              }

              if(!Array.isArray(rows)||!rows.length){
                alert('Ainda não existe último pedido.');
                return;
              }

              applyRepeat(rows);

            }catch(e){
              console.error(e);
              alert(
                'Não foi possível recuperar o último pedido: '+
                (e.message||e)
              );
            }
          }'''

          text = replace_function(
              text,
              "repeatLastOrder",
              new_repeat
          )

          # ============================================================
          # 4. APPLY REPEAT
          #
          # Localização por contagem de chaves evita o erro que apareceu
          # no build anterior.
          # ============================================================

          new_apply = r'''function applyRepeat(rows){
            try{
              if(!Array.isArray(rows)||!rows.length){
                alert('Não há itens para repetir.');
                return;
              }

              vals={};
              extras=[];

              rows.forEach(x=>{
                if(!x)return;

                if(x.cat==='Produto Adicional'){
                  const qty=Number(x.order)||0;

                  if(qty>0){
                    extras.push({
                      code:x.code==='-'?'':String(x.code||''),
                      name:String(x.name||'Produto adicional'),
                      qty:qty
                    });
                  }

                  return;
                }

                const f=productByCode(x.code);

                if(f){
                  const ko=key(
                    f.c,
                    f.s,
                    f.i,
                    'o'
                  );

                  const ks=key(
                    f.c,
                    f.s,
                    f.i,
                    's'
                  );

                  vals[ko]=Number(x.order)||0;
                  vals[ks]=Number(x.stock)||0;
                }
              });

              if(Object.prototype.hasOwnProperty.call(
                rows,
                'generalObservation'
              )){
                generalObservation=
                  rows.generalObservation||'';
              }

              const obs=
                document.getElementById('generalObs');

              if(obs){
                obs.value=generalObservation||'';
              }

              save();
              saveFeatures();
              render();
              updateBadge();
              closeFeature();

              alert(
                'Último pedido recuperado. Confira antes de enviar.'
              );

            }catch(e){
              console.error(e);

              alert(
                'Não foi possível repetir o pedido: '+
                (e.message||e)
              );
            }
          }'''

          text = replace_function(
              text,
              "applyRepeat",
              new_apply
          )

          # ============================================================
          # 5. ZERAMENTO
          #
          # Mantém cadastro/lista.
          # Zera estoque, pedido, adicionais e validade curta.
          # NÃO apaga o último pedido nem histórico.
          # ============================================================

          new_clear = r'''function clearPedido(){
            try{
              Object.keys(vals).forEach(k=>{
                if(
                  k.endsWith('|s') ||
                  k.endsWith('|o')
                ){
                  vals[k]=0;
                }
              });

              extras=[];
              validadeCurta=[];
              finalizedRows=[];
              generalObservation='';

              const obs=
                document.getElementById('generalObs');

              if(obs){
                obs.value='';
              }

              save();
              saveFeatures();

              render();
              updateBadge();
              renderValidadeCurta();
              closeConference();

            }catch(e){
              console.error(e);

              alert(
                'Não foi possível zerar o pedido: '+
                (e.message||e)
              );
            }
          }'''

          text = replace_function(
              text,
              "clearPedido",
              new_clear
          )

          # ============================================================
          # 6. CORREÇÃO CRÍTICA DO ENVIO ANDROID
          #
          # Primeiro salva histórico e zera.
          # Depois chama sharePdf().
          #
          # Assim o WebView não pode interromper o zeramento depois
          # que o compartilhamento Android assumir o controle.
          #
          # O PDF em si NÃO é alterado.
          # ============================================================

          old_android = """const b64=doc.output('datauristring').split(',')[1];
          window.AndroidFileBridge.sharePdf('pedido-acougue.pdf',b64);
          saveHistory(rows);
          clearPedido();
          return;"""

          new_android = """const b64=doc.output('datauristring').split(',')[1];
          saveHistory(rows);
          clearPedido();
          window.AndroidFileBridge.sharePdf('pedido-acougue.pdf',b64);
          return;"""

          if old_android not in text:
              raise SystemExit(
                  "ERRO: trecho Android do openPDF não encontrado."
              )

          text=text.replace(
              old_android,
              new_android,
              1
          )

          # ============================================================
          # 7. GARANTIAS
          # ============================================================

          required=[
              "function openAdmin()",
              "function confirmAdminPin()",
              "function repeatLastOrder()",
              "function applyRepeat(rows)",
              "function clearPedido()",
              "function openPDF(",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)",
              "android.useAndroidX"
          ]

          for item in required:
              if item not in text:
                  raise SystemExit(
                      "ERRO: verificação final falhou: "+
                      item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("========================================")
          print("CORREÇÃO CONCLUÍDA")
          print("========================================")
          print("Administração: OK")
          print("Repetir último: OK")
          print("Zeramento após envio: OK")
          print("Relatório existente preservado: OK")
          print("========================================")
          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          test -d "$ASSETS"

          curl -L --fail \
            -o "$ASSETS/xlsx.full.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"

          curl -L --fail \
            -o "$ASSETS/jspdf.umd.min.js" \
            "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"

          python3 - <<'PY'
          from pathlib import Path
          import os

          root=Path(os.environ["ANDROID_DIR"])
          html=root/"app/src/main/assets/app/index.html"

          text=html.read_text(encoding="utf-8")

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js",
              "xlsx.full.min.js"
          )

          text=text.replace(
              "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js",
              "jspdf.umd.min.js"
          )

          html.write_text(
              text,
              encoding="utf-8"
          )

          print("Bibliotecas locais configuradas.")
          PY

      - name: Verificar HTML
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          test -f "$HTML"

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          html=Path(
              os.environ["ANDROID_DIR"]
          )/"app/src/main/assets/app/index.html"

          text=html.read_text(encoding="utf-8")

          checks=[
              "function openAdmin()",
              "function confirmAdminPin()",
              "function repeatLastOrder()",
              "function applyRepeat(rows)",
              "function clearPedido()",
              "function openPDF(",
              "window.AndroidFileBridge.sharePdf",
              "saveHistory(rows)"
          ]

          for item in checks:
              if item not in text:
                  raise SystemExit(
                      "ERRO HTML: "+item
                  )

          # Extrai o JavaScript inline para validar sintaxe.
          scripts=re.findall(
              r"<script(?:\s[^>]*)?>(.*?)</script>",
              text,
              flags=re.S|re.I
          )

          js="\n".join(scripts)

          Path(
              "/tmp/super-pedido-inline.js"
          ).write_text(
              js,
              encoding="utf-8"
          )

          print("Verificação textual do HTML: OK")
          print("JavaScript inline extraído.")
          PY

          node --check /tmp/super-pedido-inline.js

          echo "Sintaxe JavaScript: OK"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x gradlew 2>/dev/null || true

          if [ -x "./gradlew" ]; then
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          test -n "$APK"
          test -s "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "========================================"
          echo "APK GERADO COM SUCESSO"
          echo "========================================"

          ls -lh "$APK"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.APK }}
          if-no-files-found: error
