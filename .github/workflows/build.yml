name: Gerar APK - Super Pedido Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Preparar projeto
        shell: bash
        run: |
          set -e

          rm -rf projeto

          test -f "Super-Pedido-Pro.zip"

          mkdir -p projeto

          unzip -o "Super-Pedido-Pro.zip" -d projeto

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find "$GITHUB_WORKSPACE/projeto" \
            -name settings.gradle \
            -type f \
            -print -quit | xargs -r dirname)

          test -n "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Projeto encontrado em: $ANDROID_DIR"

      - name: Configurar AndroidX
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          touch gradle.properties

          grep -q "android.useAndroidX=true" gradle.properties \
            || echo "android.useAndroidX=true" >> gradle.properties

          grep -q "android.enableJetifier=true" gradle.properties \
            || echo "android.enableJetifier=true" >> gradle.properties

      - name: Corrigir aplicativo
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          root = Path(os.environ["ANDROID_DIR"])

          html = root / "app/src/main/assets/app/index.html"

          main = next(
              (root / "app/src/main/java").rglob("MainActivity.java"),
              None
          )

          if not html.exists():
              raise SystemExit("ERRO: index.html não encontrado")

          if main is None:
              raise SystemExit("ERRO: MainActivity.java não encontrado")

          text = html.read_text(encoding="utf-8")

          # ============================================================
          # 1. CORRIGIR PDF
          #
          # A única alteração funcional é:
          # PDF sempre A4 RETRATO.
          #
          # O conteúdo do relatório continua usando reportText(),
          # sem alterar essa função.
          # ============================================================

          pdf_start = text.find("function openPDF(){")

          pdf_end = text.find(
              "function clearPedido",
              pdf_start
          )

          if pdf_start == -1:
              raise SystemExit(
                  "ERRO: função openPDF não encontrada"
              )

          if pdf_end == -1:
              raise SystemExit(
                  "ERRO: função clearPedido não encontrada"
              )

          new_pdf = """function openPDF(){
            const rows=finalizedRows.length?finalizedRows:getRows();

            if(!rows.length){
              alert('Nenhum item foi selecionado.');
              return;
            }

            try{
              const {jsPDF}=window.jspdf||{};

              if(!jsPDF){
                throw new Error(
                  'Biblioteca PDF não carregada.'
                );
              }

              const doc=new jsPDF({
                orientation:'portrait',
                unit:'mm',
                format:'a4'
              });

              const pageWidth=210;
              const pageHeight=297;
              const margin=12;
              const contentWidth=pageWidth-(margin*2);

              let y=16;
              let page=1;

              function footer(){
                doc.setFont('helvetica','normal');
                doc.setFontSize(8);

                doc.text(
                  'Página '+page,
                  pageWidth-margin,
                  pageHeight-8,
                  {align:'right'}
                );
              }

              function header(){
                doc.setFont('helvetica','bold');
                doc.setFontSize(16);

                doc.text(
                  'PEDIDO DE COMPRAS',
                  margin,
                  y
                );

                y+=7;

                doc.setFont('helvetica','normal');
                doc.setFontSize(9);

                doc.text(
                  new Date().toLocaleString('pt-BR'),
                  margin,
                  y
                );

                y+=6;

                doc.setDrawColor(180);

                doc.line(
                  margin,
                  y,
                  pageWidth-margin,
                  y
                );

                y+=7;
              }

              function newPage(){
                footer();

                doc.addPage();

                page++;

                y=16;

                header();
              }

              function safe(value,max){
                const s=String(value??'');

                if(s.length<=max){
                  return s;
                }

                return s.substring(0,max-3)+'...';
              }

              header();

              const groups=groupRows(rows);

              Object.entries(groups).forEach(
                ([cat,items])=>{

                  if(y>pageHeight-35){
                    newPage();
                  }

                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(11);

                  doc.text(
                    safe(cat,42),
                    margin,
                    y
                  );

                  y+=6;

                  doc.setFont(
                    'helvetica',
                    'bold'
                  );

                  doc.setFontSize(8);

                  doc.text(
                    'Código',
                    margin,
                    y
                  );

                  doc.text(
                    'Produto',
                    margin+28,
                    y
                  );

                  doc.text(
                    'Estoque',
                    margin+132,
                    y
                  );

                  doc.text(
                    'Pedido',
                    margin+160,
                    y
                  );

                  y+=3;

                  doc.setDrawColor(200);

                  doc.line(
                    margin,
                    y,
                    pageWidth-margin,
                    y
                  );

                  y+=5;

                  items.forEach(x=>{

                    if(y>pageHeight-18){
                      newPage();
                    }

                    doc.setFont(
                      'helvetica',
                      'normal'
                    );

                    doc.setFontSize(8);

                    doc.text(
                      safe(x.code||'-',18),
                      margin,
                      y
                    );

                    doc.text(
                      safe(x.name||'',55),
                      margin+28,
                      y
                    );

                    doc.text(
                      String(x.stock??0),
                      margin+132,
                      y
                    );

                    doc.text(
                      String(x.order??0),
                      margin+160,
                      y
                    );

                    y+=6;

                    if(x.obs){

                      const obs=
                        doc.splitTextToSize(
                          'Obs: '+String(x.obs),
                          contentWidth-28
                        );

                      if(
                        y+(obs.length*4)>
                        pageHeight-18
                      ){
                        newPage();
                      }

                      doc.setFontSize(7);

                      doc.text(
                        obs,
                        margin+28,
                        y
                      );

                      y+=(obs.length*4)+2;
                    }

                    if(x.validade){

                      if(y+5>pageHeight-18){
                        newPage();
                      }

                      doc.setFontSize(7);

                      doc.text(
                        'Validade: '+
                        String(x.validade),
                        margin+28,
                        y
                      );

                      y+=5;
                    }

                  });

                  y+=4;
                }
              );

              if(generalObservation){

                if(y>pageHeight-35){
                  newPage();
                }

                doc.setFont(
                  'helvetica',
                  'bold'
                );

                doc.setFontSize(10);

                doc.text(
                  'OBSERVAÇÃO GERAL',
                  margin,
                  y
                );

                y+=5;

                doc.setFont(
                  'helvetica',
                  'normal'
                );

                doc.setFontSize(8);

                const obs=
                  doc.splitTextToSize(
                    String(generalObservation),
                    contentWidth
                  );

                if(
                  y+(obs.length*4)>
                  pageHeight-18
                ){
                  newPage();
                }

                doc.text(
                  obs,
                  margin,
                  y
                );
              }

              footer();

              const base64=
                doc.output(
                  'datauristring'
                ).split(',')[1];

              const filename=
                'relatorio-pedido-'+
                new Date()
                  .toISOString()
                  .slice(0,10)+
                '.pdf';

              /*
               * Limpa somente depois que o PDF
               * já foi completamente criado.
               */
              clearPedido(rows);

              if(
                window.AndroidFileBridge &&
                typeof window.AndroidFileBridge.sharePdf===
                'function'
              ){
                window.AndroidFileBridge.sharePdf(
                  filename,
                  base64
                );

                return;
              }

              doc.save(filename);

            }catch(e){

              console.error(
                'Erro ao gerar PDF:',
                e
              );

              alert(
                'Erro ao gerar PDF: '+
                e.message
              );
            }
          }
          """

          text = (
              text[:pdf_start]
              + new_pdf
              + "\n"
              + text[pdf_end:]
          )

          # ============================================================
          # 2. CORRIGIR LIMPEZA
          #
          # Depois do envio:
          # - zera estoque
          # - zera pedido
          # - zera adicionais
          # - zera validade curta
          #
          # NÃO apaga:
          # - cadastro
          # - produtos
          # - favoritos
          # - histórico
          # - último pedido
          # ============================================================

          clear_start = text.find(
              "function clearPedido("
          )

          clear_end = text.find(
              "function sendWhatsApp",
              clear_start
          )

          if clear_start == -1:
              raise SystemExit(
                  "ERRO: clearPedido não encontrada"
              )

          if clear_end == -1:
              raise SystemExit(
                  "ERRO: sendWhatsApp não encontrada"
              )

          new_clear = """function clearPedido(historyRows=null){

            const historico=
              Array.isArray(historyRows) &&
              historyRows.length
              ? historyRows
              : finalizedRows;

            if(historico.length){
              saveHistory(historico);
            }

            vals={};

            extras=[];

            validadeCurta=[];

            finalizedRows=[];

            generalObservation='';

            localStorage.removeItem(
              'pedido_compras_vals'
            );

            localStorage.removeItem(
              'pedido_compras_extras'
            );

            localStorage.removeItem(
              'pedido_compras_validade_curta'
            );

            const obs=
              document.getElementById(
                'generalObs'
              );

            if(obs){
              obs.value='';
            }

            save();

            render();

            renderValidadeCurta();

            updateBadge();

            document.getElementById(
              'opcoesFinalizado'
            ).style.display='none';

            window.scrollTo({
              top:0,
              behavior:'smooth'
            });
          }
          """

          text = (
              text[:clear_start]
              + new_clear
              + "\n"
              + text[clear_end:]
          )

          # ============================================================
          # 3. BIBLIOTECAS LOCAIS
          # ============================================================

          text = text.replace(
              'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js',
              'xlsx.full.min.js'
          )

          text = text.replace(
              'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
              'jspdf.umd.min.js'
          )

          # ============================================================
          # 4. PRESERVAR CORREÇÃO DO CATÁLOGO IMPORTADO
          # ============================================================

          required = [
              'importedCatalogActive=true',
              'customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))',
              "localStorage.setItem('sp_imported_catalog_active'"
          ]

          for item in required:

              if item not in text:

                  raise SystemExit(
                      "ERRO: correção de importação ausente: "
                      + item
                  )

          html.write_text(
              text,
              encoding="utf-8"
          )

          # ============================================================
          # 5. MAINACTIVITY
          #
          # Mantém as correções que já funcionavam.
          # ============================================================

          java=main.read_text(
              encoding="utf-8"
          )

          if 'import android.content.ClipData;' not in java:

              java=java.replace(
                  'import android.content.Intent;\n',
                  'import android.content.ClipData;\n'
                  'import android.content.Intent;\n',
                  1
              )

          if 'import android.webkit.ValueCallback;' not in java:

              java=java.replace(
                  'import android.webkit.WebSettings;\n',
                  'import android.webkit.ValueCallback;\n'
                  'import android.webkit.WebSettings;\n',
                  1
              )

          if 'import android.webkit.WebChromeClient;' not in java:

              java=java.replace(
                  'import android.webkit.WebSettings;\n',
                  'import android.webkit.WebChromeClient;\n'
                  'import android.webkit.WebSettings;\n',
                  1
              )

          if 'private ValueCallback<Uri[]> filePathCallback;' not in java:

              java=java.replace(
                  'public class MainActivity extends Activity {\n',
                  'public class MainActivity extends Activity {\n'
                  '    private ValueCallback<Uri[]> filePathCallback;\n'
                  '    private static final int FILE_CHOOSER_REQUEST = 1001;\n',
                  1
              )

          if 'onShowFileChooser' not in java:

              marker=(
                  '        webView.setWebViewClient('
                  'new WebViewClient());\n'
              )

              block='''        webView.setWebChromeClient(new WebChromeClient() {
              @Override
              public boolean onShowFileChooser(
                      WebView view,
                      ValueCallback<Uri[]> callback,
                      WebChromeClient.FileChooserParams params) {

                  if (MainActivity.this.filePathCallback != null) {
                      MainActivity.this.filePathCallback.onReceiveValue(null);
                  }

                  MainActivity.this.filePathCallback = callback;

                  try {
                      Intent intent = params.createIntent();

                      startActivityForResult(
                              intent,
                              FILE_CHOOSER_REQUEST
                      );

                      return true;

                  } catch (Exception e) {

                      MainActivity.this.filePathCallback = null;

                      Toast.makeText(
                              MainActivity.this,
                              "Não foi possível abrir o seletor de arquivos.",
                              Toast.LENGTH_LONG
                      ).show();

                      return false;
                  }
              }
          });
          '''

              if marker in java:

                  java=java.replace(
                      marker,
                      marker+block,
                      1
                  )

          if 'protected void onActivityResult(' not in java:

              marker=(
                  '    public class AndroidFileBridge {\n'
              )

              result='''    @Override
          protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data) {

              super.onActivityResult(
                      requestCode,
                      resultCode,
                      data
              );

              if(
                  requestCode != FILE_CHOOSER_REQUEST ||
                  filePathCallback == null
              ){
                  return;
              }

              Uri[] results=null;

              if(
                  resultCode == RESULT_OK &&
                  data != null
              ){

                  if(data.getClipData()!=null){

                      int count=
                          data.getClipData()
                              .getItemCount();

                      results=new Uri[count];

                      for(
                          int i=0;
                          i<count;
                          i++
                      ){

                          results[i]=
                              data.getClipData()
                                  .getItemAt(i)
                                  .getUri();
                      }

                  }else if(
                      data.getData()!=null
                  ){

                      results=
                          new Uri[]{
                              data.getData()
                          };
                  }
              }

              filePathCallback.onReceiveValue(
                  results
              );

              filePathCallback=null;
          }

          '''

              if marker in java:

                  java=java.replace(
                      marker,
                      result+marker,
                      1
                  )

          # ============================================================
          # 6. SHARE PDF ANDROID
          # ============================================================

          pdf_pattern=(
              r'        @JavascriptInterface\n'
              r'        public void sharePdf\(String filename, String base64\) \{'
              r'.*?'
              r'\n        \}\n\n'
              r'        @JavascriptInterface'
          )

          pdf_method='''        @JavascriptInterface
          public void sharePdf(
                  String filename,
                  String base64) {

              try {

                  if(
                      base64 == null ||
                      base64.trim().isEmpty()
                  ){
                      throw new Exception(
                          "PDF vazio"
                      );
                  }

                  String clean=base64;

                  int comma=
                      clean.indexOf(',');

                  if(comma>=0){
                      clean=
                          clean.substring(
                              comma+1
                          );
                  }

                  byte[] bytes=
                      Base64.decode(
                          clean,
                          Base64.DEFAULT
                      );

                  File dir=
                      new File(
                          getCacheDir(),
                          "shared"
                      );

                  if(
                      !dir.exists() &&
                      !dir.mkdirs()
                  ){
                      throw new Exception(
                          "Não foi possível criar a pasta temporária"
                      );
                  }

                  String safeName=
                      sanitizeFilename(
                          filename
                      );

                  if(safeName.isEmpty()){
                      safeName="pedido.pdf";
                  }

                  if(
                      !safeName
                          .toLowerCase()
                          .endsWith(".pdf")
                  ){
                      safeName+=".pdf";
                  }

                  File file=
                      new File(
                          dir,
                          safeName
                      );

                  try(
                      FileOutputStream out=
                          new FileOutputStream(file)
                  ){

                      out.write(bytes);
                      out.flush();
                  }

                  Uri uri=
                      FileProvider.getUriForFile(
                          MainActivity.this,
                          getPackageName()+
                          ".fileprovider",
                          file
                      );

                  Intent intent=
                      new Intent(
                          Intent.ACTION_SEND
                      );

                  intent.setType(
                      "application/pdf"
                  );

                  intent.putExtra(
                      Intent.EXTRA_STREAM,
                      uri
                  );

                  intent.setClipData(
                      ClipData.newRawUri(
                          "PDF",
                          uri
                      )
                  );

                  intent.addFlags(
                      Intent.FLAG_GRANT_READ_URI_PERMISSION
                  );

                  startActivity(
                      Intent.createChooser(
                          intent,
                          "Enviar PDF"
                      )
                  );

              }catch(Exception e){

                  Toast.makeText(
                      MainActivity.this,
                      "Erro ao compartilhar PDF: "
                      +e.getMessage(),
                      Toast.LENGTH_LONG
                  ).show();
              }
          }

          @JavascriptInterface'''

          java,n=re.subn(
              pdf_pattern,
              pdf_method,
              java,
              count=1,
              flags=re.S
          )

          if n!=1:

              raise SystemExit(
                  "ERRO: não foi possível corrigir sharePdf"
              )

          # ============================================================
          # 7. saveBase64 COM 3 ARGUMENTOS
          # ============================================================

          if(
              'public void saveBase64(String filename, String mimeType, String base64)'
              not in java
          ):

              marker=(
                  '        @JavascriptInterface\n'
                  '        public void shareText(String text) {'
              )

              overload='''        @JavascriptInterface
          public void saveBase64(
                  String filename,
                  String mimeType,
                  String base64) {

              saveBase64(
                  filename,
                  base64
              );
          }

          '''

              if marker not in java:

                  raise SystemExit(
                      "ERRO: local do saveBase64 não encontrado"
                  )

              java=java.replace(
                  marker,
                  overload+marker,
                  1
              )

          # ============================================================
          # 8. NOME SEGURO DO ARQUIVO
          # ============================================================

          if 'private String sanitizeFilename(' not in java:

              marker=(
                  '    @Override\n'
                  '    public void onBackPressed() {'
              )

              helper='''    private String sanitizeFilename(String filename) {

              if(filename==null){
                  return "";
              }

              return new File(filename)
                  .getName()
                  .replaceAll(
                      "[\\\\/:*?\\\"<>|]",
                      "_"
                  );
          }

          '''

              if marker in java:

                  java=java.replace(
                      marker,
                      helper+marker,
                      1
                  )

          main.write_text(
              java,
              encoding="utf-8"
          )

          print(
              "Correções aplicadas com sucesso."
          )

          PY

      - name: Preparar bibliotecas locais
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets/app"

          curl -L --fail --retry 3 \
            -o "$ASSETS/xlsx.full.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js

          curl -L --fail --retry 3 \
            -o "$ASSETS/jspdf.umd.min.js" \
            https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js

          test -s "$ASSETS/xlsx.full.min.js"

          test -s "$ASSETS/jspdf.umd.min.js"

      - name: Verificar correções
        shell: bash
        run: |
          set -e

          HTML="$ANDROID_DIR/app/src/main/assets/app/index.html"

          JAVA=$(find \
            "$ANDROID_DIR/app/src/main/java" \
            -name MainActivity.java \
            -type f \
            -print -quit)

          test -f "$HTML"

          test -f "$JAVA"

          echo "======================================"
          echo "VERIFICANDO PDF"
          echo "======================================"

          grep -Fq \
            "orientation:'portrait'" \
            "$HTML"

          grep -Fq \
            "pageWidth=210" \
            "$HTML"

          grep -Fq \
            "pageHeight=297" \
            "$HTML"

          if grep -Fq \
            "orientation:'landscape'" \
            "$HTML"
          then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          if grep -Fq \
            'orientation:"landscape"' \
            "$HTML"
          then
            echo "ERRO: PDF ainda está em landscape."
            exit 1
          fi

          echo "PDF: OK - A4 RETRATO"

          echo "======================================"
          echo "VERIFICANDO LIMPEZA"
          echo "======================================"

          grep -Fq \
            "vals={};" \
            "$HTML"

          grep -Fq \
            "extras=[];" \
            "$HTML"

          grep -Fq \
            "validadeCurta=[];" \
            "$HTML"

          grep -Fq \
            "finalizedRows=[];" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_vals')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_extras')" \
            "$HTML"

          grep -Fq \
            "localStorage.removeItem('pedido_compras_validade_curta')" \
            "$HTML"

          grep -Fq \
            "clearPedido(rows);" \
            "$HTML"

          echo "LIMPEZA: OK"

          echo "======================================"
          echo "VERIFICANDO IMPORTAÇÃO"
          echo "======================================"

          grep -Fq \
            "importedCatalogActive=true" \
            "$HTML"

          grep -Fq \
            "customProducts=rows.filter(x=>x.code||x.name).map(x=>({...x}))" \
            "$HTML"

          echo "IMPORTAÇÃO: OK"

          echo "======================================"
          echo "VERIFICANDO BIBLIOTECAS"
          echo "======================================"

          grep -Fq \
            "xlsx.full.min.js" \
            "$HTML"

          grep -Fq \
            "jspdf.umd.min.js" \
            "$HTML"

          echo "BIBLIOTECAS: OK"

          echo "======================================"
          echo "VERIFICANDO ANDROID"
          echo "======================================"

          grep -Fq \
            "onShowFileChooser" \
            "$JAVA"

          grep -Fq \
            "ClipData.newRawUri" \
            "$JAVA"

          grep -Fq \
            "saveBase64(String filename, String mimeType, String base64)" \
            "$JAVA"

          grep -Fq \
            "sanitizeFilename" \
            "$JAVA"

          echo "ANDROID: OK"

          echo "======================================"
          echo "TODAS AS VERIFICAÇÕES PASSARAM"
          echo "======================================"

      - name: Compilar APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle \
            --no-daemon \
            clean \
            assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -e

          APK="$ANDROID_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          ls -lh "$APK"

          echo "APK gerado com sucesso."

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Super-Pedido-Pro-APK
          path: ${{ env.ANDROID_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
